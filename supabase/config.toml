# Supabase CLI settings for this repo. Only what the Edge Function needs.

# A local name only; the real project is chosen by --project-ref at deploy.
project_id = "bca-asset-tracker"

[functions.asset-api]
# The app does its own sign-in (a session id in the request body), and sends no
# Supabase JWT, so the gateway must not demand one. Every op that touches
# inventory checks the session itself.
verify_jwt = false
