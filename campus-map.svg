    <text class="name" x="1040" y="482">Wheeler</text>
    <text class="num"  x="1040" y="504">100</text>
    <text class="sm"   x="1040" y="673">Intervention</text>
    <text class="sm"   x="1040" y="690">Room</text>
    <text class="sm"   x="1040" y="707">103</text>
    <text class="num"  x="643"  y="644">102</text>
    <text class="tiny" x="690"  y="645" transform="rotate(-90 690 645)">FRONT OFFICE</text>
    <text class="tiny" x="665"  y="718">RR</text>
    <text class="tiny" x="840"  y="676" transform="rotate(90 840 676)">KITCHEN</text>
    <text class="tiny" x="958"  y="648">RR</text>
    <text class="tiny" x="958"  y="712">RR</text>
    <text class="tiny" x="505"  y="750" transform="rotate(90 505 750)">ADMIN OFFICE</text>
  </g>
</svg>
