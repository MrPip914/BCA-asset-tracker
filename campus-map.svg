    <text class="num"  x="220" y="477">201</text>
    <text class="name" x="389" y="445">MS Humanities</text>
    <text class="name" x="389" y="467">Cantrell</text>
    <text class="num"  x="389" y="489">200</text>
    <text class="tiny" x="492" y="472">RR</text>
    <text class="tiny" x="492" y="515">RR</text>
    <text class="name" x="78"  y="575">MS &amp; HS</text>
