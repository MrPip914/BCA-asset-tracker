<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-labelledby="t d">
  <title id="t">Brookside Christian Academy campus map, 2026-2027</title>
  <desc id="d">Four building groups: the K-2 building and library, the portable classrooms, the middle and high school wing, and the main building with the front office.</desc>
  <style>
    .wall   { fill: #ffffff; stroke: #2b2b2b; stroke-width: 2; }
    .room   { fill: #f6f8f4; stroke: #2b2b2b; stroke-width: 1.5; }
    .svc    { fill: #e9ecef; stroke: #2b2b2b; stroke-width: 1.5; }
    .ramp   { fill: #c8ccd0; stroke: #6b7076; stroke-width: 1; }
    .door   { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .glass  { stroke: #3a4fb5; stroke-width: 2; }
    .name   { font: 700 19px/1.1 Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
    .num    { font: 400 19px Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
    .sm     { font: 700 13px Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
    .sub    { font: 400 14px Helvetica, Arial, sans-serif; fill: #111; text-anchor: middle; }
    .tiny   { font: italic 11px Helvetica, Arial, sans-serif; fill: #444; text-anchor: middle; }
    .group  { font: italic 700 18px Helvetica, Arial, sans-serif; fill: #1f5b2e; text-anchor: middle; letter-spacing: 1px; }
  </style>
  <rect width="1100" height="850" fill="#ffffff"/>

  <!-- ===== K-2 BUILDING + LIBRARY (top left) ===== -->
  <g id="k2-building">
    <rect class="room" x="48"  y="45"  width="62"  height="70"/>
    <rect class="room" x="110" y="45"  width="70"  height="70"/>
    <rect class="room" x="45"  y="115" width="100" height="70"/>
    <rect class="svc"  x="145" y="115" width="35"  height="70"/>
    <rect class="svc"  x="45"  y="185" width="45"  height="45" stroke-dasharray="4 3"/>
    <path d="M45 185 L90 230 M90 185 L45 230" stroke="#9aa0a6" stroke-width="1"/>
    <rect class="room" x="180" y="95"  width="172" height="140"/>
    <rect class="room" x="352" y="95"  width="80"  height="140"/>
    <rect class="room" x="432" y="95"  width="93"  height="140"/>
    <path class="glass" d="M377 235 H405 M432 220 V235"/>

    <text class="sm" x="79" y="96" style="font-size:16px">Library</text>
    <text class="sm"   x="145" y="85">Lisa’s</text>
    <text class="sm"   x="145" y="100">Office</text>
    <text class="name" x="95"  y="152">Storage</text>
    <text class="tiny" x="67"  y="212">SHED</text>
    <text class="name" x="265" y="148">2</text>
    <text class="name" x="265" y="171">Runge</text>
    <text class="num"  x="265" y="194">302</text>
    <text class="name" x="390" y="150">1</text>
    <text class="num"  x="390" y="192">301</text>
    <text class="name" x="478" y="150">K</text>
    <text class="name" x="478" y="171">Sloan</text>
    <text class="num"  x="478" y="194">300</text>
  </g>

  <!-- ===== PORTABLES (top right) ===== -->
  <g id="portables">
    <rect class="room" x="835" y="8"   width="122" height="150"/>
    <rect class="room" x="957" y="8"   width="125" height="150"/>
    <rect class="room" x="835" y="160" width="122" height="150"/>
    <rect class="room" x="957" y="160" width="125" height="150"/>
    <rect class="ramp" x="1080" y="80"  width="15" height="40"/>
