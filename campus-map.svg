    <rect class="room" x="998" y="397" width="84"  height="183"/>
    <rect class="svc"  x="998" y="580" width="84"  height="60"/>
    <rect class="room" x="998" y="640" width="84"  height="102"/>
    <rect class="svc"  x="782" y="555" width="64"  height="55"/>
