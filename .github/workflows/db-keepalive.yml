# Keeps the DEV and PROD Supabase projects awake. See DATABASE_BACKEND_PLAN.md, "Running on
# the free tier", item 1: a free project is paused after about a week without
# DATABASE activity, so this runs a real query against it twice a day. The
# nightly backup (db-backup.yml) touches the database too; this is the one that
# does nothing else, so a broken backup cannot also let the project pause.
#
# A failed ping fails the run, and GitHub emails about failed scheduled runs.
#
# SCHEDULES ONLY RUN FROM THE DEFAULT BRANCH (main). Until this file is on main,
# it does nothing on its own; a manual run works once it is there too.
#
# Uses SUPABASE_DB_URL on the `supabase-dev` and `supabase-prod` environments, as
# db-migrate.yml does. NOTE: a scheduled run cannot wait for a person, so
# `supabase-prod` must NOT have required reviewers (db-migrate.yml's prod runs are
# guarded by being manual, and by Eric's say-so, instead).
# This repo is public: nothing below echoes it.

name: Database keep-alive

on:
  schedule:
    # 03:17 and 15:17 UTC. Off the hour, when GitHub's scheduler is least busy.
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    runs-on: ubuntu-latest
    environment:
      name: supabase-${{ matrix.target }}
    steps:
      - name: Query the ${{ matrix.target }} database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set on the supabase-${{ matrix.target }} environment."
            exit 1
          fi
          n="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -c "select count(*) from asset_tracker.assets")"
          echo "✓ ${{ matrix.target }} database answered: $n asset rows."
