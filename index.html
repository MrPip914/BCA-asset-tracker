  //   saving  — a POST is in flight. Apps Script cold starts make this genuinely
  //             slow, and with nothing on screen the app looks frozen, which is
  //             what made people click Save again and fire overlapping writes.
  //   failed  — the last save didn't reach the Sheet. This used to be a bare
  //             "Sync failed" tucked inside the name button on the LIST header
  //             only, i.e. invisible on the detail page, which is where almost
  //             every edit is actually made — a silently-dropped save is the
  //             same "did that work?" confusion as a silent slow one.
  //
  // Styled after the existing header pills (Sandbox, Backend outdated) rather
  // than introducing a new idiom.
  const saveStatusPill = (isSaving || saveError) && (
    <span
      title={isSaving
        ? "Saving to the Google Sheet — this can take a few seconds on the first save."
        : "The last save didn't reach the Google Sheet. Check your connection, then make the change again — it was not stored."}
      style={{
        display: "flex", alignItems: "center", gap: 5, flexShrink: 0,
        border: `1.5px solid ${isSaving ? C.border : C.danger}`, borderRadius: 12, padding: "3px 10px",
        fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 700,
        color: isSaving ? C.muted : C.danger, background: isSaving ? "transparent" : C.surface,
      }}
    >
      {isSaving ? <Loader2 size={12} className="spin" /> : <AlertTriangle size={12} />}
      {isSaving ? "Saving…" : "Save failed"}
    </span>
  );

  const nameModal = showNamePrompt && (
    <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 22, width: "100%", maxWidth: 320, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <UserCircle size={18} style={{ color: C.brand }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Who's this?</div>
        </div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
          Enter your name so edits and comments you make are attributed to you. This is just a label — not a login — and is remembered on this device.
        </div>
        <input
          value={nameInput}
          onChange={e => setNameInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && saveUserName(nameInput)}
          placeholder="Your name"
          autoFocus
          style={{ width: "100%", padding: "9px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, marginBottom: 12 }}
        />
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          {currentUser && (
            <button onClick={() => { setShowNamePrompt(false); setNameInput(""); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
              Cancel
            </button>
          )}
          <button
            onClick={() => saveUserName(nameInput)}
            disabled={!nameInput.trim()}
            style={{ padding: "8px 14px", background: nameInput.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            Save
          </button>
        </div>
      </div>
    </div>
  );

  // Shown when a save was rejected because someone else saved first (see
  // REVISION_DOMAINS). The change is genuinely gone — the backend wrote nothing
  // and the app has already reloaded what's actually stored — so this has to be
  // unmissable and has to say "redo it", not "retrying…". zIndex 60, above every
  // other modal, since it can fire while one of them is open.
  const conflictModal = saveConflict && (
    <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 16 }}>
      <div style={{ background: C.surface, border: `1.5px solid ${C.danger}`, borderRadius: 14, padding: 22, width: "100%", maxWidth: 380, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)" }}>
        <div
          style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}
          title={`Server revisions now: ${REVISION_DOMAINS.map(d => `${d} ${revisions[d]}`).join(", ")}`}
        >
          <AlertTriangle size={18} style={{ color: C.danger }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.danger }}>Your change wasn't saved</div>
        </div>
        <div style={{ fontSize: 14, color: C.ink, marginBottom: 10 }}>
          Someone else saved{" "}
          {saveConflict.map(d => REVISION_DOMAIN_LABELS[d] || d).join(" and ")}{" "}
          while you were working, so this save was rejected to avoid overwriting their change.
        </div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 16 }}>
          Nothing you just did was stored. The latest data has been reloaded — check it, then make your change again.
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button
            onClick={() => setSaveConflict(null)}
            style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            Got it
          </button>
        </div>
      </div>
    </div>
  );

  const peripheralsManagerModal = showPeripheralsManager && (
    <ListManagerModal
      title="Manage peripherals"
      items={peripheralsList}
      newValue={newPeripheralName}
      onNewValueChange={setNewPeripheralName}
      onAdd={addPeripheral}
      onRemove={removePeripheral}
      onClose={() => { setShowPeripheralsManager(false); setNewPeripheralName(""); }}
      placeholder="New peripheral name"
      isSaving={isSaving}
    />
  );

  // --- Access management -------------------------------------------------------
  // Every one of these routes through persist({ authUsers }), so the allowlist
  // travels the same save path, lock, and conflict check as everything else —
  // and, like everything else, is re-authorized by the backend before it lands.
  const ownerEmail = (auth && auth.ownerEmail) || "";

  function addAccessUser() {
    const email = accessDraft.email.trim().toLowerCase();
    const name = accessDraft.name.trim();
    if (!email) {
      setAccessDraft(d => ({ ...d, error: "Enter the person's Google account email." }));
      return;
    }
    // Deliberately loose. Strict email validation rejects addresses that are
    // actually valid, and the real check happens at sign-in anyway: an address
    // that isn't a working Google account simply never gets in.
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setAccessDraft(d => ({ ...d, error: "That doesn't look like an email address." }));
      return;
    }
    if (accessUsers.some(u => u.email === email)) {
      setAccessDraft(d => ({ ...d, error: "That address already has access." }));
      return;
    }
    const next = [...accessUsers, { email, name, role: accessDraft.role }];
    setAccessDraft({ email: "", name: "", role: "editor", error: "" });
    persist(assets, { authUsers: next });
  }

  function removeAccessUser(email) {
    // Removing yourself would sign you out on your very next action, which reads
    // as the app breaking rather than as a thing you just did to yourself.
    if (auth && email === auth.email) {
      setAccessDraft(d => ({ ...d, error: "You can't remove your own access." }));
      return;
    }
    persist(assets, { authUsers: accessUsers.filter(u => u.email !== email) });
  }

  function setAccessRole(email, role) {
    if (auth && email === auth.email) {
      setAccessDraft(d => ({ ...d, error: "You can't change your own access level." }));
      return;
    }
    persist(assets, { authUsers: accessUsers.map(u => (u.email === email ? { ...u, role } : u)) });
  }

  const accessManagerModal = showAccessManager && (
    <div
      onClick={() => { setShowAccessManager(false); setAccessDraft({ email: "", name: "", role: "editor", error: "" }); }}
      style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", zIndex: 70, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: C.surface, border: `1.5px solid ${C.border}`, borderRadius: 12, width: "100%", maxWidth: 560, maxHeight: "86vh", overflowY: "auto", padding: 22, boxShadow: "0 8px 28px rgba(42,52,57,0.28)" }}
      >
        <div style={{ fontWeight: 700, fontSize: 16, color: C.ink, marginBottom: 4 }}>Who can use this app</div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 18, lineHeight: 1.5 }}>
          Anyone listed here can sign in with that Google account. Editors can make
          changes; view-only people can look but not change anything. Everyone else
          is turned away, even with the link.
        </div>

        <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 18 }}>
          {accessUsers.length === 0 && (
            <div style={{ padding: 14, fontSize: 13, color: C.muted }}>Nobody added yet.</div>
          )}
          {accessUsers.map((u, i) => {
            const isOwner = u.email === ownerEmail;
            const isSelf = auth && u.email === auth.email;
            return (
              <div
                key={u.email}
                style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderTop: i === 0 ? "none" : `1px solid ${C.border}`, flexWrap: "wrap" }}
              >
                <div style={{ flex: "1 1 180px", minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, color: C.ink, overflow: "hidden", textOverflow: "ellipsis" }}>
                    {u.name || u.email}
                    {isSelf && <span style={{ color: C.muted, fontWeight: 400 }}> (you)</span>}
                  </div>
                  {u.name && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted, overflow: "hidden", textOverflow: "ellipsis" }}>{u.email}</div>
                  )}
                </div>

                {/* The owner row is fixed: the backend always restores this
                    address as an editor, so offering controls that silently get
                    undone would be worse than showing none. */}
                {isOwner ? (
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.accent }} title="Set in the Apps Script file — always an editor, so the app can never lock everyone out.">
                    Owner · always editor
                  </span>
                ) : (
                  <>
                    <select
                      value={u.role}
                      disabled={isSelf || isSaving}
                      onChange={e => setAccessRole(u.email, e.target.value)}
                      style={{ padding: "5px 8px", border: `1.5px solid ${C.border}`, borderRadius: 8, fontSize: 12, background: C.surface, color: C.ink }}
                    >
                      <option value="editor">Editor</option>
                      <option value="viewer">View only</option>
                    </select>
                    <button
                      onClick={() => removeAccessUser(u.email)}
                      disabled={isSelf || isSaving}
                      style={{ background: "none", border: "none", padding: 4, color: isSelf ? C.border : C.danger, fontSize: 12, fontWeight: 600, cursor: isSelf ? "default" : "pointer" }}
                    >
                      Remove
                    </button>
                  </>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ fontWeight: 600, fontSize: 13, color: C.ink, marginBottom: 8 }}>Add someone</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
          <input
            value={accessDraft.email}
            onChange={e => setAccessDraft(d => ({ ...d, email: e.target.value, error: "" }))}
            placeholder="their.name@gmail.com"
            style={{ flex: "2 1 200px", padding: "8px 10px", border: `1.5px solid ${C.border}`, borderRadius: 10, fontSize: 13, background: C.surface, color: C.ink }}
          />
          <input
            value={accessDraft.name}
            onChange={e => setAccessDraft(d => ({ ...d, name: e.target.value, error: "" }))}
            placeholder="Display name (optional)"
            style={{ flex: "1 1 150px", padding: "8px 10px", border: `1.5px solid ${C.border}`, borderRadius: 10, fontSize: 13, background: C.surface, color: C.ink }}
          />
          <select
            value={accessDraft.role}
            onChange={e => setAccessDraft(d => ({ ...d, role: e.target.value }))}
            style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, borderRadius: 10, fontSize: 13, background: C.surface, color: C.ink }}
          >
            <option value="editor">Editor</option>
            <option value="viewer">View only</option>
          </select>
        </div>
        {accessDraft.error && (
          <div style={{ fontSize: 12, color: C.danger, marginBottom: 10 }}>{accessDraft.error}</div>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <button
            onClick={addAccessUser}
            disabled={isSaving}
            style={{ padding: "8px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 13, borderRadius: 10, cursor: "pointer" }}
          >
            Add
          </button>
          <button
            onClick={() => { setShowAccessManager(false); setAccessDraft({ email: "", name: "", role: "editor", error: "" }); }}
            style={{ padding: "8px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 13, borderRadius: 10, color: C.ink, cursor: "pointer" }}
          >
            Done
          </button>
        </div>
      </div>
    </div>
  );

  const usersManagerModal = showUsersManager && (
    <ListManagerModal
      title="Manage users"
      items={usersList}
      newValue={newUserName}
      onNewValueChange={setNewUserName}
      onAdd={addUser}
      onRemove={removeUser}
      onClose={() => { setShowUsersManager(false); setNewUserName(""); }}
      placeholder="New user's name"
      isSaving={isSaving}
    />
  );

  const bulkItemTypesManagerModal = showBulkItemTypesManager && (
    <ListManagerModal
      title="Manage bulk item sub-types"
      items={bulkItemTypes}
      newValue={newBulkItemTypeName}
      onNewValueChange={setNewBulkItemTypeName}
      onAdd={addBulkItemType}
      onRemove={removeBulkItemType}
      onClose={() => { setShowBulkItemTypesManager(false); setNewBulkItemTypeName(""); }}
      placeholder="New sub-type, e.g. Folding Chair"
      isSaving={isSaving}
    />
  );

  // Not ListManagerModal: that one manages a list of plain strings, where the
  // string IS the item, so there is nothing to rename — editing an entry would
  // mean deleting one value and adding another. A type is an id with a name
  // attached, and renaming it is the whole point of giving types ids.
  const typesManagerModal = showTypesManager && (
    <TypeManagerModal
      types={typesList}
      newValue={newTypeName}
      onNewValueChange={setNewTypeName}
      onAdd={addType}
      onSave={saveTypeSettings}
      onReset={resetTypeSettings}
      onRemove={removeType}
      onClose={() => { setShowTypesManager(false); setNewTypeName(""); }}
      isSaving={isSaving}
      canEdit={canEdit}
      isLocked={isLockedType}
      nameTaken={typeNameTaken}
      countFor={id => (assets || []).filter(a => a.type === id).length}
      fieldOptions={typeEditableFields(columns)}
      hasOverrides={typeHasOverrides}
    />
  );

  // Bespoke (not ListManagerModal) since a BreakerType needs a richer editor —
  // a visual half-cell grid to build each member's footprint — than a flat
  // list of strings can express. List view and the add/edit form share one
  // modal, toggled by whether breakerTypeDraft is set.
  const breakerTypesManagerModal = showBreakerTypesManager && (
    // zIndex 50, above SelectionModal's 40 — same reasoning as ListManagerModal.
    <div
      onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
      style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: breakerTypeDraft ? 480 : 380, maxHeight: "80vh", overflowY: "auto" }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            {breakerTypeDraft ? (breakerTypeDraft.id ? "Edit Breaker Type" : "New Breaker Type") : "Manage Breaker Types"}
          </div>
          <button
            onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
            className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}
          >
            <X size={18} />
          </button>
        </div>

        {breakerTypeError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{breakerTypeError}</div>}

        {!breakerTypeDraft ? (
          <>
            {breakerTypes.length === 0 && <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>No breaker types defined yet.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {breakerTypes.map(t => (
                <div key={t.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: "8px 12px" }}>
                  {confirmDeleteTypeId === t.id ? (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ color: C.danger, fontSize: 13 }}>Delete "{t.name}"?</span>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => setConfirmDeleteTypeId(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                        <button
                          onClick={() => { removeBreakerType(t.id); setConfirmDeleteTypeId(null); }}
                          disabled={isSaving}
                          style={{ padding: "3px 8px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                        >
                          {isSaving ? "Saving…" : "Delete"}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{t.name}</div>
                        <div style={{ fontSize: 12, color: C.muted }}>
                          {t.slotSpan} slot{t.slotSpan !== 1 ? "s" : ""} · {t.members.length} breaker{t.members.length !== 1 ? "s" : ""} · {t.members.map(m => `${m.ampRating || "?"}A`).join(", ")}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => openEditBreakerType(t)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Edit ${t.name}`}>
                          <Pencil size={14} color={C.muted} />
                        </button>
                        <button onClick={() => { setBreakerTypeError(null); setConfirmDeleteTypeId(t.id); }} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Delete ${t.name}`}>
                          <Trash2 size={14} color={C.danger} />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <button
              onClick={openAddBreakerType}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}
            >
              <Plus size={14} /> New Breaker Type
            </button>
          </>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Name</span>
              <input
                value={breakerTypeDraft.name}
                onChange={e => setBreakerTypeDraft({ ...breakerTypeDraft, name: e.target.value })}
                placeholder="e.g. Tandem"
                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
              />
            </label>
            <PickerField
              label="Slot Span"
              value={breakerTypeDraft.slotSpan}
              onChange={changeBreakerTypeSlotSpan}
              options={[1, 2, 3]}
              labelForOption={n => `${n} slot${n !== 1 ? "s" : ""}`}
              title="Select slot span"
            />

            <div>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                Click cells for the breaker you're defining
              </span>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 6 }}>
                {(() => {
                  const takenSet = new Set(breakerTypeDraft.members.flatMap(m => m.cells));
                  return Array.from({ length: breakerTypeDraft.slotSpan }, (_, i) => i + 1).map(slotIdx => (
                    <div key={slotIdx} style={{ display: "flex", gap: 4, alignItems: "center" }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 40 }}>Slot {slotIdx}</span>
                      {["a", "b"].map(half => {
                        const cell = `${slotIdx}${half}`;
                        const taken = takenSet.has(cell);
                        const selected = currentMemberCells.includes(cell);
                        return (
                          <button
                            key={cell} type="button" disabled={taken}
                            onClick={() => toggleBreakerTypeCell(cell)}
                            style={{
                              flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 12, fontWeight: 700,
                              border: `1.5px solid ${selected ? C.brand : C.border}`,
                              background: taken ? C.bg : selected ? C.brand : "#fff",
                              color: taken ? C.placeholder : selected ? "#fff" : C.ink,
                              cursor: taken ? "not-allowed" : "pointer",
                            }}
                          >
                            {cell}{taken ? " ✓" : ""}
                          </button>
                        );
                      })}
                    </div>
                  ));
                })()}
              </div>
            </div>

            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Amp Rating (selected cells)</span>
                <input
                  type="number" placeholder="20" value={currentMemberAmp}
                  onChange={e => setCurrentMemberAmp(e.target.value)}
                  style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                />
              </label>
              <button onClick={addBreakerTypeMember} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600 }}>
                Add Breaker
              </button>
            </div>

            {breakerTypeDraft.members.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Breakers in this type</span>
                {breakerTypeDraft.members.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 10px", fontSize: 13 }}>
                    <span>{m.cells.join("+")} · {m.ampRating}A · {new Set(m.cells.map(c => c.slice(0, -1))).size}-pole</span>
                    <button onClick={() => removeBreakerTypeMember(i)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label="Remove breaker">
                      <X size={13} color={C.placeholder} />
                    </button>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", borderTop: `1px solid ${C.border}`, paddingTop: 14 }}>
              <button onClick={cancelBreakerTypeDraft} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                Cancel
              </button>
              <button onClick={saveBreakerType} disabled={isSaving} style={{ padding: "8px 14px", background: isSaving ? C.border : C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                {isSaving ? "Saving…" : "Save Type"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  // Fields to render in a form for the given type: common fields always,
  // type-restricted fields (hostname, screenSize) only when they apply.
  // Status is excluded — it's changed only via the Archive/Restore actions.
  // Room and Building are derived from the parent chain, so they're shown but
  // never typed into — the Parent field is what you edit instead. Filtering them
  // here (rather than at each of the two form render sites) is what stops the
  // app offering two different ways to say where something is.
  function formColumnsFor(type) {
    return columns.filter(c => fieldAppliesTo(c.key, type) && c.key !== "status");
  }

  // ---------- DETAIL VIEW ----------
  if (view === "detail" && selectedAsset) {
    const Icon = iconFor(selectedAsset.type);
    const comments = [...(selectedAsset.comments || [])].reverse();
    const changeEntries = [...(selectedAsset.changes || [])].reverse();
    const totalLoggedCost = (selectedAsset.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
    const assetAuditEntries = auditLog.filter(e => e.assetLabel === selectedAsset.label).slice().reverse();
    // Never-performed items sort first (need scheduling attention); the rest by
    // ascending next-due date, which naturally puts the most-overdue on top.
    const maintenanceItems = (selectedAsset.maintenanceItems || [])
      .map((item, idx) => ({ item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) }))
      .sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    const overdueMaintenanceCount = maintenanceItems.filter(m => m.status === "overdue").length;
    // The header prints selectedAsset.label immediately to the left of this, so
    // the name only earns a spot here when it's actually a name — nameOf() falls
    // back to the label, and "BCA0082  BCA0082" helps nobody. Generalizing the
    // Bulk Item parenthetical ("Folding Chair (Bulk Item)") to `name (type)` is
    // what lets a Room finally read "Room 300 (Room)" instead of just "Room",
    // which is all it showed before — the type name it shares with 20 others.
    const detailName = nameOf(selectedAsset);
    const detailTypeName = typeNameOf(selectedAsset.type, typesList);
    const titleText = detailName !== selectedAsset.label
      ? `${detailName} (${detailTypeName})`
      : selectedAsset.screenSize ? `${detailTypeName} · ${selectedAsset.screenSize}` : detailTypeName;
    // Room and Building are computed columns now, so they're shown for every
    // type that actually has one in its chain rather than being gated by
    // fieldAppliesTo — a Condenser has a Building but no Room, and an Unassigned
    // laptop has neither, and both fall out of the value being empty.
    // The computed Room/Building/Campus columns are left OUT of the detail view
    // entirely — the Path field says where this asset is, in full, and repeating
    // the same answer twice more in shortened form is noise. There's no longer an
    // exception for the type those columns used to name (a Room's `room`): a Room
    // is named by the Name field like everything else.
    const visibleDetailColumns = columns.filter(c => (
      fieldAppliesTo(c.key, selectedAsset.type)
    ));
    const parentProblem = parentageProblem(selectedAsset, assets, typesList);
    const detailGroups = groupDetailColumns(visibleDetailColumns);
    // "label" is excluded here (but not from addFormColumns) — it's the one
    // field the whole app treats as a stable, unique identifier elsewhere
    // (Breaker.panelLabel, Circuit.feedsPanelLabel, Room/Building roomId/
    // buildingId references, the global auditLog's assetLabel matching), so
    // editing it after creation would silently orphan all of those. Picking
    // it before the asset exists (addFormColumns) is fine — nothing
    // references it yet.
    const editFormColumns = formColumnsFor(draft.type).filter(c => c.key !== "label");

    // What's inside this place, at any depth. This used to be two hand-written
    // cases — a Room matched devices by roomId, a Building gathered its Rooms and
    // then the devices in them, plus a special case for the one type (Condenser)
    // that attached to a Building directly. One parent chain collapses all of
    // that into "everything below me", which also means a device inside a closet
    // inside a classroom shows up under the classroom, matching what the Room
    // filter on the list now does.
    // Which assets *are* Rooms is an identity question, so that test still
    // compares the type name; Rooms are split out only so they list separately.
    const isPlace = isPlaceType(selectedAsset.type);
    let contentDevices = [], contentRooms = [], contentAllocations = [];
    if (isPlace) {
      const below = descendantsOf(selectedAsset, assets);
      contentRooms = below.filter(a => a.type === "Room");
      contentDevices = below.filter(a => a.type !== "Room");
      // A bulk allocation names a Room directly and is not a parent link, so it
      // stays an exact match on this asset rather than anything below it.
      contentAllocations = assets
        .filter(a => a.type === "Bulk Item")
        .flatMap(b => (b.allocations || []).filter(al => al.roomId === selectedAsset.label).map(al => ({ bulk: b, quantity: al.quantity })));
    }
    const contentsCount = contentDevices.length + contentRooms.length + contentAllocations.length;

    return (
      <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: C.ink }}>
        {globalStyle}
        {conflictModal}
        {nameModal}
        {peripheralsManagerModal}
        {usersManagerModal}
        {accessManagerModal}
        {bulkItemTypesManagerModal}
        {typesManagerModal}
        {breakerTypesManagerModal}
        <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "12px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={closeDetail} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.brandDark, display: "flex" }} aria-label="Back to list">
            <ArrowLeft size={20} />
          </button>
          <Icon size={17} style={{ color: C.brand, flexShrink: 0 }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, color: C.accent }}>{selectedAsset.label}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: C.brandDark, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{titleText}</div>
          {saveStatusPill && <div style={{ marginLeft: "auto", display: "flex" }}>{saveStatusPill}</div>}
        </div>

        <div style={{ display: "flex", gap: 4, padding: "0 20px", borderBottom: `1.5px solid ${C.border}`, position: "sticky", top: 53, background: C.bg, zIndex: 9, overflowX: "auto" }}>
          {/* WHICH tabs appear comes from availableTabsFor (the registry);
              what each one is CALLED and counts is looked up here, because the
              counts are computed from this asset. Contents is derived from
              place-ness, modules are declared per type — see ASSET_MODULES. */}
          {availableTabsFor(selectedAsset.type).map(key => {
            const meta = {
              details: { label: "Details" },
              contents: { label: "Contents", count: contentsCount },
              maintenance: { label: "Maintenance", count: maintenanceItems.length, urgent: overdueMaintenanceCount > 0 },
              comments: { label: "Comments", count: comments.length },
              changes: { label: "Change Log", count: changeEntries.length },
              audit: { label: "Audit", count: assetAuditEntries.length },
            }[key] || { label: ASSET_MODULES[key].label, count: ASSET_MODULES[key].count(selectedAsset) };
            return { key, ...meta };
          }).map(tab => {
            const active = detailTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setDetailTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,
                }}
              >
                {tab.label}{tab.count > 0 ? ` (${tab.count})` : ""}
              </button>
            );
          })}
        </div>

        <div style={{ padding: "18px 20px 60px", maxWidth: 720, margin: "0 auto" }}>
          {/* Storage is permissive on purpose (see CLAUDE.md), so parentage the
              app itself would have refused can still arrive from a hand-edited
              sheet, a bulk script, or an asset deleted out from under this one.
              Flagging it here is the other half of that decision — the app has
              to tolerate bad parentage without breaking AND make it visible,
              because the failure is otherwise silent: the Building column just
              quietly reads "—" and nothing says why. */}
          {detailTab === "details" && parentProblem && (
            <div style={{ border: `1.5px solid ${C.danger}`, borderRadius: 10, background: "#FBF0EE", padding: "12px 14px", marginBottom: 16, display: "flex", gap: 10, alignItems: "flex-start" }}>
              <AlertTriangle size={16} style={{ color: C.danger, flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontSize: 13, color: C.ink }}>
                <b style={{ color: C.danger }}>This asset's parent doesn't make sense.</b>{" "}
                {/* The generic advice only applies when there IS a Parent field
                    to act on. For a type that takes no parent, picking a
                    different one is impossible — parentageProblem says what to do
                    instead (Edit, then Save, which clears it). */}
                {parentProblem}
                {typeTakesParent(selectedAsset.type) && ` Edit it and pick a different parent, or set it to ${UNASSIGNED_LABEL}.`}
              </div>
            </div>
          )}
          {detailTab === "details" && (!detailEditing ? (
            <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 18, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
              {detailGroups.map((group, gi) => (
                <div key={group.title} style={{ marginTop: gi === 0 ? 0 : 18 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.border}` }}>
                    {group.title}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "14px 20px" }}>
                    {group.columns.map(c => (
                      <Detail
                        key={c.key}
                        label={c.label}
                        value={
                          // Path reads out the whole chain above this asset; an
                          // empty one is a real state ("Unassigned"), not a blank.
                          // Any `room`/`building` reaching here is that asset's
                          // own name (the computed ones were filtered out above),
                          // so it falls through to the plain stored value.
                          c.key === "parent" ? (pathOf(selectedAsset, assets) || UNASSIGNED_LABEL)
                          : selectedAsset[c.key]
                        }
                        wide={c.key === "notes" || c.key === "parent"}
                      />
                    ))}
                  </div>
                </div>
              ))}
              {/* Edit / Duplicate / Archive / Restore / Delete. Gated as one
                  block rather than per button: they are the same affordance
                  (change this asset) and a viewer should see none of them. */}
              {canEdit && (
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                <button onClick={startEditSelected} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                  <Pencil size={15} /> Edit
                </button>
                {/* Places aren't duplicated — copying a Room would produce a
                    second room with the same name and none of its contents, which
                    is never what's wanted. This asked for "not Room and not
                    Building" by name until Campus arrived and silently got a
                    Duplicate button the other two don't have; isPlaceType covers
                    every level, including the next one. */}
                {!isPlaceType(selectedAsset.type) && (
                  <button
                    onClick={() => duplicateAsset(selectedAsset)}
                    disabled={isSaving}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: isSaving ? C.placeholder : C.brandDark, border: `1.5px solid ${isSaving ? C.border : C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10 }}
                  >
                    {isSaving ? <Loader2 size={15} className="spin" /> : <Copy size={15} />} {isSaving ? "Saving…" : "Duplicate"}
                  </button>
                )}
                {(selectedAsset.status || "Active") !== "Archived" ? (
                  <button
                    onClick={() => setConfirmArchive(selectedAsset.label)}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.brandDark, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10 }}
                  >
                    <Archive size={15} /> Archive
                  </button>
                ) : (
                  <>
                    <button
                      onClick={() => restoreAsset(selectedAsset.label)}
                      disabled={isSaving}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: isSaving ? C.placeholder : C.brandDark, border: `1.5px solid ${isSaving ? C.border : C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10 }}
                    >
                      {isSaving ? <Loader2 size={15} className="spin" /> : <ArchiveRestore size={15} />} {isSaving ? "Saving…" : "Restore"}
                    </button>
                    <button
                      onClick={() => setConfirmDelete(selectedAsset.label)}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.danger, border: `1.5px solid ${C.danger}`, fontWeight: 600, fontSize: 14, borderRadius: 10 }}
                    >
                      <Trash2 size={15} /> Permanently delete
                    </button>
                  </>
                )}
              </div>
              )}
            </div>
          ) : (
            <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 18, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
              {/* Form-level copy of the parent error. ParentField shows it too,
                  but only exists for a type that takes a parent — without this,
                  a save refused over a stored parent that has no field to edit
                  would look like a Save button that simply does nothing. */}
              {draft.parentError && (
                <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{draft.parentError}</div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
                {editFormColumns.map(c => (
                  c.key === "type" ? (
                    <TypeField key={c.key} value={draft.type || ""} onChange={v => setDraft({ ...draft, type: v })} types={typesList} onManage={() => setShowTypesManager(true)} />
                  ) : c.key === "parent" ? (
                    <ParentField
                      key={c.key}
                      value={draft.parentId || ""}
                      onChange={v => setDraft({ ...draft, parentId: v, parentError: "" })}
                      childType={draft.type}
                      childLabel={selectedAsset.label}
                      assets={assets}
                      error={draft.parentError}
                    />
                  ) : c.key === "person" ? (
                    <UserField
                      key={c.key}
                      value={draft.person || ""}
                      onChange={v => setDraft({ ...draft, person: v })}
                      userOptions={usersList}
                      onManage={() => setShowUsersManager(true)}
                    />
                  ) : c.key === "peripherals" ? (
                    <PeripheralsField
                      key={c.key}
                      value={draft.peripherals || ""}
                      onChange={v => setDraft({ ...draft, peripherals: v })}
                      options={peripheralsList}
                      onManage={() => setShowPeripheralsManager(true)}
                    />
                  ) : c.key === "subType" ? (
                    <BulkTypeField
                      key={c.key}
                      value={draft.subType || ""}
                      onChange={v => setDraft({ ...draft, subType: v })}
                      options={bulkItemTypes}
                      onManage={() => setShowBulkItemTypesManager(true)}
                    />
                  ) : (
                    <Field
                      key={c.key}
                      label={c.label}
                      value={draft[c.key] || ""}
                      onChange={v => setDraft({ ...draft, [c.key]: v })}
                      wide={c.key === "notes"}
                      type={c.key === "totalQuantity" ? "number" : undefined}
                    />
                  )
                ))}
              </div>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 14 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                  Note for audit log (optional)
                </span>
                <textarea
                  value={editNote}
                  onChange={e => setEditNote(e.target.value)}
                  placeholder="Why this change? e.g. 20 chairs disposed of, broken"
                  rows={2}
                  style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, resize: "vertical", color: C.ink }}
                />
              </label>
              <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
                <button onClick={saveDraft} disabled={isSaving} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: isSaving ? C.border : C.success, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                  {isSaving ? <Loader2 size={15} className="spin" /> : <Save size={15} />} {isSaving ? "Saving…" : "Save"}
                </button>
                <button onClick={() => { setDetailEditing(false); setEditNote(""); }} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10, color: C.ink }}>
                  Cancel
                </button>
              </div>
            </div>
          ))}

          {detailTab === "details" && selectedAsset.type === "Room" && (() => {
            // Computed, not stored — same pattern as a sub-panel's "Fed from"
            // banner: a circuit's roomsServedIds already names this room by
            // its stable id, so the reverse link (which breaker feeds this
            // room) is found by searching every panel's circuits rather than
            // duplicating the relationship as a stored field that could
            // drift out of sync.
            const feeds = assets
              .filter(a => a.type === "Electrical Panel")
              .flatMap(panel => (panel.breakers || []).map(breaker => ({ panel, breaker })))
              .flatMap(({ panel, breaker }) => (breaker.circuits || [])
                .filter(c => (c.roomsServedIds || []).includes(selectedAsset.label))
                .map(circuit => ({ panel, breaker, circuit })));
            if (feeds.length === 0) return null;
            return (
              <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 18, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.border}` }}>
                  Electrical
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {feeds.map(({ panel, breaker, circuit }) => (
                    <div key={circuit.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: C.ink }}>
                      <Zap size={14} color={C.accent} />
                      <span>
                        Fed by{" "}
                        <button
                          onClick={() => {
                            openDetail(panel, "breakers");
                            const members = (panel.breakers || []).filter(b => (breaker.groupId ? b.groupId === breaker.groupId : b.id === breaker.id));
                            openBreakerModal(breaker.id, members);
                          }}
                          style={{ background: "none", border: "none", padding: 0, font: "inherit", color: C.brandDark, fontWeight: 700, cursor: "pointer", textDecoration: "underline" }}
                        >
                          Panel {panel.label}, Slot {slotsLabel_(breaker)}
                        </button>
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}

          {detailTab === "contents" && (
            <>
              {contentsCount === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>
                  Nothing linked to this {selectedAsset.type.toLowerCase()} yet.
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {contentRooms.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 2 }}>
                      Rooms ({contentRooms.length})
                    </div>
                  )}
                  {contentRooms.map(r => {
                    const RIcon = iconFor(r.type);
                    return (
                      <button key={r.label} onClick={() => openDetail(r)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <RIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1 }}>{r.room}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.accent }}>{r.label}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                  {contentDevices.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginTop: contentRooms.length ? 10 : 0, marginBottom: 2 }}>
                      Devices ({contentDevices.length})
                    </div>
                  )}
                  {contentDevices.map(d => {
                    const DIcon = iconFor(d.type);
                    return (
                      <button key={d.label} onClick={() => openDetail(d)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <DIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {d.type}{d.brand ? ` · ${d.brand}` : ""}{selectedAsset.type === "Building" && roomNameOf(d, assets) ? ` · ${roomNameOf(d, assets)}` : ""}
                        </span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.accent }}>{d.label}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                  {contentAllocations.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginTop: (contentRooms.length || contentDevices.length) ? 10 : 0, marginBottom: 2 }}>
                      Bulk Items ({contentAllocations.length})
                    </div>
                  )}
                  {contentAllocations.map(({ bulk, quantity }) => {
                    const BIcon = iconFor(bulk.type);
                    return (
                      <button key={bulk.label} onClick={() => openDetail(bulk)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <BIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1 }}>{nameOf(bulk) !== bulk.label ? nameOf(bulk) : bulk.type}</span>
                        <span style={{ fontWeight: 600, color: C.brandDark }}>× {quantity}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {detailTab === "allocations" && hasModule(selectedAsset.type, "allocations") && (
            <>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 16, fontSize: 13 }}>
                <div><span style={{ color: C.muted }}>Total: </span><span style={{ fontWeight: 700, color: C.brandDark }}>{parseFloat(selectedAsset.totalQuantity) || 0}</span></div>

        {confirmChangeDelete !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Delete this change log entry?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>

                <button onClick={() => setConfirmChangeDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => { deleteChange(confirmChangeDelete); setConfirmChangeDelete(null); }}
                  disabled={isSaving}
                  style={{ padding: "8px 14px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                >
                  {isSaving ? "Saving…" : "Delete"}
                </button>
              </div>
            </div>
          </div>
        )}

        {confirmAllocationRemove !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove allocation for {roomNameFor(confirmAllocationRemove, assets)}?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>That quantity returns to the available pool. This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmAllocationRemove(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
