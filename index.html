                  {isSaving ? "Saving…" : "Remove"}
                </button>
              </div>
            </div>
          </div>
        )}

        {confirmMaintenanceDelete !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Delete this maintenance schedule?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmMaintenanceDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => deleteMaintenanceItem(confirmMaintenanceDelete)}
                  disabled={isSaving}
                  style={{ padding: "8px 14px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                >
                  {isSaving ? "Saving…" : "Delete"}
                </button>
              </div>
            </div>
          </div>
        )}

        {breakerModal && (() => {
          const allBreakers = selectedAsset.breakers || [];
          const clicked = allBreakers.find(b => b.id === breakerModal.anchorId);
          if (!clicked) return null;
          // Local aliases so the rest of this block (unchanged below) can keep
          // reading `instanceDraft`/`editing`/etc. directly — only the
          // setters (further down) need to go through setBreakerModal now.
          const { memberAmpDrafts, activeMemberId, instanceDraft, editing, error: breakerModalError, confirmDeleteGroup, addingCircuitFor } = breakerModal;
          const patchBreakerModal = patch => setBreakerModal({ ...breakerModal, ...patch });
          // A group is one physical breaker-type instance (tandem/quad/split
          // double-pole/...) even though it's several Breaker rows sharing a
          // groupId — the modal shows every member, not just the one clicked,
          // same as the diagram already renders them as one visual cell.
          const members = [...(clicked.groupId ? allBreakers.filter(b => b.groupId === clicked.groupId) : [clicked])].sort((b1, b2) => {
            const s1 = Math.min(...slotsFromCells(b1.cells).map(Number));
            const s2 = Math.min(...slotsFromCells(b2.cells).map(Number));
            return s1 - s2;
          });
          const anchor = members[0];
          const memberIds = members.map(m => m.id);
          const breakerType = breakerTypes.find(t => t.id === anchor.breakerTypeId);
          const groupSlotLabel = [...new Set(members.flatMap(m => slotsFromCells(m.cells)))].sort((a, b) => parseFloat(a) - parseFloat(b)).join("/") || "—";
          const otherPanels = assets.filter(a => a.type === "Electrical Panel" && a.label !== selectedAsset.label);
          const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent };
          const inputStyle = { padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink };
          const closeModal = () => setBreakerModal(null);
          // Edit mode covers the WHOLE unit — the instance fields and every
          // member's amp rating at once — so both its entry and its exit reseed
          // every draft from what's stored. Reseeding on entry (not just on
          // Cancel) means no path back into edit mode can ever start from a
          // stale draft left behind by an earlier abandoned edit.
          const seedDrafts = () => {
            const amps = {};
            members.forEach(m => { amps[m.id] = m.ampRating || ""; });
            return {
              memberAmpDrafts: amps,
              instanceDraft: { serial: anchor.serial || "", installedDate: anchor.installedDate || "", notes: anchor.notes || "" },
            };
          };
          // Entering edit mode also collapses whichever member was expanded:
          // circuits have their own add/edit/delete flow that persists on the
          // spot, which doesn't belong inside a transaction the user can still
          // Cancel out of.
          const beginEdit = () => patchBreakerModal({ ...seedDrafts(), editing: true, error: null, activeMemberId: null, addingCircuitFor: null });
          const cancelEdit = () => patchBreakerModal({ ...seedDrafts(), editing: false, error: null, confirmDeleteGroup: false });
          function renderCircuitTargetFields(values, setValues) {
            // Body lives in the top-level CircuitTargetFields component — the panel's
            // unassigned-circuit list needs the identical control, outside this modal.
            return <CircuitTargetFields values={values} setValues={setValues} assets={assets} otherPanels={otherPanels} />;
          }
          return (
            <div onClick={closeModal} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
              <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 520, maxHeight: "85vh", overflowY: "auto" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                  <div>
                    {breakerType && <div style={{ fontWeight: 700, fontSize: 16, color: C.brandDark }}>{breakerType.name}</div>}
                    <div style={{ fontSize: 12, color: C.muted }}>Slot {groupSlotLabel}{breakerType ? ` — ${members.length} breaker${members.length !== 1 ? "s" : ""}` : ""}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    {/* The ONE edit affordance in this modal: it puts the whole unit into
                        edit mode — the instance fields (serial/installed/notes, shared by
                        every member) AND every member's amp rating below, saved together by
                        a single Save at the bottom. There used to be a second pencil on each
                        member's Amp Rating row, which meant a split double-pole's three amps
                        and its serial were four separate edit/save cycles; the only pencil
                        left per member is the chevron that shows that breaker's circuits,
                        which is a different thing entirely. */}
                    {/* Gating the pencil closes the whole write path here: Save and
                        Delete live in the footer, which only renders while `editing`,
                        and this is the only way in. A viewer can still open a breaker
                        and read it — which is the point of the panel view. */}
                    {!editing && canEdit && (
                      <button onClick={beginEdit} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, display: "flex" }} aria-label="Edit breaker unit">
                        <Pencil size={14} color={C.muted} />
                      </button>
                    )}
                    <button onClick={closeModal} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
                  </div>
                </div>

                {/* Instance-level details — serial/installed/notes describe the one
                    physical unit, so they're edited once here and applied to every
                    member row, not repeated per breaker. Deliberately not wrapped in
                    a bordered box like the breaker member rows below, so it reads as
                    plain metadata about this slot rather than a breaker of its own.
                    In edit mode these are just the top of one form — Cancel/Save (and
                    Delete, which removes the whole unit for the same reason these are
                    edited at unit level) sit at the very bottom of the modal, below the
                    member cards they also save, not up here above them. */}
                <div style={{ marginBottom: 14 }}>
                  {editing ? (
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10 }}>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={labelStyle}>Serial</span>
                        <input value={instanceDraft.serial} onChange={e => patchBreakerModal({ instanceDraft: { ...instanceDraft, serial: e.target.value } })} placeholder="optional" style={inputStyle} />
                      </label>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={labelStyle}>Installed</span>
                        <input type="date" value={dateOnly(instanceDraft.installedDate)} onChange={e => patchBreakerModal({ instanceDraft: { ...instanceDraft, installedDate: e.target.value } })} style={inputStyle} />
                      </label>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                        <span style={labelStyle}>Notes</span>
                        <input value={instanceDraft.notes} onChange={e => patchBreakerModal({ instanceDraft: { ...instanceDraft, notes: e.target.value } })} style={inputStyle} />
                      </label>
                    </div>
                  ) : (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 16 }}>
                      <div>
                        <div style={labelStyle}>Serial</div>
                        <div style={{ fontSize: 13, color: C.ink }}>{anchor.serial || "—"}</div>
                      </div>
                      <div>
                        <div style={labelStyle}>Installed</div>
                        <div style={{ fontSize: 13, color: C.ink }}>{formatDateOnly(anchor.installedDate) || "—"}</div>
                      </div>
                      <div>
                        <div style={labelStyle}>Notes</div>
                        <div style={{ fontSize: 13, color: C.ink }}>{anchor.notes || "—"}</div>
                      </div>
                    </div>
                  )}
                </div>

                {members.map((member, idx) => {
                  const ampDraft = memberAmpDrafts[member.id];
                  // Not an edit gate anymore — `activeMemberId` now only tracks which
                  // member has its Circuits sub-table expanded (that's a separate flow
                  // with its own immediate persists, deliberately outside the unit's
                  // edit transaction). Every member's amp is editable at once in edit
                  // mode, whether or not it's the expanded one.
                  const isActive = activeMemberId === member.id;
                  // A lone single-breaker "group" has no "Breaker N — Slot X" title (there's
                  // only ever one member, so it'd be redundant with the modal's own Slot X
                  // header) — rather than leave that space blank next to the expand toggle,
                  // the Amp Rating row moves up into it instead of sitting on its own row.
                  const hasTitle = members.length > 1;
                  const ampContent = editing ? (
                    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <span style={labelStyle}>Amp Rating</span>
                      <input
                        type="number"
                        value={ampDraft === undefined ? (member.ampRating || "") : ampDraft}
                        onChange={e => patchBreakerModal({ memberAmpDrafts: { ...memberAmpDrafts, [member.id]: e.target.value } })}
                        style={{ ...inputStyle, width: 100 }}
                      />
                    </label>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={labelStyle}>Amp Rating</span>
                      <span style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{member.ampRating ? `${member.ampRating}A` : "—"}</span>
                    </div>
                  );
                  return (
                    <div key={member.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, marginBottom: 14, background: "#fff" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: hasTitle ? 8 : (isActive ? 14 : 0) }}>
                        {hasTitle ? (
                          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.ink }}>
                            {`Breaker ${idx + 1} — Slot ${slotsLabel_(member)}`}
                          </div>
                        ) : ampContent}
                        {/* A chevron, not a pencil: this only shows/hides that breaker's
                            circuits. It used to be a pencil because expanding was also the
                            only way to reach the amp-rating pencil inside — now that amps
                            are edited from the unit's one edit mode, a second pencil here
                            would just be the confusion this consolidation removes. Hidden
                            in edit mode: circuits persist immediately, so they'd escape a
                            Cancel. Matches ChildEntityTable's own expand toggle. */}
                        {!editing && (
                          <button
                            onClick={() => patchBreakerModal({
                              activeMemberId: isActive ? null : member.id,
                              addingCircuitFor: null,
                            })}
                            className="icon-btn"
                            style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", flexShrink: 0 }}
                            aria-label={isActive ? "Hide circuits" : "Show circuits"}
                          >
                            {isActive ? <ChevronDown size={15} color={C.brand} /> : <ChevronRight size={15} color={C.brand} />}
                          </button>
                        )}
                      </div>
                      {hasTitle && (
                        <div style={{ marginBottom: isActive ? 14 : 0 }}>
                          {ampContent}
                        </div>
                      )}

                      {isActive && (
                        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                            <div style={labelStyle}>Circuits</div>
                            <button
                              onClick={() => patchBreakerModal({ addingCircuitFor: addingCircuitFor === member.id ? null : member.id })}
                              className="icon-btn"
                              style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }}
                              aria-label="Add circuit"
                            >
                              <Plus size={14} color={C.muted} />
                            </button>
                          </div>
                          <ChildEntityTable
                            canEdit={canEdit}
                            items={member.circuits || []}
                            fields={CIRCUIT_TABLE_FIELDS}
                            initialDraft={CIRCUIT_TABLE_INITIAL_DRAFT}
                            isSaving={isSaving}
                            onAdd={draft2 => addCircuit(member.id, draft2)}
                            onSave={(id, draft2) => saveCircuitEdit(member.id, id, draft2)}
                            onDelete={id => deleteCircuit(member.id, id)}
                            addLabel="Add Circuit"
                            hideAddButton
                            addOpen={addingCircuitFor === member.id}
                            onAddOpenChange={open => patchBreakerModal({ addingCircuitFor: open ? member.id : null })}
                            emptyMessage="No circuits on this breaker yet."
                            renderCustomFields={renderCircuitTargetFields}
                            deleteConfirmMessage={circuit => `Delete circuit "${circuit.label}"?`}
                            renderSummary={circuit => circuitSummary(circuit, assets)}
                            customRowActions={circuit => (
                              <button onClick={() => openMoveCircuit(member.id, circuit)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label={`Move circuit ${circuit.label}`}>
                                <ArrowLeftRight size={14} color={C.muted} />
                              </button>
                            )}
                          />
                        </div>
                      )}
                      {!isActive && (member.circuits || []).length > 0 && (
                        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 14, paddingTop: 12 }}>
                          <div style={{ ...labelStyle, marginBottom: 8 }}>Circuits</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {/* Same content as the expanded view's rows, minus the per-row
                                actions — both go through circuitSummary() now, so a future
                                circuit-summary field only has to be added in one place. */}
                            {(member.circuits || []).map(circuit => (
                              <div key={circuit.id}>{circuitSummary(circuit, assets)}</div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}

                {/* One Cancel/Save for the whole unit, sitting below everything it
                    saves — the instance fields above AND every member's amp rating.
                    Save is a single persist() (saveBreakerUnit), not one per changed
                    field: every save posts the entire state snapshot, so the old
                    per-field saves cost a backend round trip each. Delete lives here
                    too — it removes the whole unit, so it belongs with the unit's other
                    write actions, and keeping it inside edit mode (as it was before)
                    keeps it from sitting next to the pencil as a stray action in the
                    read-only view. */}
                {editing && (
                  <div style={{ display: "flex", alignItems: "center", gap: 10, borderTop: `1px solid ${C.border}`, paddingTop: 14 }}>
                    {confirmDeleteGroup ? (() => {
                      // A unit carrying circuits isn't refused any more — the prompt
                      // says what will happen to them and the button name matches,
                      // so "Unassign & delete" is never a surprise.
                      const attached = attachedCircuitCount(members);
                      return (
                      <>
                        <span style={{ fontSize: 13, color: C.danger }}>
                          {attached > 0
                            ? `Delete this breaker unit? Its ${attached} circuit${attached !== 1 ? "s" : ""} will be unassigned, not deleted — ${attached !== 1 ? "they" : "it"} will move to Unassigned circuits.`
                            : "Delete this breaker unit?"}
                        </span>
                        <div style={{ display: "flex", gap: 10, marginLeft: "auto" }}>
                          <button onClick={() => patchBreakerModal({ confirmDeleteGroup: false })} style={{ padding: "8px 12px", background: "transparent", border: `1.5px solid ${C.border}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                            Cancel
                          </button>
                          <button
                            onClick={() => {
                              deleteBreakerGroup(members, groupSlotLabel, attached > 0);
                              closeModal();
                            }}
                            disabled={isSaving}
                            style={{ padding: "8px 12px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                          >
                            {isSaving ? "Saving…" : attached > 0 ? "Unassign & delete" : "Delete"}
                          </button>
                        </div>
                      </>
                      );
                    })() : (
                      <>
                        <button onClick={() => patchBreakerModal({ error: null, confirmDeleteGroup: true })} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Delete breaker unit">
                          <Trash2 size={14} color={C.danger} />
                        </button>
                        <div style={{ display: "flex", gap: 10, marginLeft: "auto" }}>
                          <button
                            onClick={cancelEdit}
                            style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}
                          >
                            Cancel
                          </button>
                          <button
                            onClick={() => {
                              // Stays in edit mode with the drafts intact if the save
                              // reports a reason (mid-save double-click, panel gone) —
                              // dropping the user's edits on a message they never saw
                              // is exactly what the error string exists to prevent.
                              const reason = saveBreakerUnit(memberIds, groupSlotLabel, instanceDraft, memberAmpDrafts);
                              if (reason) { patchBreakerModal({ error: reason }); return; }
                              patchBreakerModal({ editing: false, error: null });
                            }}
                            disabled={isSaving}
                            style={{ padding: "8px 14px", background: isSaving ? C.border : C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                          >
                            {isSaving ? "Saving…" : "Save"}
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                )}

                {breakerModalError && <div style={{ fontSize: 13, color: C.danger, marginTop: 10 }}>{breakerModalError}</div>}
              </div>
            </div>
          );
        })()}

        {swapModal && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 4, color: C.brandDark }}>Swap breaker at Slot {slotsLabel_(swapModal.breaker)}</div>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
                Keeps the same slot(s) and id — logged as a physical replacement, separate from a field edit.
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>New Serial</span>
                  <input
                    value={swapModal.draft.serial}
                    onChange={e => setSwapModal({ ...swapModal, draft: { ...swapModal.draft, serial: e.target.value } })}
                    style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                  />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Amp Rating</span>
                  <input
                    type="number"
                    value={swapModal.draft.ampRating}
                    onChange={e => setSwapModal({ ...swapModal, draft: { ...swapModal.draft, ampRating: e.target.value } })}

                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>

                    value={swapModal.draft.installedDate}

        {moveCircuitModal && (

              <div style={{ fontWeight: 700, marginBottom: 4, color: C.brandDark }}>Move circuit "{moveCircuitModal.circuit.label}"</div>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
                Choose another breaker on this panel, or unassign it from breakers entirely.
              </div>
              {(() => {
                const targetBreakers = (selectedAsset.breakers || []).filter(b => b.id !== moveCircuitModal.breakerId);
                // "Unassigned" is offered as just another destination rather than a
                // separate action, so breaker -> breaker, breaker -> unassigned and
                // unassigned -> breaker are all the same one flow. It's omitted when
                // the circuit is already there, same as its current breaker is.
                const options = ["", ...targetBreakers.map(b => b.id), ...(moveCircuitModal.breakerId ? [UNASSIGNED_TARGET] : [])];
                const slotLabelFor = id => {
                  if (id === UNASSIGNED_TARGET) return "Unassigned (no breaker)";
                  const b = targetBreakers.find(x => x.id === id);
                  return b ? `Slot ${slotsLabel_(b)}` : "Select a destination…";
                };
                return (
                  <div style={{ marginBottom: 12 }}>
                    <PickerField
                      label="Destination"
                      hideLabel
                      value={moveCircuitModal.target}
                      onChange={v => setMoveCircuitModal({ ...moveCircuitModal, target: v })}
                      options={options}
                      placeholder="Select a destination…"
                      labelForOption={slotLabelFor}
                      title="Select a destination"
                    />
                  </div>

              })()}
              {moveCircuitModal.error && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{moveCircuitModal.error}</div>}

                <button onClick={() => setMoveCircuitModal(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                  Cancel
                </button>
                <button
                  onClick={submitMoveCircuit}
                  disabled={isSaving}
                  style={{ padding: "8px 14px", background: isSaving ? C.border : C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}

                  {isSaving ? "Saving…" : "Move"}
                </button>
              </div>
            </div>
          </div>

        {showChangeTypeManager && (
          <ListManagerModal
            title="Manage change types"
            items={changeTypes}
            newValue={newChangeTypeName}
            onNewValueChange={setNewChangeTypeName}
            onAdd={addChangeType}
            onRemove={removeChangeType}
            onClose={() => { setShowChangeTypeManager(false); setNewChangeTypeName(""); }}
            placeholder="New change type"
            isSaving={isSaving}
          />
        )}

        {showVendorManager && (
          <ListManagerModal
            title="Manage vendors"
            items={vendors}
            newValue={newVendorName}
            onNewValueChange={setNewVendorName}
            onAdd={addVendor}
            onRemove={removeVendor}
            onClose={() => { setShowVendorManager(false); setNewVendorName(""); }}
            placeholder="New vendor name"
            isSaving={isSaving}
          />
        )}
      </div>
    );
  }

  // ---------- LIST VIEW ----------
  const hiddenColumns = columns.filter(c => !isColumnVisible(c));
  const addFormColumns = formColumnsFor(draft.type);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', 'Helvetica Neue', sans-serif", color: C.ink }}>
      {globalStyle}
      {conflictModal}
      {nameModal}
      {peripheralsManagerModal}
      {usersManagerModal}
        {accessManagerModal}
      {bulkItemTypesManagerModal}
      {typesManagerModal}
      {breakerTypesManagerModal}

      {/* Shown when a view-only user's action was refused. persist() sets this
          and returns without touching anything, so the message is the only
          evidence the click happened — without it the app would just look
          broken to someone who doesn't know they're view-only. */}
      {readOnlyNotice && (
        <div
          style={{
            position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 60,

            boxShadow: "0 4px 12px rgba(42,52,57,0.18)", maxWidth: "min(92vw, 460px)",

        >
          <span style={{ fontSize: 13, color: C.ink, lineHeight: 1.45 }}>{readOnlyNotice}</span>
          <button
            onClick={() => setReadOnlyNotice(null)}
            style={{ background: "none", border: "none", padding: 0, color: C.muted, fontSize: 12, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}
          >
            Dismiss
          </button>
        </div>
      )}

      {/* Slim header */}
      <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "10px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: C.brandDark }}>BCA Asset Tracker</h1>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button
            onClick={toggleSandboxMode}
            title={sandboxMode
              ? "Sandbox is ON — you're editing local fixture data, nothing is saved to the Google Sheet. Click to switch back to the real Sheet."
              : "Click to switch to Sandbox mode — local fixture data, safe to experiment on, nothing saved to the Google Sheet."}
            style={{
              display: "flex", alignItems: "center", gap: 5, border: `1.5px solid ${sandboxMode ? C.accent : C.border}`,
              background: sandboxMode ? C.accent : "transparent", color: sandboxMode ? "#fff" : C.muted,
              borderRadius: 12, padding: "3px 10px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 700,
            }}
          >
            <FlaskConical size={12} />
            {sandboxMode ? "SANDBOX" : "Sandbox"}
          </button>
          {sandboxMode && (
            <button
              onClick={() => { if (confirm("Reset sandbox data back to the starting fixture? Your sandbox edits will be lost.")) resetSandbox(); }}
              title="Reset sandbox data back to the starting fixture"
              style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted }}
            >
              <RotateCcw size={12} /> Reset
            </button>
          )}
          {saveStatusPill}
          {/* Sandbox keeps the old typed name tag — it has no sign-in, but audit
              entries still want an author. A signed-in session shows the identity
              the SERVER resolved, and it isn't editable: the whole point is that
              it can't be whatever someone types. */}
          {sandboxMode ? (
            <button
              onClick={() => { setNameInput(currentUser || ""); setShowNamePrompt(true); }}
              style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}
            >
              <UserCircle size={14} style={{ color: C.brand }} />
              {currentUser || "Set name"}
            </button>
          ) : auth && (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span
                title={`Signed in as ${auth.email}\nAccess: ${canEdit ? "editor" : "view-only"}`}
                style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}
              >
                <UserCircle size={14} style={{ color: C.brand }} />
                {auth.name || auth.email}
              </span>
              {canEdit && (
                <button
                  onClick={() => setShowAccessManager(true)}
                  title="Manage who can sign in to the asset tracker"
                  style={{ background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted, textDecoration: "underline", cursor: "pointer" }}
                >
                  Access
                </button>
              )}
              {!canEdit && (
                <span
                  title="You can browse the inventory but not change it. Ask an editor if you need to make changes."
                  style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 10, padding: "2px 7px" }}
                >
                  View only
                </span>
              )}
              <button
                onClick={() => endSession(null, true)}
                title="Sign out of the asset tracker"
                style={{ background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted, textDecoration: "underline", cursor: "pointer" }}
              >
                Sign out
              </button>
            </div>

            <span
              style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.danger }}

            >
              Backend outdated
            </span>
          )}
        </div>
      </div>

      {/* Top-level page tabs */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "0 20px", position: "sticky", top: 45, background: C.bg, zIndex: 9 }}>
        <div style={{ display: "flex", gap: 4, overflowX: "auto", overflowY: "hidden" }}>
          {[
            { key: "assets", label: "Assets" },
            { key: "maintenance", label: "Maintenance", count: allMaintenanceRows.length, urgent: maintenanceOverdueTotal > 0 },
          ].map(tab => {
            const active = mainTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setMainTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,

                {tab.label}{tab.count > 0 ? ` (${tab.count})` : ""}
              </button>

          })}
        </div>

        {mainTab === "assets" && (
          <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>

              <div style={{ position: "relative", width: 220 }}>
                <Search size={14} style={{ position: "absolute", left: 10, top: 9, color: C.accent }} />
                <input
                  autoFocus
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  onBlur={() => { if (!query) setSearchOpen(false); }}
                  placeholder="Search asset ID, room, user, serial…"
                  style={{ width: "100%", padding: "8px 28px 8px 30px", border: `1.5px solid ${C.border}`, background: C.surface, fontSize: 13, borderRadius: 10, color: C.ink }}
                />

                  <button
                    onClick={() => { setQuery(""); setSearchOpen(false); }}
                    aria-label="Clear search"
                    className="icon-btn"
                    style={{ position: "absolute", right: 4, top: 4, background: "none", border: "none", padding: 4, borderRadius: 6, color: C.muted, display: "flex" }}
                  >
                    <X size={13} />
                  </button>
                )}
              </div>
            ) : (
              <button
                onClick={() => setSearchOpen(true)}
                aria-label="Search"
                className="icon-btn"
                style={{ background: "none", border: "none", padding: 8, borderRadius: 8, color: C.brandDark, display: "flex" }}
              >
                <Search size={18} />
              </button>
            )}

            <div style={{ position: "relative", flexShrink: 0 }}>
              <button
                onClick={() => setShowToolbarMenu(v => !v)}
                aria-label="More actions"
                className="icon-btn"
                style={{ background: "none", border: "none", padding: 8, borderRadius: 8, color: C.brandDark, display: "flex" }}
              >
                <Menu size={18} />
              </button>
              {showToolbarMenu && (
                <>
                  <div onClick={() => setShowToolbarMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 20 }} />
                  <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 6, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", zIndex: 21, minWidth: 170, overflow: "hidden", padding: 4 }}>
                    <button
                      onClick={() => { setShowToolbarMenu(false); setShowColManager(true); }}
                      className="icon-btn"
                      style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 12px", background: "none", border: "none", fontSize: 14, color: C.ink, textAlign: "left", borderRadius: 6 }}
                    >
                      <Columns3 size={15} /> Columns
                    </button>
                    <button
                      onClick={() => { setShowToolbarMenu(false); exportToExcel(); }}
                      className="icon-btn"
                      style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 12px", background: "none", border: "none", fontSize: 14, color: C.ink, textAlign: "left", borderRadius: 6 }}
                    >
                      <Download size={15} /> Export
                    </button>
                    {/* Columns and Export stay available to viewers: Columns is
                        mostly per-device visibility (never persisted), and Export
                        is a read. Only Add asset writes. */}
                    {canEdit && (
                    <button
                      onClick={() => { setShowToolbarMenu(false); startAdd(); }}
                      className="icon-btn"
                      style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 12px", background: "none", border: "none", fontSize: 14, fontWeight: 700, color: C.brand, textAlign: "left", borderRadius: 6 }}
                    >
                      <Plus size={15} /> Add asset
                    </button>
                    )}
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {mainTab === "maintenance" && (
          <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
            {searchOpen || maintenanceQuery ? (
              <div style={{ position: "relative", width: 220 }}>
                <Search size={14} style={{ position: "absolute", left: 10, top: 9, color: C.accent }} />
                <input
                  autoFocus
                  value={maintenanceQuery}
                  onChange={e => setMaintenanceQuery(e.target.value)}
                  onBlur={() => { if (!maintenanceQuery) setSearchOpen(false); }}
                  placeholder="Search task, asset, owner…"
                  style={{ width: "100%", padding: "8px 28px 8px 30px", border: `1.5px solid ${C.border}`, background: C.surface, fontSize: 13, borderRadius: 10, color: C.ink }}
                />
                {maintenanceQuery && (
                  <button
                    onClick={() => { setMaintenanceQuery(""); setSearchOpen(false); }}
                    aria-label="Clear search"
                    className="icon-btn"
                    style={{ position: "absolute", right: 4, top: 4, background: "none", border: "none", padding: 4, borderRadius: 6, color: C.muted, display: "flex" }}
                  >
                    <X size={13} />
                  </button>
                )}
              </div>
            ) : (
              <button
                onClick={() => setSearchOpen(true)}
                aria-label="Search"
                className="icon-btn"
                style={{ background: "none", border: "none", padding: 8, borderRadius: 8, color: C.brandDark, display: "flex" }}
              >
                <Search size={18} />
              </button>
            )}

            <div style={{ position: "relative", flexShrink: 0 }}>
              <button
                onClick={() => setShowToolbarMenu(v => !v)}
                aria-label="More actions"
                className="icon-btn"
                style={{ background: "none", border: "none", padding: 8, borderRadius: 8, color: C.brandDark, display: "flex" }}
              >
                <Menu size={18} />
              </button>
              {showToolbarMenu && (
                <>
                  <div onClick={() => setShowToolbarMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 20 }} />
                  <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 6, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", zIndex: 21, minWidth: 170, overflow: "hidden", padding: 4 }}>
                    <button
                      onClick={() => { setShowToolbarMenu(false); exportToExcel(); }}
                      className="icon-btn"
                      style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 12px", background: "none", border: "none", fontSize: 14, color: C.ink, textAlign: "left", borderRadius: 6 }}
                    >
                      <Download size={15} /> Export
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}
      </div>

      <div style={{ padding: "18px 20px 80px", maxWidth: 1300, margin: "0 auto" }}>
        {mainTab === "assets" && (
        <>
        <HierarchyNav assets={assets} scopeId={scopeId} setScopeId={setScopeId} />

        {/* Add form */}
        {showAdd && (
          <div style={{ border: `1px solid ${C.border}`, background: C.surface, padding: 20, marginBottom: 18, borderRadius: 10, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: C.brandDark }}>Add asset</div>
              <button onClick={cancelAdd} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
              {addFormColumns.map(c => (
                c.key === "type" ? (
                  <TypeField key={c.key} value={draft.type || ""} onChange={v => setDraft({ ...draft, type: v })} types={typesList} onManage={() => setShowTypesManager(true)} />
                ) : c.key === "parent" ? (
                  <ParentField
                    key={c.key}
                    value={draft.parentId || ""}
                    onChange={v => setDraft({ ...draft, parentId: v, parentError: "" })}
                    childType={draft.type}
                    childLabel={draft.label}
                    assets={assets}
                    error={draft.parentError}
                  />
                ) : c.key === "person" ? (
                  <UserField
                    key={c.key}
                    value={draft.person || ""}
                    onChange={v => setDraft({ ...draft, person: v })}
                    userOptions={usersList}
                    onManage={() => setShowUsersManager(true)}
                  />
                ) : c.key === "peripherals" ? (
                  <PeripheralsField
                    key={c.key}
                    value={draft.peripherals || ""}
                    onChange={v => setDraft({ ...draft, peripherals: v })}
                    options={peripheralsList}
                    onManage={() => setShowPeripheralsManager(true)}
                  />
                ) : c.key === "subType" ? (
                  <BulkTypeField
                    key={c.key}
                    value={draft.subType || ""}
                    onChange={v => setDraft({ ...draft, subType: v })}
                    options={bulkItemTypes}
                    onManage={() => setShowBulkItemTypesManager(true)}
                  />
                ) : (
                  <Field
                    key={c.key}
                    label={c.label}
                    value={draft[c.key] || ""}
                    // Editing the Asset ID clears a stale duplicate-ID error, so
                    // the message never outlives the value it was complaining about.
                    onChange={v => { if (c.key === "label" && addError) setAddError(""); setDraft({ ...draft, [c.key]: v }); }}
                    wide={c.key === "notes"}
                    // The Name placeholder previews exactly what saving blank
                    // will store, so the default is visible before it's chosen
                    // rather than appearing out of nowhere afterwards.
                    placeholder={c.key === "screenSize" ? 'e.g. 24"' : c.key === "name" ? suggestedNameFor(draft, assets) : undefined}
                    type={c.key === "totalQuantity" ? "number" : undefined}
                  />
                )
              ))}
            </div>
            {addError && <div style={{ fontSize: 13, color: C.danger, marginTop: 12 }}>{addError}</div>}
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button onClick={saveDraft} disabled={isSaving} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: isSaving ? C.border : C.success, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                {isSaving ? <Loader2 size={15} className="spin" /> : <Save size={15} />} {isSaving ? "Saving…" : "Save"}
              </button>
              <button onClick={cancelAdd} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10, color: C.ink }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {canEdit && userFilter !== "All users" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 10, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Reassign {filtered.filter(a => fieldAppliesTo("person", a.type)).length} filtered asset(s) from <b style={{ color: C.brandDark }}>{userFilter}</b> to:</span>
            <div style={{ flex: "1 1 140px", maxWidth: 220 }}>
              <PickerField
                label="Reassign to user"
                hideLabel
                value={reassignTarget}
                onChange={setReassignTarget}
                options={["", ...usersList.filter(u => u !== userFilter)]}
                placeholder="Select a user…"
                labelForOption={u => u || "Select a user…"}
                title="Select a user"
              />
            </div>
            <button onClick={() => setShowUsersManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Manage users">
              <Settings size={14} color={C.accent} />
            </button>
            <button
              onClick={() => reassignFilteredTo(reassignTarget)}
              disabled={!reassignTarget.trim()}
              style={{ padding: "6px 12px", background: reassignTarget.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
            >
              Reassign
            </button>
          </div>

        {canEdit && bulkMoveSourceId && roomMovable.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 10, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>

                  they already are is the one destination that can't be meant. */}
              <RoomField
                hideLabel
                value={moveTarget}
                onChange={setMoveTarget}

                excludeId={bulkMoveSourceId}

            <button
              onClick={() => moveFilteredTo(moveTarget)}

              {visibleColumns.map((c, i) => {

                style={{ display: "grid", gridTemplateColumns: gridTemplate, alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
              >
                {visibleColumns.map((c, i) => {
                  const isTypeCol = c.key === "type";
                  const Icon = isTypeCol ? iconFor(a.type) : null;
                  const applies = fieldAppliesTo(c.key, a.type);
                  const isParentCol = c.key === "parent";
                  return (
                    <div
                      key={c.key}
                      style={{
                        padding: "12px 14px",
                        fontSize: c.key === "label" ? 12 : 13,
                        fontFamily: c.key === "label" ? "'IBM Plex Mono', monospace" : undefined,
                        fontWeight: c.key === "label" ? 600 : isTypeCol ? 500 : 400,
                        color: c.key === "label" ? C.accent : applies ? C.muted : C.border,

                        // "Unassigned" only where a parent is a thing this type

                        applies ? (pathOf(a, assets) || UNASSIGNED_LABEL) : ""
                      ) : isTypeCol ? (
                        // The stored value is the type's id; what's shown is its
                        // current name, which is what makes a rename take effect
                        // everywhere at once.
                        typeNameOf(a.type, typesList) || "—"
                      ) : (
                        applies ? (a[c.key] || "—") : ""

              <div style={{ display: "grid", gridTemplateColumns: "220px 170px 110px 130px 130px 130px 120px", background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
                {[
                  { key: "task", label: "Task" },
                  { key: "asset", label: "Asset" },
                  { key: "frequency", label: "Frequency" },
                  { key: "owner", label: "Owner" },
                  { key: "lastPerformed", label: "Last Performed" },
                  { key: "nextDue", label: "Next Due" },
                  { key: "status", label: "Status" },
                ].map(c => (
                  <ColumnHeaderCell
                    key={c.key}
                    label={c.label}
                    colKey={c.key}

                    setSortConfig={setMaintenanceSortConfig}

                <div style={{ padding: 32, textAlign: "center", color: C.empty, fontSize: 14, minWidth: "max-content" }}>
                  {allMaintenanceRows.length === 0 ? "No maintenance scheduled yet." : "No scheduled items match your search."}

              {filteredMaintenanceRows.map(({ asset, assetName, item, idx, status, due }) => {
                const statusMeta = {
                  overdue: { label: "Overdue", color: C.danger },
                  "due-soon": { label: "Due soon", color: C.accent },

                  <div

                    style={{ display: "grid", gridTemplateColumns: "220px 170px 110px 130px 130px 130px 120px", alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
                  >
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.task}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted, display: "flex", alignItems: "center", gap: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      <AssetIcon size={14} style={{ flexShrink: 0, color: C.brand }} />
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{assetName}</span>
                    </div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted }}>{item.frequencyLabel}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.owner || "—"}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted }}>{item.lastPerformed ? formatDateOnly(item.lastPerformed) : "Never"}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, fontWeight: 600, color: statusMeta.color }}>{due ? formatDateOnly(due.toISOString().slice(0, 10)) : "—"}</div>
                    <div style={{ padding: "12px 14px" }}>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: statusMeta.color }}>

                    </div>
                  </div>

              })}
            </div>
          </div>
        </>
        )}
      </div>

      {/* Column header filter modal */}
      <ColumnFilterModal
        activeCol={activeFilterCol}
        filterConfigs={filterConfigs}
        sortConfig={sortConfig}
        setSortConfig={setSortConfig}
        onClose={() => setActiveFilterCol(null)}
      />
      <ColumnFilterModal
        activeCol={activeMaintenanceFilterCol}
        filterConfigs={maintenanceFilterConfigs}
        sortConfig={maintenanceSortConfig}
        setSortConfig={setMaintenanceSortConfig}
        onClose={() => setActiveMaintenanceFilterCol(null)}
      />

      {/* Column manager modal */}
      {showColManager && (
        <div onClick={() => setShowColManager(false)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:340, maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Columns</div>
              <button onClick={() => setShowColManager(false)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>Hostname and Screen Size only apply to some types — they'll show blank for others.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {columns.map(c => (
                <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 8, opacity: c.locked ? 0.6 : 1 }}>
                    <input type="checkbox" checked={isColumnVisible(c)} disabled={c.locked} onChange={() => toggleColumnVisible(c.key)} />
                    {c.label} {c.locked && <Lock size={11} />}
                  </label>
                  {c.custom && canEdit && (
                    <button onClick={() => setConfirmDeleteCol(c.key)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </div>
              ))}
            </div>
            {/* Show/hide checkboxes above are per-device and never persisted, so
                a viewer keeps them. Adding or removing a COLUMN changes the shape
                of every asset for everyone, so that half goes. */}
            {canEdit && (
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
              <input
                value={newColName}

              />

            </div>
            )}
          </div>
        </div>
      )}

      {/* Delete column confirm */}
      {confirmDeleteCol && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 360 }}>
            <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove "{columns.find(c => c.key === confirmDeleteCol)?.label}" column?</div>
            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This deletes that field's data from every asset. This can't be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteCol(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
              <button onClick={() => removeColumn(confirmDeleteCol)} disabled={isSaving} style={{ padding: "8px 14px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>{isSaving ? "Saving…" : "Remove"}</button>
            </div>

    </div>
