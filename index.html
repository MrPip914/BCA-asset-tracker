}

function Detail({ label, value, wide, italic }) {
  return (
    <div style={{ gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 0.5, textTransform: "uppercase", color: C.placeholder }}>{label}</span>
      <div style={{ color: value ? C.ink : C.placeholder, fontSize: 14, fontStyle: italic ? "italic" : "normal" }}>{value || "—"}</div>
    </div>
  );
}

function ListManagerModal({ title, items, newValue, onNewValueChange, onAdd, onRemove, onClose, placeholder, isLocked, hint }) {
  const [confirmItem, setConfirmItem] = useState(null);
  return (
    // zIndex 50, above SelectionModal's 40 — this modal is frequently opened via the
    // "manage" gear from inside an open SelectionModal (e.g. Type field -> manage asset
    // types), so it must stack above that picker rather than being hidden behind it.
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:320, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        {hint && <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>{hint}</div>}
        {items.length === 0 && (
          <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>Nothing added yet.</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
          {items.map(item => {
            const locked = isLocked ? isLocked(item) : false;
            return (
            <div key={item} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
              {confirmItem === item ? (
                <>
                  <span style={{ color: C.danger, fontSize: 13 }}>Remove "{item}"?</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmItem(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                    <button
                      onClick={() => { onRemove(item); setConfirmItem(null); }}
                      style={{ padding: "3px 8px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                    >
                      Delete
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <span style={{ display: "flex", alignItems: "center", gap: 6, opacity: locked ? 0.6 : 1 }}>{item} {locked && <Lock size={11} />}</span>
                  {locked ? (
                    <span />
                  ) : (
                    <button onClick={() => setConfirmItem(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </>
              )}
            </div>
            );
          })}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
          <input
            value={newValue}
            onChange={e => onNewValueChange(e.target.value)}
            onKeyDown={e => e.key === "Enter" && onAdd()}
            placeholder={placeholder}
            style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
          />
          <button onClick={onAdd} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}>Add</button>
        </div>
      </div>
    </div>
  );
}

// Generic modal picker mirroring the column-filter popup's look: centered card,
// scrollable list of option buttons, checkmark on the selected one. Used for any
// single-select field (Type/Room/Building) that shouldn't use a native <select>.
function SelectionModal({ title, options, value, onChange, onClose, labelForOption, emptyLabel, onManage, manageLabel }) {
  const getLabel = labelForOption || (o => o);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
            {onManage && (
              <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.accent, display: "flex" }} aria-label={manageLabel || "Manage list"}>
                <Settings size={15} />
              </button>
            )}
            <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
          </div>
        </div>
        {options.length === 0 && emptyLabel && (
          <div style={{ fontSize: 13, color: C.empty, padding: "4px 2px 8px" }}>{emptyLabel}</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {options.map(opt => {
            const isSelected = opt === (value || "");
            return (
              <button
                key={opt || "__none__"}
                onClick={() => { onChange(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: opt ? C.ink : C.empty, fontWeight: isSelected ? 600 : 400,
                }}
              >
                {getLabel(opt)}
                {isSelected && <Check size={15} color={C.brand} />}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Header cell for a data-table column: either a filter+sort trigger (Filter icon,
// opens ColumnFilterModal) for columns present in filterConfigs, or a plain
// click-to-cycle sort button (asc -> desc -> none) for everything else. A small
// × chip appears next to the sort arrow on whichever column is currently sorted,
// so it can be cleared directly instead of reopening the modal or re-cycling taps.
function ColumnHeaderCell({ label, colKey, sticky, filterConfigs, sortConfig, setSortConfig, onOpenFilter }) {
  const cfg = filterConfigs[colKey];
  const isFiltered = cfg && cfg.value !== cfg.options[0];
  const sortedHere = sortConfig && sortConfig.key === colKey;
  const sortArrow = sortedHere ? (sortConfig.dir === "asc" ? " ↑" : " ↓") : "";
  return (
    <div style={{ position: sticky ? "sticky" : "static", left: sticky ? 0 : undefined, background: C.brandDark, zIndex: sticky ? 2 : 1, display: "flex", alignItems: "center" }}>
      {cfg ? (
        <button
          onClick={() => onOpenFilter(colKey)}
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: isFiltered || sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: isFiltered || sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
          <Filter size={11} style={{ flexShrink: 0 }} />
        </button>
      ) : (
        <button
          onClick={() => setSortConfig(
            !sortedHere ? { key: colKey, dir: "asc" }
            : sortConfig.dir === "asc" ? { key: colKey, dir: "desc" }
            : null
          )}
          title="Tap to sort"
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
        </button>
      )}
      {sortedHere && (
        <button
          onClick={() => setSortConfig(null)}
          title="Clear sort"
          aria-label="Clear sort"
          style={{ flexShrink: 0, background: "none", border: "none", padding: "6px 10px 6px 0", color: "#E8C9A0", display: "flex" }}
        >
          <X size={11} />
        </button>
      )}
    </div>
  );
}

// Modal opened from a ColumnHeaderCell's filter button: option list (with an
// optional cfg.labelForOption for columns whose stored value isn't the display
// text, e.g. Maintenance's Status filter storing "due-soon" but showing "Due
// soon") plus Sort A→Z / Z→A for that column.
function ColumnFilterModal({ activeCol, filterConfigs, sortConfig, setSortConfig, onClose }) {
  if (!activeCol || !filterConfigs[activeCol]) return null;
  const cfg = filterConfigs[activeCol];
  const getLabel = cfg.labelForOption || (o => o);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            Filter by {cfg.label}
          </div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {cfg.options.map(opt => {
            const isSelected = opt === cfg.value;
            return (
              <button
                key={opt}
                onClick={() => { cfg.setValue(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: C.ink, fontWeight: isSelected ? 600 : 400,
                }}
              >
                {getLabel(opt)}
                {isSelected && <Check size={15} color={C.brand} />}
              </button>
            );
          })}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 12, display: "flex", gap: 6 }}>
          {[["asc", "Sort A → Z"], ["desc", "Sort Z → A"]].map(([dir, lbl]) => {
            const active = sortConfig && sortConfig.key === activeCol && sortConfig.dir === dir;
            return (
              <button
                key={dir}
                onClick={() => { setSortConfig(active ? null : { key: activeCol, dir }); onClose(); }}
                style={{ flex: 1, padding: "7px 10px", background: active ? C.brand : "transparent", color: active ? "#fff" : C.ink, border: `1.5px solid ${active ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
              >
                {lbl}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Everything the Breakers tab shows besides the breaker-detail/swap/move-
// circuit modals (those stay in AssetTracker since they're reachable from
// other tabs too, e.g. a Room's "Fed by" link jumps straight into one) —
// the "Fed from" banner, the panel diagram itself, and the Add Breaker form.
// Pulled out of AssetTracker's ~3700-line body as the first cut at breaking
// that component up; the props list is exactly what this piece touches.
function BreakersTabContent({
  selectedAsset, assets, breakerTypes, showPanelConfig, setShowPanelConfig,
  updatePanelConfig, openBreakerModal, addBreakerDraft, setAddBreakerDraft,
  setShowBreakerTypesManager, addBreaker,
}) {
  const feed = assets
    .filter(a => a.type === "Electrical Panel")
    .flatMap(a => (a.breakers || []).map(b => ({ panel: a, breaker: b })))
    .flatMap(({ panel, breaker }) => (breaker.circuits || []).map(c => ({ panel, breaker, circuit: c })))
    .find(({ circuit }) => circuit.feedsPanelLabel === selectedAsset.label);

  const slotCount = parseInt(selectedAsset.panelSlotCount, 10) || 0;
  const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent };
  const inputStyle = { padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, maxWidth: 120 };
  const selectedType = addBreakerDraft ? breakerTypes.find(t => t.id === addBreakerDraft.breakerTypeId) : null;
  const closeAddBreakerForm = () => setAddBreakerDraft(null);

  return (
    <>
      {feed && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", marginBottom: 14, border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, fontSize: 13, color: C.ink }}>
          <Zap size={14} color={C.accent} />
          Fed from <strong style={{ fontWeight: 700, color: C.brandDark }}>{feed.panel.label}</strong>, Slot {cellsLabel_(feed.breaker)}
        </div>
      )}

      {slotCount <= 0 || showPanelConfig ? (
        <PanelConfigForm
          slotCount={selectedAsset.panelSlotCount}
          layout={selectedAsset.panelLayout}
          onSave={(count, lay) => { updatePanelConfig(count, lay); setShowPanelConfig(false); }}
          onCancel={slotCount > 0 ? () => setShowPanelConfig(false) : null}
        />
      ) : (
        <PanelDiagram
          slotCount={slotCount}
          layout={selectedAsset.panelLayout || "two-column"}
          breakers={selectedAsset.breakers || []}
          allAssets={assets}
          breakerTypes={breakerTypes}
          panelLabel={selectedAsset.label}
          onReconfigure={() => setShowPanelConfig(true)}
          onSlotClick={id => {
            const list = selectedAsset.breakers || [];
            const b = list.find(x => x.id === id);
            if (!b) return;
            // A click anywhere in a group opens the whole group — every
            // breaker sharing this groupId, not just the one clicked —
            // since a group is one physical breaker-type instance (e.g.
            // a quad or split double-pole) even though it's several rows.
            const members = b.groupId ? list.filter(x => x.groupId === b.groupId) : [b];
            openBreakerModal(id, members);
          }}
          onSpareClick={slot => {
            setAddBreakerDraft({ breakerTypeId: breakerTypes[0] ? breakerTypes[0].id : "", startSlot: String(slot), serial: "", installedDate: "", notes: "", error: null });
          }}
        />
      )}

      {addBreakerDraft && (
        <div onClick={closeAddBreakerForm} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 16, color: C.brandDark }}>Add Breaker</div>
              <button onClick={closeAddBreakerForm} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 180 }}>
                  <span style={labelStyle}>Breaker Type</span>
                  {breakerTypes.length === 0 ? (
                    <div style={{ fontSize: 13, color: C.empty }}>No breaker types defined yet.</div>
                  ) : (
                    <PickerField
                      label="Breaker Type"
                      hideLabel
                      value={addBreakerDraft.breakerTypeId || ""}
                      onChange={v => setAddBreakerDraft({ ...addBreakerDraft, breakerTypeId: v })}
                      options={breakerTypes.map(t => t.id)}
                      labelForOption={id => {
                        const t = breakerTypes.find(x => x.id === id);
                        return t ? `${t.name} — ${t.slotSpan} slot${t.slotSpan !== 1 ? "s" : ""}, ${t.members.length} breaker${t.members.length !== 1 ? "s" : ""}` : "";
                      }}
                      title="Select breaker type"
                    />
                  )}
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Starting Slot</span>
                  <input type="number" placeholder="e.g. 5" value={addBreakerDraft.startSlot || ""} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, startSlot: e.target.value })} style={inputStyle} />
                </label>
                <button
                  type="button" onClick={() => setShowBreakerTypesManager(true)}
                  style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", padding: "8px 0", color: C.accent, fontSize: 12, fontWeight: 600 }}
                >
                  <Settings size={13} /> Manage types
                </button>
              </div>
              {selectedType && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <span style={labelStyle}>Amp rating per breaker (from type — editable)</span>
                  {selectedType.members.map((m, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 13, color: C.muted }}>
                        {m.cells.join("+")} · {new Set(m.cells.map(c => c.slice(0, -1))).size}-pole
                      </span>
                      <input
                        type="number" placeholder={m.ampRating}
                        value={addBreakerDraft[`amp_${i}`] !== undefined ? addBreakerDraft[`amp_${i}`] : m.ampRating}
                        onChange={e => setAddBreakerDraft({ ...addBreakerDraft, [`amp_${i}`]: e.target.value })}
                        style={{ ...inputStyle, maxWidth: 90 }}
                      />
                    </div>
                  ))}
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Serial</span>
                  <input value={addBreakerDraft.serial} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, serial: e.target.value })} placeholder="optional" style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Installed</span>
                  <input type="date" value={addBreakerDraft.installedDate} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, installedDate: e.target.value })} style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                  <span style={labelStyle}>Notes</span>
                  <input value={addBreakerDraft.notes} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, notes: e.target.value })} style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
              </div>
              {addBreakerDraft.error && <div style={{ fontSize: 13, color: C.danger }}>{addBreakerDraft.error}</div>}
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={closeAddBreakerForm} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                  Cancel
                </button>
                <button
                  onClick={() => {
                    const result = addBreaker(addBreakerDraft);
                    if (result.error) { setAddBreakerDraft({ ...addBreakerDraft, error: result.error }); return; }
                    setAddBreakerDraft(null);
                    openBreakerModal(result.newBreakers[0].id, result.newBreakers);
                  }}
                  style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                >
                  Add Breaker
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// One-time (or reconfigure-on-demand) setup for a panel's physical slot
// layout — total slot count plus a layout preset. Kept separate from the
// generic asset Edit form since it's specific to how the Breakers tab draws
// the diagram, not a general asset field a user would expect in Details.
function PanelConfigForm({ slotCount, layout, onSave, onCancel }) {
  const [count, setCount] = useState(slotCount || "");
  const [lay, setLay] = useState(layout || "two-column");
  const valid = count && parseInt(count, 10) > 0;
  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, marginBottom: 20, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>
        {onCancel ? "Reconfigure this panel's slot layout." : "Set up this panel's slot layout to see a visual diagram of where breakers sit."}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
        <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Total Slots</span>
          <input
            type="number" min="1" value={count} onChange={e => setCount(e.target.value)} placeholder="e.g. 24"
            style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
          />
        </label>
        <PickerField
          label="Layout"
          value={lay}
          onChange={setLay}
          options={["two-column", "single-column"]}
          labelForOption={v => (v === "two-column" ? "Two-column (odd left / even right)" : "Single column")}
          title="Select layout"
        />
      </div>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
        {onCancel && (
          <button onClick={onCancel} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
            Cancel
          </button>
        )}
        <button
          onClick={() => onSave(parseInt(count, 10) || 0, lay)}
          disabled={!valid}
          style={{ padding: "8px 14px", background: valid ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
        >
          Save layout

      </div>
    </div>
  );
}

// Visual panel schedule — slots laid out per the panel's configured layout
// (two-column odd-left/even-right, or a single column) rather than just a
// flat breaker list. Slot numbers print outside the breaker cells, on the
// side of the panel they'd physically be on (odd left / even right), the
// way a real panel schedule reads — the cells themselves are freed up for
// breaker or feed info via the toggle. A double-pole breaker's two slots
// collapse into one tall cell spanning both rows in its column, still with
// both individual slot numbers printed outside at their own row; a tandem
// pair shares one cell split top/bottom. Clicking a breaker opens that
// specific breaker's detail modal (edit fields + its circuits) — the
// diagram IS the entry point for a breaker's detail, not a map onto a
// separate list.
function fallbackCopyToClipboard(text, onCopied) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); onCopied(); } catch (e) { /* clipboard unavailable — give up silently */ }
  document.body.removeChild(ta);
}

function PanelDiagram({ slotCount, layout, breakers, allAssets, breakerTypes, panelLabel, onReconfigure, onSlotClick, onSpareClick }) {
  const [infoMode, setInfoMode] = useState("breaker"); // "breaker" | "feeds" | "table"
  const [linkCopied, setLinkCopied] = useState(false);
  // Table mode's own sort/filter state — same ColumnHeaderCell/ColumnFilterModal
  // pattern the Assets/Maintenance tables use (see CLAUDE.md), just local to this
  // component instead of living on AssetTracker, since a panel's breaker table is
  // self-contained data no other tab needs to read.
  const [tableSortConfig, setTableSortConfig] = useState(null);
  const [tableRoomFilter, setTableRoomFilter] = useState("");
  const [tableActiveFilterCol, setTableActiveFilterCol] = useState(null);

  // Builds a link back to this exact panel's Breakers tab (?asset=...&tab=breakers,
  // consumed by the one-time deep-link effect in AssetTracker) and copies it to the
  // clipboard. Falls back to the older execCommand approach when the async Clipboard
  // API isn't available (e.g. a plain file:// page, which isn't a secure context).
  function copyPanelLink() {
    const url = `${window.location.origin}${window.location.pathname}?asset=${encodeURIComponent(panelLabel)}&tab=breakers`;
    const onCopied = () => { setLinkCopied(true); setTimeout(() => setLinkCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(onCopied).catch(() => fallbackCopyToClipboard(url, onCopied));
    } else {
      fallbackCopyToClipboard(url, onCopied);
    }
  }
  const columns = layout === "single-column" ? 1 : 2;
  const rowOf = n => (columns === 1 ? n : Math.ceil(n / 2));
  const colOf = n => (columns === 1 ? 0 : (n % 2 === 1 ? 0 : 1));
  // Grid tracks, left to right: [numLeft] [breaker col 0] [breaker col 1] [numRight]
  // (single-column collapses to [num] [breaker]). Breaker col -> track, and
  // the number track on that same side.
  const breakerTrack = col => (columns === 1 ? 2 : col + 2);
  const numberTrack = col => (columns === 1 ? 1 : (col === 0 ? 1 : 4));
  const gridTemplateColumns = columns === 1 ? "28px 1fr" : "28px 1fr 1fr 28px";

  // Every slot a breaker touches is derived from its cells (see
  // BREAKER_TYPES_ARCHITECTURE.md) — slotMap is just "which breakers touch
  // this slot at all," used below to find the group anchored there.
  const slotMap = {};
  breakers.forEach(b => slotsFromCells(b.cells).forEach(s => {
    const n = parseInt(s, 10);
    if (!n) return;
    (slotMap[n] = slotMap[n] || []).push(b);
  }));

  const covered = new Set();
  const cells = [];
  for (let s = 1; s <= slotCount; s++) {
    if (covered.has(s)) continue;
    const here = slotMap[s] || [];
    const col = colOf(s);
    const row = rowOf(s);

    if (here.length === 0) {
      cells.push({ key: `spare-${s}`, col, row, rowSpan: 1, kind: "spare", slot: s });
      continue;
    }
    // Every breaker placed via Add Breaker carries a groupId (even a lone
    // single-pole/double-pole — a "group" of one) — so grouping is always
    // just "every breaker sharing this groupId," regardless of how many
    // slots or members it has. A group of >1 renders as a vertical stack
    // (the same cell shape whether it's a tandem, quad, or any custom
    // BreakerType); a group of 1 renders as the plain single cell.
    const groupId = here[0].groupId;
    const groupBreakers = groupId ? breakers.filter(b => b.groupId === groupId) : [here[0]];
    const groupSlots = [...new Set(groupBreakers.flatMap(b => slotsFromCells(b.cells).map(x => parseInt(x, 10))))].sort((a, b2) => a - b2);
    if (groupSlots[0] !== s) continue; // reached via a non-primary slot; the primary slot already covers it
    groupSlots.filter(x => x !== s).forEach(x => covered.add(x));
    const rows = groupSlots.map(rowOf);
    const rowSpan = Math.max(...rows) - Math.min(...rows) + 1;
    if (groupBreakers.length > 1) {
      // Sort each breaker ONCE by its own minimum slot — not by bucketing
      // "which slots does this breaker touch" (a breaker spanning 2 slots,
      // like the middle breaker of a split double-pole, would then get
      // listed once per slot it touches and render as a duplicate box).
      const orderedBreakers = [...groupBreakers].sort((b1, b2) => {
        const s1 = Math.min(...slotsFromCells(b1.cells).map(Number));
        const s2 = Math.min(...slotsFromCells(b2.cells).map(Number));
        return s1 - s2;
      });
      cells.push({ key: `group-${groupId}`, col, row: Math.min(...rows), rowSpan, kind: "tandem", breakers: orderedBreakers, slot: s });
    } else {
      cells.push({ key: `breaker-${groupBreakers[0].id}`, col, row: Math.min(...rows), rowSpan, kind: "breaker", breaker: groupBreakers[0], slot: s });
    }
  }

  // Slot numbers print independently of the breaker cells above — every
  // slot gets its own number at its own row, even when a double-pole
  // breaker's cell spans two of them.
  const numbers = [];
  for (let s = 1; s <= slotCount; s++) {
    numbers.push({ key: `num-${s}`, slot: s, col: colOf(s), row: rowOf(s) });
  }

  // What a cell shows in "feeds" mode — what the breaker's circuit(s) actually
  // serve (rooms, or a downstream sub-panel), not the circuit's own label or
  // its electrical spec.
  function feedInfo(breaker) {
    const circuits = breaker.circuits || [];
    if (circuits.length === 0) return { primary: "—", secondary: "no circuits" };
    const roomIds = [...new Set(circuits.flatMap(c => c.roomsServedIds || []))];
    const subPanels = [...new Set(circuits.filter(c => c.feedsPanelLabel).map(c => c.feedsPanelLabel))];
    const parts = [...roomIds.map(id => roomNameFor(id, allAssets)), ...subPanels.map(p => `→ ${p}`)];
    return { primary: parts.join(", ") || "—", secondary: "" };
  }
  function breakerInfo(breaker) {
    return { primary: breaker.ampRating ? `${breaker.ampRating}A` : "—", secondary: "" };
  }
  const cellInfo = infoMode === "feeds" ? feedInfo : breakerInfo;

  const cellBase = {
    borderRadius: 8, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
    cursor: "pointer", padding: "4px", gap: 2, background: "#fff", textAlign: "center", overflow: "hidden",
  };

  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, marginBottom: 20, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
            Panel Layout — {slotCount} slots
          </span>
          <button onClick={onReconfigure} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", color: C.muted }} aria-label="Reconfigure panel layout">
            <Settings size={14} />
          </button>
          <button onClick={copyPanelLink} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", gap: 4, color: linkCopied ? C.success : C.muted }} aria-label="Copy link to this panel">
            {linkCopied ? <Check size={14} /> : <Copy size={14} />}
            {linkCopied && <span style={{ fontSize: 11, fontWeight: 600 }}>Copied!</span>}
          </button>
        </div>
        <div style={{ display: "flex", border: `1.5px solid ${C.border}`, borderRadius: 8, overflow: "hidden" }}>
          {[["breaker", "Breaker"], ["feeds", "Feeds"], ["table", "Table"]].map(([val, label]) => (
            <button
              key={val} type="button" onClick={() => setInfoMode(val)}
              style={{ padding: "5px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", background: infoMode === val ? C.brand : "#fff", color: infoMode === val ? "#fff" : C.ink }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
      {infoMode === "table" ? (() => {
        // One row per circuit (a breaker with no circuits yet still gets a single
        // row, circuit fields blank) — flat rows are what makes per-column sort
        // and the Room filter meaningful, unlike the grouped-by-slot diagram/table
        // toggle siblings. roomIds stays on the row (not just the display text) so
        // the Room filter can do a real membership check against a circuit that
        // serves more than one room, not a brittle string-contains match.
        const tableRows = [];
        [...cells].sort((a, b2) => a.slot - b2.slot).forEach(cell => {
          if (cell.kind === "spare") {
            tableRows.push({ key: cell.key, breakerId: null, spareSlot: cell.slot, slotSort: cell.slot, slotLabel: String(cell.slot), typeName: "Spare", ampRating: "", roomIds: [], roomText: "—", notes: "" });
            return;
          }
          const groupBreakers = cell.kind === "tandem" ? cell.breakers : [cell.breaker];
          const type = breakerTypes.find(t => t.id === groupBreakers[0].breakerTypeId);
          groupBreakers.forEach(b => {
            const circuits = (b.circuits && b.circuits.length) ? b.circuits : [null];
            circuits.forEach(c => {
              const roomIds = c ? (c.roomsServedIds || []) : [];
              const roomText = c
                ? (c.feedsPanelLabel ? `Feeds → ${c.feedsPanelLabel}` : roomIds.length ? roomIds.map(id => roomNameFor(id, allAssets)).join(", ") : "—")
                : "—";
              tableRows.push({
                key: `${b.id}-${c ? c.id : "none"}`, breakerId: b.id,
                slotSort: Math.min(...slotsFromCells(b.cells).map(Number)), slotLabel: cellsLabel_(b),
                typeName: type ? type.name : "—", ampRating: b.ampRating || "",
                roomIds, roomText, notes: c ? (c.notes || "") : "",
              });
            });
          });
        });

        const roomOptionIds = [...new Set(tableRows.flatMap(r => r.roomIds))]
          .sort((a2, b2) => roomNameFor(a2, allAssets).localeCompare(roomNameFor(b2, allAssets)));
        const tableFilterConfigs = {
          room: {
            label: "Room", value: tableRoomFilter, setValue: setTableRoomFilter, options: ["", ...roomOptionIds],
            labelForOption: id => (id ? roomNameFor(id, allAssets) : "All rooms"),
          },
        };

        let displayRows = tableRoomFilter ? tableRows.filter(r => r.roomIds.includes(tableRoomFilter)) : tableRows;
        if (tableSortConfig) {
          const mult = tableSortConfig.dir === "desc" ? -1 : 1;
          const sortValue = r => {
            if (tableSortConfig.key === "slot") return r.slotSort;
            if (tableSortConfig.key === "amp") return parseFloat(r.ampRating) || 0;
            return { type: r.typeName, room: r.roomText, notes: r.notes }[tableSortConfig.key] || "";
          };
          displayRows = [...displayRows].sort((a2, b2) => {
            const av = sortValue(a2), bv = sortValue(b2);
            if (typeof av === "number" && typeof bv === "number") return (av - bv) * mult;
            return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" }) * mult;
          });
        }
        // A breaker with multiple circuits gets one row per circuit, so Slot/Type/
        // Amp would otherwise repeat identically on every one of those rows — merge
        // them into one vertically-centered cell spanning every consecutive row for
        // that breaker instead. Based on adjacency in the already-sorted/filtered
        // list, not a stored "first of group" flag, so it still does the right thing
        // regardless of sort order: rows only merge when they actually land next to
        // each other. mergeSpan is only set on the first row of a run; 0 means "this
        // row's Slot/Type/Amp cells are covered by an earlier row's merged cell,
        // don't render them here at all."
        displayRows = displayRows.map((r, i) => {
          const isFirst = !(i > 0 && r.breakerId && displayRows[i - 1].breakerId === r.breakerId);
          if (!isFirst) return { ...r, mergeSpan: 0 };
          let span = 1;
          while (displayRows[i + span] && r.breakerId && displayRows[i + span].breakerId === r.breakerId) span++;
          return { ...r, mergeSpan: span };
        });

        // Fixed px for every column, not 1fr/flex fractions — a fractional track
        // resolves relative to its grid's own natural width, which drifted between
        // rows back when each row was its own separate grid container. Body rows
        // now all share ONE grid container (needed for the Slot/Type/Amp row-span
        // above), so that particular failure mode can't recur here anymore, but the
        // header is still a separate grid and needs to land on the same boundaries.
        const tableCols = "70px 190px 220px 210px 90px";
        const cellStyle = (col, span, borderTop) => ({
          gridColumn: col, gridRow: span ? `span ${span}` : undefined,
          padding: "10px 12px", borderTop: borderTop ? `1px solid ${C.border}` : "none",
          display: "flex", alignItems: "center", cursor: "pointer",
        });
        return (
          <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
            <div className="scroller" style={{ overflowX: "auto" }}>
              <div style={{ display: "grid", gridTemplateColumns: tableCols, background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
                {[["slot", "Slot"], ["room", "Room"], ["notes", "Notes"], ["type", "Type"], ["amp", "Amp"]].map(([key, label]) => (
                  <ColumnHeaderCell key={key} label={label} colKey={key} filterConfigs={tableFilterConfigs} sortConfig={tableSortConfig} setSortConfig={setTableSortConfig} onOpenFilter={setTableActiveFilterCol} />
                ))}
              </div>
              {displayRows.length === 0 ? (
                <div style={{ padding: 24, textAlign: "center", color: C.empty, fontSize: 13, minWidth: "max-content" }}>No circuits match.</div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: tableCols, gridAutoRows: "auto", minWidth: "max-content" }}>
                  {displayRows.map((r, i) => {
                    const onRowClick = () => { if (r.breakerId) onSlotClick(r.breakerId); else if (r.spareSlot) onSpareClick(r.spareSlot); };
                    const top = i > 0;
                    return (
                      <React.Fragment key={r.key}>
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(1, r.mergeSpan, top), fontSize: 13, fontFamily: "'IBM Plex Mono', monospace", color: C.ink }}>
                            {r.slotLabel}
                          </div>
                        )}
                        <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(2, 0, top), fontSize: 13, color: C.ink }}>{r.roomText}</div>
                        <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(3, 0, top), fontSize: 12, color: C.muted, whiteSpace: "pre-line" }}>{r.notes || "—"}</div>
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(4, r.mergeSpan, top), fontSize: 13, color: C.ink }}>
                            {r.typeName}
                          </div>
                        )}
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(5, r.mergeSpan, top), fontSize: 13, color: C.ink }}>
                            {r.ampRating ? `${r.ampRating}A` : "—"}
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
              )}
            </div>
            <ColumnFilterModal activeCol={tableActiveFilterCol} filterConfigs={tableFilterConfigs} sortConfig={tableSortConfig} setSortConfig={setTableSortConfig} onClose={() => setTableActiveFilterCol(null)} />
          </div>
        );
      })() : (
      <div style={{ display: "grid", gridTemplateColumns, gridAutoRows: "44px", gap: 6, width: "100%" }}>
        {numbers.map(n => (
          <div
            key={n.key}
            style={{
              gridColumn: numberTrack(n.col), gridRow: n.row,
              display: "flex", alignItems: "center",
              justifyContent: columns === 1 ? "center" : (n.col === 0 ? "flex-end" : "flex-start"),
              fontSize: 11, fontWeight: 700, color: C.muted, fontFamily: "'IBM Plex Mono', monospace",
            }}
          >
            {n.slot}
          </div>
        ))}
        {cells.map(cell => {
          if (cell.kind === "spare") {
            return (
              <button
                key={cell.key} type="button" onClick={() => onSpareClick(cell.slot)}
                style={{ gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px dashed ${C.border}`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: C.placeholder, background: "none", cursor: "pointer" }}
              >
                spare
              </button>
            );
          }
          if (cell.kind === "tandem") {
            return (
              <div key={cell.key} style={{ gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px solid ${C.border}`, borderRadius: 8, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                {cell.breakers.map((b, i) => {
                  const info = cellInfo(b);
                  return (
                    <button
                      key={b.id} onClick={() => onSlotClick(b.id)} type="button"
                      style={{ flex: 1, border: "none", borderTop: i > 0 ? `1px solid ${C.border}` : "none", background: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: "2px 4px", overflow: "hidden" }}
                    >
                      <span style={{ fontSize: 9, fontWeight: 700, color: C.brandDark }}>{info.primary}</span>
                      <span style={{ fontSize: 8, color: C.muted, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden", maxWidth: "100%" }}>{info.secondary}</span>
                    </button>
                  );
                })}
              </div>
            );
          }
          const b = cell.breaker;
          const info = cellInfo(b);
          return (
            <button
              key={cell.key} onClick={() => onSlotClick(b.id)} type="button"
              style={{ ...cellBase, gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px solid ${C.border}` }}
            >
              <span style={{ fontSize: 11, fontWeight: 700, color: C.brandDark }}>{info.primary}</span>
              <span style={{ fontSize: 9, color: C.muted, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden", maxWidth: "100%" }}>{info.secondary}</span>
            </button>
          );
        })}
      </div>
      )}
    </div>
  );
}

// Generic list/add/edit/delete UI for a structured child entity (id + fields).
// Built for Breakers and Circuits — validated against both real shapes in this
// same pass, not designed speculatively for a single call site. Field-driven
// (text/number/date/select/multiselect) covers the common cases;
// renderCustomFields covers anything that doesn't fit that shape (e.g. a
// circuit's rooms-vs-sub-panel toggle). Owns its own add/edit/expand/
// delete-confirm UI state — the caller just supplies items + field config +
// onAdd/onSave/onDelete. Actions that aren't a generic field edit (Swap
// Breaker, Move Circuit) live outside this component via customRowActions,
// which the caller uses to open its own dedicated modal.
function ChildEntityTable({
  items, fields, onAdd, onSave, onDelete, initialDraft,
  renderCustomFields, renderSummary, renderExpanded, customRowActions,
  addLabel, emptyMessage, canDelete, deleteConfirmMessage, highlightedId, hideAddButton,
  addOpen: addOpenProp, onAddOpenChange,
}) {
  const [draft, setDraft] = useState(initialDraft);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [expandedIds, setExpandedIds] = useState({});
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [addError, setAddError] = useState(null);
  const [editError, setEditError] = useState(null);
  // "Add" open state is normally internal, but a caller that wants its own
  // trigger button elsewhere on the page (e.g. a compact "+" next to a
  // section header instead of this component's own full-width button) can
  // control it externally by passing addOpen/onAddOpenChange.
  const [uncontrolledAddOpen, setUncontrolledAddOpen] = useState(false);
  const addOpen = addOpenProp !== undefined ? addOpenProp : uncontrolledAddOpen;
  const setAddOpen = onAddOpenChange || setUncontrolledAddOpen;

  function renderField(f, values, setValues) {
    // See dateOnly()'s comment: a date field may come back from the Sheet as a
    // full ISO timestamp instead of the plain "yyyy-MM-dd" a <input type="date">
    // requires — normalize so an already-round-tripped value still displays.
    const value = f.type === "date" ? dateOnly(values[f.key]) : values[f.key];
    const commonLabel = (
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        {f.label}
      </span>
    );
    if (f.type === "select") {
      return (
        <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
          {commonLabel}
          <PickerField
            label={f.label}
            hideLabel
            value={value || ""}
            onChange={v => setValues({ ...values, [f.key]: v })}
            options={["", ...(f.options || [])]}
            labelForOption={o => o || "Select…"}
            title={`Select ${f.label}`}
          />
        </label>
      );
    }
    if (f.type === "textarea") {
      return (
        <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
          {commonLabel}
          <textarea
            value={value || ""}
            onChange={e => setValues({ ...values, [f.key]: e.target.value })}
            placeholder={f.placeholder}
            rows={f.rows || 3}
            style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, resize: "vertical", fontFamily: "inherit" }}
          />
        </label>
      );
    }
    if (f.type === "multiselect") {
      const selected = Array.isArray(value) ? value : [];
      return (
        <div key={f.key} style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
          {commonLabel}
          {(f.options || []).length === 0 ? (
            <div style={{ fontSize: 13, color: C.empty }}>None available yet.</div>
          ) : (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {(f.options || []).map(opt => {
                const active = selected.includes(opt);
                return (
                  <button
                    key={opt}
                    type="button"
                    onClick={() => setValues({ ...values, [f.key]: active ? selected.filter(s => s !== opt) : [...selected, opt] })}
                    style={{
                      padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                      border: `1.5px solid ${active ? C.brand : C.border}`, background: active ? C.brand : "#fff", color: active ? "#fff" : C.ink,
                    }}
                  >
                    {opt}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }
    return (
      <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
        {commonLabel}
        <input
          type={f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}
          value={value || ""}
          onChange={e => setValues({ ...values, [f.key]: e.target.value })}
          placeholder={f.placeholder}
          style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
        />
      </label>
    );
  }

  function startEdit(item) {
    setEditingId(item.id);
    setEditDraft({ ...item });
    setEditError(null);
  }
  function cancelEdit() {
    setEditingId(null);
    setEditDraft(null);
    setEditError(null);
  }
  // onAdd/onSave may return a validation error string (e.g. slot overlap) —
  // when they do, the draft is kept as-is so the user doesn't lose their input.
  function saveEdit() {
    const error = onSave(editingId, editDraft);
    if (error) { setEditError(error); return; }
    cancelEdit();
  }
  function submitAdd() {
    const error = onAdd(draft);
    if (error) { setAddError(error); return; }
    setAddError(null);
    setDraft(initialDraft);
    setAddOpen(false);
  }
  function toggleExpanded(id) {
    setExpandedIds({ ...expandedIds, [id]: !expandedIds[id] });
  }

  return (
    <div>
      {addOpen ? (
        <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
            {fields.map(f => renderField(f, draft, setDraft))}
            {renderCustomFields && renderCustomFields(draft, setDraft, true)}
          </div>
          {addError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 8 }}>{addError}</div>}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <button
              onClick={() => { setAddOpen(false); setAddError(null); setDraft(initialDraft); }}
              style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}
            >
              Cancel
            </button>
            <button onClick={submitAdd} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
              {addLabel}
            </button>
          </div>
        </div>
      ) : hideAddButton ? null : (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 20 }}>
          <button
            onClick={() => setAddOpen(true)}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            <Plus size={14} /> {addLabel}
          </button>
        </div>
      )}

      {items.length === 0 ? (
        <div style={{ fontSize: 12, color: C.empty, padding: "2px 0" }}>{emptyMessage}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column" }}>
          {items.map((item, i) => {
            const isEditing = editingId === item.id;
            const isExpanded = !!expandedIds[item.id];
            if (isEditing) {
              return (
                <div key={item.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, margin: "6px 0", boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                    {fields.map(f => renderField(f, editDraft, setEditDraft))}
                    {renderCustomFields && renderCustomFields(editDraft, setEditDraft, false)}
                  </div>
                  {editError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 8 }}>{editError}</div>}
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                    <button onClick={saveEdit} style={{ padding: "8px 14px", background: C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                      Save
                    </button>
                    <button onClick={cancelEdit} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                      Cancel
                    </button>
                  </div>
                </div>
              );
            }
            const isHighlighted = highlightedId === item.id;
            return (
              <div
                key={item.id}
                id={`entity-row-${item.id}`}
                style={{
                  borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : "none",
                  background: isHighlighted ? C.brandLight || C.surface : "transparent",
                  padding: "8px 4px",
                  boxShadow: isHighlighted ? `0 0 0 3px ${C.brand}33` : "none", transition: "box-shadow 0.2s, background-color 0.2s",
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
                    {renderExpanded && (
                      <button onClick={() => toggleExpanded(item.id)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex", flexShrink: 0 }} aria-label={isExpanded ? "Collapse" : "Expand"}>
                        {isExpanded ? <ChevronDown size={15} color={C.brand} /> : <ChevronRight size={15} color={C.brand} />}
                      </button>
                    )}
                    <div style={{ minWidth: 0, flex: 1 }}>{renderSummary ? renderSummary(item) : null}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                    {customRowActions && customRowActions(item)}
                    <button onClick={() => startEdit(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Edit">
                      <Pencil size={14} color={C.muted} />
                    </button>
                    <button
                      onClick={() => setConfirmDeleteId(item.id)}
                      className="icon-btn"
                      style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }}
                      aria-label="Delete"
                    >
                      <X size={14} color={C.placeholder} />
                    </button>
                  </div>
                </div>
                {isExpanded && renderExpanded && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                    {renderExpanded(item)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {confirmDeleteId !== null && (() => {
        const item = items.find(i => i.id === confirmDeleteId);
        const blockReason = canDelete && item ? canDelete(item) : null;
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 360 }}>
              {blockReason ? (
                <>
                  <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Can't delete</div>
                  <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>{blockReason}</div>
                  <div style={{ display: "flex", justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDeleteId(null)} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                      OK
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>
                    {deleteConfirmMessage ? deleteConfirmMessage(item) : "Delete this item?"}
                  </div>
                  <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDeleteId(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                      Cancel
                    </button>
                    <button
                      onClick={() => { onDelete(confirmDeleteId); setConfirmDeleteId(null); }}
                      style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                    >
                      Delete
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AssetTracker />);
</script>
</body>
</html>
