  };

  const selectedAsset = assets ? assets.find(a => a.label === selectedLabel) : null;

  function openDetail(asset, initialTab) {
    setSelectedLabel(asset.label);
    setView("detail");
    setDetailEditing(false);
    setEditNote("");
    setCommentDraft("");
    setChangeDraft({ changeType: "", vendor: "", cost: "", note: "" });
    // Electrical Panels open straight to Breakers — that's the tab worth
    // seeing first for a panel, not the mostly-empty generic Details fields.
    // A requested tab this type doesn't have falls back to its default rather
    // than being honoured — a ?tab=breakers link pasted onto a Computer used to
    // select a tab the bar didn't offer, leaving the tab strip with nothing
    // under it. Deep links outlive the asset they were copied from.
    const wanted = initialTab && availableTabsFor(asset.type).includes(initialTab) ? initialTab : defaultTabFor(asset.type);
    setDetailTab(wanted);
    setConfirmCommentDelete(null);
    setConfirmChangeDelete(null);
    setConfirmArchive(null);
    setAllocationDraft({ roomId: "", quantity: "", error: "" });
    setConfirmAllocationRemove(null);
    setMaintenanceDraft({ task: "", frequency: MAINTENANCE_FREQUENCIES[1].label, lastPerformed: "", owner: "" });
    setEditingMaintenanceIdx(null);
    setMaintenanceEditDraft(null);
    setConfirmMaintenanceDelete(null);
    setSwapModal(null);
    setMoveCircuitModal(null);
    setBreakerModal(null);
    setAddBreakerDraft(null);
  }

  function closeDetail() {
    setView("list");
    setSelectedLabel(null);
    setDetailEditing(false);
  }

  function startEditSelected() {
    setDraft({ ...emptyDraftFrom(columns), ...selectedAsset });
    setEditNote("");
    setDetailEditing(true);
  }

  // The next BCA number to issue. Backed by the persisted `nextAssetNumber`
  // counter rather than recomputed from the current assets every time, which is
  // what this did before: deriving it means permanently deleting the
  // highest-numbered asset frees its label for immediate reuse, and since
  // AuditLog is keyed by assetLabel and deliberately outlives the asset it
  // logged, the next asset created would silently inherit the dead one's
  // history (created/edited/archived/deleted entries and all).
  //
  // Max — not "the counter if it's set" — so it can also be seeded on an
  // existing sheet that predates it (counter null -> derived wins), and so a
  // counter that somehow lags the sheet (a direct API write, the one-off
  // migration script, a hand-edited Config row) can still never hand out a
  // number that's already on an asset.
  function peekAssetNumber() {
    const derived = Math.max(0, ...(assets || []).map(a => assetNumberFromLabel(a.label))) + 1;
    return Math.max(nextAssetNumber || 0, derived);
  }
  // What to store back after actually creating an asset with `label`. Normally
  // that's just peek+1, but the add form lets the suggested label be edited, so
  // a hand-typed *higher* number has to push the counter past it too. A label
  // that isn't a BCA number consumes nothing and leaves the counter alone.
  // Never decrements: a lower hand-typed number (filling a hole) doesn't pull
  // the counter back down over labels it has already issued.
  function advanceAssetNumber(label) {
    const used = assetNumberFromLabel(label);
    const current = peekAssetNumber();
    return used ? Math.max(current, used + 1) : current;
  }

  // An asset's `label` is the app-wide primary key: roomId/buildingId,
  // panelLabel, feedsPanelLabel and every AuditLog row point at it, and every
  // lookup that uses it matches ALL rows sharing it — edit does
  // `assets.map(a => a.label === selectedLabel ? ...)`, delete does the mirror
  // `filter`, and the backend groups child rows (comments/changes/breakers/...)
  // by it. Two assets sharing a label therefore aren't two assets that happen
  // to collide, they're one merged asset with no way to tell them apart again,
  // so a collision has to be refused at creation. Case-insensitive and trimmed:
  // "bca0082 " would be a distinct string but the same ID to a human.
  function findLabelConflict(label) {
    const key = String(label || "").trim().toLowerCase();
    if (!key) return null;
    return (assets || []).find(a => String(a.label || "").trim().toLowerCase() === key) || null;
  }

  function startAdd() {
    setAddError("");
    setDraft({ ...emptyDraftFrom(columns), label: assetLabelForNumber(peekAssetNumber()), type: "Computer", status: "Active", comments: [], changes: [], allocations: [] });
    setShowAdd(true);
  }

  function cancelAdd() {
    setShowAdd(false);
    setDraft({});
    setAddError("");
  }

  async function saveDraft() {
    // A double-click can land in the same tick as the first click, before React
    // re-renders the Save button as disabled — so the visual disable can't be
    // the only guard. Every write handler below starts the same way; see
    // savingRef for why this lives here and not inside persist().
    if (savingRef.current) return;
    if (showAdd) {
      // Every failure here sets a visible inline error instead of returning
      // silently — the label is editable in this form, so "Save did nothing"
      // is indistinguishable from "Save worked" to whoever typed the typo.
      const label = (draft.label || "").trim();
      if (!label) { setAddError("Asset ID is required."); return; }
      if (!draft.type?.trim()) { setAddError("Type is required."); return; }
      const conflict = findLabelConflict(label);
      if (conflict) {
        // Name the existing asset — and say so when it's archived, since an
        // archived asset isn't in the default list view and "that ID is taken"
        // is otherwise baffling when nothing on screen is using it.
        const what = [conflict.type, conflict.status === "Archived" ? "archived" : null].filter(Boolean).join(", ");
        setAddError(`Asset ID "${conflict.label}" is already in use${what ? ` (${what})` : ""}. Asset IDs must be unique — pick a different one.`);
        return;
      }
      const parentError = validateParentChoice(label, draft.type, draft.parentId, assets, typesList);
      if (parentError) { setAddError(parentError); return; }
      setAddError("");
      const createdEntry = {
        at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
        assetType: draft.type, action: "created",
      };
      // Left blank, the Name takes the same suggestion the field shows as its
      // placeholder — so a new asset is named at creation rather than relying on
      // nameOf()'s Asset ID fallback forever. Typed over, whatever was typed wins.
      const named = { ...stripDraftUiState(draft), label };
      if (!(named.name || "").trim()) named.name = suggestedNameFor(named, assets);
      // `label` last, so the asset stores the trimmed value that was validated
      // above rather than the raw draft string.
      await persist(
        [...assets, { comments: [], changes: [], allocations: [], ...named }],
        { auditLog: logAudit([createdEntry]), nextAssetNumber: advanceAssetNumber(label) }
      );
      cancelAdd();
    } else {
      if (!draft.label?.trim() || !draft.type?.trim()) return;
      const original = selectedAsset;
      // A type that takes no parent has no Parent field on its form, so a stored
      // parentId is unreachable from the UI — refusing the save over it would be
      // a dead end with nothing to click. Saving CLEARS it instead: for such a
      // type, no parent is the only correct value, so this is a repair rather
      // than a loss. This is how an asset damaged by the old migration (see
      // adoptLegacyParentage) gets fixed — by opening it and pressing Save.
      const draftToSave = typeTakesParent(draft.type) ? draft : { ...draft, parentId: "" };
      const parentError = validateParentChoice(original.label, draftToSave.type, draftToSave.parentId, assets, typesList);
      // parentError is shown BOTH inside ParentField and as a form-level line at
      // the top of the form. The form-level copy is the one that matters here: a
      // type with no Parent field renders no ParentField, so without it a refused
      // save would look like a Save button that does nothing at all.
      if (parentError) { setDraft({ ...draftToSave, parentError }); return; }
      const editEntries = [];
      // parentId holds a stable label (id), not the display name — an asset's own
      // name field is edited like any other field (below), and everything that
      // points AT it just holds that id, so renaming needs no cascade: nothing
      // else has to change, and lookups pick up the new name automatically. Diff
      // display still needs to resolve the id to a name, and an empty one reads
      // as "Unassigned" rather than a blank, so a move in or out of that state
      // is legible in the history.
      Object.keys(draftToSave).forEach(key => {
        if (key === "comments" || key === "changes" || key === "allocations" || key === "parentError") return;
        const oldVal = original[key] || "";
        const newVal = draftToSave[key] || "";
        if (oldVal === newVal) return;
        const isParentField = key === "parentId";
        const fieldLabel = isParentField ? "Parent" : (columns.find(c => c.key === key)?.label || key);
        const from = isParentField ? (parentNameFor(oldVal, assets) || UNASSIGNED_LABEL) : oldVal;
        const to = isParentField ? (parentNameFor(newVal, assets) || UNASSIGNED_LABEL) : newVal;
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draftToSave.type || original.type, action: "edited", field: fieldLabel, from, to,
        });
      });

      const next = assets.map(a => (a.label === selectedLabel ? { ...a, ...stripDraftUiState(draftToSave) } : a));
      if (editNote.trim()) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draftToSave.type || original.type, action: "noted", note: editNote.trim(),
        });
      }
      await persist(next, { auditLog: editEntries.length ? logAudit(editEntries) : auditLog });
      setDetailEditing(false);
      setEditNote("");
    }
  }

  // Referential integrity for permanent delete — deleting an asset that other
  // records point at would leave a dangling id. Client-side only, same as every
  // other delete guard in this app (e.g. findBreakerTypeUsages).
  //
  // The "is anything inside this?" half is no longer two type-specific checks
  // (Rooms looked for roomId, Buildings for a Room's buildingId): with one
  // parent field it's one question asked of every asset, so a closet inside a
  // classroom, or any future kind of container, is covered without adding a
  // branch. The allocation/circuit checks below stay Room-shaped because those
  // references genuinely are to a Room specifically, not to a parent.
  function canDeleteAsset(asset) {
    const refs = [];
    assets.forEach(a => {
      if (a.label === asset.label) return;
      if (a.parentId === asset.label) refs.push(a.label);
      (a.allocations || []).forEach(al => { if (al.roomId === asset.label) refs.push(`${a.label} (allocation)`); });
      (a.breakers || []).forEach(b => (b.circuits || []).forEach(c => {
        if ((c.roomsServedIds || []).includes(asset.label)) refs.push(`${a.label} Slot ${slotsLabel_(b)} (circuit "${c.label}")`);
      }));
      // An unassigned circuit holds roomsServedIds exactly like an attached one,
      // so it dangles the same way if the Room is deleted out from under it.
      (a.unassignedCircuits || []).forEach(c => {
        if ((c.roomsServedIds || []).includes(asset.label)) refs.push(`${a.label} (unassigned circuit "${c.label}")`);
      });
    });
    if (refs.length > 0) return `Still referenced by: ${refs.join(", ")}.`;
    return null;
  }

  async function doDelete(label) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const asset = assets.find(a => a.label === label);
    const deletedEntry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "deleted",
    };
    await persist(assets.filter(a => a.label !== label), { auditLog: logAudit([deletedEntry]) });
    setConfirmDelete(null);
    if (selectedLabel === label) closeDetail();
  }

  async function archiveAsset(label) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const asset = assets.find(a => a.label === label);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "archived",
    };
    const next = assets.map(a => (a.label === label ? { ...a, status: "Archived" } : a));
    await persist(next, { auditLog: logAudit([entry]) });
    setConfirmArchive(null);
  }

  async function restoreAsset(label) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const asset = assets.find(a => a.label === label);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "restored",
    };
    const next = assets.map(a => (a.label === label ? { ...a, status: "Active" } : a));
    await persist(next, { auditLog: logAudit([entry]) });
  }

  async function duplicateAsset(source) {
    // Guarded like every other write handler — and doubly worth it here, since
    // a second click would issue a second asset label and create a second copy.
    if (savingRef.current) return;
    // Same persisted counter as startAdd() — no separate max-derivation here,
    // or the two would disagree the moment one of them issued a number.
    const nextLabel = assetLabelForNumber(peekAssetNumber());
    const copy = {
      ...source,
      label: nextLabel,
      serial: "",       // unique per unit — never copied
      hostname: "",     // unique per unit — never copied
      status: "Active",
      comments: [],
      changes: [],
      allocations: [],
    };
    // A name someone actually typed is worth copying; a default one isn't, since
    // it names the source ("Computer BCA0001") and would be wrong on the copy the
    // moment it exists. Comparing against the suggestion is what tells them apart
    // — there's no flag saying which a name is, and there shouldn't be.
    if ((copy.name || "").trim() === suggestedNameFor(source, assets)) {
      copy.name = suggestedNameFor(copy, assets);
    }
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: nextLabel,
      assetType: copy.type, action: "created",
    };
    await persist([...assets, copy], { auditLog: logAudit([entry]), nextAssetNumber: advanceAssetNumber(nextLabel) });
    openDetail(copy);
  }

  // Bulk actions on the currently filtered set — powered by the active User / Room filter.
  async function reassignFilteredTo(newUser) {
    if (!newUser.trim()) return;
    const targets = new Set(filtered.filter(a => fieldAppliesTo("person", a.type)).map(a => a.label));
    const entries = [];
    const next = assets.map(a => {
      if (!targets.has(a.label) || a.person === newUser) return a;
      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,
        assetType: a.type, action: "edited", field: "User", from: a.person || "", to: newUser,
      });
      return { ...a, person: newUser };
    });
    await persist(next, { auditLog: entries.length ? logAudit(entries) : auditLog });
    setUserFilter(newUser);
    setReassignTarget("");
  }

  async function moveFilteredTo(newRoomId) {
    if (!newRoomId) return;
    // A Room may now sit inside another Room, so this bulk move can be handed a
    // target that is somewhere below one of the assets it's moving — which would
    // close a loop. Skipping those (rather than refusing the whole batch) keeps
    // the action useful: everything that can legally move does.
    const targets = new Set(
      roomMovable.filter(a => a.label !== newRoomId && !wouldCreateCycle(a.label, newRoomId, assets)).map(a => a.label)
    );
    const entries = [];
    const newRoomName = roomNameFor(newRoomId, assets);
    const next = assets.map(a => {
      if (!targets.has(a.label) || a.parentId === newRoomId) return a;
      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,
        assetType: a.type, action: "edited", field: "Parent",
        from: parentNameFor(a.parentId, assets) || UNASSIGNED_LABEL, to: newRoomName,
      });
      return { ...a, parentId: newRoomId };
    });
    await persist(next, { auditLog: entries.length ? logAudit(entries) : auditLog });
    // Follow the things that just moved by re-pointing the scope at the
    // destination — otherwise the user is left looking at the now-empty room they
    // moved out of. The scope is the only thing this can be: it's the only way to
    // narrow to one room now that the Room column filter is gone, and
    // bulkMoveSourceId reads it directly.
    setScopeId(newRoomId);
    setMoveTarget("");
  }

  async function addComment() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!commentDraft.trim() || !selectedAsset) return;
    const comment = { text: commentDraft.trim(), at: new Date().toISOString(), by: currentUser || "" };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, comments: [...(a.comments || []), comment] } : a));
    await persist(next, { columns });
    setCommentDraft("");
  }

  async function deleteComment(idx) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const next = assets.map(a => {
      if (a.label !== selectedLabel) return a;
      const comments = (a.comments || []).filter((_, i) => i !== idx);
      return { ...a, comments };
    });
    await persist(next, { columns });
  }

  async function addChange() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!changeDraft.changeType || !selectedAsset) return;
    const entry = {
      changeType: changeDraft.changeType,
      vendor: changeDraft.vendor.trim(),
      cost: changeDraft.cost.trim(),
      note: changeDraft.note.trim(),
      at: new Date().toISOString(),
      by: currentUser || "",
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, changes: [...(a.changes || []), entry] } : a));
    await persist(next, { columns });
    setChangeDraft({ changeType: "", vendor: "", cost: "", note: "" });
  }

  async function deleteChange(idx) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const next = assets.map(a => {
      if (a.label !== selectedLabel) return a;
      const changes = (a.changes || []).filter((_, i) => i !== idx);
      return { ...a, changes };
    });
    await persist(next, { columns });
  }

  function getAllocatedTotal(asset) {
    return ((asset && asset.allocations) || []).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
  }
  function getAvailable(asset) {
    const total = parseFloat(asset && asset.totalQuantity) || 0;
    return total - getAllocatedTotal(asset);
  }

  async function saveAllocation() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const roomId = allocationDraft.roomId;
    const qty = parseFloat(allocationDraft.quantity);
    if (!roomId || !qty || qty <= 0) {
      setAllocationDraft({ ...allocationDraft, error: "Pick a room and a quantity greater than 0." });
      return;
    }
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.roomId === roomId);
    const otherRoomsTotal = existing.filter(a => a.roomId !== roomId).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
    const totalQty = parseFloat(selectedAsset.totalQuantity) || 0;
    if (otherRoomsTotal + qty > totalQty) {
      setAllocationDraft({ ...allocationDraft, error: `Only ${totalQty - otherRoomsTotal} available to assign here.` });
      return;
    }
    const nextAllocations = existingForRoom
      ? existing.map(a => (a.roomId === roomId ? { ...a, quantity: qty } : a))
      : [...existing, { roomId, quantity: qty }];
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "allocated", room: roomNameFor(roomId, assets), quantity: qty,
      previousQuantity: existingForRoom ? existingForRoom.quantity : null,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, { auditLog: logAudit([entry]) });
    setAllocationDraft({ roomId: "", quantity: "", error: "" });
  }

  async function removeAllocation(roomId) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.roomId === roomId);
    const nextAllocations = existing.filter(a => a.roomId !== roomId);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "unallocated", room: roomNameFor(roomId, assets), quantity: existingForRoom ? existingForRoom.quantity : 0,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, { auditLog: logAudit([entry]) });
    setConfirmAllocationRemove(null);
  }

  // Adding a new schedule isn't separately audited — its own at/by plus its
  // presence in the Maintenance tab is enough (same reasoning as comments/changes).
  async function addMaintenanceItem() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!maintenanceDraft.task.trim() || !selectedAsset) return;
    const freq = MAINTENANCE_FREQUENCIES.find(f => f.label === maintenanceDraft.frequency) || MAINTENANCE_FREQUENCIES[1];
    const item = {
      task: maintenanceDraft.task.trim(),
      frequencyLabel: freq.label,
      frequencyDays: freq.days,
      lastPerformed: maintenanceDraft.lastPerformed || "",
      owner: maintenanceDraft.owner.trim(),
      at: new Date().toISOString(),
      by: currentUser || "",
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: [...(a.maintenanceItems || []), item] } : a));
    await persist(next, { columns });
    setMaintenanceDraft({ task: "", frequency: freq.label, lastPerformed: "", owner: "" });
  }

  function startEditMaintenance(idx) {
    const item = (selectedAsset.maintenanceItems || [])[idx];
    setMaintenanceEditDraft({ task: item.task, frequency: item.frequencyLabel, lastPerformed: dateOnly(item.lastPerformed), owner: item.owner || "" });
    setEditingMaintenanceIdx(idx);
  }

  function cancelEditMaintenance() {
    setEditingMaintenanceIdx(null);
    setMaintenanceEditDraft(null);
  }

  // Mutating an existing schedule (unlike adding one) loses the prior value, so
  // it's logged field-by-field — same approach as the main asset edit diff.
  async function saveMaintenanceEdit() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!maintenanceEditDraft.task.trim() || !selectedAsset) return;
    const idx = editingMaintenanceIdx;
    const items = selectedAsset.maintenanceItems || [];
    const original = items[idx];
    const freq = MAINTENANCE_FREQUENCIES.find(f => f.label === maintenanceEditDraft.frequency) || MAINTENANCE_FREQUENCIES[1];
    const updated = {
      ...original,
      task: maintenanceEditDraft.task.trim(),
      frequencyLabel: freq.label,
      frequencyDays: freq.days,
      lastPerformed: maintenanceEditDraft.lastPerformed || "",
      owner: maintenanceEditDraft.owner.trim(),
    };
    const mkEntry = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_edited", field: `${original.task} — ${field}`, from, to,
    });
    const entries = [];
    if (original.task !== updated.task) entries.push(mkEntry("Task", original.task, updated.task));
    if (original.frequencyLabel !== updated.frequencyLabel) entries.push(mkEntry("Frequency", original.frequencyLabel, updated.frequencyLabel));
    if ((original.owner || "") !== (updated.owner || "")) entries.push(mkEntry("Owner", original.owner || "—", updated.owner || "—"));
    if ((original.lastPerformed || "") !== (updated.lastPerformed || "")) {
      entries.push(mkEntry("Last performed", formatDateOnly(original.lastPerformed) || "—", formatDateOnly(updated.lastPerformed) || "—"));
    }
    const nextItems = items.map((it, i) => (i === idx ? updated : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    await persist(next, { auditLog: entries.length ? logAudit(entries) : auditLog });
    cancelEditMaintenance();
  }

  async function markMaintenanceDone(idx) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const today = new Date().toISOString().slice(0, 10);
    const nextItems = items.map((it, i) => (i === idx ? { ...it, lastPerformed: today } : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "maintenance_completed", field: item.task,
      from: item.lastPerformed ? formatDateOnly(item.lastPerformed) : "never", to: formatDateOnly(today),
    };
    await persist(next, { auditLog: logAudit([entry]) });
  }

  async function deleteMaintenanceItem(idx) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const nextItems = items.filter((_, i) => i !== idx);
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_removed", field: item.task,
    };
    await persist(next, { auditLog: logAudit([entry]) });
    setConfirmMaintenanceDelete(null);
  }

  // ---------- Breakers / Circuits (Electrical Panel assets only) ----------
  // Breakers/Circuits carry no at/by of their own (unlike comments/changes/
  // maintenance items), so — like Allocations — every mutation is audited.
  // These are plain (non-async) functions: onAdd/onSave need to return a
  // validation-error string synchronously for ChildEntityTable to show it, so
  // persist() is called fire-and-forget here, same as toggleColumnVisible/
  // addColumn/addChangeType etc. already do elsewhere in this file.
  function slotsLabel_(breaker) {
    return cellsLabel_(breaker);
  }

  function updateBreakers(nextBreakers) {
    return assets.map(a => (a.label === selectedLabel ? { ...a, breakers: nextBreakers } : a));
  }

  // Panel slot count/layout drive the visual diagram in the Breakers tab —
  // stored as plain asset fields (like brand/model), not part of the
  // breakers/circuits child tables, since they describe the panel itself.
  function updatePanelConfig(slotCount, layout) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const original = selectedAsset;
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: original.type,
      action: "edited", field, from, to,
    });
    const entries = [];
    if (String(original.panelSlotCount || "") !== String(slotCount || "")) entries.push(mk("Panel Slot Count", original.panelSlotCount || "—", slotCount || "—"));
    if ((original.panelLayout || "") !== (layout || "")) entries.push(mk("Panel Layout", original.panelLayout || "—", layout || "—"));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, panelSlotCount: slotCount, panelLayout: layout } : a));
    persist(next, { auditLog: entries.length ? logAudit(entries) : auditLog });
  }

  // Placing a breaker means placing a whole BreakerType instance at once — one
  // Breaker row per type member (1 for Single-Pole/Double-Pole, 2 for Tandem,
  // however many the type defines), each with its own amp rating from the
  // moment it's created, linked by a fresh groupId. See
  // BREAKER_TYPES_ARCHITECTURE.md section 4. Circuits attach to these rows
  // exactly like any other breaker, as a separate later step — placing a type
  // is never blocked on (or coupled to) adding circuits.
  // Returns { error } on failure, or { newBreakers } (the freshly created rows,
  // all sharing one groupId) on success — the caller uses those rows to jump
  // straight into the breaker detail modal without waiting on a state refetch.
  function addBreaker(draft) {
    // Reports the reason rather than returning silently — this form keeps the
    // user's draft on screen, so a no-op click needs an explanation.
    if (savingRef.current) return { error: SAVE_IN_PROGRESS_MESSAGE };
    if (!selectedAsset) return { error: "No panel selected." };
    const type = breakerTypes.find(t => t.id === draft.breakerTypeId);
    if (!type) return { error: "Pick a breaker type." };
    const startSlot = parseInt(draft.startSlot, 10);
    if (!startSlot || startSlot < 1) return { error: "Enter a starting slot." };
    const panelSlotCount = parseInt(selectedAsset.panelSlotCount, 10) || 0;
    const resolvedSlots = resolveTypeSlots(type.slotSpan, startSlot);
    if (panelSlotCount && Math.max(...resolvedSlots) > panelSlotCount) {
      return { error: `Slot ${Math.max(...resolvedSlots)} is beyond this panel's ${panelSlotCount} slots.` };
    }
    const existing = selectedAsset.breakers || [];
    const takenCells = new Set(existing.flatMap(b => b.cells || []));
    const groupId = crypto.randomUUID();
    const serial = draft.serial || "";
    const installedDate = draft.installedDate || "";
    const notes = draft.notes || "";
    const newBreakers = type.members.map((member, i) => {
      const cells = resolveRelativeCells(member.cells, startSlot);
      return {
        id: crypto.randomUUID(), panelLabel: selectedAsset.label, cells,
        breakerTypeId: type.id, groupId,
        ampRating: draft[`amp_${i}`] !== undefined && draft[`amp_${i}`] !== "" ? draft[`amp_${i}`] : member.ampRating,
        serial, installedDate, notes,
        circuits: [],
      };
    });
    const conflictCell = newBreakers.flatMap(b => b.cells).find(c => takenCells.has(c));
    if (conflictCell) return { error: `Slot ${conflictCell.slice(0, -1)} is already in use.` };
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_added", field: `Slot ${resolvedSlots.join("/")}`,
      to: `${type.name} (${newBreakers.map(b => b.ampRating ? b.ampRating + "A" : "?A").join(" / ")})`,
    };
    persist(updateBreakers([...existing, ...newBreakers]), { auditLog: logAudit([entry]) });
    return { newBreakers };
  }

  // Shared by clicking an existing breaker in the diagram and by a successful
  // Add Breaker submit — both need to seed the same per-member/instance drafts
  // for the group the given breaker belongs to.
  function openBreakerModal(anchorId, members) {
    const ampDrafts = {};
    members.forEach(m => { ampDrafts[m.id] = m.ampRating || ""; });
    const anchor = members.find(m => m.id === anchorId) || members[0];
    setBreakerModal({
      anchorId,
      memberAmpDrafts: ampDrafts,
      activeMemberId: null,
      instanceDraft: { serial: anchor.serial || "", installedDate: anchor.installedDate || "", notes: anchor.notes || "" },
      editing: false,
      error: null,
      confirmDeleteGroup: false,
      addingCircuitFor: null,
    });
  }

  // Editing a placed breaker only ever touches its own row — cells, groupId,
  // and breakerTypeId are set once at placement (addBreaker, above) and
  // aren't editable here, since changing them could orphan sibling rows in
  // the same group. Delete and re-add to change where/what a breaker is.
  //
  // ONE save for the whole unit, not one per field. The two things being
  // written are stored at different levels and that hasn't changed: amp rating
  // is per-member (the one spec that legitimately varies within a type
  // instance, e.g. the 15/30/15 split double-pole), while serial/installed
  // date/notes describe the single physical unit you bought and installed, not
  // any one pole, so the same value goes onto every member row. What changed is
  // the editing UI above it: each of those used to have its own pencil and its
  // own save (`saveBreakerAmp` / `saveBreakerInstanceDetails`), so correcting a
  // split double-pole's three amps plus its serial was four separate save
  // cycles — and since every save posts the ENTIRE state snapshot (see
  // Persistence model), four backend round trips for one logical edit.
  //
  // Audit fidelity is per-changed-thing, not per-save: one entry per member
  // whose amp actually moved, plus one per instance field that actually
  // changed — never one blanket "unit edited" entry, and never an entry for a
  // field the user didn't touch. A Save where nothing changed writes nothing at
  // all (no snapshot, no audit row) rather than logging a no-op edit.
  function saveBreakerUnit(memberIds, groupSlotLabel, instanceDraft, ampDrafts) {
    // Says why rather than returning silently — the modal keeps the drafts on
    // screen in edit mode, so a Save that does nothing needs a reason.
    if (savingRef.current) return SAVE_IN_PROGRESS_MESSAGE;
    if (!selectedAsset) return "No panel selected.";
    const existing = selectedAsset.breakers || [];
    const idSet = new Set(memberIds);
    const members = existing.filter(b => idSet.has(b.id));
    if (members.length === 0) return "Breaker not found.";
    const anchor = members[0];
    const nextInstance = { serial: instanceDraft.serial || "", installedDate: instanceDraft.installedDate || "", notes: instanceDraft.notes || "" };
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_edited", field, from, to,
    });
    const entries = [];
    if ((anchor.serial || "") !== nextInstance.serial) entries.push(mk(`Slot ${groupSlotLabel} — Serial`, anchor.serial || "—", nextInstance.serial || "—"));
    if ((anchor.installedDate || "") !== nextInstance.installedDate) {
      entries.push(mk(`Slot ${groupSlotLabel} — Installed Date`, formatDateOnly(anchor.installedDate) || "—", formatDateOnly(nextInstance.installedDate) || "—"));
    }
    if ((anchor.notes || "") !== nextInstance.notes) entries.push(mk(`Slot ${groupSlotLabel} — Notes`, anchor.notes || "—", nextInstance.notes || "—"));
    // Compared as strings: a draft the user never touched is whatever was
    // stored (which older/seeded data may hold as a number), while the moment
    // the number input is touched it's a string — so a bare !== would log an
    // "edit" from 15 to "15".
    const sameAmp = (a, b) => String(a === undefined || a === null ? "" : a) === String(b === undefined || b === null ? "" : b);
    const nextAmps = {};
    members.forEach(m => {
      const draft = ampDrafts[m.id];
      nextAmps[m.id] = draft === undefined ? (m.ampRating || "") : (draft || "");
      if (!sameAmp(m.ampRating, nextAmps[m.id])) {
        entries.push(mk(`Slot ${slotsLabel_(m)} — Amp Rating`, m.ampRating || "—", nextAmps[m.id] || "—"));
      }
    });
    if (entries.length === 0) return; // nothing changed — don't spend a full-snapshot write on it
    const nextBreakers = existing.map(b => (idSet.has(b.id) ? { ...b, ...nextInstance, ampRating: nextAmps[b.id] } : b));
    persist(updateBreakers(nextBreakers), { auditLog: logAudit(entries) });
  }

  // Referential integrity (a breaker unit with circuits attached can't be
  // deleted) is enforced here, client-side only — consistent with every other
  // guard in this app (delete/archive confirmations etc.); nothing else
  // validates server-side either, so this one check wouldn't close a real gap
  // by moving. Delete removes the whole group — a breaker-type instance is one
  // physical unit, not N independently removable poles.
  // How many circuits the whole unit carries — drives the delete prompt's
  // wording. Deleting a unit with circuits used to be refused outright
  // (canDeleteBreakerGroup), which left the user to move every circuit by hand
  // before the unit would budge. Now that a circuit can sit on the panel with no
  // breaker at all, the prompt offers to unassign them instead: the circuits
  // survive, detached, in the panel's Unassigned circuits section.
  function attachedCircuitCount(members) {
    return members.reduce((n, m) => n + (m.circuits || []).length, 0);
  }

  // `unassignCircuits` must be true to delete a unit that still has circuits —
  // the caller has to have asked. Without it this is a no-op rather than a
  // silent data loss, so a future call site can't delete circuits by omission.
  function deleteBreakerGroup(members, groupSlotLabel, unassignCircuits) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset || members.length === 0) return;
    const orphaned = members.flatMap(m => (m.circuits || []).map(c => ({ ...c, breakerId: "" })));
    if (orphaned.length > 0 && !unassignCircuits) return;
    const ids = new Set(members.map(m => m.id));
    const existing = selectedAsset.breakers || [];
    const nextBreakers = existing.filter(b => !ids.has(b.id));
    // null leaves the unassigned list untouched (see updatePanelCircuits) — only
    // a unit that actually had circuits rewrites it.
    const nextUnassigned = orphaned.length
      ? [...(selectedAsset.unassignedCircuits || []), ...orphaned]
      : null;
    const stamp = { at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type };
    // One entry per circuit that moved, not a single lumped one — each circuit
    // ending up unattached is its own fact someone may later go looking for.
    const entries = [
      { ...stamp, action: "breaker_removed", field: `Slot ${groupSlotLabel}` },
      ...orphaned.map(c => ({
        ...stamp, action: "circuit_reassigned", field: c.label,
        from: `Slot ${groupSlotLabel}`, to: "Unassigned",
      })),
    ];
    persist(updatePanelCircuits(nextBreakers, nextUnassigned), { auditLog: logAudit(entries) });
  }

  // Swap is deliberately separate from the generic edit above — it's the only
  // way to change serial/ampRating/installedDate, keeping "replaced the
  // physical unit" distinct from "corrected a typo" in the audit trail.
  function openSwapBreaker(breaker) {
    setSwapModal({
      breaker,
      draft: { serial: breaker.serial || "", ampRating: breaker.ampRating || "", installedDate: dateOnly(breaker.installedDate) },
      error: null,
    });
  }

  function submitSwapBreaker() {
    if (!selectedAsset || !swapModal) return;
    const existing = selectedAsset.breakers || [];
    const original = existing.find(b => b.id === swapModal.breaker.id);
    if (!original) { setSwapModal({ ...swapModal, error: "Breaker not found." }); return; }
    const { draft } = swapModal;
    const updated = { ...original, serial: draft.serial || "", ampRating: draft.ampRating || "", installedDate: draft.installedDate || "" };
    const nextBreakers = existing.map(b => (b.id === original.id ? updated : b));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_swapped", field: `Slot ${slotsLabel_(original)}`,
      from: original.serial || "—", to: updated.serial || "—",
    };
    persist(updateBreakers(nextBreakers), { auditLog: logAudit([entry]) });
    setSwapModal(null);
  }

  // A circuit lives in one of two places on its panel: attached to a breaker
  // (`breakerId` set, stored inside that breaker's `circuits`) or attached to
  // nothing yet (`breakerId` empty, stored in the panel's own
  // `unassignedCircuits`). Every handler below takes that breaker id as its
  // first argument and reads a falsy one as "the unassigned list", so there's
  // one add/edit/delete/move flow rather than a parallel set for circuits that
  // simply aren't wired up yet. `panelLabel` is on the circuit either way — it's
  // the only thing that says which panel an unassigned circuit belongs to (see
  // CIRCUIT_FIELDS in AssetTrackerSync.gs).
  function circuitsIn(breakerId) {
    if (!breakerId) return selectedAsset.unassignedCircuits || [];
    const breaker = (selectedAsset.breakers || []).find(b => b.id === breakerId);
    return breaker ? breaker.circuits || [] : [];
  }

  // Writes one panel's circuit containers back. Passing null for either means
  // "leave that one as it is" — only a move between a breaker and the
  // unassigned list touches both at once.
  function updatePanelCircuits(nextBreakers, nextUnassigned) {
    return assets.map(a => (a.label === selectedLabel ? {
      ...a,
      breakers: nextBreakers || a.breakers || [],
      unassignedCircuits: nextUnassigned || a.unassignedCircuits || [],
    } : a));
  }

  // "Slot 12" / "Unassigned" — the human-readable name for wherever a circuit
  // sits, so an audit entry never reads as a blank or a raw breaker id.
  function circuitLocationLabel(breakerId) {
    if (!breakerId) return "Unassigned";
    const breaker = (selectedAsset.breakers || []).find(b => b.id === breakerId);
    return breaker ? `Slot ${slotsLabel_(breaker)}` : "Unassigned";
  }

  // The one rule a circuit is subject to wherever it lives: it either serves
  // rooms or feeds a downstream sub-panel, never both and never neither. Shared
  // by add and edit so an unassigned circuit can't sidestep it.
  function validateCircuitDraft(draft) {
    if (!draft.label || !draft.label.trim()) return "Enter a circuit label.";
    const roomsServedIds = draft.roomsServedIds || [];
    const feedsPanelLabel = draft.feedsPanelLabel || "";
    if (roomsServedIds.length === 0 && !feedsPanelLabel) return "Pick either rooms served or a sub-panel this circuit feeds.";
    if (roomsServedIds.length > 0 && feedsPanelLabel) return "A circuit can serve rooms or feed a sub-panel, not both.";
    return null;
  }

  function addCircuit(breakerId, draft) {
    // Returns the reason, not silence — ChildEntityTable renders it as the
    // form's error line and keeps the draft.
    if (savingRef.current) return SAVE_IN_PROGRESS_MESSAGE;
    if (!selectedAsset) return "No panel selected.";
    const invalid = validateCircuitDraft(draft);
    if (invalid) return invalid;
    const roomsServedIds = draft.roomsServedIds || [];
    const feedsPanelLabel = draft.feedsPanelLabel || "";
    const existing = selectedAsset.breakers || [];
    if (breakerId && !existing.some(b => b.id === breakerId)) return "Breaker not found.";
    const circuit = {
      id: crypto.randomUUID(), breakerId: breakerId || "", panelLabel: selectedLabel,
      label: draft.label.trim(), notes: (draft.notes || "").trim(),
      roomsServedIds, feedsPanelLabel,
    };
    const nextBreakers = breakerId
      ? existing.map(b => (b.id === breakerId ? { ...b, circuits: [...(b.circuits || []), circuit] } : b))
      : null;
    const nextUnassigned = breakerId ? null : [...(selectedAsset.unassignedCircuits || []), circuit];
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_added", field: circuit.label, from: circuitLocationLabel(breakerId),
      to: feedsPanelLabel ? `Feeds ${feedsPanelLabel}` : `Serves ${roomsServedIds.map(id => roomNameFor(id, assets)).join(", ")}`,
    };
    persist(updatePanelCircuits(nextBreakers, nextUnassigned), { auditLog: logAudit([entry]) });
  }

  function saveCircuitEdit(breakerId, id, draft) {
    if (savingRef.current) return SAVE_IN_PROGRESS_MESSAGE; // see addCircuit
    if (!selectedAsset) return "No panel selected.";
    const invalid = validateCircuitDraft(draft);
    if (invalid) return invalid;
    const roomsServedIds = draft.roomsServedIds || [];
    const feedsPanelLabel = draft.feedsPanelLabel || "";
    const existing = selectedAsset.breakers || [];
    if (breakerId && !existing.some(b => b.id === breakerId)) return "Breaker not found.";
    const original = circuitsIn(breakerId).find(c => c.id === id);
    if (!original) return "Circuit not found.";
    const updated = { ...original, label: draft.label.trim(), notes: (draft.notes || "").trim(), roomsServedIds, feedsPanelLabel };
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_edited", field: `${original.label} — ${field}`, from, to,
    });
    const entries = [];
    if (original.label !== updated.label) entries.push(mk("Label", original.label, updated.label));
    if ((original.notes || "") !== updated.notes) entries.push(mk("Notes", original.notes || "—", updated.notes || "—"));
    if ((original.roomsServedIds || []).join(",") !== roomsServedIds.join(",")) {
      const fromNames = (original.roomsServedIds || []).map(rid => roomNameFor(rid, assets)).join(", ");
      const toNames = roomsServedIds.map(rid => roomNameFor(rid, assets)).join(", ");
      entries.push(mk("Rooms served", fromNames || "—", toNames || "—"));
    }
    if ((original.feedsPanelLabel || "") !== feedsPanelLabel) entries.push(mk("Feeds sub-panel", original.feedsPanelLabel || "—", feedsPanelLabel || "—"));
    const nextBreakers = breakerId
      ? existing.map(b => (b.id === breakerId ? { ...b, circuits: (b.circuits || []).map(c => (c.id === id ? updated : c)) } : b))
      : null;
    const nextUnassigned = breakerId ? null : (selectedAsset.unassignedCircuits || []).map(c => (c.id === id ? updated : c));
    persist(updatePanelCircuits(nextBreakers, nextUnassigned), { auditLog: entries.length ? logAudit(entries) : auditLog });
  }

  function deleteCircuit(breakerId, id) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!selectedAsset) return;
    const existing = selectedAsset.breakers || [];
    const circuit = circuitsIn(breakerId).find(c => c.id === id);
    if (!circuit) return;
    const nextBreakers = breakerId
      ? existing.map(b => (b.id === breakerId ? { ...b, circuits: (b.circuits || []).filter(c => c.id !== id) } : b))
      : null;
    const nextUnassigned = breakerId ? null : (selectedAsset.unassignedCircuits || []).filter(c => c.id !== id);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_removed", field: circuit.label, from: circuitLocationLabel(breakerId),
    };
    persist(updatePanelCircuits(nextBreakers, nextUnassigned), { auditLog: logAudit([entry]) });
  }

  // Same-panel only for this pass — moving a circuit to a different Panel
  // asset would mean mutating two assets atomically, deferred as a follow-up.
  // Within this panel the destination is any other breaker OR the unassigned
  // list, in either direction: `breakerId` (where it is now) and `target`
  // (where it's going) are both "a breaker id, or UNASSIGNED_TARGET".
  function openMoveCircuit(breakerId, circuit) {
    setMoveCircuitModal({ breakerId: breakerId || "", circuit, target: "", error: null });
  }

  function submitMoveCircuit() {
    if (!selectedAsset || !moveCircuitModal) return;
    const { breakerId, circuit: movingCircuitRef, target } = moveCircuitModal;
    const fail = message => setMoveCircuitModal({ ...moveCircuitModal, error: message });
    if (savingRef.current) { fail(SAVE_IN_PROGRESS_MESSAGE); return; } // double-submit guard, see savingRef
    if (!target) { fail("Pick a destination."); return; }
    // The picker's "Unassigned" option can't be a plain "" — that's already the
    // placeholder — so it carries its own sentinel, normalized back to "" here.
    const toBreakerId = target === UNASSIGNED_TARGET ? "" : target;
    if (toBreakerId === (breakerId || "")) { fail(toBreakerId ? "That's already this circuit's breaker." : "This circuit is already unassigned."); return; }
    const existing = selectedAsset.breakers || [];
    if (breakerId && !existing.some(b => b.id === breakerId)) { fail("Breaker not found."); return; }
    if (toBreakerId && !existing.some(b => b.id === toBreakerId)) { fail("Breaker not found."); return; }
    const circuit = circuitsIn(breakerId).find(c => c.id === movingCircuitRef.id);
    if (!circuit) { fail("Circuit not found."); return; }
    const fromLabel = circuitLocationLabel(breakerId);
    const toLabel = circuitLocationLabel(toBreakerId);
    // panelLabel is restated rather than assumed: a circuit that predates the
    // v13 schema won't have one until something writes it.
    const movedCircuit = { ...circuit, breakerId: toBreakerId, panelLabel: selectedLabel };
    const nextBreakers = existing.map(b => {
      if (b.id === breakerId) return { ...b, circuits: (b.circuits || []).filter(c => c.id !== circuit.id) };
      if (b.id === toBreakerId) return { ...b, circuits: [...(b.circuits || []), movedCircuit] };
      return b;
    });
    const unassigned = selectedAsset.unassignedCircuits || [];
    const nextUnassigned = breakerId
      ? (toBreakerId ? unassigned : [...unassigned, movedCircuit])
      : unassigned.filter(c => c.id !== circuit.id);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_reassigned", field: circuit.label, from: fromLabel, to: toLabel,
    };
    persist(updatePanelCircuits(nextBreakers, nextUnassigned), { auditLog: logAudit([entry]) });
    setMoveCircuitModal(null);
  }

  // Local-only — no persist() call. Column show/hide is a per-device viewing
  // preference now, not shared state, so this never touches the Sheet.
  function toggleColumnVisible(key) {
    const col = columns.find(c => c.key === key);
    if (col && col.locked) return;
    const next = { ...columnVisibility, [key]: !isColumnVisible(col) };
    setColumnVisibility(next);
    try {
      localStorage.setItem(COLUMN_VISIBILITY_STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      // Non-fatal — the toggle still applies for this session, just won't stick next visit.
    }
  }

  function addColumn() {
    if (savingRef.current) return; // double-submit guard, see savingRef
    if (!newColName.trim()) return;
    let key = slugify(newColName);
    let i = 1;
    while (columns.some(c => c.key === key)) key = slugify(newColName) + "_" + i++;
    const nextColumns = [...columns, { key, label: newColName.trim(), width: 160, visible: true, custom: true }];
    const nextAssets = assets.map(a => ({ ...a, [key]: "" }));
    persist(nextAssets, { columns: nextColumns });
    setNewColName("");
  }

  function removeColumn(key) {
    if (savingRef.current) return; // double-submit guard, see savingRef
    const nextColumns = columns.filter(c => c.key !== key);
    const nextAssets = assets.map(a => {
      const copy = { ...a };
      delete copy[key];
      return copy;
    });
    persist(nextAssets, { columns: nextColumns });
    setConfirmDeleteCol(null);
  }

  function addChangeType() {
    const name = newChangeTypeName.trim();
    if (!name || changeTypes.includes(name)) return;
    persist(assets, { changeTypes: [...changeTypes, name] });
    setNewChangeTypeName("");
  }

  function removeChangeType(name) {
    persist(assets, { changeTypes: changeTypes.filter(t => t !== name) });
  }

  function addVendor() {
    const name = newVendorName.trim();
    if (!name || vendors.includes(name)) return;
    persist(assets, { vendors: [...vendors, name] });
    setNewVendorName("");
  }

  function removeVendor(name) {
    persist(assets, { vendors: vendors.filter(v => v !== name) });
  }

  function addPeripheral() {
    const name = newPeripheralName.trim();
    if (!name || peripheralsList.includes(name)) return;
    persist(assets, { peripheralsList: [...peripheralsList, name] });
    setNewPeripheralName("");
  }

  function removePeripheral(name) {
    persist(assets, { peripheralsList: peripheralsList.filter(p => p !== name) });
  }

  function addUser() {
    const name = newUserName.trim();
    if (!name || usersList.includes(name)) return;
    persist(assets, { usersList: [...usersList, name].sort() });
    setNewUserName("");
  }

  // Removing a user only takes them off the pick list — assets already assigned
  // to them keep that value until someone reassigns them.
  function removeUser(name) {
    persist(assets, { usersList: usersList.filter(u => u !== name) });
  }

  function addBulkItemType() {
    const name = newBulkItemTypeName.trim();
    if (!name || bulkItemTypes.includes(name)) return;
    persist(assets, { bulkItemTypes: [...bulkItemTypes, name].sort() });
    setNewBulkItemTypeName("");
  }

  // Removing a sub-type only takes it off the pick list — bulk items already
  // using that value keep it until someone edits them.
  function removeBulkItemType(name) {
    persist(assets, { bulkItemTypes: bulkItemTypes.filter(t => t !== name) });
  }

  // Names don't have to be unique for correctness — nothing resolves a type
  // through its name any more — but two types both reading "Printer" in the
  // picker is a trap for the person choosing, so both add and rename refuse it.
  function typeNameTaken(name, exceptId) {
    const wanted = name.trim().toLowerCase();
    return typesList.some(t => t.id !== exceptId && t.name.trim().toLowerCase() === wanted);
  }

  function addType() {
    const name = newTypeName.trim();
    if (!name || typeNameTaken(name)) return;
    // A generated id, per the convention for anything that isn't an Asset and so
    // has no label to be identified by (see CLAUDE.md). Only NEW types get one:
    // a built-in keeps its original name as its id so existing assets stay valid.
    const entry = { id: crypto.randomUUID(), name };
    // Insert before "Other" (if present) so it stays the catch-all at the end of
    // the picker, matching how new default columns get inserted before "status".
    const otherIdx = typesList.findIndex(t => t.id === "Other");
    const nextTypesList = otherIdx === -1
      ? [...typesList, entry]
      : [...typesList.slice(0, otherIdx), entry, ...typesList.slice(otherIdx)];
    persist(assets, { typesList: nextTypesList });
    setNewTypeName("");
  }

  // One save for the whole type editor. Name lives in typesList (it's what the
  // picker lists), the rest in typeSettings (it's an override of the shipped
  // registry) — but they're one edit to the user, so they go in ONE persist():
  // both are the config domain, so two calls would mean two full snapshot writes
  // and two chances for the second to be refused as a conflict with the first.
  function saveTypeSettings(id, draft) {
    const name = (draft.name || "").trim();
    if (!name || typeNameTaken(name, id)) return;

    // Fields invented in this editing session become real custom columns, each
    // flagged `restricted` so it belongs to the types that claim it rather than
    // appearing on everything. This is the one way a NEW restricted field can be
    // created — ticking an existing common field still can't mint one, for the
    // reason in SHIPPED_RESTRICTED_FIELDS.
    let nextColumns = columns;
    const createdKeys = [];
    (draft.newFields || []).forEach(f => {
      const label = (f.label || "").trim();
      if (!label) return;
      let key = slugify(label);
      let i = 1;
      while (nextColumns.some(c => c.key === key)) key = slugify(label) + "_" + i++;
      // Hidden by default: a field belonging to one type would otherwise add a
      // mostly-empty column to everyone's table. It's in the Columns menu.
      nextColumns = [...nextColumns, { key, label, width: 160, visible: false, custom: true, restricted: true }];
      createdKeys.push(key);
    });

    const fields = typeEditableFields(nextColumns).map(c => c.key);
    const wanted = new Set([...draft.fields, ...createdKeys]);
    // Restriction is read off the columns being SAVED, not the current ones, so
    // a field created in this same save counts as restricted immediately.
    const isRestricted = k => SHIPPED_RESTRICTED_FIELDS.has(k)
      || nextColumns.some(c => c.key === k && c.restricted);

    const nextTypesList = typesList.map(t => (t.id === id ? { ...t, name } : t));
    const nextTypeSettings = {
      ...typeSettings,
      [id]: {
        iconName: draft.iconName || undefined,
        parentTypes: draft.parentTypes,
        // Unchecked fields become exclusions; checked ones enter onlyFields only
        // when they're restricted — shipped that way, or created as a per-type
        // field just above.
        excludedFields: fields.filter(k => !wanted.has(k)),
        onlyFields: fields.filter(k => wanted.has(k) && isRestricted(k)),
      },
    };
    persist(assets, { columns: nextColumns, typesList: nextTypesList, typeSettings: nextTypeSettings });
  }

  // Drops the override so the type falls back to what the app ships. For a
  // user-created type that means the generic-device defaults, which is what it
  // had before anyone opened the editor. The NAME is deliberately left alone —
  // it isn't an override of anything, and resetting a renamed built-in back to
  // "Computer" is a separate thought from resetting its fields.
  function resetTypeSettings(id) {
    if (!typeSettings[id]) return;
    const nextTypeSettings = { ...typeSettings };
    delete nextTypeSettings[id];
    persist(assets, { typeSettings: nextTypeSettings });
  }

  // Removing a type only takes it off the pick list — assets already using that
  // value keep it until someone edits them. A registry type marked `locked` can't
  // be removed at all, since Room/Building/Bulk Item/Electrical Panel have
  // structural dependencies elsewhere (field rules, Contents/Allocations/Breakers).
  function removeType(id) {
    if (isLockedType(id)) return;
    persist(assets, { typesList: typesList.filter(t => t.id !== id) });
  }

  // --- Breaker Types (catalog) ------------------------------------------------
  // See BREAKER_TYPES_ARCHITECTURE.md. A type's cells use RELATIVE slot indices
  // (its own 1st/2nd/... slot) — allCellsForSpan/saveBreakerType work entirely
  // in that relative space; resolving onto real panel slots happens only at
  // placement time (addBreakerFromType), not here.
  function allCellsForSpan(slotSpan) {
    const cells = [];
    for (let i = 1; i <= slotSpan; i++) cells.push(`${i}a`, `${i}b`);
    return cells;
  }

  function openAddBreakerType() {
    setBreakerTypeDraft({ id: null, name: "", slotSpan: 1, members: [] });
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function openEditBreakerType(type) {
    setBreakerTypeDraft({ ...type, members: type.members.map(m => ({ ...m })) });
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function cancelBreakerTypeDraft() {
    setBreakerTypeDraft(null);
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function changeBreakerTypeSlotSpan(slotSpan) {
    // Members are cleared on span change rather than trying to salvage cells
    // that might now be out of range — simplest correct behavior, and slot
    // span is normally the first thing set, before any member is defined.
    setBreakerTypeDraft(d => ({ ...d, slotSpan, members: [] }));
    setCurrentMemberCells([]);
  }
  function toggleBreakerTypeCell(cell) {
    setCurrentMemberCells(prev => (prev.includes(cell) ? prev.filter(c => c !== cell) : [...prev, cell]));
  }
  function addBreakerTypeMember() {
    if (currentMemberCells.length === 0) { setBreakerTypeError("Select at least one cell for this breaker."); return; }
    if (!currentMemberAmp) { setBreakerTypeError("Enter an amp rating for this breaker."); return; }
    setBreakerTypeDraft(d => ({ ...d, members: [...d.members, { cells: [...currentMemberCells].sort(), ampRating: currentMemberAmp }] }));
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function removeBreakerTypeMember(idx) {
    setBreakerTypeDraft(d => ({ ...d, members: d.members.filter((_, i) => i !== idx) }));
  }

  function saveBreakerType() {
    // Says why, since this form has its own error line and keeps the draft.
    if (savingRef.current) { setBreakerTypeError(SAVE_IN_PROGRESS_MESSAGE); return; }
    const draft = breakerTypeDraft;
    const name = (draft.name || "").trim();
    if (!name) { setBreakerTypeError("Enter a name."); return; }
    if (draft.members.length === 0) { setBreakerTypeError("Add at least one breaker."); return; }
    const allCells = allCellsForSpan(draft.slotSpan);
    const usedCells = draft.members.flatMap(m => m.cells);
    const missing = allCells.filter(c => !usedCells.includes(c));
    if (missing.length > 0) { setBreakerTypeError(`Every cell must be assigned to a breaker — still unassigned: ${missing.join(", ")}.`); return; }
    const isNew = !draft.id;
    const savedType = { id: draft.id || crypto.randomUUID(), name, slotSpan: draft.slotSpan, members: draft.members };
    const nextTypes = isNew ? [...breakerTypes, savedType] : breakerTypes.map(t => (t.id === savedType.id ? savedType : t));
    persist(assets, { breakerTypes: nextTypes });
    cancelBreakerTypeDraft();
  }

  // Blocks deletion if any breaker anywhere still references this type,
  // listing exactly where (panel + slot) rather than just refusing — the
  // architecture doc's breakerTypeId is display-only, but that doesn't mean
  // deleting the type out from under placed breakers is harmless: the badge
  // would go stale/blank, so it's still worth surfacing to fix first.
  function findBreakerTypeUsages(typeId) {
    const usages = [];
    (assets || []).filter(a => hasModule(a.type, "breakers")).forEach(panel => {
      (panel.breakers || []).filter(b => b.breakerTypeId === typeId).forEach(b => {
        usages.push({ panelLabel: panel.label, slot: cellsLabel_(b) });
      });
    });
    return usages;
  }
  function removeBreakerType(id) {
    if (savingRef.current) { setBreakerTypeError(SAVE_IN_PROGRESS_MESSAGE); return; }
    const usages = findBreakerTypeUsages(id);
    if (usages.length > 0) {
      const list = usages.map(u => `${u.panelLabel} Slot ${u.slot}`).join(", ");
      setBreakerTypeError(`Can't delete — still used by: ${list}.`);
      return;
    }
    persist(assets, { breakerTypes: breakerTypes.filter(t => t.id !== id) });
  }

  function exportToExcel() {
    // Room/Building/Parent are relationships, not stored text — resolve each to
    // a display name for export the same way the UI does, rather than dumping
    // raw label ids into the sheet. roomNameOf/buildingNameOf already handle the
    // "is this asset itself a Room/Building?" case by answering with its own
    // name, so the identity test that used to live here moved into them.
    // Campus/Building/Room are export-only columns now: the list dropped them in
    // favour of Path, but a spreadsheet is exactly where you'd group or pivot by
    // building, and one Path string can't be grouped. They are written HERE
    // rather than read out of `columns`, because that coupling is what would
    // silently delete them from every export the moment the list stopped
    // carrying them.
    const writePlaceColumns = (row, a) => {
      row.Campus = campusNameOf(a, assets);
      row.Building = buildingNameOf(a, assets);
      row.Room = roomNameOf(a, assets);
    };
    const assetRows = assets.map(a => {
      const row = {};
      columns.forEach(c => {
        // Handled before the fieldAppliesTo check, and the place columns written
        // whether or not this type takes a parent, so every row inserts these
        // four keys at the same point. Column ORDER comes from the first row that
        // introduces a key, and the first asset is a Campus, which takes no
        // parent — skip it there and Campus/Building/Room get appended after the
        // last column instead of sitting next to Path where they're readable.
        if (c.key === "parent") {
          row[c.label] = fieldAppliesTo(c.key, a.type) ? (pathOf(a, assets) || UNASSIGNED_LABEL) : "";
          writePlaceColumns(row, a);
          return;
        }
        if (!fieldAppliesTo(c.key, a.type)) { row[c.label] = ""; return; }
        row[c.label] = a[c.key] || "";
      });
      // A column config with no `parent` shouldn't cost the export its location
      // columns — the whole point of writing them here is that they don't depend
      // on what the list happens to show.
      if (!("Room" in row)) writePlaceColumns(row, a);
      row["Comments logged"] = (a.comments || []).length;
      row["Changes logged"] = (a.changes || []).length;
      row["Total cost logged"] = (a.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
      // Allocated/Available are the allocations MODULE's summary, so they follow
      // whoever owns that module rather than the one type that owns it today.
      if (hasModule(a.type, "allocations")) {
        row["Allocated"] = getAllocatedTotal(a);
        row["Available"] = getAvailable(a);
      }
      return row;
    });
    const commentRows = [];
    assets.forEach(a => {
      (a.comments || []).forEach(cm => {
        commentRows.push({ "Asset ID": a.label, Type: a.type, Room: displayRoom(a), When: formatWhen(cm.at), Comment: cm.text, "Logged by": cm.by || "" });
      });
    });
    const changeRows = [];
    assets.forEach(a => {
      (a.changes || []).forEach(ch => {
        changeRows.push({
          "Asset ID": a.label, Type: a.type, Room: displayRoom(a), When: formatWhen(ch.at),
          "Change type": ch.changeType, Vendor: ch.vendor, Cost: parseFloat(ch.cost) || "", Note: ch.note,
          "Logged by": ch.by || "",
        });
      });
    });
    const allocationRows = [];
    assets.forEach(a => {
      (a.allocations || []).forEach(al => {
        allocationRows.push({ "Asset ID": a.label, Item: a.type === "Bulk Item" ? (a.notes || a.label) : a.label, Room: roomNameFor(al.roomId, assets), Quantity: al.quantity });
      });
    });

    const auditRows = auditLog.map(entry => ({
      "Asset ID": entry.assetLabel, Type: entry.assetType, When: formatWhen(entry.at),
      Action: entry.action, Detail: describeAudit(entry), "By": entry.by || "",
    }));

    const breakerRows = [];
    const circuitRows = [];
    assets.forEach(a => {
      (a.breakers || []).forEach(b => {
        const breakerType = breakerTypes.find(t => t.id === b.breakerTypeId);
        breakerRows.push({
          Panel: a.label, "Slot(s)": slotsFromCells(b.cells).join("/"), "Amp Rating": b.ampRating || "",
          Poles: polesFromCells(b.cells), Type: breakerType ? breakerType.name : "", Serial: b.serial || "",
          "Installed Date": b.installedDate || "", Notes: b.notes || "", Circuits: (b.circuits || []).length,
        });
        (b.circuits || []).forEach(c => {
          circuitRows.push({
            Panel: a.label, "Slot(s)": slotsFromCells(b.cells).join("/"), Circuit: c.label,
            Serves: c.feedsPanelLabel ? `Feeds → ${c.feedsPanelLabel}` : (c.roomsServedIds || []).map(id => roomNameFor(id, assets)).join(", "),
            Notes: c.notes || "",
          });
        });
      });
      // Circuits with no breaker land in the same sheet — they're real circuits
      // on this panel, just not wired to a slot yet, so leaving them out would
      // make the export quietly disagree with what the Layout tab shows.
      (a.unassignedCircuits || []).forEach(c => {
        circuitRows.push({
          Panel: a.label, "Slot(s)": "Unassigned", Circuit: c.label,
          Serves: c.feedsPanelLabel ? `Feeds → ${c.feedsPanelLabel}` : (c.roomsServedIds || []).map(id => roomNameFor(id, assets)).join(", "),
          Notes: c.notes || "",
        });
      });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assetRows), "Assets");
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(changeRows.length ? changeRows : [{ "Asset ID": "", Type: "", Room: "", When: "", "Change type": "", Vendor: "", Cost: "", Note: "", "Logged by": "" }]),
      "Changes"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(commentRows.length ? commentRows : [{ "Asset ID": "", Type: "", Room: "", When: "", Comment: "", "Logged by": "" }]),
      "Comments"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(allocationRows.length ? allocationRows : [{ "Asset ID": "", Item: "", Room: "", Quantity: "" }]),
      "Allocations"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(breakerRows.length ? breakerRows : [{
        Panel: "", "Slot(s)": "", "Amp Rating": "", Poles: "", Mount: "", Serial: "", "Installed Date": "", Notes: "", Circuits: "",
      }]),
      "Breakers"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(circuitRows.length ? circuitRows : [{ Panel: "", "Slot(s)": "", Circuit: "", Serves: "", Notes: "" }]),
      "Circuits"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(auditRows.length ? auditRows : [{ "Asset ID": "", Type: "", When: "", Action: "", Detail: "", "By": "" }]),
      "Audit Log"
    );
    XLSX.writeFile(wb, "brookside-asset-inventory.xlsx");
  }

  // The sign-in gate. Ahead of the loading and error screens deliberately: a
  // visitor who isn't signed in should be asked to sign in, not shown a spinner
  // or a "couldn't reach the backend" error that misdescribes what happened.
  //
  // The button container is mounted unconditionally rather than swapped out
  // while a check is in flight. Google injects its button into that node once,
  // driven by an effect keyed on authSatisfied — which doesn't change on a
  // failed attempt, so unmounting the node would take the button away for good
  // and leave a dead end with no way to retry.
  if (!authSatisfied) {
    const notAllowed = authError && authError.reason === "notallowed";
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Sans', sans-serif", padding: 16 }}>
        <div style={{ background: C.surface, border: `1.5px solid ${C.border}`, borderRadius: 10, padding: 28, width: "100%", maxWidth: 380, textAlign: "center", boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
          <div style={{ fontWeight: 700, fontSize: 17, color: C.ink, marginBottom: 4 }}>BCA Asset Tracker</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent, marginBottom: 20 }}>
            Brookside Christian Academy
          </div>

          {notAllowed ? (
            <div style={{ fontSize: 13, color: C.danger, background: "rgba(200,60,60,0.07)", border: `1px solid ${C.danger}`, borderRadius: 8, padding: "10px 12px", marginBottom: 18, textAlign: "left", lineHeight: 1.5 }}>
              {authError.message}
            </div>
          ) : (
            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18, lineHeight: 1.5 }}>
              {/* Swapped as TEXT, never by returning a different tree. The Google
                  button is injected into a ref'd node by an effect keyed on
                  authSatisfied, which doesn't change here — unmounting that node
                  would lose the button with no way to get it back. */}
              {authPending
                ? "Signing you back in…"
                : "Sign in with your Google account to view and edit the inventory."}
            </div>
          )}

          {authError && !notAllowed && (
            <div style={{ fontSize: 13, color: C.danger, marginBottom: 14, lineHeight: 1.5 }}>
              {authError.message}
            </div>
          )}

          {/* The backend's account of WHICH check failed. Shown rather than
              swallowed because the alternative — bouncing silently back to this
              screen — is undebuggable from the outside, and the details it can
              report reveal nothing about whether an account exists or is
              allowed. See verifyIdToken_ in AssetTrackerSync.gs. */}
          {authError && authError.detail && (
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 10px", marginBottom: 14, textAlign: "left", lineHeight: 1.5, wordBreak: "break-word" }}>
              {authError.detail}
            </div>
          )}

          <div
            ref={signInButtonRef}
            style={{ display: "flex", justifyContent: "center", opacity: authPending ? 0.4 : 1, pointerEvents: authPending ? "none" : "auto" }}
          />

          {authPending && (
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted, marginTop: 14 }}>
              Checking your access…
            </div>
          )}

          {/* manualSignOut below is essential, not just tidy: with automatic
              re-issue left on, Google would immediately hand back the SAME
              account that was just refused, and "use a different account"
              would loop forever without ever offering a choice. */}
          {notAllowed && !authPending && (
            <button
              onClick={() => endSession(null, true)}
              style={{ marginTop: 14, padding: "7px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 13, borderRadius: 10, color: C.ink, cursor: "pointer" }}
            >
              Use a different account
            </button>
          )}

          {/* The Sandbox pill lives in the header, which is now behind this
              gate — so without this, turning sandbox mode ON from a signed-out
              browser is impossible, and anyone whose sandbox was OFF is locked
              out of local iteration entirely. Sandbox touches no backend and no
              real data, so it needs no sign-in of its own. */}
          <div style={{ marginTop: 22, paddingTop: 16, borderTop: `1px solid ${C.border}` }}>
            <button
              onClick={toggleSandboxMode}
              title="Work against local fixture data instead. Nothing is read from or written to the Google Sheet."
              style={{ display: "inline-flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted, textDecoration: "underline", cursor: "pointer" }}
            >
              <FlaskConical size={12} />
              Continue in Sandbox (local test data)
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (loadError) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Sans', sans-serif", padding: 16 }}>
        <div style={{ background: C.surface, border: `1.5px solid ${C.danger}`, borderRadius: 10, padding: 24, width: "100%", maxWidth: 380, textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 16, color: C.danger, marginBottom: 8 }}>Couldn't load inventory</div>
          <div style={{ fontSize: 14, color: C.muted, marginBottom: 20 }}>
            The app couldn't reach the Google Sheets backend. Nothing has been changed — check your connection and try again.
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <button onClick={loadData} style={{ padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
              Try again
            </button>
            <button onClick={() => window.location.reload()} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10, color: C.ink }}>
              Refresh page
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", color: C.muted }}>
        Loading inventory…
      </div>
    );
  }

  const globalStyle = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      * { box-sizing: border-box; }
      input, select, textarea { font-family: 'IBM Plex Sans', sans-serif; }
      ::placeholder { color: ${C.placeholder}; }
      .row-body { transition: background-color 0.15s ease; }
      .row-body:hover { background: ${C.hover} !important; }
      button { cursor: pointer; transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
      button:active { transform: translateY(0.5px); }
      .icon-btn { transition: background-color 0.15s ease; }
      .icon-btn:hover { background: ${C.hover} !important; }
      input, select, textarea { transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      input:hover, select:hover, textarea:hover { border-color: ${C.brand} !important; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: ${C.brand} !important;
        box-shadow: 0 0 0 3px rgba(84,111,117,0.18);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(84,111,117,0.28);
      }
      button:disabled { cursor: default; }
      /* The one spinner in the app — every "saving" affordance (header pill and
         the Save buttons' icon) uses this same Loader2 + .spin pairing. */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.8s linear infinite; }
      .scroller::-webkit-scrollbar { height: 10px; }
      .scroller::-webkit-scrollbar-track { background: ${C.hover}; }
      .scroller::-webkit-scrollbar-thumb { background: ${C.scrollThumb}; border-radius: 5px; }
    `}</style>
  );

  // The app-wide save status, shown in BOTH headers (list and detail) — every
  // write funnels through persist(), so one flag says everything. Two states:
  //
