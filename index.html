function Field({ label, value, onChange, placeholder, wide, type }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>{label}</span>
      <input
        type={type || "text"}
        inputMode={type === "number" ? "numeric" : undefined}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
      />
    </label>
  );
}

function PickerTrigger({ value, placeholder, onClick, ariaLabel }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-label={ariaLabel}
      style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
        padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10,
        color: value ? C.ink : C.empty, background: "#fff", textAlign: "left",
      }}
    >
      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{value || placeholder}</span>
      <ChevronDown size={14} color={C.muted} style={{ flexShrink: 0, marginLeft: 6 }} />
    </button>
  );
}

// `value` is a type's stable `id`, not the name shown in the picker — see the
// DEFAULT_TYPES comment. The option list is ids too, with the name resolved for
// display only, so renaming a type changes what this shows and nothing else.
function TypeField({ value, onChange, types, onManage }) {
  const [open, setOpen] = useState(false);
  const ids = types.map(t => t.id);
  // A type removed from the managed list stays selectable on the asset already
  // using it, so opening the form doesn't silently blank its Type.
  const options = ids.includes(value) || !value ? ids : [value, ...ids];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Type
        {onManage && (
          <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage asset types">
            <Settings size={12} color={C.accent} />
          </button>
        )}
      </span>
      <PickerTrigger value={typeNameOf(value, types)} placeholder="Select…" onClick={() => setOpen(true)} ariaLabel="Select type" />
      {open && (
        <SelectionModal
          title="Select type"
          options={options}
          value={value}
          onChange={onChange}
          labelForOption={id => typeNameOf(id, types)}
          onClose={() => setOpen(false)}
          onManage={onManage}
          manageLabel="Manage asset types"
        />
      )}
    </label>
  );
}

// `value` is a Room asset's stable `label` (id), not its display name — same
// reasoning as roomNameFor/buildingNameFor: storing the id instead of the
// mutable name means renaming a Room needs no cascade elsewhere.
// Picks a Room specifically — NOT a parent. Used by the Bulk Item Allocations
// tab (which spreads a quantity across named Rooms — a distribution, explicitly
// not parent/child, see CLAUDE.md) and by the list toolbar's bulk move-to-room.
// Both browse the hierarchy through the same HierarchyBrowserModal as everything
// else; only the selectable rule differs, and here it's simply "is it a Room".
// The old BuildingField had no non-parent caller and is gone entirely.
//
// `label`/`ariaLabel` are parameterized because the toolbar's copy of this field
// sits inline in a sentence ("Move 4 devices from X to:") where a stacked
// "ROOM" caption would read as a second heading.
function RoomField({ value, onChange, assets, label = "Room", hideLabel, excludeId }) {
  const [open, setOpen] = useState(false);
  const all = assets || [];
  const rooms = all.filter(a => a.type === "Room" && a.label !== excludeId);
  const placeholder = rooms.length ? "Select a room…" : "No Room assets yet";
  // Shows the full path, not the bare room name — two buildings can each have a
  // "Kitchen", and the browser's breadcrumb is gone once the modal closes.
  const chosen = value ? all.find(a => a.label === value) : null;
  const triggerText = !value ? "" : !chosen ? "(deleted room)"
    : [...ancestorsOf(chosen, all).reverse().map(p => nameOf(p)), nameOf(chosen)].join(PATH_SEPARATOR);
  const excluded = useMemo(() => (excludeId ? new Set([excludeId]) : undefined), [excludeId]);

  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      {!hideLabel && (
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>{label}</span>
      )}
      <PickerTrigger value={triggerText} placeholder={placeholder} onClick={() => setOpen(true)} ariaLabel="Select room" />
      {open && (
        <HierarchyBrowserModal
          title="Select room"
          hint="Choose a Room"
          assets={all}
          isSelectable={a => a.type === "Room"}
          excluded={excluded}
          value={value || ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
        />
      )}
    </label>
  );
}

// The hierarchy navigator that sits above the asset list — drill into a campus,
// then a building, then a room, and the list below narrows to everything inside
// wherever you are. Inline rather than a modal, because it's not answering a
// question and closing; it's the view you work in.
//
// Deliberately NOT built on HierarchyBrowserModal despite the obvious overlap:
// that component picks ONE thing (or several) out of a tree and hands the answer
// back, and to do it it hides places you can't pick and rows that lead nowhere.
// Here every place is enterable — a building with no assets is still somewhere
// you'd navigate to, to confirm it's empty — and there's no "selectable" notion
// at all. Forcing one component to be both would have meant a predicate that
// says "everything" plus disabling the modal's own hiding rules, which is more
// configuration than the fifteen lines of shared tree-walking are worth.
function HierarchyNav({ assets, scopeId, setScopeId }) {
  const all = assets || [];
  const scope = scopeId ? all.find(a => a.label === scopeId) : null;
  // A scope whose asset has vanished (deleted in another tab) falls back to the
  // top rather than showing an empty list with no way out.
  const effectiveScope = scope ? scopeId : "";

  // Only places are navigable. A dangling parent counts as a root, matching the
  // browser modal, so an orphaned room stays reachable.
  const parentKeyOf = a => {
    const pid = a.parentId;
    if (!pid) return null;
    return all.some(x => x.label === pid) ? pid : null;
  };
  const childPlaces = all
    .filter(a => isPlaceType(a.type) && parentKeyOf(a) === (effectiveScope || null))
    .sort((x, y) => nameOf(x).localeCompare(nameOf(y), undefined, { numeric: true, sensitivity: "base" }));

  const trail = scope ? [...ancestorsOf(scope, all).reverse(), scope] : [];

  const crumb = (label, id, isLast) => (
    <React.Fragment key={id || "__root__"}>
      {id !== undefined && <ChevronRight size={13} style={{ color: C.placeholder, flexShrink: 0 }} />}
      <button
        type="button"
        onClick={() => setScopeId(id ?? "")}
        disabled={isLast}
        style={{
          background: "none", border: "none", padding: "2px 4px", fontSize: 13,
          color: isLast ? C.ink : C.brand, fontWeight: isLast ? 700 : 500, whiteSpace: "nowrap",
        }}
      >
        {label}
      </button>
    </React.Fragment>
  );

  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: "10px 14px", marginBottom: 12, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
      <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 1 }}>
        {crumb("All assets", null, trail.length === 0)}
        {trail.map((a, i) => crumb(nameOf(a), a.label, i === trail.length - 1))}
      </div>
      {childPlaces.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 9 }}>
          {childPlaces.map(p => {
            const Icon = iconFor(p.type);
            return (
              <button
                key={p.label}
                type="button"
                onClick={() => setScopeId(p.label)}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 14, fontSize: 13, fontWeight: 500, border: `1.5px solid ${C.border}`, background: "transparent", color: C.ink }}
              >
                <Icon size={13} style={{ color: C.brand, flexShrink: 0 }} />
                {nameOf(p)}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// A DRILL-DOWN browser over the asset hierarchy — the shared picker behind
// every "which place?" question in the app. You start at the top (the
// Buildings), open one, and see only what's inside it.
//
// It began life inside the parent picker as a flat list of every valid
// candidate, each labelled with its own chain to disambiguate ("Kitchen —
// Building 100" vs "Kitchen (Upstairs) — Residence"). That works at four rooms
// and falls apart at forty: every room in the school in one alphabetical list,
// with the path doing the work that navigation should be doing. Browsing also
// matches how someone actually thinks about it — you know which building before
// you know which room. It was generalized out of ParentField once the same
// complaint applied to the circuit "serves rooms" chips, the bulk-item
// allocation picker and the bulk move-to-room toolbar; four flat lists of every
// room was three too many.
//
// The wrinkle that shapes the whole component: **the things you navigate THROUGH
// are usually not things you may pick.** Choosing a Room, a Building is never a
// valid answer, but it's the only route to the Rooms. So a row has up to two
// independent affordances — choose it, and/or open it — and a row that is
// neither selectable nor contains anything selectable is hidden entirely, so you
// can never walk into a dead end.
//
// Callers supply the rule rather than the list:
//   isSelectable(asset) — may this be chosen? (a type test, usually)
//   excluded            — labels to hide from the tree outright (optional)
//   multi               — true to pick several; the modal then stays open,
//                         shows the running selection as removable chips, and
//                         commits on Done. Single-select commits on click.
//   noneLabel           — text for the "choose nothing" row, or omitted to have
//                         no such row. Not defaulted to "Unassigned": that word
//                         is right for a parent (a real, meaningful state) and
//                         nonsense when you're assigning chairs to a room, where
//                         the honest answer is that there's nothing to offer.
function HierarchyBrowserModal({
  title, hint, assets, isSelectable, excluded, multi, value, onChange, onClose, noneLabel,
}) {
  const all = assets || [];
  const blocked = excluded || new Set();

  // Multi keeps its own working copy so the caller only hears about the change
  // once, on Done — a circuit's rooms are saved as one edit, and firing per
  // toggle would make an eight-room circuit eight audit entries.
  const [picked, setPicked] = useState(() => (multi ? [...(value || [])] : []));
  const selectedIds = multi ? picked : (value ? [value] : []);
  const isPicked = label => selectedIds.includes(label);

  // An asset whose parent doesn't exist (deleted, or a bad hand edit) is treated
  // as a root, so it stays reachable here instead of being stranded — otherwise
  // the one orphaned room you need to pick would be invisible in the browser
  // while the old flat list would have shown it.
  const parentKeyOf = a => {
    const pid = a.parentId;
    if (!pid) return null;
    return all.some(x => x.label === pid) ? pid : null;
  };
  const childrenOf = key => all
    .filter(a => !blocked.has(a.label) && parentKeyOf(a) === key)
    .sort((x, y) => nameOf(x).localeCompare(nameOf(y), undefined, { numeric: true, sensitivity: "base" }));

  const canPick = a => isSelectable(a) && !blocked.has(a.label);
  // Does anything inside this lead somewhere pickable? Drives whether the row is
  // shown at all, and whether it gets an "open" chevron. The visited set guards
  // the same loop case every other walk in this file does.
  const hasSelectableInside = (a, seen = new Set()) => {
    if (seen.has(a.label)) return false;
    seen.add(a.label);
    return childrenOf(a.label).some(c => canPick(c) || hasSelectableInside(c, seen));
  };

  // Open where the current selection lives, so an existing choice is on screen
  // and ticked rather than making the user re-navigate to see what's set. With
  // several selected, the first one wins — there's no level that shows them all.
  const initialLevel = () => {
    const first = selectedIds[0];
    const current = first ? all.find(a => a.label === first) : null;
    return current ? parentKeyOf(current) : null;
  };
  const [levelId, setLevelId] = useState(initialLevel);

  const levelAsset = levelId ? all.find(a => a.label === levelId) : null;
  // Guard against a levelId that no longer resolves (the asset was deleted in
  // another tab while this was open) by falling back to the top.
  const effectiveLevelId = levelAsset ? levelId : null;
  const trail = levelAsset ? [...ancestorsOf(levelAsset, all).reverse(), levelAsset] : [];
  const rows = childrenOf(effectiveLevelId).filter(a => canPick(a) || hasSelectableInside(a));

  const toggle = a => {
    if (multi) {
      setPicked(p => (p.includes(a.label) ? p.filter(x => x !== a.label) : [...p, a.label]));
    } else {
      onChange(a.label);
      onClose();
    }
  };

  const crumb = (label, id, isLast) => (
    <React.Fragment key={id || "__root__"}>
      {id !== undefined && <ChevronRight size={12} style={{ color: C.placeholder, flexShrink: 0 }} />}
      <button
        type="button"
        onClick={() => setLevelId(id ?? null)}
        disabled={isLast}
        style={{
          background: "none", border: "none", padding: "2px 3px", fontSize: 12,
          color: isLast ? C.ink : C.brand, fontWeight: isLast ? 700 : 500, whiteSpace: "nowrap",
        }}
      >
        {label}
      </button>
    </React.Fragment>
  );

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 380, maxHeight: "72vh", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>

        {/* Says what you're looking for, which matters most at the top level,
            where (choosing a Room) nothing on screen is pickable yet and the
            list is all buildings. */}
        <div style={{ fontSize: 12, color: C.empty, marginBottom: 8 }}>{hint}</div>

        {/* Multi-select only: what's picked so far, as removable chips. Without
            this you can't see your own selection — it's spread across levels and
            only one level is on screen at a time, which the old flat chip wall
            at least got right. Each chip removes itself, so undoing a pick never
            means navigating back to where you made it. */}
        {multi && picked.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 8 }}>
            {picked.map(id => {
              const a = all.find(x => x.label === id);
              return (
                <button
                  key={id}
                  type="button"
                  onClick={() => setPicked(p => p.filter(x => x !== id))}
                  aria-label={`Remove ${a ? nameOf(a) : id}`}
                  style={{ display: "flex", alignItems: "center", gap: 4, padding: "4px 8px", borderRadius: 14, fontSize: 12, fontWeight: 600, border: `1.5px solid ${C.brand}`, background: C.brand, color: "#fff" }}
                >
                  {a ? nameOf(a) : "(deleted)"}
                  <X size={12} />
                </button>
              );
            })}
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 1, marginBottom: 8, paddingBottom: 8, borderBottom: `1px solid ${C.border}` }}>
          {crumb("All", null, trail.length === 0)}
          {trail.map((a, i) => crumb(nameOf(a), a.label, i === trail.length - 1))}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 2, overflowY: "auto" }}>
          {/* The "none" row belongs to the top level only — it's the absence of a
              choice, not something that lives inside Building 100. Single-select
              only: in multi-select, picking nothing is just an empty chip row. */}
          {!multi && !effectiveLevelId && noneLabel && (
            <button
              onClick={() => { onChange(""); onClose(); }}
              style={{
                display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 10px",
                background: !value ? C.hover : "transparent", border: "none", borderRadius: 10,
                fontSize: 14, textAlign: "left", color: C.empty, fontWeight: !value ? 600 : 400,
              }}
            >
              {noneLabel}
              {!value && <Check size={15} color={C.brand} />}
            </button>
          )}

          {rows.length === 0 && (
            <div style={{ fontSize: 13, color: C.empty, padding: "8px 2px" }}>
              {effectiveLevelId ? "Nothing inside this you can choose." : "Nothing to choose from yet."}
            </div>
          )}

          {rows.map(a => {
            const selectable = canPick(a);
            const openable = hasSelectableInside(a);
            const isCurrent = isPicked(a.label);
            const Icon = iconFor(a.type);
            return (
              <div key={a.label} style={{ display: "flex", alignItems: "stretch", gap: 2 }}>
                <button
                  // A row you can't choose still opens on its body — otherwise
                  // the only way into a Building (when choosing a Room) would be
                  // the small chevron, and the obvious click would do nothing.
                  onClick={() => { if (selectable) toggle(a); else setLevelId(a.label); }}
                  style={{
                    flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8, padding: "9px 10px",
                    background: isCurrent ? C.hover : "transparent", border: "none", borderRadius: 10,
                    fontSize: 14, textAlign: "left", color: selectable ? C.ink : C.muted, fontWeight: isCurrent ? 600 : 400,
                  }}
                >
                  <Icon size={15} style={{ flexShrink: 0, color: C.brand }} />
                  <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{nameOf(a)}</span>
                  {isCurrent && <Check size={15} color={C.brand} style={{ flexShrink: 0 }} />}
                </button>
                {openable && (
                  <button
                    onClick={() => setLevelId(a.label)}
                    className="icon-btn"
                    aria-label={`Open ${nameOf(a)}`}
                    style={{ background: "none", border: "none", padding: "0 8px", borderRadius: 10, color: C.muted, display: "flex", alignItems: "center", flexShrink: 0 }}
                  >
                    <ChevronRight size={16} />
                  </button>
                )}
              </div>
            );
          })}
        </div>

        {/* Multi-select commits here rather than per click, so a several-room
            change lands as one edit. Single-select has no footer — a click IS
            the commit. */}
        {multi && (
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
            <button onClick={onClose} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
              Cancel
            </button>
            <button
              onClick={() => { onChange(picked); onClose(); }}
              style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
            >
              Done{picked.length ? ` (${picked.length})` : ""}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// The one field that says where an asset sits — it replaced the placement role
// of RoomField and the whole of BuildingField, which existed only because the
// two fixed roomId/buildingId columns did. Which types may be chosen comes from
// the registry (parentTypesFor), so a Computer gets Rooms, a Condenser gets
// Buildings, and a Room gets both Buildings and other Rooms, with no list here
// to keep in step. The picking itself happens in HierarchyBrowserModal above.
function ParentField({ value, onChange, childType, childLabel, assets, error }) {
  const [open, setOpen] = useState(false);
  const allowedTypes = parentTypesFor(childType);
  const anyCandidate = (assets || []).some(a => allowedTypes.includes(a.type) && a.label !== childLabel);

  // The asset itself and everything below it, hidden from the tree outright
  // rather than offered and then refused on save. Nothing below this asset can
  // be a legal parent (that's the cycle rule), so there's nothing to navigate to
  // down there either. saveDraft still validates; see validateParentChoice.
  // This is the one caller that needs `excluded` — a plain room picker has no
  // equivalent notion of "would loop".
  const excluded = useMemo(() => {
    const s = new Set();
    if (!childLabel) return s;
    s.add(childLabel);
    const self = (assets || []).find(a => a.label === childLabel);
    if (self) descendantsOf(self, assets).forEach(d => s.add(d.label));
    return s;
  }, [childLabel, assets]);

  // An empty parent reads as the state it IS ("Unassigned"), not as a prompt to
  // fill something in — it's a legitimate resting place for a spare in a drawer
  // or something not yet installed, so "Select a room…" would misdescribe it.
  // The "nothing to pick yet" case still says so, since that one really is a gap.
  const typeWords = allowedTypes.join(" or ").toLowerCase();
  const placeholder = anyCandidate ? UNASSIGNED_LABEL : `${UNASSIGNED_LABEL} — no ${typeWords} assets exist yet`;
  // The trigger shows the full path, not just the parent's name — two rooms can
  // share a name in different buildings, and the browser's breadcrumb is gone
  // once the modal closes. A dangling id resolves to "(deleted asset)" rather
  // than "" — blank is indistinguishable from Unassigned, a different state.
  const chosen = value ? (assets || []).find(a => a.label === value) : null;
  const triggerText = !value ? "" : !chosen ? "(deleted asset)"
    : [...ancestorsOf(chosen, assets).reverse().map(p => nameOf(p)), nameOf(chosen)].join(PATH_SEPARATOR);

  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Parent</span>
      <PickerTrigger
        value={triggerText}
        placeholder={placeholder}
        onClick={() => setOpen(true)}
        ariaLabel="Select parent"
      />
      {error && <span style={{ fontSize: 12, color: C.danger }}>{error}</span>}
      {open && (
        <HierarchyBrowserModal
          title="Select parent"
          hint={`Choose a ${allowedTypes.join(" or ")}`}
          assets={assets}
          isSelectable={a => allowedTypes.includes(a.type)}
          excluded={excluded}
          noneLabel={UNASSIGNED_LABEL}
          value={value || ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
        />
      )}
    </label>
  );
}

// Generic single-select field styled like TypeField/RoomField/BuildingField above —
// a PickerTrigger button that opens a SelectionModal — for any plain string/number
// enum (Frequency, Change Type, Vendor, Status, ...) instead of a native <select>,
// so every single-select field in the app looks and behaves the same way. To allow
// clearing back to unselected, the caller prepends "" to `options` itself (see
// BulkTypeField below) and maps it to a placeholder like "Select…" via labelForOption.
function PickerField({ label, value, onChange, options, placeholder = "Select…", labelForOption, onManage, manageLabel, title, emptyLabel, wide, hideLabel }) {
  const [open, setOpen] = useState(false);
  const getLabel = labelForOption || (o => o);
  const displayValue = value !== "" && value != null ? getLabel(value) : "";
  const Wrapper = hideLabel ? "div" : "label";
  return (
    <Wrapper style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      {!hideLabel && (
        <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
          {label}
          {onManage && (
            <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label={manageLabel || `Manage ${label}`}>
              <Settings size={12} color={C.accent} />
            </button>
          )}
        </span>
      )}
      <PickerTrigger value={displayValue} placeholder={placeholder} onClick={() => setOpen(true)} ariaLabel={`Select ${label}`} />
      {open && (
        <SelectionModal
          title={title || `Select ${label}`}
          options={options}
          value={value ?? ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
          labelForOption={labelForOption}
          emptyLabel={emptyLabel}
          onManage={onManage}
          manageLabel={manageLabel}
        />
      )}
    </Wrapper>
  );
}

function BulkTypeField({ value, onChange, options, onManage }) {
  // Include the current value even if it's not in the managed list (legacy/custom
  // data), so editing never silently drops it.
  const allOptions = !value || options.includes(value) ? options : [value, ...options];
  return (
    <PickerField
      label="Sub-type"
      value={value || ""}
      onChange={onChange}
      options={["", ...allOptions]}
      placeholder={options.length ? "Select…" : "No sub-types yet — add one"}
      labelForOption={o => (o ? o : (options.length ? "Select…" : "No sub-types yet — add one"))}
      onManage={onManage}
      manageLabel="Manage bulk item sub-types"
      title="Select sub-type"
    />
  );
}

function UserField({ value, onChange, userOptions, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom names already on this asset that aren't in the
  // managed list, so editing never silently drops someone.
  const allOptions = [...userOptions, ...selected.filter(s => !userOptions.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        User{selected.length > 1 ? "s" : ""}
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage users">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No users defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PeripheralsField({ value, onChange, options, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom values already on this asset that aren't in the managed list,
  // so editing never silently drops data.
  const allOptions = [...options, ...selected.filter(s => !options.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Peripherals
        <button onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage peripherals">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No peripherals defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>

    </div>

}

function Detail({ label, value, wide, italic }) {
  return (
    <div style={{ gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 0.5, textTransform: "uppercase", color: C.placeholder }}>{label}</span>
      <div style={{ color: value ? C.ink : C.placeholder, fontSize: 14, fontStyle: italic ? "italic" : "normal" }}>{value || "—"}</div>
    </div>

}

// `isSaving` is threaded in from AssetTracker rather than each caller wiring up
// its own: every one of these lists writes through the same persist(), so the
// add/remove controls here disable and say "Saving…" for the same reason the
// asset forms do. Guarding onAdd/onRemove in one place covers all six lists.
// Manages the asset TYPE list: add, rename, remove. Separate from
// ListManagerModal because a type is an { id, name } record rather than a bare
// string — renaming one edits a field, where renaming a string would mean
// swapping one list entry for another and orphaning every asset pointing at it.
//
// Renaming is safe precisely because nothing resolves a type through its name:
// `asset.type` holds the id (see DEFAULT_TYPES), so this writes one field and
// every asset follows automatically. That's why the row shows a live count of
// assets using the type — it's reassurance that they come along, not a warning.
//
// Edit affordance follows the app's convention: an icon-only pencil at the
// trailing edge of the row it edits (see CLAUDE.md).
function TypeManagerModal({
  types, newValue, onNewValueChange, onAdd, onSave, onReset, onRemove, onClose,
  isSaving, canEdit, isLocked, nameTaken, countFor, fieldOptions, hasOverrides,
}) {
  const [confirmId, setConfirmId] = useState(null);
  const [draft, setDraft] = useState(null); // { id, name, iconName, parentTypes, fields, newFields }
  const [newFieldName, setNewFieldName] = useState("");

  // Seeds the form from the type's EFFECTIVE settings (shipped defaults with any
  // override already applied), so the boxes show what's actually in force rather
  // than what was last typed. Reseeded on every open, so an abandoned edit can't
  // leave a stale draft behind — the same rule the breaker modal follows.
  const startEdit = t => {
    const entry = typeEntryFor(t.id) || {};
    setDraft({
      id: t.id,
      name: t.name,
      iconName: entry.iconName || "",
      parentTypes: entry.parentTypes || (TYPE_REGISTRY[t.id] ? [] : DEFAULT_PARENT_TYPES),
      fields: fieldOptions.filter(f => fieldAppliesTo(f.key, t.id)).map(f => f.key),
      newFields: [],
    });
    setNewFieldName("");
    setConfirmId(null);
  };
  const cancelEdit = () => setDraft(null);

  const clean = (draft?.name || "").trim();
  const duplicate = !!draft && !!clean && nameTaken(clean, draft.id);
  const canSave = !!clean && !duplicate && !isSaving;
  const toggle = (list, v) => (list.includes(v) ? list.filter(x => x !== v) : [...list, v]);

  // Pending until Save, so the whole editor is still one commit — creating the
  // column immediately would persist half an edit and leave a stray column
  // behind if the rest were cancelled. Refuses a label that already names a
  // field, for the same reason duplicate type names are refused: the chips
  // become unreadable.
  const fieldLabelTaken = label => {
    const wanted = label.trim().toLowerCase();
    return fieldOptions.some(f => f.label.trim().toLowerCase() === wanted)
      || (draft?.newFields || []).some(f => f.label.trim().toLowerCase() === wanted);
  };
  const addPendingField = () => {
    const label = newFieldName.trim();
    if (!label || !draft || fieldLabelTaken(label)) return;
    setDraft({ ...draft, newFields: [...(draft.newFields || []), { tempId: crypto.randomUUID(), label }] });
    setNewFieldName("");
  };

  const chip = (on, label, key, onClick) => (
    <button
      key={key}
      type="button"
      onClick={onClick}
      style={{
        padding: "4px 10px", borderRadius: 999, fontSize: 12,
        border: `1px solid ${on ? C.brand : C.border}`,
        background: on ? C.brand : "transparent",
        color: on ? "#fff" : C.muted, fontWeight: on ? 600 : 400,
      }}
    >
      {label}
    </button>
  );

  return (
    // zIndex 50, above SelectionModal's 40 — opened via the "manage" gear from
    // inside the Type picker, so it must stack above it.
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 460, maxHeight: "80vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            {draft ? `Edit type` : "Manage asset types"}
          </div>
          <button onClick={draft ? cancelEdit : onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>

        {draft ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Name</span>
              <input
                autoFocus
                value={draft.name}
                onChange={e => setDraft({ ...draft, name: e.target.value })}
                style={{ padding: "6px 8px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 14, fontFamily: "inherit", background: C.surface, color: C.ink }}
                aria-label="Type name"
              />
              {duplicate && <span style={{ fontSize: 12, color: C.danger }}>Another type is already called "{clean}".</span>}
            </label>

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Icon</span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {Object.entries(TYPE_ICON_CHOICES).map(([key, Ico]) => {
                  const on = draft.iconName === key;
                  return (
                    <button
                      key={key} type="button" aria-label={`Icon ${key}`}
                      onClick={() => setDraft({ ...draft, iconName: on ? "" : key })}
                      style={{ padding: 7, borderRadius: 8, display: "flex", border: `1px solid ${on ? C.brand : C.border}`, background: on ? C.brand : "transparent" }}
                    >
                      <Ico size={15} color={on ? "#fff" : C.muted} />
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Can sit inside</span>
              <div style={{ fontSize: 12, color: C.empty }}>
                Nothing ticked means this type has no Parent field at all — right for a Campus, or for something pooled across rooms.
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {types.map(t => chip(
                  draft.parentTypes.includes(t.id), t.name, t.id,
                  () => setDraft({ ...draft, parentTypes: toggle(draft.parentTypes, t.id) })
                ))}
              </div>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Fields</span>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {fieldOptions.map(f => chip(
                  draft.fields.includes(f.key), f.label, f.key,
                  () => setDraft({ ...draft, fields: toggle(draft.fields, f.key) })
                ))}
                {/* Fields invented here but not yet saved. Removable while they
                    are still pending; once saved they're ordinary columns and
                    are deleted from the Columns menu, which already owns that
                    (destructive) action rather than having a second copy here. */}
                {(draft.newFields || []).map(f => (
                  <span key={f.tempId} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "4px 6px 4px 10px", borderRadius: 999, fontSize: 12, border: `1px dashed ${C.brand}`, background: "transparent", color: C.brandDark, fontWeight: 600 }}>
                    {f.label}
                    <button
                      type="button"
                      aria-label={`Remove ${f.label}`}
                      onClick={() => setDraft({ ...draft, newFields: draft.newFields.filter(x => x.tempId !== f.tempId) })}
                      style={{ background: "none", border: "none", padding: 0, display: "flex", color: C.muted }}
                    >
                      <X size={12} />
                    </button>
                  </span>
                ))}
              </div>
              <div style={{ display: "flex", gap: 6, marginTop: 2 }}>
                <input
                  value={newFieldName}
                  onChange={e => setNewFieldName(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addPendingField(); } }}
                  placeholder="New field for this type, e.g. Warranty Contact"
                  style={{ flex: 1, padding: "5px 8px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 12, fontFamily: "inherit", background: C.surface, color: C.ink }}
                />
                <button
                  type="button"
                  onClick={addPendingField}
                  style={{ padding: "5px 10px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink, fontWeight: 600 }}
                >
                  Add field
                </button>
              </div>
              <div style={{ fontSize: 12, color: C.empty }}>
                A new field belongs to the types you tick it for, and is hidden from the main table until you show it from the Columns menu.
              </div>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 8, borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
              <button
                onClick={() => { if (!canSave) return; onSave(draft.id, draft); cancelEdit(); }}
                disabled={!canSave}
                style={{ padding: "6px 14px", background: canSave ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600 }}
              >
                {isSaving ? "Saving…" : "Save"}
              </button>
              <button onClick={cancelEdit} style={{ padding: "6px 12px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 13, color: C.ink }}>Cancel</button>
              {hasOverrides(draft.id) && (
                <button
                  onClick={() => { if (isSaving) return; onReset(draft.id); cancelEdit(); }}
                  style={{ marginLeft: "auto", padding: "6px 12px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.muted }}
                >
                  Reset to default
                </button>
              )}
            </div>
          </div>
        ) : (
          <>
            <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>
              Renaming a type updates it everywhere — assets keep their type. Room, Building, Bulk Item, Campus and Electrical Panel are built into the app and can't be removed.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
              {types.map(t => {
                const locked = isLocked ? isLocked(t.id) : false;
                const inUse = countFor ? countFor(t.id) : 0;
                const Ico = iconFor(t.id);
                return (
                  <div key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, fontSize: 14 }}>
                    {confirmId === t.id ? (
                      <>
                        <span style={{ color: C.danger, fontSize: 13 }}>
                          Remove "{t.name}"?{inUse > 0 && ` ${inUse} asset(s) keep it.`}
                        </span>
                        <div style={{ display: "flex", gap: 6 }}>
                          <button onClick={() => setConfirmId(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                          <button
                            onClick={() => { if (isSaving) return; onRemove(t.id); setConfirmId(null); }}
                            disabled={isSaving}
                            style={{ padding: "3px 8px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                          >
                            {isSaving ? "Saving…" : "Delete"}
                          </button>
                        </div>
                      </>
                    ) : (
                      <>
                        <span style={{ display: "flex", alignItems: "center", gap: 6, opacity: locked ? 0.75 : 1, minWidth: 0 }}>
                          <Ico size={14} color={C.brand} style={{ flexShrink: 0 }} />
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.name}</span>
                          {locked && <Lock size={11} style={{ flexShrink: 0 }} />}
                          {inUse > 0 && <span style={{ fontSize: 11, color: C.empty, flexShrink: 0 }}>{inUse}</span>}
                          {hasOverrides(t.id) && <span style={{ fontSize: 10, color: C.accent, flexShrink: 0, fontFamily: "'IBM Plex Mono', monospace" }}>EDITED</span>}
                        </span>
                        {canEdit && (
                          <span style={{ display: "flex", alignItems: "center", gap: 2, flexShrink: 0 }}>
                            {/* Editing is allowed on locked types too: `locked`
                                means the app depends on the type EXISTING (its
                                tabs, its field rules), which is about the id, not
                                what it's called or what it holds. */}
                            <button onClick={() => startEdit(t)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label={`Edit ${t.name}`}>
                              <Pencil size={14} color={C.muted} />
                            </button>
                            {!locked && (
                              <button onClick={() => setConfirmId(t.id)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label={`Remove ${t.name}`}>
                                <Trash2 size={14} color={C.danger} />
                              </button>
                            )}
                          </span>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            {canEdit && (
              <div style={{ display: "flex", gap: 6 }}>
                <input
                  value={newValue}
                  onChange={e => onNewValueChange(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") onAdd(); }}
                  placeholder="New type name"
                  style={{ flex: 1, padding: "6px 8px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, fontFamily: "inherit", background: C.surface, color: C.ink }}
                />
                <button
                  onClick={onAdd}
                  disabled={isSaving}
                  style={{ padding: "6px 12px", background: isSaving ? C.border : C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600 }}
                >
                  {isSaving ? "Saving…" : "Add"}
                </button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function ListManagerModal({ title, items, newValue, onNewValueChange, onAdd, onRemove, onClose, placeholder, isLocked, hint, isSaving }) {
  const [confirmItem, setConfirmItem] = useState(null);
  return (
    // zIndex 50, above SelectionModal's 40 — this modal is frequently opened via the
    // "manage" gear from inside an open SelectionModal (e.g. Type field -> manage asset
    // types), so it must stack above that picker rather than being hidden behind it.
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:320, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        {hint && <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>{hint}</div>}
        {items.length === 0 && (
          <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>Nothing added yet.</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
          {items.map(item => {
            const locked = isLocked ? isLocked(item) : false;
            return (
            <div key={item} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
              {confirmItem === item ? (
                <>
                  <span style={{ color: C.danger, fontSize: 13 }}>Remove "{item}"?</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmItem(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                    <button
                      onClick={() => { if (isSaving) return; onRemove(item); setConfirmItem(null); }}
                      disabled={isSaving}
                      style={{ padding: "3px 8px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                    >
                      {isSaving ? "Saving…" : "Delete"}
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <span style={{ display: "flex", alignItems: "center", gap: 6, opacity: locked ? 0.6 : 1 }}>{item} {locked && <Lock size={11} />}</span>
                  {locked ? (
                    <span />
                  ) : (
                    <button onClick={() => setConfirmItem(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </>
              )}
            </div>
            );
          })}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
          <input
            value={newValue}
            onChange={e => onNewValueChange(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && !isSaving) onAdd(); }}
            placeholder={placeholder}
            style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
          />
          <button onClick={onAdd} disabled={isSaving} style={{ padding: "8px 14px", background: isSaving ? C.border : C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}>{isSaving ? "Saving…" : "Add"}</button>
        </div>
      </div>
    </div>
  );
}

// Generic modal picker mirroring the column-filter popup's look: centered card,
// scrollable list of option buttons, checkmark on the selected one. Used for any
// single-select field (Type/Room/Building) that shouldn't use a native <select>.
function SelectionModal({ title, options, value, onChange, onClose, labelForOption, emptyLabel, onManage, manageLabel }) {
  const getLabel = labelForOption || (o => o);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
            {onManage && (
              <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.accent, display: "flex" }} aria-label={manageLabel || "Manage list"}>
                <Settings size={15} />
              </button>
            )}
            <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
          </div>
        </div>
        {options.length === 0 && emptyLabel && (
          <div style={{ fontSize: 13, color: C.empty, padding: "4px 2px 8px" }}>{emptyLabel}</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {options.map(opt => {
            const isSelected = opt === (value || "");
            return (
              <button
                key={opt || "__none__"}
                onClick={() => { onChange(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: opt ? C.ink : C.empty, fontWeight: isSelected ? 600 : 400,
                }}
              >
                {getLabel(opt)}
                {isSelected && <Check size={15} color={C.brand} />}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Header cell for a data-table column: either a filter+sort trigger (Filter icon,
// opens ColumnFilterModal) for columns present in filterConfigs, or a plain
// click-to-cycle sort button (asc -> desc -> none) for everything else. A small
// × chip appears next to the sort arrow on whichever column is currently sorted,
// so it can be cleared directly instead of reopening the modal or re-cycling taps.
function ColumnHeaderCell({ label, colKey, sticky, filterConfigs, sortConfig, setSortConfig, onOpenFilter }) {
  const cfg = filterConfigs[colKey];
  const isFiltered = cfg && cfg.value !== cfg.options[0];
  const sortedHere = sortConfig && sortConfig.key === colKey;
  const sortArrow = sortedHere ? (sortConfig.dir === "asc" ? " ↑" : " ↓") : "";
  return (
    <div style={{ position: sticky ? "sticky" : "static", left: sticky ? 0 : undefined, background: C.brandDark, zIndex: sticky ? 2 : 1, display: "flex", alignItems: "center" }}>
      {cfg ? (
        <button
          onClick={() => onOpenFilter(colKey)}
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: isFiltered || sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: isFiltered || sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
          <Filter size={11} style={{ flexShrink: 0 }} />
        </button>
      ) : (
        <button
          onClick={() => setSortConfig(
            !sortedHere ? { key: colKey, dir: "asc" }
            : sortConfig.dir === "asc" ? { key: colKey, dir: "desc" }
            : null
          )}
          title="Tap to sort"
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
        </button>
      )}
      {sortedHere && (
        <button
          onClick={() => setSortConfig(null)}
          title="Clear sort"
          aria-label="Clear sort"
          style={{ flexShrink: 0, background: "none", border: "none", padding: "6px 10px 6px 0", color: "#E8C9A0", display: "flex" }}
        >
          <X size={11} />
        </button>
      )}
    </div>
  );
}

// Modal opened from a ColumnHeaderCell's filter button: option list (with an
// optional cfg.labelForOption for columns whose stored value isn't the display
// text, e.g. Maintenance's Status filter storing "due-soon" but showing "Due
// soon") plus Sort A→Z / Z→A for that column.
function ColumnFilterModal({ activeCol, filterConfigs, sortConfig, setSortConfig, onClose }) {
  if (!activeCol || !filterConfigs[activeCol]) return null;
  const cfg = filterConfigs[activeCol];
  const getLabel = cfg.labelForOption || (o => o);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            Filter by {cfg.label}
          </div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {cfg.options.map(opt => {
            const isSelected = opt === cfg.value;
            return (
              <button
                key={opt}
                onClick={() => { cfg.setValue(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: C.ink, fontWeight: isSelected ? 600 : 400,
                }}
              >
                {getLabel(opt)}
                {isSelected && <Check size={15} color={C.brand} />}
              </button>
            );
          })}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 12, display: "flex", gap: 6 }}>
          {[["asc", "Sort A → Z"], ["desc", "Sort Z → A"]].map(([dir, lbl]) => {
            const active = sortConfig && sortConfig.key === activeCol && sortConfig.dir === dir;
            return (
              <button
                key={dir}
                onClick={() => { setSortConfig(active ? null : { key: activeCol, dir }); onClose(); }}
                style={{ flex: 1, padding: "7px 10px", background: active ? C.brand : "transparent", color: active ? "#fff" : C.ink, border: `1.5px solid ${active ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
              >
                {lbl}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Everything the Layout tab shows besides the breaker-detail/swap/move-
// circuit modals (those stay in AssetTracker since they're reachable from
// other tabs too, e.g. a Room's "Fed by" link jumps straight into one) —
// the "Fed from" banner, the panel diagram itself, the Add Breaker form, and
// the panel's unassigned-circuit list.
// Pulled out of AssetTracker's ~3700-line body as the first cut at breaking
// that component up; the props list is exactly what this piece touches.
function BreakersTabContent({
  selectedAsset, assets, breakerTypes, showPanelConfig, setShowPanelConfig,
  updatePanelConfig, openBreakerModal, addBreakerDraft, setAddBreakerDraft,
  setShowBreakerTypesManager, addBreaker, isSaving,
  addCircuit, saveCircuitEdit, deleteCircuit, openMoveCircuit,
  canEdit,
}) {
  const feed = assets
    .filter(a => a.type === "Electrical Panel")
    .flatMap(a => (a.breakers || []).map(b => ({ panel: a, breaker: b })))
    .flatMap(({ panel, breaker }) => (breaker.circuits || []).map(c => ({ panel, breaker, circuit: c })))
    .find(({ circuit }) => circuit.feedsPanelLabel === selectedAsset.label);

  const slotCount = parseInt(selectedAsset.panelSlotCount, 10) || 0;
  const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent };
  const inputStyle = { padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, maxWidth: 120 };
  const selectedType = addBreakerDraft ? breakerTypes.find(t => t.id === addBreakerDraft.breakerTypeId) : null;
  const closeAddBreakerForm = () => setAddBreakerDraft(null);
  const unassignedCircuits = selectedAsset.unassignedCircuits || [];
  const otherPanels = assets.filter(a => a.type === "Electrical Panel" && a.label !== selectedAsset.label);

  return (
    <>
      {feed && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 14px", marginBottom: 14, border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, fontSize: 13, color: C.ink }}>
          <Zap size={14} color={C.accent} />
          Fed from <strong style={{ fontWeight: 700, color: C.brandDark }}>{feed.panel.label}</strong>, Slot {cellsLabel_(feed.breaker)}
        </div>
      )}

      {slotCount <= 0 || showPanelConfig ? (
        <PanelConfigForm
          slotCount={selectedAsset.panelSlotCount}
          layout={selectedAsset.panelLayout}
          onSave={(count, lay) => { updatePanelConfig(count, lay); setShowPanelConfig(false); }}
          onCancel={slotCount > 0 ? () => setShowPanelConfig(false) : null}
          isSaving={isSaving}
        />
      ) : (
        <PanelDiagram
          slotCount={slotCount}
          layout={selectedAsset.panelLayout || "two-column"}
          breakers={selectedAsset.breakers || []}
          unassignedCircuits={unassignedCircuits}
          allAssets={assets}
          breakerTypes={breakerTypes}
          panelAsset={selectedAsset}
          panelLabel={selectedAsset.label}
          canEdit={canEdit}
          onReconfigure={() => setShowPanelConfig(true)}
          onSlotClick={id => {
            const list = selectedAsset.breakers || [];
            const b = list.find(x => x.id === id);
            if (!b) return;
            // A click anywhere in a group opens the whole group — every
            // breaker sharing this groupId, not just the one clicked —
            // since a group is one physical breaker-type instance (e.g.
            // a quad or split double-pole) even though it's several rows.
            const members = b.groupId ? list.filter(x => x.groupId === b.groupId) : [b];
            openBreakerModal(id, members);
          }}
          onSpareClick={slot => {
            setAddBreakerDraft({ breakerTypeId: breakerTypes[0] ? breakerTypes[0].id : "", startSlot: String(slot), serial: "", installedDate: "", notes: "", error: null });
          }}
        />
      )}

      {/* Circuits that belong to this panel but aren't wired to a breaker — a
          run that's been pulled and labelled but not landed yet, or one that
          was taken off a breaker without being deleted. They're stored on the
          panel itself (selectedAsset.unassignedCircuits), which is why a
          Circuit now carries its own panelLabel: with no breaker to chain
          through, nothing else records which panel it belongs to.
          Deliberately the same ChildEntityTable, field config, summary and
          Move action as the circuits under a breaker — it's the same entity
          in a different place, not a second kind of circuit. `key` on the
          panel label so navigating between panels can't leave a half-typed
          add form (this component's own internal state) open on the next one. */}
      <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, marginTop: 20, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
        <div style={{ ...labelStyle, marginBottom: 10 }}>
          Unassigned circuits{unassignedCircuits.length > 0 ? ` (${unassignedCircuits.length})` : ""}
        </div>
        <ChildEntityTable
          canEdit={canEdit}
          key={selectedAsset.label}
          items={unassignedCircuits}
          fields={CIRCUIT_TABLE_FIELDS}
          initialDraft={CIRCUIT_TABLE_INITIAL_DRAFT}
          isSaving={isSaving}
          onAdd={draft => addCircuit(null, draft)}
          onSave={(id, draft) => saveCircuitEdit(null, id, draft)}
          onDelete={id => deleteCircuit(null, id)}
          addLabel="Add Circuit"
          emptyMessage="No unassigned circuits on this panel."
          renderCustomFields={(values, setValues) => (
            <CircuitTargetFields values={values} setValues={setValues} assets={assets} otherPanels={otherPanels} />
          )}
          deleteConfirmMessage={circuit => `Delete circuit "${circuit.label}"?`}
          renderSummary={circuit => circuitSummary(circuit, assets)}
          customRowActions={circuit => (
            <button onClick={() => openMoveCircuit(null, circuit)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label={`Move circuit ${circuit.label} onto a breaker`}>
              <ArrowLeftRight size={14} color={C.muted} />
            </button>
          )}
        />
      </div>

      {addBreakerDraft && (
        <div onClick={closeAddBreakerForm} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 16, color: C.brandDark }}>Add Breaker</div>
              <button onClick={closeAddBreakerForm} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 180 }}>
                  <span style={labelStyle}>Breaker Type</span>
                  {breakerTypes.length === 0 ? (
                    <div style={{ fontSize: 13, color: C.empty }}>No breaker types defined yet.</div>
                  ) : (
                    <PickerField
                      label="Breaker Type"
                      hideLabel
                      value={addBreakerDraft.breakerTypeId || ""}
                      onChange={v => setAddBreakerDraft({ ...addBreakerDraft, breakerTypeId: v })}
                      options={breakerTypes.map(t => t.id)}
                      labelForOption={id => {
                        const t = breakerTypes.find(x => x.id === id);
                        return t ? `${t.name} — ${t.slotSpan} slot${t.slotSpan !== 1 ? "s" : ""}, ${t.members.length} breaker${t.members.length !== 1 ? "s" : ""}` : "";
                      }}
                      title="Select breaker type"
                    />
                  )}
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Starting Slot</span>
                  <input type="number" placeholder="e.g. 5" value={addBreakerDraft.startSlot || ""} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, startSlot: e.target.value })} style={inputStyle} />
                </label>
                <button
                  type="button" onClick={() => setShowBreakerTypesManager(true)}
                  style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", padding: "8px 0", color: C.accent, fontSize: 12, fontWeight: 600 }}
                >
                  <Settings size={13} /> Manage types
                </button>
              </div>
              {selectedType && (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  <span style={labelStyle}>Amp rating per breaker (from type — editable)</span>
                  {selectedType.members.map((m, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 13, color: C.muted }}>
                        {m.cells.join("+")} · {new Set(m.cells.map(c => c.slice(0, -1))).size}-pole
                      </span>
                      <input
                        type="number" placeholder={m.ampRating}
                        value={addBreakerDraft[`amp_${i}`] !== undefined ? addBreakerDraft[`amp_${i}`] : m.ampRating}
                        onChange={e => setAddBreakerDraft({ ...addBreakerDraft, [`amp_${i}`]: e.target.value })}
                        style={{ ...inputStyle, maxWidth: 90 }}
                      />
                    </div>
                  ))}
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Serial</span>
                  <input value={addBreakerDraft.serial} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, serial: e.target.value })} placeholder="optional" style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={labelStyle}>Installed</span>
                  <input type="date" value={addBreakerDraft.installedDate} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, installedDate: e.target.value })} style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                  <span style={labelStyle}>Notes</span>
                  <input value={addBreakerDraft.notes} onChange={e => setAddBreakerDraft({ ...addBreakerDraft, notes: e.target.value })} style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }} />
                </label>
              </div>
              {addBreakerDraft.error && <div style={{ fontSize: 13, color: C.danger }}>{addBreakerDraft.error}</div>}
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={closeAddBreakerForm} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                  Cancel
                </button>
                <button
                  onClick={() => {
                    const result = addBreaker(addBreakerDraft);
                    if (result.error) { setAddBreakerDraft({ ...addBreakerDraft, error: result.error }); return; }
                    setAddBreakerDraft(null);
                    openBreakerModal(result.newBreakers[0].id, result.newBreakers);
                  }}
                  disabled={isSaving}
                  style={{ padding: "8px 14px", background: isSaving ? C.border : C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                >
                  {isSaving ? "Saving…" : "Add Breaker"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

// One-time (or reconfigure-on-demand) setup for a panel's physical slot
// layout — total slot count plus a layout preset. Kept separate from the
// generic asset Edit form since it's specific to how the Breakers tab draws
// the diagram, not a general asset field a user would expect in Details.
function PanelConfigForm({ slotCount, layout, onSave, onCancel, isSaving }) {
  const [count, setCount] = useState(slotCount || "");
  const [lay, setLay] = useState(layout || "two-column");
  const valid = count && parseInt(count, 10) > 0;
  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, marginBottom: 20, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>
        {onCancel ? "Reconfigure this panel's slot layout." : "Set up this panel's slot layout to see a visual diagram of where breakers sit."}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
        <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Total Slots</span>
          <input
            type="number" min="1" value={count} onChange={e => setCount(e.target.value)} placeholder="e.g. 24"
            style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
          />
        </label>
        <PickerField
          label="Layout"
          value={lay}
          onChange={setLay}
          options={["two-column", "single-column"]}
          labelForOption={v => (v === "two-column" ? "Two-column (odd left / even right)" : "Single column")}
          title="Select layout"
        />
      </div>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
        {onCancel && (
          <button onClick={onCancel} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
            Cancel
          </button>
        )}
        <button
          onClick={() => onSave(parseInt(count, 10) || 0, lay)}
          disabled={isSaving || !valid}
          style={{ padding: "8px 14px", background: (!isSaving && valid) ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
        >
          {isSaving ? "Saving…" : "Save layout"}
        </button>
      </div>
    </div>
  );
}

// Visual panel schedule — slots laid out per the panel's configured layout
// (two-column odd-left/even-right, or a single column) rather than just a
// flat breaker list. Slot numbers print outside the breaker cells, on the
// side of the panel they'd physically be on (odd left / even right), the
// way a real panel schedule reads — the cells themselves are freed up for
// breaker or feed info via the toggle. A double-pole breaker's two slots
// collapse into one tall cell spanning both rows in its column, still with
// both individual slot numbers printed outside at their own row; a tandem
// pair shares one cell split top/bottom. Clicking a breaker opens that
// specific breaker's detail modal (edit fields + its circuits) — the
// diagram IS the entry point for a breaker's detail, not a map onto a
// separate list.
function fallbackCopyToClipboard(text, onCopied) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); onCopied(); } catch (e) { /* clipboard unavailable — give up silently */ }
  document.body.removeChild(ta);
}

// ── Printed panel directory card ─────────────────────────────────────────────
