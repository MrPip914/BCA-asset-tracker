        <input
          value={nameInput}
          onChange={e => setNameInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && saveUserName(nameInput)}
          placeholder="Your name"
          autoFocus
          style={{ width: "100%", padding: "9px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, marginBottom: 12 }}
        />
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          {currentUser && (
            <button onClick={() => { setShowNamePrompt(false); setNameInput(""); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
              Cancel
            </button>
          )}
          <button
            onClick={() => saveUserName(nameInput)}
            disabled={!nameInput.trim()}
            style={{ padding: "8px 14px", background: nameInput.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            Save
          </button>
        </div>
      </div>
    </div>
  );

  const peripheralsManagerModal = showPeripheralsManager && (
    <ListManagerModal
      title="Manage peripherals"
      items={peripheralsList}
      newValue={newPeripheralName}
      onNewValueChange={setNewPeripheralName}
      onAdd={addPeripheral}
      onRemove={removePeripheral}
      onClose={() => { setShowPeripheralsManager(false); setNewPeripheralName(""); }}
      placeholder="New peripheral name"
    />
  );

  const usersManagerModal = showUsersManager && (
    <ListManagerModal
      title="Manage users"
      items={usersList}
      newValue={newUserName}
      onNewValueChange={setNewUserName}
      onAdd={addUser}
      onRemove={removeUser}
      onClose={() => { setShowUsersManager(false); setNewUserName(""); }}
      placeholder="New user's name"
    />
  );

  const bulkItemTypesManagerModal = showBulkItemTypesManager && (
    <ListManagerModal
      title="Manage bulk item sub-types"
      items={bulkItemTypes}
      newValue={newBulkItemTypeName}
      onNewValueChange={setNewBulkItemTypeName}
      onAdd={addBulkItemType}
      onRemove={removeBulkItemType}
      onClose={() => { setShowBulkItemTypesManager(false); setNewBulkItemTypeName(""); }}
      placeholder="New sub-type, e.g. Folding Chair"
    />
  );

  const typesManagerModal = showTypesManager && (
    <ListManagerModal
      title="Manage asset types"
      items={typesList}
      newValue={newTypeName}
      onNewValueChange={setNewTypeName}
      onAdd={addType}
      onRemove={removeType}
      onClose={() => { setShowTypesManager(false); setNewTypeName(""); }}
      placeholder="New type name"
      isLocked={isLockedType}
      hint="Room, Building, Bulk Item, and Electrical Panel are built into the app and can't be removed."
    />
  );

  // Bespoke (not ListManagerModal) since a BreakerType needs a richer editor —
  // a visual half-cell grid to build each member's footprint — than a flat
  // list of strings can express. List view and the add/edit form share one
  // modal, toggled by whether breakerTypeDraft is set.
  const breakerTypesManagerModal = showBreakerTypesManager && (
    // zIndex 50, above SelectionModal's 40 — same reasoning as ListManagerModal.
    <div
      onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
      style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: breakerTypeDraft ? 480 : 380, maxHeight: "80vh", overflowY: "auto" }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            {breakerTypeDraft ? (breakerTypeDraft.id ? "Edit Breaker Type" : "New Breaker Type") : "Manage Breaker Types"}
          </div>
          <button
            onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
            className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}
          >
            <X size={18} />
          </button>
        </div>

        {breakerTypeError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{breakerTypeError}</div>}

        {!breakerTypeDraft ? (
          <>
            {breakerTypes.length === 0 && <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>No breaker types defined yet.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {breakerTypes.map(t => (
                <div key={t.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: "8px 12px" }}>
                  {confirmDeleteTypeId === t.id ? (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ color: C.danger, fontSize: 13 }}>Delete "{t.name}"?</span>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => setConfirmDeleteTypeId(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                        <button
                          onClick={() => { removeBreakerType(t.id); setConfirmDeleteTypeId(null); }}
                          style={{ padding: "3px 8px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{t.name}</div>
                        <div style={{ fontSize: 12, color: C.muted }}>
                          {t.slotSpan} slot{t.slotSpan !== 1 ? "s" : ""} · {t.members.length} breaker{t.members.length !== 1 ? "s" : ""} · {t.members.map(m => `${m.ampRating || "?"}A`).join(", ")}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => openEditBreakerType(t)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Edit ${t.name}`}>
                          <Pencil size={14} color={C.muted} />
                        </button>
                        <button onClick={() => { setBreakerTypeError(null); setConfirmDeleteTypeId(t.id); }} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Delete ${t.name}`}>
                          <Trash2 size={14} color={C.danger} />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <button
              onClick={openAddBreakerType}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}
            >
              <Plus size={14} /> New Breaker Type
            </button>
          </>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Name</span>
              <input
                value={breakerTypeDraft.name}
                onChange={e => setBreakerTypeDraft({ ...breakerTypeDraft, name: e.target.value })}
                placeholder="e.g. Tandem"
                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
              />
            </label>
            <PickerField
              label="Slot Span"
              value={breakerTypeDraft.slotSpan}
              onChange={changeBreakerTypeSlotSpan}
              options={[1, 2, 3]}
              labelForOption={n => `${n} slot${n !== 1 ? "s" : ""}`}
              title="Select slot span"
            />

            <div>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                Click cells for the breaker you're defining
              </span>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 6 }}>
                {(() => {
                  const takenSet = new Set(breakerTypeDraft.members.flatMap(m => m.cells));
                  return Array.from({ length: breakerTypeDraft.slotSpan }, (_, i) => i + 1).map(slotIdx => (
                    <div key={slotIdx} style={{ display: "flex", gap: 4, alignItems: "center" }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 40 }}>Slot {slotIdx}</span>
                      {["a", "b"].map(half => {
                        const cell = `${slotIdx}${half}`;
                        const taken = takenSet.has(cell);
                        const selected = currentMemberCells.includes(cell);
                        return (
                          <button
                            key={cell} type="button" disabled={taken}
                            onClick={() => toggleBreakerTypeCell(cell)}
                            style={{
                              flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 12, fontWeight: 700,
                              border: `1.5px solid ${selected ? C.brand : C.border}`,
                              background: taken ? C.bg : selected ? C.brand : "#fff",
                              color: taken ? C.placeholder : selected ? "#fff" : C.ink,
                              cursor: taken ? "not-allowed" : "pointer",
                            }}
                          >
                            {cell}{taken ? " ✓" : ""}
                          </button>
                        );
                      })}
                    </div>
                  ));
                })()}
              </div>
            </div>

            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Amp Rating (selected cells)</span>
                <input
                  type="number" placeholder="20" value={currentMemberAmp}
                  onChange={e => setCurrentMemberAmp(e.target.value)}
                  style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                />
              </label>
              <button onClick={addBreakerTypeMember} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600 }}>
                Add Breaker
              </button>
            </div>

            {breakerTypeDraft.members.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Breakers in this type</span>
                {breakerTypeDraft.members.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 10px", fontSize: 13 }}>
                    <span>{m.cells.join("+")} · {m.ampRating}A · {new Set(m.cells.map(c => c.slice(0, -1))).size}-pole</span>
                    <button onClick={() => removeBreakerTypeMember(i)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label="Remove breaker">
                      <X size={13} color={C.placeholder} />
                    </button>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", borderTop: `1px solid ${C.border}`, paddingTop: 14 }}>
              <button onClick={cancelBreakerTypeDraft} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                Cancel
              </button>
              <button onClick={saveBreakerType} style={{ padding: "8px 14px", background: C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                Save Type
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  // Fields to render in a form for the given type: common fields always,
  // type-restricted fields (hostname, screenSize) only when they apply.
  // Status is excluded — it's changed only via the Archive/Restore actions.
  function formColumnsFor(type) {
    return columns.filter(c => fieldAppliesTo(c.key, type) && c.key !== "status");
  }

  // ---------- DETAIL VIEW ----------
  if (view === "detail" && selectedAsset) {
    const Icon = iconFor(selectedAsset.type);
    const comments = [...(selectedAsset.comments || [])].reverse();
    const changeEntries = [...(selectedAsset.changes || [])].reverse();
    const totalLoggedCost = (selectedAsset.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
    const assetAuditEntries = auditLog.filter(e => e.assetLabel === selectedAsset.label).slice().reverse();
    // Never-performed items sort first (need scheduling attention); the rest by
    // ascending next-due date, which naturally puts the most-overdue on top.
    const maintenanceItems = (selectedAsset.maintenanceItems || [])
      .map((item, idx) => ({ item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) }))
      .sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    const overdueMaintenanceCount = maintenanceItems.filter(m => m.status === "overdue").length;
    const titleText = selectedAsset.type === "Bulk Item" && selectedAsset.itemName
      ? `${selectedAsset.itemName} (Bulk Item)`
      : selectedAsset.screenSize ? `${selectedAsset.type} · ${selectedAsset.screenSize}` : selectedAsset.type;
    const visibleDetailColumns = columns.filter(c => fieldAppliesTo(c.key, selectedAsset.type));
    const inheritedBuilding = !fieldAppliesTo("building", selectedAsset.type) ? inferBuilding(selectedAsset, assets) : "";
    const detailGroups = groupDetailColumns(visibleDetailColumns);
    // "label" is excluded here (but not from addFormColumns) — it's the one
    // field the whole app treats as a stable, unique identifier elsewhere
    // (Breaker.panelLabel, Circuit.feedsPanelLabel, Room/Building roomId/
    // buildingId references, the global auditLog's assetLabel matching), so
    // editing it after creation would silently orphan all of those. Picking
    // it before the asset exists (addFormColumns) is fine — nothing
    // references it yet.
    const editFormColumns = formColumnsFor(draft.type).filter(c => c.key !== "label");

    // Contents of a Room: devices located there + bulk-item allocations to it.
    // Contents of a Building: its linked Rooms, the devices in those Rooms, and
    // anything that attaches to the Building directly instead of through a Room.
    // Which assets *are* Rooms/Buildings is an identity question, so those tests
    // still compare type names; which assets *live in* a place is a linkage
    // question, so those go through linkageOf.
    const isPlace = selectedAsset.type === "Room" || selectedAsset.type === "Building";
    let contentDevices = [], contentRooms = [], contentAllocations = [];
    if (selectedAsset.type === "Room") {
      contentDevices = assets.filter(a => linkageOf(a.type) === "room" && a.roomId === selectedAsset.label);
      contentAllocations = assets
        .filter(a => a.type === "Bulk Item")
        .flatMap(b => (b.allocations || []).filter(al => al.roomId === selectedAsset.label).map(al => ({ bulk: b, quantity: al.quantity })));
    } else if (selectedAsset.type === "Building") {
      contentRooms = assets.filter(a => a.type === "Room" && a.buildingId === selectedAsset.label);
      const roomIds = new Set(contentRooms.map(r => r.label));
      // A Condenser (linkage "building") has a buildingId and no roomId at all,
      // so matching only on roomId left it out of its own Building's Contents.
      // Room is the one other building-linked type, and it's excluded here
      // because it's already listed separately above as contentRooms.
      contentDevices = assets.filter(a => (
        linkageOf(a.type) === "room" ? roomIds.has(a.roomId)
        : linkageOf(a.type) === "building" && a.type !== "Room" && a.buildingId === selectedAsset.label
      ));
    }
    const contentsCount = contentDevices.length + contentRooms.length + contentAllocations.length;

    return (
      <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: C.ink }}>
        {globalStyle}
        {nameModal}
        {peripheralsManagerModal}
        {usersManagerModal}
        {bulkItemTypesManagerModal}
        {typesManagerModal}
        {breakerTypesManagerModal}
        <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "12px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={closeDetail} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.brandDark, display: "flex" }} aria-label="Back to list">
            <ArrowLeft size={20} />
          </button>
          <Icon size={17} style={{ color: C.brand, flexShrink: 0 }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, color: C.accent }}>{selectedAsset.label}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: C.brandDark, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{titleText}</div>
        </div>

        <div style={{ display: "flex", gap: 4, padding: "0 20px", borderBottom: `1.5px solid ${C.border}`, position: "sticky", top: 53, background: C.bg, zIndex: 9, overflowX: "auto" }}>
          {[
            { key: "details", label: "Details" },
            ...(isPlace ? [{ key: "contents", label: "Contents", count: contentsCount }] : []),
            ...(selectedAsset.type === "Bulk Item" ? [{ key: "allocations", label: "Allocations", count: (selectedAsset.allocations || []).length }] : []),
            ...(selectedAsset.type === "Electrical Panel" ? [{ key: "breakers", label: "Breakers", count: (selectedAsset.breakers || []).length }] : []),
            { key: "maintenance", label: "Maintenance", count: maintenanceItems.length, urgent: overdueMaintenanceCount > 0 },
            { key: "comments", label: "Comments", count: comments.length },
            { key: "changes", label: "Change Log", count: changeEntries.length },
            { key: "audit", label: "Audit", count: assetAuditEntries.length },
          ].map(tab => {
            const active = detailTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setDetailTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,
                }}
              >
                {tab.label}{tab.count > 0 ? ` (${tab.count})` : ""}
              </button>
            );
          })}
        </div>

        <div style={{ padding: "18px 20px 60px", maxWidth: 720, margin: "0 auto" }}>
          {detailTab === "details" && (!detailEditing ? (
            <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 18, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
              {detailGroups.map((group, gi) => (
                <div key={group.title} style={{ marginTop: gi === 0 ? 0 : 18 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.border}` }}>
                    {group.title}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "14px 20px" }}>
                    {group.columns.map(c => (
                      <Detail
                        key={c.key}
                        label={c.label}
                        value={
                          // Room/Building here are id references to resolve, EXCEPT on a
                          // type whose own display name lives in that field (a Room's
                          // `room`, a Building's `building`) — which is exactly the
                          // types whose linkage isn't "room"/"building" respectively.
                          c.key === "room" && linkageOf(selectedAsset.type) === "room" ? roomNameFor(selectedAsset.roomId, assets)
                          : c.key === "building" && linkageOf(selectedAsset.type) === "building" ? buildingNameFor(selectedAsset.buildingId, assets)
                          : selectedAsset[c.key]
                        }
                        wide={c.key === "notes"}
                      />
                    ))}
                    {group.title === "Location & Assignment" && inheritedBuilding && (
                      <Detail label="Building (via Room)" value={inheritedBuilding} italic />
                    )}
                  </div>
                </div>
              ))}
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                <button onClick={startEditSelected} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                  <Pencil size={15} /> Edit
                </button>
                {selectedAsset.type !== "Room" && selectedAsset.type !== "Building" && (
                  <button
                    onClick={() => duplicateAsset(selectedAsset)}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.brandDark, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10 }}
                  >
                    <Copy size={15} /> Duplicate
                  </button>
                )}
                {(selectedAsset.status || "Active") !== "Archived" ? (

                    <div style={{ display: "flex", flexWrap: "wrap", gap: 16 }}>

                  {confirmDeleteGroup && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "flex-end", marginTop: 12 }}>
                      <span style={{ fontSize: 13, color: C.danger }}>Delete this breaker unit?</span>

                      <button
                        onClick={() => {

                          closeModal();

                  const isEditingAmp = editingMemberId === member.id;
                  const isActive = activeMemberId === member.id;
                  // A lone single-breaker "group" has no "Breaker N — Slot X" title (there's
                  // only ever one member, so it'd be redundant with the modal's own Slot X
                  // header) — rather than leave that space blank next to the edit toggle,

                  const hasTitle = members.length > 1;
                  const ampContent = isEditingAmp ? (
                    <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={labelStyle}>Amp Rating</span>
                        <input type="number" value={ampDraft} onChange={e => patchBreakerModal({ memberAmpDrafts: { ...memberAmpDrafts, [member.id]: e.target.value } })} style={{ ...inputStyle, width: 100 }} />
                      </label>
                      <button
                        onClick={() => patchBreakerModal({ memberAmpDrafts: { ...memberAmpDrafts, [member.id]: member.ampRating || "" }, editingMemberId: null })}

                      >
                        Cancel
                      </button>
                      <button
                        onClick={() => { saveBreakerAmp(member.id, ampDraft); patchBreakerModal({ editingMemberId: null }); }}

                      >
                        Save
                      </button>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={labelStyle}>Amp Rating</span>
                      <span style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{member.ampRating ? `${member.ampRating}A` : "—"}</span>
                      {isActive && (
                        <button onClick={() => patchBreakerModal({ editingMemberId: member.id })} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Edit amp rating">
                          <Pencil size={14} color={C.muted} />

                      )}
                    </div>

                  return (
                    <div key={member.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, marginBottom: 14, background: "#fff" }}>

                        <button
                          onClick={() => patchBreakerModal({
                            activeMemberId: isActive ? null : member.id,
                            editingMemberId: null,
                            addingCircuitFor: null,

                          style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", flexShrink: 0 }}

                      </div>

                              aria-label="Add circuit"

                              <Plus size={14} color={C.muted} />
                            </button>
                          </div>
                          <ChildEntityTable

              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setMoveCircuitModal(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>

                </button>
                <button onClick={submitMoveCircuit} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>

              </div>

          </div>

        {showChangeTypeManager && (
          <ListManagerModal

            items={changeTypes}
            newValue={newChangeTypeName}
            onNewValueChange={setNewChangeTypeName}
            onAdd={addChangeType}
            onRemove={removeChangeType}
            onClose={() => { setShowChangeTypeManager(false); setNewChangeTypeName(""); }}

        {showVendorManager && (

            onAdd={addVendor}
            onRemove={removeVendor}
            onClose={() => { setShowVendorManager(false); setNewVendorName(""); }}
            placeholder="New vendor name"
          />

  const hiddenColumns = columns.filter(c => !isColumnVisible(c));
  const addFormColumns = formColumnsFor(draft.type);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', 'Helvetica Neue', sans-serif", color: C.ink }}>

      {/* Slim header */}
      <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "10px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>

            style={{

          >
            <UserCircle size={14} style={{ color: C.brand }} />
            {currentUser || "Set name"}

          </button>

            <span
              style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.danger }}
              title={`Deployed backend: ${backendScriptVersion}\nExpected: ${FRONTEND_SCRIPT_VERSION}\n\nAssetTrackerSync.gs was edited but the live deployment wasn't updated to match — some saves may silently fail to persist. Redeploy: Apps Script > Deploy > Manage deployments > pencil icon > Version: New version > Deploy.`}

            )}

            <div style={{ position: "relative", flexShrink: 0 }}>
              <button
                onClick={() => setShowToolbarMenu(v => !v)}
                aria-label="More actions"
                className="icon-btn"
                style={{ background: "none", border: "none", padding: 8, borderRadius: 8, color: C.brandDark, display: "flex" }}
              >
                <Menu size={18} />
              </button>
              {showToolbarMenu && (
                <>
                  <div onClick={() => setShowToolbarMenu(false)} style={{ position: "fixed", inset: 0, zIndex: 20 }} />
                  <div style={{ position: "absolute", right: 0, top: "100%", marginTop: 6, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", zIndex: 21, minWidth: 170, overflow: "hidden", padding: 4 }}>
                    <button
                      onClick={() => { setShowToolbarMenu(false); exportToExcel(); }}
                      className="icon-btn"
                      style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 12px", background: "none", border: "none", fontSize: 14, color: C.ink, textAlign: "left", borderRadius: 6 }}
                    >
                      <Download size={15} /> Export
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}
      </div>

      <div style={{ padding: "18px 20px 80px", maxWidth: 1300, margin: "0 auto" }}>
        {mainTab === "assets" && (
        <>
        {/* Add form */}
        {showAdd && (
          <div style={{ border: `1px solid ${C.border}`, background: C.surface, padding: 20, marginBottom: 18, borderRadius: 10, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: C.brandDark }}>Add asset</div>
              <button onClick={cancelAdd} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
              {addFormColumns.map(c => (
                c.key === "type" ? (
                  <TypeField key={c.key} value={draft.type || ""} onChange={v => setDraft({ ...draft, type: v })} typeOptions={typesList} onManage={() => setShowTypesManager(true)} />
                ) : c.key === "room" && linkageOf(draft.type) === "room" ? (
                  <RoomField key={c.key} value={draft.roomId || ""} onChange={v => setDraft({ ...draft, roomId: v })} rooms={roomAssets} />
                ) : c.key === "building" && linkageOf(draft.type) === "building" ? (
                  <BuildingField key={c.key} value={draft.buildingId || ""} onChange={v => setDraft({ ...draft, buildingId: v })} buildings={buildingAssets} />
                ) : c.key === "person" ? (
                  <UserField
                    key={c.key}
                    value={draft.person || ""}
                    onChange={v => setDraft({ ...draft, person: v })}
                    userOptions={usersList}
                    onManage={() => setShowUsersManager(true)}
                  />
                ) : c.key === "peripherals" ? (
                  <PeripheralsField
                    key={c.key}
                    value={draft.peripherals || ""}
                    onChange={v => setDraft({ ...draft, peripherals: v })}
                    options={peripheralsList}
                    onManage={() => setShowPeripheralsManager(true)}
                  />
                ) : c.key === "itemName" ? (
                  <BulkTypeField
                    key={c.key}
                    value={draft.itemName || ""}
                    onChange={v => setDraft({ ...draft, itemName: v })}
                    options={bulkItemTypes}
                    onManage={() => setShowBulkItemTypesManager(true)}
                  />
                ) : (
                  <Field
                    key={c.key}
                    label={c.label}
                    value={draft[c.key] || ""}
                    // Editing the Asset ID clears a stale duplicate-ID error, so
                    // the message never outlives the value it was complaining about.
                    onChange={v => { if (c.key === "label" && addError) setAddError(""); setDraft({ ...draft, [c.key]: v }); }}
                    wide={c.key === "notes"}
                    placeholder={c.key === "screenSize" ? 'e.g. 24"' : undefined}
                    type={c.key === "totalQuantity" ? "number" : undefined}
                  />
                )
              ))}
            </div>
            {addError && <div style={{ fontSize: 13, color: C.danger, marginTop: 12 }}>{addError}</div>}
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button onClick={saveDraft} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.success, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                <Save size={15} /> Save
              </button>
              <button onClick={cancelAdd} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10, color: C.ink }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {userFilter !== "All users" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 10, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Reassign {filtered.filter(a => fieldAppliesTo("person", a.type)).length} filtered asset(s) from <b style={{ color: C.brandDark }}>{userFilter}</b> to:</span>
            <div style={{ flex: "1 1 140px", maxWidth: 220 }}>
              <PickerField
                label="Reassign to user"
                hideLabel
                value={reassignTarget}
                onChange={setReassignTarget}
                options={["", ...usersList.filter(u => u !== userFilter)]}
                placeholder="Select a user…"
                labelForOption={u => u || "Select a user…"}
                title="Select a user"
              />
            </div>
            <button onClick={() => setShowUsersManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Manage users">
              <Settings size={14} color={C.accent} />
            </button>
            <button
              onClick={() => reassignFilteredTo(reassignTarget)}
              disabled={!reassignTarget.trim()}
              style={{ padding: "6px 12px", background: reassignTarget.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
            >
              Reassign
            </button>
          </div>
        )}

        {roomFilter && roomMovable.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 10, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Move {roomMovable.length} filtered device(s) from <b style={{ color: C.brandDark }}>{roomNameFor(roomFilter, assets)}</b> to:</span>
            <div style={{ flex: "1 1 140px", maxWidth: 220 }}>
              <PickerField
                label="Move to room"
                hideLabel
                value={moveTarget}
                onChange={setMoveTarget}
                options={["", ...roomAssets.filter(r => r.label !== roomFilter).map(r => r.label)]}
                placeholder="Select a room…"
                labelForOption={id => (id ? roomNameFor(id, assets) : "Select a room…")}
                title="Select a room"
              />
            </div>
            <button
              onClick={() => moveFilteredTo(moveTarget)}
              disabled={!moveTarget}
              style={{ padding: "6px 12px", background: moveTarget ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
            >
              Move
            </button>
          </div>
        )}

        {/* Table */}
        <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", background: C.surface, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
          <div className="scroller" style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: gridTemplate, background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
              {visibleColumns.map((c, i) => {
                return (
                  <ColumnHeaderCell
                    key={c.key}
                    label={c.label}
                    colKey={c.key}
                    sticky={i === 0}
                    filterConfigs={filterConfigs}
                    sortConfig={sortConfig}
                    setSortConfig={setSortConfig}
                    onOpenFilter={setActiveFilterCol}
                  />
                );
              })}
              <div style={{ padding: "10px 14px" }} />
            </div>

            {filtered.length === 0 && (
              <div style={{ padding: 32, textAlign: "center", color: C.empty, fontSize: 14, minWidth: "max-content" }}>No assets match your search.</div>
            )}

            {filtered.map(a => (
              <div
                key={a.label}
                className="row-body"
                onClick={() => openDetail(a)}
                style={{ display: "grid", gridTemplateColumns: gridTemplate, alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
              >
                {visibleColumns.map((c, i) => {
                  const isTypeCol = c.key === "type";
                  const Icon = isTypeCol ? iconFor(a.type) : null;
                  const applies = fieldAppliesTo(c.key, a.type);
                  // A Room's `room` / a Building's `building` is that asset's own
                  // display name, not an id to resolve — so only resolve when the
                  // type actually links that way (see linkageOf).
                  const linkage = linkageOf(a.type);
                  const isRoomCol = c.key === "room" && applies && linkage === "room";
                  const isBuildingCol = c.key === "building" && applies && linkage === "building";
                  const isInferredBuilding = c.key === "building" && !applies;
                  const inferredValue = isInferredBuilding ? inferBuilding(a, assets) : "";
                  return (
                    <div
                      key={c.key}
                      style={{
                        padding: "12px 14px",
                        fontSize: c.key === "label" ? 12 : 13,
                        fontFamily: c.key === "label" ? "'IBM Plex Mono', monospace" : undefined,
                        fontWeight: c.key === "label" ? 600 : isTypeCol ? 500 : 400,
                        fontStyle: isInferredBuilding && inferredValue ? "italic" : "normal",
                        color: c.key === "label" ? C.accent : (applies || (isInferredBuilding && inferredValue)) ? C.muted : C.border,
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        display: "flex", alignItems: "center", gap: 8,
                        position: i === 0 ? "sticky" : "static",
                        left: i === 0 ? 0 : undefined,
                        background: i === 0 ? C.surface : "transparent",
                        zIndex: i === 0 ? 2 : "auto",
                      }}
                      title={isInferredBuilding && inferredValue ? "Inherited via this asset's Room" : undefined}
                    >
                      {Icon && <Icon size={15} style={{ flexShrink: 0, color: C.brand }} />}
                      {isTypeCol && a.type === "Bulk Item" ? (
                        <>
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.itemName || "Bulk Item"}</span>
                          <span style={{ flexShrink: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, fontWeight: 700, letterSpacing: 0.5, color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 3, padding: "1px 4px" }}>
                            BULK
                          </span>
                        </>
                      ) : isTypeCol && a.type === "Building" ? (
                        a.building || "Building"
                      ) : isTypeCol && a.type === "Room" ? (
                        a.room || "Room"
                      ) : isRoomCol ? (
                        roomNameFor(a.roomId, assets) || "—"
                      ) : isBuildingCol ? (
                        buildingNameFor(a.buildingId, assets) || "—"
                      ) : (
                        applies ? (a[c.key] || "—") : isInferredBuilding ? (inferredValue || "") : ""
                      )}
                    </div>
                  );
                })}
                <div style={{ display: "flex", justifyContent: "center", padding: "12px 8px" }}>
                  <ChevronRight size={15} style={{ color: C.placeholder }} />
                </div>
              </div>
            ))}
          </div>
        </div>
        </>
        )}

        {mainTab === "maintenance" && (
        <>
          {maintenanceOverdueTotal > 0 && (
            <div style={{ marginBottom: 18 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 700, color: C.danger }}>
                {maintenanceOverdueTotal} overdue
              </span>
            </div>
          )}

          <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", background: C.surface, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
            <div className="scroller" style={{ overflowX: "auto" }}>
              <div style={{ display: "grid", gridTemplateColumns: "220px 170px 110px 130px 130px 130px 120px", background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
                {[
                  { key: "task", label: "Task" },
                  { key: "asset", label: "Asset" },
                  { key: "frequency", label: "Frequency" },
                  { key: "owner", label: "Owner" },
                  { key: "lastPerformed", label: "Last Performed" },
                  { key: "nextDue", label: "Next Due" },
                  { key: "status", label: "Status" },
                ].map(c => (
                  <ColumnHeaderCell
                    key={c.key}
                    label={c.label}
                    colKey={c.key}
                    filterConfigs={maintenanceFilterConfigs}
                    sortConfig={maintenanceSortConfig}
                    setSortConfig={setMaintenanceSortConfig}
                    onOpenFilter={setActiveMaintenanceFilterCol}
                  />
                ))}
              </div>

              {filteredMaintenanceRows.length === 0 && (
                <div style={{ padding: 32, textAlign: "center", color: C.empty, fontSize: 14, minWidth: "max-content" }}>
                  {allMaintenanceRows.length === 0 ? "No maintenance scheduled yet." : "No scheduled items match your search."}
                </div>
              )}

              {filteredMaintenanceRows.map(({ asset, assetName, item, idx, status, due }) => {
                const statusMeta = {
                  overdue: { label: "Overdue", color: C.danger },
                  "due-soon": { label: "Due soon", color: C.accent },
                  ok: { label: "On track", color: C.success },
                  never: { label: "Not yet done", color: C.muted },
                }[status];
                const AssetIcon = iconFor(asset.type);
                return (
                  <div
                    key={`${asset.label}-${idx}`}
                    className="row-body"
                    onClick={() => openDetail(asset, "maintenance")}
                    style={{ display: "grid", gridTemplateColumns: "220px 170px 110px 130px 130px 130px 120px", alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
                  >
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.task}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted, display: "flex", alignItems: "center", gap: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      <AssetIcon size={14} style={{ flexShrink: 0, color: C.brand }} />
                      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{assetName}</span>
                    </div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted }}>{item.frequencyLabel}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.owner || "—"}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, color: C.muted }}>{item.lastPerformed ? formatDateOnly(item.lastPerformed) : "Never"}</div>
                    <div style={{ padding: "12px 14px", fontSize: 13, fontWeight: 600, color: statusMeta.color }}>{due ? formatDateOnly(due.toISOString().slice(0, 10)) : "—"}</div>
                    <div style={{ padding: "12px 14px" }}>
                      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: statusMeta.color }}>
                        {statusMeta.label}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </>
        )}
      </div>

      {/* Column header filter modal */}
      <ColumnFilterModal
        activeCol={activeFilterCol}
        filterConfigs={filterConfigs}
        sortConfig={sortConfig}
        setSortConfig={setSortConfig}
        onClose={() => setActiveFilterCol(null)}
      />
      <ColumnFilterModal
        activeCol={activeMaintenanceFilterCol}
        filterConfigs={maintenanceFilterConfigs}
        sortConfig={maintenanceSortConfig}
        setSortConfig={setMaintenanceSortConfig}
        onClose={() => setActiveMaintenanceFilterCol(null)}
      />

      {/* Column manager modal */}
      {showColManager && (
        <div onClick={() => setShowColManager(false)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:340, maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Columns</div>
              <button onClick={() => setShowColManager(false)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>Hostname and Screen Size only apply to some types — they'll show blank for others.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {columns.map(c => (
                <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 8, opacity: c.locked ? 0.6 : 1 }}>
                    <input type="checkbox" checked={isColumnVisible(c)} disabled={c.locked} onChange={() => toggleColumnVisible(c.key)} />
                    {c.label} {c.locked && <Lock size={11} />}
                  </label>
                  {c.custom && (
                    <button onClick={() => setConfirmDeleteCol(c.key)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
              <input
                value={newColName}
                onChange={e => setNewColName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addColumn()}
                placeholder="New column name"
                style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
              />
              <button onClick={addColumn} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Delete column confirm */}
      {confirmDeleteCol && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 360 }}>
            <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove "{columns.find(c => c.key === confirmDeleteCol)?.label}" column?</div>
            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This deletes that field's data from every asset. This can't be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteCol(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
              <button onClick={() => removeColumn(confirmDeleteCol)} style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>Remove</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Field({ label, value, onChange, placeholder, wide, type }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>{label}</span>
      <input
        type={type || "text"}
        inputMode={type === "number" ? "numeric" : undefined}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
      />
    </label>
  );
}

function PickerTrigger({ value, placeholder, onClick, ariaLabel }) {
  return (
    <button
      type="button"
      onClick={onClick}
      aria-label={ariaLabel}
      style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
        padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10,
        color: value ? C.ink : C.empty, background: "#fff", textAlign: "left",
      }}
    >
      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{value || placeholder}</span>
      <ChevronDown size={14} color={C.muted} style={{ flexShrink: 0, marginLeft: 6 }} />
    </button>
  );
}

function TypeField({ value, onChange, typeOptions, onManage }) {
  const [open, setOpen] = useState(false);
  const options = typeOptions.includes(value) || !value ? typeOptions : [value, ...typeOptions];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Type
        {onManage && (
          <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage asset types">
            <Settings size={12} color={C.accent} />
          </button>
        )}
      </span>
      <PickerTrigger value={value} placeholder="Select…" onClick={() => setOpen(true)} ariaLabel="Select type" />
      {open && (
        <SelectionModal
          title="Select type"
          options={options}
          value={value}
          onChange={onChange}
          onClose={() => setOpen(false)}
          onManage={onManage}
          manageLabel="Manage asset types"
        />
      )}
    </label>
  );
}

// `value` is a Room asset's stable `label` (id), not its display name — same
// reasoning as roomNameFor/buildingNameFor: storing the id instead of the
// mutable name means renaming a Room needs no cascade elsewhere.
function RoomField({ value, onChange, rooms }) {
  const [open, setOpen] = useState(false);
  const placeholder = rooms.length ? "Select a room…" : "No Room assets yet";
  const nameForId = id => {
    if (!id) return placeholder;
    const room = rooms.find(r => r.label === id);
    return room ? room.room : "(deleted room)";
  };
  const ids = rooms.map(r => r.label);
  const options = !value || ids.includes(value) ? ids : [value, ...ids];
  const withClear = ["", ...options];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Room</span>
      <PickerTrigger value={value ? nameForId(value) : ""} placeholder={placeholder} onClick={() => setOpen(true)} ariaLabel="Select room" />
      {open && (
        <SelectionModal
          title="Select room"
          options={withClear}
          value={value || ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
          labelForOption={nameForId}
        />
      )}
    </label>
  );
}

function BuildingField({ value, onChange, buildings }) {
  const [open, setOpen] = useState(false);
  const placeholder = buildings.length ? "Select a building…" : "No Building assets yet";
  const nameForId = id => {
    if (!id) return placeholder;
    const building = buildings.find(b => b.label === id);
    return building ? building.building : "(deleted building)";
  };
  const ids = buildings.map(b => b.label);
  const options = !value || ids.includes(value) ? ids : [value, ...ids];
  const withClear = ["", ...options];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Building</span>
      <PickerTrigger value={value ? nameForId(value) : ""} placeholder={placeholder} onClick={() => setOpen(true)} ariaLabel="Select building" />
      {open && (
        <SelectionModal
          title="Select building"
          options={withClear}
          value={value || ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
          labelForOption={nameForId}
        />
      )}
    </label>
  );
}

// Generic single-select field styled like TypeField/RoomField/BuildingField above —
// a PickerTrigger button that opens a SelectionModal — for any plain string/number
// enum (Frequency, Change Type, Vendor, Status, ...) instead of a native <select>,
// so every single-select field in the app looks and behaves the same way. To allow
// clearing back to unselected, the caller prepends "" to `options` itself (see
// BulkTypeField below) and maps it to a placeholder like "Select…" via labelForOption.
function PickerField({ label, value, onChange, options, placeholder = "Select…", labelForOption, onManage, manageLabel, title, emptyLabel, wide, hideLabel }) {
  const [open, setOpen] = useState(false);
  const getLabel = labelForOption || (o => o);
  const displayValue = value !== "" && value != null ? getLabel(value) : "";
  const Wrapper = hideLabel ? "div" : "label";
  return (
    <Wrapper style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      {!hideLabel && (
        <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
          {label}
          {onManage && (
            <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label={manageLabel || `Manage ${label}`}>
              <Settings size={12} color={C.accent} />
            </button>
          )}
        </span>
      )}
      <PickerTrigger value={displayValue} placeholder={placeholder} onClick={() => setOpen(true)} ariaLabel={`Select ${label}`} />
      {open && (
        <SelectionModal
          title={title || `Select ${label}`}
          options={options}
          value={value ?? ""}
          onChange={onChange}
          onClose={() => setOpen(false)}
          labelForOption={labelForOption}
          emptyLabel={emptyLabel}
          onManage={onManage}
          manageLabel={manageLabel}
        />
      )}
    </Wrapper>
  );
}

function BulkTypeField({ value, onChange, options, onManage }) {
  // Include the current value even if it's not in the managed list (legacy/custom
  // data), so editing never silently drops it.
  const allOptions = !value || options.includes(value) ? options : [value, ...options];
  return (
    <PickerField
      label="Sub-type"
      value={value || ""}
      onChange={onChange}
      options={["", ...allOptions]}
      placeholder={options.length ? "Select…" : "No sub-types yet — add one"}
      labelForOption={o => (o ? o : (options.length ? "Select…" : "No sub-types yet — add one"))}
      onManage={onManage}
      manageLabel="Manage bulk item sub-types"
      title="Select sub-type"
    />
  );
}

function UserField({ value, onChange, userOptions, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom names already on this asset that aren't in the
  // managed list, so editing never silently drops someone.
  const allOptions = [...userOptions, ...selected.filter(s => !userOptions.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        User{selected.length > 1 ? "s" : ""}
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage users">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No users defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PeripheralsField({ value, onChange, options, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom values already on this asset that aren't in the managed list,
  // so editing never silently drops data.
  const allOptions = [...options, ...selected.filter(s => !options.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Peripherals
        <button onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage peripherals">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No peripherals defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
