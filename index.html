<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCA Asset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>

<!-- Import map: lets the app's plain "import X from 'react'" style statements
     resolve to real packages served over CDN, with no bundler/build step. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>

<!-- Babel Standalone: transpiles the JSX/ESM below in the browser at load time. -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- Google Identity Services — the "Sign in with Google" button and the ID token
     it mints. Loaded as a plain classic script (not through the import map)
     because it registers the global `google.accounts.id` that the app polls for
     on mount. Deliberately NOT async/defer: Babel transpiles the module below
     at load time, which takes long enough that this has always resolved first,
     and waiting on it explicitly (see waitForGoogleIdentity) covers the case
     where it hasn't. -->
<script src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import ReactDOM from "react-dom/client";
import { createPortal } from "react-dom";

import React, { useState, useEffect, useMemo, useRef } from "react";
import * as XLSX from "xlsx";
import {
  Search, Plus, X, Pencil, Trash2, Save, ChevronRight, ChevronDown, ArrowLeft, MessageSquare,
  Monitor, Phone, Tv, Camera, HardDrive, HelpCircle, Columns3, Lock, Filter, Check, DoorOpen, Download,
  Wrench, UserCircle, Settings, History, Archive, ArchiveRestore, Building2, Package, Copy, Zap, Repeat, ArrowLeftRight, Menu,
  FlaskConical, RotateCcw, AlertTriangle, Loader2, Printer, MapPin, QrCode,
} from "lucide-react";

// Starter managed peripherals/users/bulk-item-type lists — empty until the school
// builds them up via the "manage" (gear icon) UI, or they arrive from the Sheet on load.
const DEFAULT_PERIPHERALS = [];
const DEFAULT_USERS = [];
const DEFAULT_BULK_ITEM_TYPES = [];

// ---------- TYPE REGISTRY ----------
// The single place describing everything the app knows about a *structurally*
// special asset type. This used to be spread across TYPE_OPTIONS, LOCKED_TYPES,
// TYPE_ONLY_FIELDS, five separate *_EXCLUDED_FIELDS arrays, CATEGORY_ICONS, and a
// scattering of `asset.type === "Room"`-style tests at render sites — so adding a
// structurally new type meant remembering to edit all of them, in the right
// places, with nothing to catch a miss. Now it's one entry here.
//
// Each entry may declare:
//   locked         — can't be removed from the managed type list (isLockedType()).
//                    These have deep structural dependencies elsewhere (field
//                    rules, Contents/Allocations/Breakers tabs, inferBuilding())
//                    that a plain managed-list removal would silently break.
//   icon           — lucide icon for list rows / the detail header. Default is
//                    HelpCircle (see iconFor()).
//   excludedFields — column keys this type doesn't get at all.
//   onlyFields     — column keys that belong to THIS type. Any key named in any
//                    entry's onlyFields becomes restricted app-wide (see
//                    restrictedFields() below): no type that doesn't name it gets it.
//   (There is deliberately no `nameField` key. Every asset carries one optional
//    `name` field instead — see nameOf() — so a type does not declare where its
//    name lives, and a user-created type gets a real name with no registry
//    change at all.)
//   parentTypes    — which types this type may sit INSIDE, as an array of type
//                    names. This is what render sites branch on instead of
//                    comparing type names, and it replaced `linkage` (the old
//                    "room"/"building"/"allocations"/"none" enum) when the fixed
//                    roomId/buildingId pair collapsed into one `parentId`. A
//                    Computer names ["Room"], a Condenser ["Building"] (an
//                    outdoor unit sits in no particular Room), a Room
//                    ["Building", "Room"] — naming its own type is what lets a
//                    closet nest inside a classroom, i.e. what makes the chain
//                    arbitrarily deep instead of the two fixed levels the old
//                    room/building fields could express.
//                    An EMPTY array means "takes no parent at all", and covers
//                    two genuinely different cases that need no distinction
//                    anywhere: a Building is the top of the tree, and a Bulk
//                    Item has no single place at all (it spreads a quantity
//                    across rooms via its own allocations[] — see the Allocations
//                    tab, which is deliberately NOT parent/child).
//                    Every entry declares this explicitly, including the plain
//                    devices, so `parentTypes || []` never has to guess what an
//                    omission meant — an omission on a REGISTERED type is a
//                    mistake, whereas an unregistered type legitimately falls
//                    back to DEFAULT_PARENT_TYPES.
//   modules        — the extra detail TABS this type owns, beyond the ones every
//                    asset has (Details/Maintenance/Comments/Change Log/Audit).
//                    Names entries in ASSET_MODULES below, which say what each
//                    module is called and how to count it. A Bulk Item owns
//                    ["allocations"], an Electrical Panel ["breakers"]; Doors
//                    will own ["locks"] when that module exists.
//                    This replaced a per-module `type === "Electrical Panel"`
//                    test repeated at the tab list, the tab body, and the
//                    default-tab choice — three places to remember for every new
//                    module, with nothing to catch a miss.
//   defaultTab     — which tab opens first (openDetail). Only worth setting when
//                    the Details tab isn't the useful landing place: opening a
//                    panel to anything but its Layout wastes a click every time.
//                    Defaults to "details".
//
// Types added at runtime via the gear-icon type manager are deliberately NOT in
// here — they're generic devices, and every lookup below falls back to exactly
// that: no icon, no field rules, DEFAULT_PARENT_TYPES.
const DEFAULT_PARENT_TYPES = ["Room"];
const TYPE_REGISTRY = {
  Computer: { icon: HardDrive, parentTypes: ["Room"], onlyFields: ["hostname"] },
  Monitor: { icon: Monitor, parentTypes: ["Room"], onlyFields: ["screenSize"] },
  Phone: { icon: Phone, parentTypes: ["Room"] },
  TV: { icon: Tv, parentTypes: ["Room"], onlyFields: ["screenSize"] },
  DocuCam: { icon: Camera, parentTypes: ["Room"] },
  "Stream Deck": { parentTypes: ["Room"] },
  "Mini Split": { parentTypes: ["Room"] },
  // An outdoor unit doesn't sit inside any one Room, so it sits directly in a
  // Building instead of inheriting one through a Room like every other device.
  Condenser: { parentTypes: ["Building"] },
  // A Room is a space, not a device — no brand/model/serial/etc. It sits in the
  // Building it's in, or inside another Room (a closet within a classroom).
  Room: {
    locked: true, icon: DoorOpen, parentTypes: ["Building", "Room"],
    excludedFields: ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"],
  },
  // One level up from a Room, with even less in common with a device asset.
  Building: {
    locked: true, icon: Building2, parentTypes: ["Campus"],
    excludedFields: ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"],
  },
  // A site — a group of Buildings, and the top of the tree. Added once the app
  // had to describe more than one location (the school itself plus a separate
  // residence), which the old fixed Building→Room pair couldn't express at all.
  // That it was a one-entry change here, plus a column and a backend field, is
  // the parent chain paying for itself: nothing else in the app needed telling
  // that the world got a level deeper.
  Campus: {
    locked: true, icon: MapPin, parentTypes: [],
    excludedFields: ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"],
  },
  // Tables, chairs... not individually tagged or tied to one room — a pooled
  // quantity, distributed across rooms via the Allocations tab instead. That
  // distribution is explicitly not parent/child, hence no parentTypes.
  // `subType` is its sub-type, picked from the managed bulkItemTypes list
  // (e.g. "Folding Chair", "Cafeteria Table"). Stored as `itemName` before v24;
  // see adoptLegacySubType.
  "Bulk Item": {
    locked: true, icon: Package, parentTypes: [], onlyFields: ["totalQuantity", "subType"],
    excludedFields: ["hostname", "screenSize", "peripherals", "serial", "person"],
    modules: ["allocations"],
  },
  // Otherwise device-like (real brand/model/serial, purchase date, warranty, room
  // placement) — it just doesn't have peripherals like a computer does.
  "Electrical Panel": {
    locked: true, icon: Zap, parentTypes: ["Room"], excludedFields: ["peripherals"],
    modules: ["breakers"], defaultTab: "breakers",
  },
  Other: { parentTypes: ["Room"] },
};

// The icons a user can pick for a type, by name. A name rather than a component
// because a setting has to survive JSON: the component is looked up here at
// render time (see iconFor). Deliberately a small curated set — every one is
// already imported at the top of this file, so the picker can't reference an
// icon the app doesn't bundle, and a stored name that isn't here falls back to
// the shipped icon rather than rendering nothing.
const TYPE_ICON_CHOICES = {
  Computer: HardDrive, Monitor, Phone, TV: Tv, Camera, Printer, Package, Zap,
  Door: DoorOpen, Building: Building2, Campus: MapPin, Wrench, Lock, Archive,
  Unknown: HelpCircle,
};

// Starter/fallback type list for a brand-new sheet, in registry order. The live
// list is managed via the gear icon on the Type field (persisted as Config's
// `typesList`) and can hold types that aren't in the registry at all.
const TYPE_OPTIONS = Object.keys(TYPE_REGISTRY);

// A TYPE IS REFERENCED BY ID, NEVER BY THE NAME PEOPLE READ.
//
// `asset.type` holds a type's `id`, and so does every `parentTypes` entry and
// every key in TYPE_REGISTRY. The id never changes; the `name` beside it is
// ordinary editable text. That split is what makes renaming a type free: with
// the name stored on every asset, "Computer" → "Workstation" would have to
// rewrite every asset that said Computer plus every type that named it as a
// possible parent — the same rename cascade the id migration removed for Rooms
// (see CLAUDE.md's reference conventions), and the reason it wasn't offered.
//
// A BUILT-IN TYPE'S ID IS ITS ORIGINAL NAME — Room's id is the string "Room".
// That looks like the thing this is meant to avoid and is the opposite: it means
// every asset already on the sheet is already storing a valid id, so this needs
// NO data migration and NO backend change, and every identity test the app
// already makes (`a.type === "Room"`, which CLAUDE.md keeps as legitimate) keeps
// working untouched. Only types created from here on get a generated id, since
// only they have no historical name to preserve.
const DEFAULT_TYPES = TYPE_OPTIONS.map(id => ({ id, name: id }));

// Reads a type list saved before types had ids — a plain array of name strings —
// as the object form. Same shape of fix as adoptLegacyParentage/adoptLegacyNames:
// applied on load, so nothing past loadData ever sees the old form, and the same
// build is correct against a migrated Config blob and an un-migrated one. The
// name becomes the id, which is exactly right: that string is what every asset
// is already storing.
function adoptLegacyTypesList(list) {
  return (list || []).map(t => (typeof t === "string" ? { id: t, name: t } : t));
}

// USER-EDITED TYPE SETTINGS, LAYERED OVER THE SHIPPED DEFAULTS.
//
// TYPE_REGISTRY is what the app ships with and is never written to. What the
// user changes in the type editor lives in Config under `typeSettings`, keyed by
// type id, and is merged ON TOP of the registry entry at read time. So a
// built-in type keeps working if its settings row is missing or is thrown away,
// and "reset to default" is just deleting the override.
//
// WHY THIS IS A MODULE-LEVEL VARIABLE AND NOT REACT STATE. `fieldAppliesTo`,
// `isPlaceType`, `parentTypesFor` and friends are plain functions called from
// something like a hundred render sites, several of them per table cell.
// Threading the settings through all of them would be a very large diff for no
// behavioural gain, so instead `applyTypeSettings` sets this one variable.
//
// The hazard that creates, stated plainly: React does not know this changed, so
// setting it does NOT by itself re-render anything. It is safe only because
// every write goes through persist(), which calls setTypesSettings and so
// re-renders anyway — and applyTypeSettings is called BEFORE that setState, so
// the render that follows reads the new values. Anything that changes these
// settings without a setState will silently show stale rules; don't add one.
let TYPE_SETTINGS = {};
// The two app-wide sets derived from every entry at once. Recomputed when the
// settings change rather than on every call, since fieldAppliesTo runs per cell.
let DERIVED_TYPE_SETS = { restrictedFields: new Set(), placeTypes: new Set() };
// The column list, mirrored here for the same reason TYPE_SETTINGS is: a custom
// column created AS a per-type field carries `restricted: true`, and
// fieldAppliesTo has to know that without being handed the columns at every one
// of its call sites.
let TYPE_FIELD_COLUMNS = [];
function recomputeDerivedTypeSets() {
  const ids = new Set([...Object.keys(TYPE_REGISTRY), ...Object.keys(TYPE_SETTINGS)]);
  const restricted = new Set();
  const places = new Set();
  ids.forEach(id => {
    const entry = typeEntryFor(id) || {};
    (entry.onlyFields || []).forEach(k => restricted.add(k));
    (entry.parentTypes || []).forEach(t => places.add(t));
  });
  // A per-type field is restricted by a flag on the COLUMN, not by whoever
  // currently claims it in onlyFields. Otherwise unticking it from its last
  // owner would make it an ordinary common field and it would appear on every
  // type at once — the opposite of what "field for this type" means.
  TYPE_FIELD_COLUMNS.forEach(c => { if (c && c.restricted && c.key) restricted.add(c.key); });
  DERIVED_TYPE_SETS = { restrictedFields: restricted, placeTypes: places };
}
function applyTypeSettings(next, columns) {
  TYPE_SETTINGS = next && typeof next === "object" ? next : {};
  if (Array.isArray(columns)) TYPE_FIELD_COLUMNS = columns;
  recomputeDerivedTypeSets();
}
// Populate the derived sets from the shipped registry alone, so they're correct
// before any Config has loaded. An empty column list, not DEFAULT_COLUMNS: that
// const is declared further down this file and reading it here would be a
// temporal-dead-zone error — and no custom column exists at module load anyway.
applyTypeSettings({}, []);

// The effective settings for a type: shipped defaults with the user's overrides
// on top. Null for a type that is neither registered nor customised — i.e. a
// plain user-created type, which is exactly the generic-device fallback every
// helper below already had.
function typeEntryFor(typeId) {
  const base = TYPE_REGISTRY[typeId];
  const over = TYPE_SETTINGS[typeId];
  if (!base && !over) return null;
  return { ...(base || {}), ...(over || {}) };
}
// Is this type's setting user-modified? Drives the editor's "Reset to default".
function typeHasOverrides(typeId) {
  return !!TYPE_SETTINGS[typeId];
}

// What a type is CALLED. Falls back to the id, which covers an asset whose type
// was removed from the managed list — the id is the original name for a built-in
// and a raw uuid for a user-created one, but showing something beats showing
// nothing, and the asset's Type field is where it gets corrected.
function typeNameOf(typeId, typesList) {
  const found = (typesList || []).find(t => t.id === typeId);
  return found ? found.name : (typeId || "");
}

// Locked types can't be removed in the type manager (see `locked` above).
function isLockedType(typeId) {
  return !!TYPE_REGISTRY[typeId]?.locked;
}
// Puts back any locked type missing from a stored type list, in registry order,
// so a list saved before a new structural type existed still offers it. See the
// call site in loadData for why only LOCKED types are restored. A locked type
// restored this way gets its default name; one the user has since renamed is
// already present by id, so its name is left alone.
function ensureLockedTypes(list) {
  const have = new Set(list.map(t => t.id));
  const missing = TYPE_OPTIONS.filter(id => isLockedType(id) && !have.has(id));
  if (missing.length === 0) return list; // reference-stable: persist()'s _dirty check compares by identity
  return [...list, ...missing.map(id => ({ id, name: id }))];
}
// Which types an asset of `type` may sit inside — the only thing render sites
// should branch on, instead of comparing type names. A REGISTERED type always
// declares this (an empty array meaning "takes no parent"), so `|| []` would be
// wrong here: it would silently turn a forgotten key into "takes no parent"
// rather than a visible mistake. Only an UNREGISTERED (user-added) type falls
// back, and it falls back to a generic room-dwelling device.
function parentTypesFor(type) {
  const entry = typeEntryFor(type);
  return entry ? (entry.parentTypes || []) : DEFAULT_PARENT_TYPES;
}
// Does this type take a parent at all? False for a Building (top of the tree)
// and a Bulk Item (spreads across rooms via allocations instead) — the two cases
// that render no Parent field and are never "Unassigned", because having no
// parent is their correct and permanent state, not a gap to fill in.
function typeTakesParent(type) {
  return parentTypesFor(type).length > 0;
}
// May an asset of `childType` sit inside one of `parentType`? The single rule
// the app enforces; storage itself stays permissive (see CLAUDE.md), so this is
// also what flags parentage that arrived from a hand-edited sheet or a script.
function canBeParentOf(parentType, childType) {
  return parentTypesFor(childType).includes(parentType);
}

// The types that can CONTAIN something — derived from what every other type
// names as a possible parent, not declared as a second list. So Campus, Building
// and Room are places because something says it can sit in them, and a new kind
// of place becomes one the moment anything can go inside it.
//
// This replaced a hardcoded `type === "Room" || type === "Building"` at the
// Contents tab, which silently would NOT have included Campus — adding a level
// above Building would have left campuses with no Contents tab and no way to see
// what's on them. Deriving it is also the cheapest possible version of the
// "move place-ness into the type settings" work, done here because Campus forced
// the issue rather than as a refactor pass of its own.
// Derived from every type's parentTypes, INCLUDING user overrides, so making a
// type able to hold something turns that something into a place immediately.
function isPlaceType(type) {
  return DERIVED_TYPE_SETS.placeTypes.has(type);
}

// What each sub-item module IS — its tab label and how to count what's in it.
// The registry's `modules` says which types OWN a module; this says what the
// module means. Two halves of the same question kept apart on purpose: whether
// a Door has locks is a fact about Doors, while what a "locks" tab is called and
// counts is a fact about the locks module, and a second type owning locks
// shouldn't mean restating the label.
//
// Adding a module is now: one entry here, one name in the owning type's
// `modules`, and one render branch for its body. Nothing else needs telling.
//
// "Contents" is deliberately NOT in here. Every other module is DECLARED by the
// types that own it; contents is DERIVED — a type has it when anything can sit
// inside it (isPlaceType), which falls out of parentTypes. Listing it here would
// mean maintaining by hand a fact the registry already computes, and Campus
// would have needed adding to that list to get a Contents tab at all.
const ASSET_MODULES = {
  allocations: {
    label: "Allocations",
    count: asset => (asset.allocations || []).length,
  },
  breakers: {
    // Label says "Layout" because the tab covers more than breakers now (the
    // panel diagram plus the unassigned-circuit list), but the KEY stays
    // "breakers" on purpose: it's what ?asset=...&tab=breakers deep links
    // already in circulation carry, and what openDetail() defaults a panel to.
    // Renaming it would silently break every previously-copied panel link.
    // The count is breakers + unassigned circuits — both are things this tab
    // holds, and counting only breakers would show "(0)" on a panel whose whole
    // content is a pile of circuits waiting to be wired.
    label: "Layout",
    count: asset => (asset.breakers || []).length + (asset.unassignedCircuits || []).length,
  },
};

// Which sub-item modules this type owns. An unregistered (user-added) type owns
// none — it's a plain device.
// Not user-editable: a module needs a render branch for its tab body, so it
// can't be turned on by data alone. Read through the merged entry anyway, so
// the day one becomes settable nothing here has to change.
function modulesFor(type) {
  return typeEntryFor(type)?.modules || [];
}
// Does this type own a given module? The one thing render sites should ask,
// rather than naming the type that happens to own it today.
function hasModule(type, moduleKey) {
  return modulesFor(type).includes(moduleKey);
}
// Which detail tab opens first for this type.
function defaultTabFor(type) {
  return typeEntryFor(type)?.defaultTab || "details";
}

// Every tab this type gets, in display order — the common ones every asset has,
// plus Contents when it's a place and whatever modules it owns. One source for
// both the tab bar and the deep-link check, so a link can't select a tab the bar
// doesn't offer.
function availableTabsFor(type) {
  return [
    "details",
    ...(isPlaceType(type) ? ["contents"] : []),
    ...modulesFor(type),
    "maintenance", "comments", "changes", "audit",
  ];
}
// What this asset is *called*. ONE optional field on every asset, falling back
// to the label (its Asset ID) when it's blank.
//
// This replaced a per-type `nameField` in the registry that pointed at a
// different column for each named type — a Room's `room`, a Building's
// `building`, a Campus's `campus`, a Bulk Item's sub-type — which tangled two
// separate questions together: the Room column meant "this room's name" on a
// Room row and "the room this sits in" on every other row, and the Type column
// printed a name where the type word belonged. Worse, only those four types
// could be named at all, so a user-created type could never have one without a
// new column AND a registry change.
//
// A name is DISPLAY ONLY and never identity: `label` remains the one stable key
// (see CLAUDE.md's reference conventions), names need not be unique, and nothing
// resolves a reference through one. That's what makes renaming free.
function nameOf(asset) {
  return (asset?.name || "").trim() || asset?.label || "";
}

// Options for the structured per-asset change log
const DEFAULT_CHANGE_TYPES = ["Purchase", "Repair", "Replacement", "Upgrade", "Maintenance", "Relocation", "Disposal", "Other"];

// Preset intervals for scheduled maintenance — fixed (not a managed list) since
// each needs a day-count to compute a next-due date.
const MAINTENANCE_FREQUENCIES = [
  { label: "Weekly", days: 7 },
  { label: "Monthly", days: 30 },
  { label: "Quarterly", days: 90 },
  { label: "Semi-Annually", days: 182 },
  { label: "Annually", days: 365 },
];

// A field key named in ANY registry entry's onlyFields is restricted app-wide:
// only the types that name it get it. Derived from the registry rather than
// declared as a second parallel list, so introducing a type-specific field is a
// one-line change to one entry and can't drift out of sync.
// Recomputed with the user's overrides applied (see DERIVED_TYPE_SETS), so
// granting a field to one type restricts it app-wide exactly as a shipped
// onlyFields entry does.
function restrictedFields() {
  return DERIVED_TYPE_SETS.restrictedFields;
}
// Does `key` apply to an asset of `type`? Explicit exclusions win first, then the
// restricted-field rule; anything else is a common field present on every type.
// An unregistered (user-added) type excludes nothing and owns no restricted field
// — i.e. it behaves as a generic device, exactly as before the registry existed.
function fieldAppliesTo(key, type) {
  // The Parent field exists only for a type that can actually sit inside
  // something — a Building (top of the tree) and a Bulk Item (spreads across
  // rooms via allocations) get no Parent picker at all.
  if (key === "parent") return typeTakesParent(type);
  const entry = typeEntryFor(type);
  if (entry?.excludedFields?.includes(key)) return false;
  if (!restrictedFields().has(key)) return true; // common field, applies to every type
  return !!entry?.onlyFields?.includes(key);
}

// There is no such thing as a computed COLUMN any more. `isComputedColumn` and
// `isOwnPlaceColumn` are gone with the Campus/Building/Room columns they
// described: the list shows Path instead, so nothing needs to ask whether a
// column is derived, nor to italicise a value read off an ancestor rather than
// off the asset itself. Their type-aware ancestor, `isComputedColumnFor`, had
// already been retired when `name` stopped those columns doubling as one type's
// own name.
//
// `computedPlaceValue`, which mapped one of those column keys to its value, went
// with them: its four callers were the list cell, the detail view, sorting and
// the export, and only the export still wants place names. That one asks
// campusNameOf/buildingNameOf/roomNameOf directly, since it knows which three it
// wants and no longer has a column key to dispatch on.

// adoptLegacyParentage() is gone (v25). It read a pre-v15 roomId/buildingId as a
// parentId for a sheet that hadn't been migrated; those columns were dropped from
// ASSET_FIELDS in v25, so the backend no longer returns them and there is nothing
// left to adopt. parentId is the only answer.
//
// Note what it also had to do, in case a similar migration is ever written: it
// refused to adopt for a type whose parentTypes is empty. A Bulk Item takes no
// parent but pre-v9 rows still carried a stale roomId, and adopting one produced
// an asset permanently flagged as having an impossible parent, on a form with no
// Parent field to fix it with.

// Types that are bolted to the building rather than carried around. Used ONLY to
// pick a sensible default name ("Room 102 Mini Split" reads better than "Mini
// Split BCA0044"), never to gate behaviour — a wrong guess costs a retype, so
// this deliberately isn't a registry setting yet. Promote it to one if the
// suggestion turns out to earn its keep.
const FIXED_IN_PLACE_TYPES = new Set(["Mini Split", "Condenser", "Electrical Panel"]);

// The nearest place above an asset, by name — a Room for most things, a Building
// for a Condenser, whatever the chain actually offers. Asked rather than assumed
// so the suggestion is right at any depth and for any future place type.
function nearestPlaceNameOf(asset, assets) {
  const place = ancestorsOf(asset, assets).find(p => isPlaceType(p.type));
  return place ? nameOf(place) : "";
}

// A default name for an asset that has none. Fixed equipment is called by where
// it is, since that's how you'd ask for it ("the Room 102 mini split"); anything
// portable is called by its type and Asset ID, since where it is today says
// nothing about it tomorrow.
//
// This is a SUGGESTION, not a computed value: it's written into `name` once (at
// the backfill below, or when a new asset is saved without one) and is ordinary
// editable text from then on. So it can go stale — move that mini split and the
// name still says Room 102. That's the deliberate trade: a name that silently
// rewrote itself would make a real name indistinguishable from a placeholder.
function suggestedNameFor(asset, assets) {
  const type = (asset?.type || "").trim();
  if (!type) return "";
  if (FIXED_IN_PLACE_TYPES.has(type)) {
    const place = nearestPlaceNameOf(asset, assets);
    if (place) return `${place} ${type}`;
  }
  return `${type} ${asset.label || ""}`.trim();
}

// adoptLegacySubType() is gone (v25) along with the `itemName` column it read.

// Gives every asset saved before the `name` field existed the name it was
// already being displayed under, so nothing visibly changes on the first load
// after this ships. Applied in loadData (after parentage is resolved, since the
// fixed-equipment suggestion walks the chain); the first asset-domain save
// writes the result in for every asset at once, exactly like the parentId
// migration. The old per-type name columns are read HERE AND NOWHERE ELSE —
// they stay in the sheet, unwritten, so this release is reversible.
//
// It takes a whole list rather than one asset because the passes depend on each
// other: "Room 102 Mini Split" can only be built once the Room itself is called
// "Room 102". Naming them in one pass produced "BCR0006 Mini Split", since
// nameOf() was still falling back to the room's label when the mini split asked.
// Hence stored names first, then places, then everything else.
// Which old column held a given type's OWN name, before `name` existed. Gated by
// type, and that gating is the whole point: the `room` column is a Room's name,
// but on every OTHER asset it's a leftover from the pre-v9 schema still holding
// the room it sits in ("Room 102"). Reading it ungated named every computer in
// the building after its room. See the note in NAME_FIELD_PLAN.md — the sandbox
// fixture had no such leftovers, so nothing caught it before the live sheet did.
// A Bulk Item is called by its sub-type ("Chairs") unless someone has given it a
// name of its own. The only per-type naming rule left: this used to be a map of
// four types onto the four legacy name columns, and Room/Building/Campus dropped
// out of it when those columns were deleted in v25 — each of those is now named
// like everything else, by `name`.
const NAME_FROM_FIELD = { "Bulk Item": "subType" };
function nameFromFieldOf(a) {
  const key = NAME_FROM_FIELD[a?.type];
  return key ? String(a[key] || "").trim() : "";
}

// hasMisadoptedName() is gone (v25). It repaired names written by the first,
// broken version of the backfill below, which read the stale place columns
// ungated by type and so named a device after its room. It worked by comparing a
// name against `room`/`building`/`campus` — the very columns v25 deleted — so it
// cannot be reconstructed, and any name still wrong is now just a name someone
// has to retype. That is why the removal waited until a save had written every
// repaired name into the sheet.
function adoptLegacyNames(list) {
  const stillBlank = a => !(a.name || "").trim();
  // 1. A Bulk Item with no name of its own takes a copy of its sub-type
  //    ("Chairs"), which is what it was called before Sub-Type went back to
  //    being purely a category.
  const stored = list.map(a => {
    if (!stillBlank(a)) return a;
    const fromField = nameFromFieldOf(a);
    return fromField ? { ...a, name: fromField } : a;
  });
  // 2. Places next, so a nameless room has a name of its own before anything
  //    inside it is named after it.
  const places = stored.map(a => (stillBlank(a) && isPlaceType(a.type)) ? { ...a, name: suggestedNameFor(a, stored) } : a);
  // 3. Everything else, resolved against a list whose places are all named.
  return places.map(a => stillBlank(a) ? { ...a, name: suggestedNameFor(a, places) } : a);
}

// Next-due date for a maintenance item, or null if it's never been performed

function nextMaintenanceDue(item) {

  if (isNaN(last.getTime())) return null;

function describeAudit(entry) {
  if (entry.action === "created") return "Asset created";
  if (entry.action === "deleted") return "Asset permanently deleted";
  if (entry.action === "archived") return "Asset archived";
  if (entry.action === "restored") return "Asset restored from archive";
  if (entry.action === "allocated") {
    return entry.previousQuantity != null
      ? `Allocation to ${entry.room} changed from ${entry.previousQuantity} to ${entry.quantity}`
      : `Allocated ${entry.quantity} to ${entry.room}`;
  }
  if (entry.action === "unallocated") return `Removed allocation of ${entry.quantity} from ${entry.room}`;
  if (entry.action === "noted") return `Note: ${entry.note}`;
  if (entry.action === "maintenance_completed") return `Completed maintenance "${entry.field}" — last done ${entry.to}`;
  if (entry.action === "maintenance_removed") return `Removed scheduled maintenance: ${entry.field}`;
  if (entry.action === "breaker_added") return `Added breaker at ${entry.field} (${entry.to})`;
  if (entry.action === "breaker_swapped") return `Swapped breaker at ${entry.field} — serial changed from "${entry.from}" to "${entry.to}"`;
  if (entry.action === "breaker_removed") return `Removed breaker at ${entry.field}`;
  // `from` on an add/remove is where the circuit sat — "Slot 12" or "Unassigned".
  // Entries logged before circuits could be unassigned have no `from` at all, so
  // both fall back to the wording they used then rather than printing "at undefined".
  if (entry.action === "circuit_added") {
    return entry.from ? `Added circuit "${entry.field}" at ${entry.from} (${entry.to})` : `Added circuit "${entry.field}" (${entry.to})`;
  }
  if (entry.action === "circuit_reassigned") return `Moved circuit "${entry.field}" from ${entry.from} to ${entry.to}`;
  if (entry.action === "circuit_removed") {
    return entry.from ? `Removed circuit "${entry.field}" from ${entry.from}` : `Removed circuit "${entry.field}"`;
  }
  // breaker_edited / circuit_edited fall through to the generic case below —
  // their field/from/to are already in the "X changed from A to B" shape.
  return `${entry.field} changed from "${entry.from || "—"}" to "${entry.to || "—"}"`;
}
// Every asset already has a stable, unique `label` — Room/Building references
// elsewhere in the app store that label (an id), not the mutable display
// name, so renaming a Room/Building is a normal single-asset edit with
// nothing else to keep in sync. These resolve an id back to the current
// display name at render time; a dangling id (its Room/Building was deleted)
// resolves to "" rather than throwing.
// Both go through nameOf() rather than reading a per-type column: since v23 an
// asset's name lives in one `name` field, and the old `room`/`building` columns
// are leftovers that stop being written. Reading them here would have shown the
// pre-rename value everywhere a room is resolved from an id.
function roomNameFor(roomId, assets) {
  if (!roomId) return "";
  const room = assets.find(a => a.type === "Room" && a.label === roomId);
  return room ? nameOf(room) : "";
}
function buildingNameFor(buildingId, assets) {
  if (!buildingId) return "";
  const building = assets.find(a => a.type === "Building" && a.label === buildingId);
  return building ? nameOf(building) : "";
}

// ---------- PARENT CHAIN ----------
// An asset's place in the world is one `parentId` holding the parent asset's
// label (an id, never a display name — see "Reference conventions" in CLAUDE.md).
// Everything that used to be a fixed roomId/buildingId pair is now derived by
// walking up from here.
//
// EVERY walk is loop-safe, and that is not defensive padding: with fixed
// room/building fields a cycle was structurally impossible, and with a general
// parent it isn't. The app refuses to CREATE one (see wouldCreateCycle, wired
// into saveDraft), but storage stays permissive by design, so a hand-edited
// sheet or a bulk script can still introduce "A inside B inside A" — and an
// unguarded walk would hang the browser rather than show bad data. The visited
// set is what makes that impossible; MAX_PARENT_DEPTH is a second belt against
// a chain that is merely absurdly long rather than circular.
const MAX_PARENT_DEPTH = 50;
// What an asset with no parent is called, wherever a place would otherwise be
// shown. Deliberately NOT "Unplaced": a parent is a containment relationship,
// not necessarily a location, so a type whose parent isn't a place would make
// "Unplaced" read as nonsense.
const UNASSIGNED_LABEL = "Unassigned";

function parentOf(asset, assets) {
  if (!asset || !asset.parentId) return null;
  return (assets || []).find(a => a.label === asset.parentId) || null;
}

// The chain above `asset`, nearest parent first, stopping at the root — or at
// the first repeat if the data contains a loop.
function ancestorsOf(asset, assets) {
  const out = [];
  const seen = new Set(asset?.label ? [asset.label] : []);
  let cur = parentOf(asset, assets);
  while (cur && !seen.has(cur.label) && out.length < MAX_PARENT_DEPTH) {
    out.push(cur);
    seen.add(cur.label);
    cur = parentOf(cur, assets);
  }
  return out;
}

// The nearest ancestor of a given type. "Which of these assets is a Room?" is an
// identity question, so comparing the type name here is correct — it's the
// *capability* questions ("can this hold other things?") that go through the
// registry instead. See CLAUDE.md's note on that distinction.
function nearestAncestorOfType(asset, assets, type) {
  return ancestorsOf(asset, assets).find(a => a.type === type) || null;
}

// Everything anywhere below `asset`, at any depth. Asks each candidate for its
// own chain rather than walking down from the parent, which keeps it loop-safe
// for free (ancestorsOf already is) and needs no child index. Fine at this
// inventory's scale — a few hundred assets, only while a detail view is open.
function descendantsOf(asset, assets) {
  if (!asset) return [];
  return (assets || []).filter(a => a.label !== asset.label && ancestorsOf(a, assets).some(p => p.label === asset.label));
}

// Would pointing `childLabel` at `parentId` close a loop? True when the proposed
// parent IS the child, or already sits somewhere below it. ancestorsOf is itself
// loop-safe, so this stays correct even when the existing data is already bad.
function wouldCreateCycle(childLabel, parentId, assets) {
  if (!parentId || !childLabel) return false;
  if (parentId === childLabel) return true;
  const parent = (assets || []).find(a => a.label === parentId);
  if (!parent) return false;
  return ancestorsOf(parent, assets).some(a => a.label === childLabel);
}

// Resolves a parentId to the parent's display name. A dangling id (its asset was
// deleted) resolves to a visible marker rather than "" or a throw — the same
// treatment RoomField/BuildingField gave a deleted Room/Building, kept because
// silently blank is indistinguishable from "no parent", which is now a real and
// different state.
function parentNameFor(parentId, assets) {
  if (!parentId) return "";
  const p = (assets || []).find(a => a.label === parentId);
  return p ? nameOf(p) : "(deleted asset)";
}

// The Room / Building an asset is in, by walking up. An asset that IS a Room (or
// Building) answers with its own name — "which asset is a Room" is identity, as
// above. Both return "" when there's nothing of that type in the chain, which is
// a genuine answer (an Unassigned laptop is in no room) and not an error.
function roomNameOf(asset, assets) {
  if (!asset) return "";
  if (asset.type === "Room") return nameOf(asset);
  const r = nearestAncestorOfType(asset, assets, "Room");
  return r ? nameOf(r) : "";
}
function buildingNameOf(asset, assets) {
  if (!asset) return "";
  if (asset.type === "Building") return nameOf(asset);
  const b = nearestAncestorOfType(asset, assets, "Building");
  return b ? nameOf(b) : "";
}
function campusNameOf(asset, assets) {
  if (!asset) return "";
  if (asset.type === "Campus") return nameOf(asset);
  const c = nearestAncestorOfType(asset, assets, "Campus");
  return c ? nameOf(c) : "";

// Where an asset sits, written out in full: the whole chain above it, outermost
// first — "Building 100 › Room 101 › Storage Room". This is the list's one
// location column, chosen over separate Building and Room columns so a deeply
// nested item never hides the middle of its chain (a laptop in a closet in a
// classroom would otherwise show the closet and the building, and silently drop
// the classroom).
// The asset itself is NOT included: the row already says what it is, and
// repeating it would make every Room read "… › Room 101" twice over.
const PATH_SEPARATOR = " › ";
function pathOf(asset, assets) {
  if (!asset) return "";
  return ancestorsOf(asset, assets).map(a => nameOf(a)).reverse().join(PATH_SEPARATOR);
}

// Same as buildingNameOf but returns the Building asset's id — used for
// filtering/sorting by building, where matching on a stable id (not a name that
// could theoretically collide or change) is what's actually wanted.
function effectiveBuildingId(asset, assets) {
  if (!asset) return "";
  if (asset.type === "Building") return asset.label;
  const b = nearestAncestorOfType(asset, assets, "Building");
  return b ? b.label : "";
}

// permissive, so this can be false for data the app itself would have refused —
// which is exactly the case the UI flags rather than hides. A missing parent is
// NOT invalid (that's Unassigned); a parent that no longer exists, or one of a
// type this type may not sit inside, is.
function parentageProblem(asset, assets, typesList) {
  if (!asset || !asset.parentId) return null;
  // Type NAMES, not ids — since types got ids, `asset.type` is an id, which for
  // a built-in reads like its name but for a user-created type is a raw uuid.
  const own = typeNameOf(asset.type, typesList);
  if (!typeTakesParent(asset.type)) return `A ${own} doesn't sit inside anything, but this one has a parent. Press Edit and then Save to clear it.`;
  const parent = (assets || []).find(a => a.label === asset.parentId);
  if (!parent) return `Its parent (${asset.parentId}) no longer exists.`;
  if (!canBeParentOf(parent.type, asset.type)) return `A ${own} can't sit inside a ${typeNameOf(parent.type, typesList)}.`;
  // Asking ancestorsOf(asset) whether it contains `asset` can never say yes — it
  // seeds its visited set with asset.label and stops at the first repeat, so the
  // asset is excluded by construction. The loop this asset is actually part of is
  // the one you'd close by re-pointing it where it already points, which is
  // exactly the question wouldCreateCycle answers.
  if (wouldCreateCycle(asset.label, asset.parentId, assets)) return "It's part of a loop — something above it is also below it.";
  if (ancestorsOf(asset, assets).length >= MAX_PARENT_DEPTH) return "Its chain of parents is unreasonably long, which usually means a loop.";

// key that belongs on screen and not on the asset (`parentError`). Stripped on

function validateParentChoice(childLabel, childType, parentId, assets, typesList) {
  if (!parentId) return null;
  const own = typeNameOf(childType, typesList);
  if (!typeTakesParent(childType)) return `A ${own} doesn't sit inside anything.`;
  const parent = (assets || []).find(a => a.label === parentId);
  if (!parent) return "That parent no longer exists — pick another.";
  if (!canBeParentOf(parent.type, childType)) {
    const allowed = parentTypesFor(childType).map(t => typeNameOf(t, typesList)).join(" or ");

  if (wouldCreateCycle(childLabel, parentId, assets)) {
    return `That would put ${nameOf(parent)} inside itself — it's already somewhere below this asset.`;
  }

    // point of sessions being records rather than self-expiring tokens: without

    // "Sign out" would mean nothing more than clearing this browser.

    // outlives a failed call still expires on its own.
    if (manualSignOut && sessionId) {

  // Which sandbox setting the current data was loaded for. Stamped here rather

  const lastLoadedSandboxRef = useRef(null);

  async function loadData() {
    lastLoadedSandboxRef.current = sandboxMode;
    setLoading(true);
    setLoadError(false);
    try {
      let data;

        // could only carry it in the query string, writing a live credential
        // into browser history and Google's logs. Nothing on this path writes —
        // the backend routes op:"read" away before it takes the write lock.
        //
        // `cache: "no-store"` is kept even though POSTs aren't cached the way
        // the old GET was. It cost nothing, and the failure it originally fixed

        // save is rejected as a conflict, and the conflict handler's own
        // loadData() gets served the same cached response — leaving the user
        // unable to ever save, with no way out from inside the app. See
        // "Optimistic concurrency" in CLAUDE.md.
        const res = await fetch(SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          // `_dirty` all-false is a SAFETY GUARD against a version mismatch, not
          // something v18 itself needs — v18's doPost routes op:"read" away
          // before it looks at _dirty at all.
          //
          // It matters if this frontend ever reaches a v17-or-older backend
          // (the window between pulling this code and doing the Apps Script
          // redeploy, which is not a hypothetical — the redeploy is a manual
          // step that has been forgotten in this project before). Such a backend
          // doesn't know op:"read"; it treats this as an ordinary save. With
          // _dirty absent it defaults to "rewrite everything", and since a read
          // payload carries no assets, it would blank the Assets tab and every
          // child tab with it. All-false makes an old backend write nothing:
          // each write branch is gated on a dirty flag, the audit append gets an
          // empty list, and the Config block is skipped because no domain was
          // written. The load then fails cleanly on "Malformed response" instead
          // of destroying the inventory.
          // Two shapes, one request. A pending Google credential means this is a
          // fresh sign-in, which is the only time an ID token is ever sent — the
          // backend exchanges it for a session and returns both the session and
          // the inventory together, so signing in stays one round trip. Every
          // load after that presents the session instead.
          body: JSON.stringify(authIdToken
            ? { op: "signin", idToken: authIdToken, _dirty: { assets: false, config: false, breakerTypes: false } }
            : { op: "read", sessionId: sessionId, _dirty: { assets: false, config: false, breakerTypes: false } }),
          cache: "no-store",
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
        // Not signed in, expired, or not on the allowlist. An expected outcome
        // rather than a transport failure, so it resets to the sign-in screen
        // instead of showing the generic "couldn't reach the backend" error.
        if (data && data.authFailed) {

            reason: data.reason || "signin",
            message: data.error || "Sign in to use the asset tracker.",
            detail: data.detail || "",
          });

          return;
        }

      // this side. Absent in sandbox mode, which has no backend and no allowlist,

        // the Google credential the moment it has been exchanged — it has done
        // its one job and keeping it around is pure liability.

        setAccessUsers(data.auth.users || []);

      setAuthPending(false);

      // Migrate column config: add any default columns introduced in newer app
      // versions, at the position DEFAULT_COLUMNS puts them in rather than always
      // just before `status`. That blanket rule sent `name` to the far right of an
      // existing user's table — past a dozen columns, effectively invisible — even
      // though it's the first column for anyone starting fresh. Anchoring on the
      // nearest preceding default column that this user already has keeps the new
      // column next to the ones it belongs with; a column with no such anchor (one
      // that leads the default order, like `name`) goes to the front.
      let storedCols = data.columns && data.columns.length ? data.columns : DEFAULT_COLUMNS;
      // Rename first, then drop retired columns, then add new defaults — a
      // renamed key has to reach the add pass under its NEW name or that pass
      // sees it as missing and inserts a duplicate.
      storedCols = storedCols.map(c => (
        !c.custom && RENAMED_COLUMN_KEYS[c.key]
          ? { ...c, key: RENAMED_COLUMN_KEYS[c.key], label: DEFAULT_COLUMNS.find(d => d.key === RENAMED_COLUMN_KEYS[c.key])?.label || c.label }
          : c
      ));
      // Drop columns retired in a newer app version before adding new ones, so a
      // sheet last saved by an older client doesn't keep offering a column that
      // nothing renders or edits any more (see RETIRED_COLUMN_KEYS).
      storedCols = storedCols.filter(c => c.custom || !RETIRED_COLUMN_KEYS.has(c.key));
      DEFAULT_COLUMNS.forEach((dc, defaultIdx) => {
        if (storedCols.some(c => c.key === dc.key)) return;
        let insertAt = 0;
        for (let i = defaultIdx - 1; i >= 0; i--) {
          const anchor = storedCols.findIndex(c => c.key === DEFAULT_COLUMNS[i].key);
          if (anchor !== -1) { insertAt = anchor + 1; break; }
        }
        storedCols = [...storedCols.slice(0, insertAt), dc, ...storedCols.slice(insertAt)];
      });
      setColumns(storedCols);
      // BEFORE the assets are mapped, not just before the setState: the load-time
      // backfills below ask typeTakesParent and isPlaceType, and those read the
      // module-level settings. Applied later, the first load after a settings
      // change would adopt parents and names using the PREVIOUS rules.
      const loadedTypeSettings = data.typeSettings && typeof data.typeSettings === "object" ? data.typeSettings : {};
      applyTypeSettings(loadedTypeSettings, storedCols);

      const parented = data.assets
        .map(a => ({ comments: [], changes: [], allocations: [], status: "Active", subType: "", purchaseDate: "", warrantyUntil: "", ...a }));
      // Names are filled in over the already-parented list, because the
      // suggestion for fixed equipment reads the chain above the asset ("Room 102
      // Mini Split") — running it inside the first map would walk a list whose
      // parentIds were still half-adopted.
      const loadedAssets = adoptLegacyNames(parented);
      setAssets(loadedAssets);
      // No scriptVersion at all means an old backend that predates this check entirely —
      // still a real mismatch, not a "nothing to compare" case. In sandbox mode the
      // fixture always reports the current frontend version, so this never fires there.
      setBackendScriptVersion(data.scriptVersion || "(none reported — backend predates version tracking)");
      // Absent (sandbox fixture, or a backend predating v12) normalizes to all
      // zeros, which is exactly what such a backend compares against — so this
      // stays a no-op rather than a permanent conflict.
      rememberRevisions(data.revisions);
      setChangeTypes(data.changeTypes && data.changeTypes.length ? data.changeTypes : DEFAULT_CHANGE_TYPES);
      setVendors(Array.isArray(data.vendors) ? data.vendors : []);
      setAuditLog(Array.isArray(data.auditLog) ? data.auditLog : []);
      setPeripheralsList(Array.isArray(data.peripheralsList) ? data.peripheralsList : DEFAULT_PERIPHERALS);
      setBulkItemTypes(Array.isArray(data.bulkItemTypes) ? data.bulkItemTypes : DEFAULT_BULK_ITEM_TYPES);
      // Migrate the managed type list the same way columns are migrated above:
      // a list stored before a new LOCKED type existed would otherwise never gain
      // it, so the type could never be picked in the add form and its assets
      // could never be created. Campus is what exposed this — the stored list on
      // any sheet (and any saved sandbox copy) predates it.
      //
      // Only locked types are restored, and that limit is the point: a locked
      // type can't be removed in the type manager at all, so its absence is
      // always a version gap and never a choice. An ordinary type the user
      // deliberately deleted stays deleted, which re-adding every entry in
      // TYPE_OPTIONS would undo on every single load.
      setTypesList(ensureLockedTypes(adoptLegacyTypesList(
        Array.isArray(data.typesList) && data.typesList.length ? data.typesList : DEFAULT_TYPES
      )));
      setTypeSettings(loadedTypeSettings);
      // Absent/0/garbage all mean "never stored" — peekAssetNumber() seeds it
      // from the loaded assets instead, and the first asset created writes it.
      const storedNextNumber = Number(data.nextAssetNumber);
      setNextAssetNumber(Number.isFinite(storedNextNumber) && storedNextNumber > 0 ? storedNextNumber : null);
      setBreakerTypes(Array.isArray(data.breakerTypes) && data.breakerTypes.length ? data.breakerTypes : SEEDED_BREAKER_TYPES);
      if (Array.isArray(data.usersList) && data.usersList.length) {
        setUsersList(data.usersList);
      } else {
        // No stored users list yet (e.g. brand-new sheet) — derive starter names
        // from whatever's already on the loaded assets, if any.
        const derived = Array.from(
          new Set(loadedAssets.flatMap(a => (a.person ? a.person.split("/").map(s => s.trim()) : [])).filter(Boolean))
        ).sort();
        setUsersList(derived);
      }
      setLoading(false);
    } catch (e) {
      // Sheet unreachable or returned something unexpected — show a blocking error
      // instead of guessing. Assets stays null, so persist()/writeSnapshot() never
      // run against fabricated data (see the write-guard in persist()).
      setLoadError(true);
      setLoading(false);
    }
  }

  // Loads once sign-in is settled, and again whenever the sandbox toggle flips.
  // The guard ref exists because the sign-in path calls loadData() directly with
  // the fresh token — that response is what establishes `auth` in the first
  // place — so without it, `auth` appearing would immediately fire this effect
  // and repeat the identical fetch. loadData() stamps the ref itself, so both
  // entry points are covered by one piece of bookkeeping.
  useEffect(() => {
    if (!authSatisfied) return;
    if (lastLoadedSandboxRef.current === sandboxMode) return;
    loadData();
  }, [sandboxMode, authSatisfied]);

  // Consumes a shared deep link (?asset=BCA0082&tab=breakers) once, on the
  // first load where assets are actually available — jumps straight to that
  // asset/tab instead of the list view. Guarded by a ref (not an empty-deps
  // effect) since `assets` starts null and only becomes usable after loadData()
  // resolves; a plain [] effect would run too early and find nothing to match.
  const urlDeepLinkAppliedRef = useRef(false);
  useEffect(() => {
    if (!assets || urlDeepLinkAppliedRef.current) return;
    urlDeepLinkAppliedRef.current = true;
    const params = new URLSearchParams(window.location.search);
    const assetLabel = params.get("asset");
    if (!assetLabel) return;
    const target = assets.find(a => a.label === assetLabel);
    if (!target) return;
    openDetail(target, params.get("tab") || undefined);
  }, [assets]);

  function toggleSandboxMode() {
    const next = !sandboxMode;
    setSandboxMode(next);
    try { localStorage.setItem(SANDBOX_MODE_KEY, next ? "1" : "0"); } catch (e) { /* non-fatal — just won't remember across reloads */ }
  }

  // Wipes sandbox edits back to the MOCK_SNAPSHOT fixture. Only relevant in
  // sandbox mode — never touches the real backend either way.
  function resetSandbox() {
    try { localStorage.removeItem(SANDBOX_DATA_KEY); } catch (e) { /* non-fatal */ }
    if (sandboxMode) loadData();
  }

  // Only sandbox mode still asks for a typed name. It has no backend and no
  // sign-in, but audit entries still want an author on them. A signed-in session
  // takes its identity from the server instead (see loadData) — replacing this
  // unverified, self-declared name tag is the entire point of the change.
  useEffect(() => {
    if (!sandboxMode) return;
    try {
      const stored = localStorage.getItem(USER_STORAGE_KEY);
      if (stored) setCurrentUser(stored);
      else setShowNamePrompt(true);
    } catch (e) {
      setShowNamePrompt(true);
    }
  }, [sandboxMode]);

  useEffect(() => {
    try {
      const stored = localStorage.getItem(COLUMN_VISIBILITY_STORAGE_KEY);
      if (stored) setColumnVisibility(JSON.parse(stored));
    } catch (e) {
      // Non-fatal — falls back to each column's server-defined visible flag.
    }
  }, []);

  function saveUserName(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setCurrentUser(trimmed);
    setShowNamePrompt(false);
    setNameInput("");
    try {
      localStorage.setItem(USER_STORAGE_KEY, trimmed);
    } catch (e) {
      // Non-fatal — name just won't persist to the next session on this device.
    }
  }

  // POSTs the full app state to the Apps Script backend. Sent as text/plain
  // rather than application/json — Apps Script parses e.postData.contents as
  // JSON regardless of the declared content type, and text/plain is a "simple"
  // request that skips the browser's CORS preflight (which Apps Script doesn't
  // handle), avoiding a class of failures that has nothing to do with the data itself.
  async function writeSnapshot(payload) {
    const res = await fetch(SHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      // The ID token goes in the body, not a header: a custom header would make
      // this a non-simple CORS request, and the browser's preflight OPTIONS is
      // exactly what Apps Script can't answer — see the text/plain note above.
      body: JSON.stringify({ ...payload, sessionId: sessionId }),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
    let result;
    try {
      result = JSON.parse(text);
    } catch (e) {
      throw new Error(`Non-JSON response: ${text.slice(0, 200)}`);
    }
    // A rejected save (someone else saved first — see REVISION_DOMAINS) comes
    // back as a normal 200 with { ok: false, conflict: [...] }. That's an
    // expected outcome, not a transport failure, so it's returned to persist()
    // to handle rather than thrown as an error.
    if (!result) throw new Error("Empty response from backend");
    // An auth failure — expired token, access revoked since load, or view-only —
    // also comes back as a normal 200 with { ok: false, authFailed: true }.
    // Like a conflict it's an expected outcome rather than a transport failure,
    // so it's handed to persist() to deal with instead of thrown: persist sends
    // the user back to sign-in, which a thrown error would show as a generic
    // "save failed" with no way to recover.
    if (!result.ok && !result.authFailed && !result.refused && !Array.isArray(result.conflict)) {
      throw new Error(result.error ? result.error : "Unknown write failure");
    }
    return result;
  }

  // `overrides` only needs to name whichever domains actually changed — every
  // other domain defaults to its current state, so a call that's only adding
  // an audit entry (the overwhelming majority) is just `persist(next, { auditLog })`
  // instead of re-passing columns/changeTypes/vendors unchanged every time.
  async function persist(nextAssets, overrides = {}) {
    const {
      columns: nextColumns = columns,
      changeTypes: nextChangeTypes = changeTypes,
      vendors: nextVendors = vendors,
      auditLog: nextAuditLog = auditLog,
      peripheralsList: nextPeripheralsList = peripheralsList,
      usersList: nextUsersList = usersList,
      bulkItemTypes: nextBulkItemTypes = bulkItemTypes,
      typesList: nextTypesList = typesList,
      typeSettings: nextTypeSettings = typeSettings,
      breakerTypes: nextBreakerTypes = breakerTypes,
      nextAssetNumber: nextNumberToIssue = nextAssetNumber,
      // Defaults to undefined, NOT to the current list, which is the opposite of
      // every other domain here and deliberate. The backend treats an absent
      // authUsers as "leave the allowlist alone" and only overwrites when one is
      // actually sent — so a save that isn't about access can never rewrite it,
      // even if this client's copy were somehow stale or empty.
      authUsers: nextAuthUsers = undefined,
    } = overrides;
    // Guard against ever writing over the Sheet before a real snapshot has been
    // loaded — the UI shouldn't be reachable in that state, but this keeps a
    // load-failure from being able to clobber live data no matter how it's triggered.
    if (assets === null) return;
    // View-only. The backend refuses these saves too — that is the actual
    // control, and it's the one that matters since anything here can be edited
    // in a browser console. Stopping at this choke point as well means a
    // viewer's click doesn't optimistically repaint the screen with a change
    // that the next load will silently undo. Every write in the app funnels
    // through persist(), so nothing gets past this by being missed.
    if (!canEdit) {
      setReadOnlyNotice("Your access is view-only, so that change wasn't saved.");
      return;
    }
    // Reference equality against current state, computed before any setState
    // below. Every call site either passes a domain through untouched (same
    // reference) or a freshly computed one (new reference) — that's already
    // the convention throughout this file — so this reliably detects which
    // domains actually changed without each call site needing to declare it.
    // Lets the backend skip rewriting tabs that didn't change.
    const dirty = {
      assets: nextAssets !== assets,
      config: nextColumns !== columns || nextChangeTypes !== changeTypes || nextVendors !== vendors
        || nextPeripheralsList !== peripheralsList || nextUsersList !== usersList || nextBulkItemTypes !== bulkItemTypes
        || nextTypesList !== typesList || nextTypeSettings !== typeSettings
        || nextNumberToIssue !== nextAssetNumber
        || nextAuthUsers !== undefined,
      breakerTypes: nextBreakerTypes !== breakerTypes,
    };
    // Set before the first await and cleared in the finally below, so it always
    // clears — on success, on a network/backend failure, and on the conflict
    // path that reloads and opens the blocking modal. A spinner that never
    // stops would be worse than no spinner at all.
    savingRef.current = true;
    setIsSaving(true);
    try {
      setAssets(nextAssets);
      setColumns(nextColumns);
      setChangeTypes(nextChangeTypes);
      setVendors(nextVendors);
      setAuditLog(nextAuditLog);
      setPeripheralsList(nextPeripheralsList);
      setUsersList(nextUsersList);
      setBulkItemTypes(nextBulkItemTypes);
      setTypesList(nextTypesList);
      // Before the setState, per the ordering rule in the TYPE_SETTINGS comment:
      // the re-render this setState causes is what makes the new rules visible,
      // so the module-level copy has to be current by the time it runs.
      applyTypeSettings(nextTypeSettings, nextColumns);
      setTypeSettings(nextTypeSettings);
      setBreakerTypes(nextBreakerTypes);
      setNextAssetNumber(nextNumberToIssue);
      if (nextAuthUsers !== undefined) setAccessUsers(nextAuthUsers);
      const payload = {
        assets: nextAssets, columns: nextColumns, changeTypes: nextChangeTypes,
        vendors: nextVendors, auditLog: nextAuditLog, peripheralsList: nextPeripheralsList, usersList: nextUsersList,
        bulkItemTypes: nextBulkItemTypes, typesList: nextTypesList,
        typeSettings: nextTypeSettings, breakerTypes: nextBreakerTypes,
        nextAssetNumber: nextNumberToIssue, _dirty: dirty,
        // Spread conditionally so the key is genuinely ABSENT on an ordinary
        // save, not present-but-undefined — JSON.stringify drops undefined
        // values, but relying on that to protect the allowlist would be a
        // silent dependency on a serialization detail.
        ...(nextAuthUsers !== undefined ? { authUsers: nextAuthUsers } : {}),
      };
      if (sandboxMode) {
        // Mirror to localStorage so a refresh doesn't lose sandbox edits — but
        // never touches SHEET_API_URL. No network call happens at all here, so
        // there's nobody to conflict with: no `_revisions` is attached and no
        // check runs, rather than fabricating revision numbers locally.
        // scriptVersion is stamped fresh each save so the sandbox never shows a
        // false "backend outdated" warning.
        // Note this path never awaits, so isSaving goes true and false again
        // inside one React batch — the sandbox gets no distracting flash of a
        // "Saving…" state for a write that took a millisecond, without the
        // indicator having to special-case sandbox mode into being wrong.
        try {
          localStorage.setItem(SANDBOX_DATA_KEY, JSON.stringify({ ...payload, scriptVersion: FRONTEND_SCRIPT_VERSION }));
          setSaveError(false);
        } catch (e) {
          setSaveError(true);
        }
        return;
      }
      try {
        // Queued behind any save still in flight, and reading the revisions at
        // send time (not closure-capture time) so a queued save uses whatever the
        // one before it came back with — see writeQueueRef/revisionsRef.
        const send = writeQueueRef.current.then(
          () => writeSnapshot({ ...payload, _revisions: revisionsRef.current })
        );
        writeQueueRef.current = send.then(() => {}, () => {}); // keep the chain alive past a failure
        const result = await send;
        // Sign-in expired mid-session, or access was changed since load. Nothing
        // was written. endSession() drops `assets` back to null, which also
        // discards the optimistic setState above — the edit is genuinely gone,
        // and leaving it on screen would be a lie the next load would undo.
        if (result && result.authFailed) {
          endSession({
            reason: result.reason || "signin",
            message: result.error || "Your sign-in expired. Sign in again to keep working.",
            detail: result.detail || "",
          });
          return;
        }
        // The backend refused a save that would have emptied the Assets tab.
        // Nothing was written. Reloading matters as much as the message: the
        // optimistic setState above has already painted the app with whatever
        // bad state produced this, and leaving it there invites the user to
        // "fix" it with another save. Server truth replaces it.
        if (result && result.refused === "emptyAssets") {
          setReadOnlyNotice(result.error || "That save was refused because it would have deleted every asset.");
          setSaveError(false);
          await loadData();
          return;
        }
        if (result && Array.isArray(result.conflict) && result.conflict.length) {
          // Someone else saved first, so the backend wrote NOTHING and this edit
          // is gone. Deliberately no auto-merge and no silent retry — a merge
          // can't know which of two conflicting values is right, and a retry
          // would overwrite the other person's change, which is the exact bug
          // this whole mechanism exists to prevent. Reload server truth instead
          // (which also replaces the optimistic setState above, so the app stops
          // showing an edit that isn't stored anywhere) and say so plainly.
          rememberRevisions(result.revisions);
          setSaveConflict(result.conflict);
          setSaveError(false);
          // Close anything mid-edit against records the reload is about to
          // replace underneath it.
          setBreakerModal(null);
          setAddBreakerDraft(null);
          setSwapModal(null);
          setMoveCircuitModal(null);
          setDetailEditing(false);
          setEditingMaintenanceIdx(null);
          setMaintenanceEditDraft(null);
          await loadData();
          return;
        }
        // A v11-or-older backend reports no revisions; leaving them as-is keeps
        // posting the same (all-zero) numbers, which it ignores anyway.
        if (result && result.revisions) rememberRevisions(result.revisions);
        setSaveConflict(null);
        setSaveError(false);
      } catch (e) {
        setSaveError(true);
      }
    } finally {
      savingRef.current = false;
      setIsSaving(false);
    }
  }

  function logAudit(entries) {
    return [...auditLog, ...entries];
  }

  // Type filter options are type IDS, sorted by the name they currently show.
  const types = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.map(a => a.type || "Other"));
    return ["All types", ...Array.from(set).sort((x, y) =>
      typeNameOf(x, typesList).localeCompare(typeNameOf(y, typesList)))];
  }, [assets, typesList]);

  const users = useMemo(() => ["All users", ...usersList], [usersList]);

  const filtered = useMemo(() => {
    if (!assets) return [];
    const q = query.trim().toLowerCase();
    const list = assets.filter(a => {
      // Scope: everything BENEATH the chosen place, at any depth — drilling to a
      // building shows the equipment in all its rooms, not just what sits
      // directly on the building. The place itself is excluded: you're looking
      // *inside* it, and listing it as one of its own contents reads as an error
      // (it's also what made the bulk move-to-room drag the room along).
      if (scopeId && !ancestorsOf(a, assets).some(p => p.label === scopeId)) return false;
      if (typeFilter !== "All types" && (a.type || "Other") !== typeFilter) return false;
      if (userFilter !== "All users" && !(a.person || "").split("/").map(s => s.trim()).includes(userFilter)) return false;
      if (statusFilter !== "All statuses" && (a.status || "Active") !== statusFilter) return false;
      if (!q) return true;
      // Searching matches the whole chain above an asset, so typing a building
      // name finds the equipment inside it however many levels down it sits.
      const chainNames = [roomNameOf(a, assets), buildingNameOf(a, assets), ...ancestorsOf(a, assets).map(p => nameOf(p))];
      if (chainNames.some(n => n && n.toLowerCase().includes(q))) return true;
      return Object.values(a).some(v => typeof v === "string" && v.toLowerCase().includes(q));
    });
    if (sortConfig) {
      const { key, dir } = sortConfig;
      const mult = dir === "desc" ? -1 : 1;
      const sortValue = x => {
        // Sorting the Path column on the full outermost-first string groups a
        // building's contents together and orders rooms within it, which is what
        // sorting by location is for. Sorting on the immediate parent's name
        // alone would scatter them.
        if (key === "parent") return pathOf(x, assets);
        return (x[key] || "").toString();
      };
      list.sort((x, y) => {
        const xv = sortValue(x), yv = sortValue(y);
        const xn = parseFloat(xv), yn = parseFloat(yv);
        if (!isNaN(xn) && !isNaN(yn) && xv.trim() !== "" && yv.trim() !== "") return (xn - yn) * mult;
        return xv.localeCompare(yv, undefined, { numeric: true, sensitivity: "base" }) * mult;
      });
    }
    return list;
  }, [assets, query, scopeId, typeFilter, userFilter, statusFilter, sortConfig]);

  // Which of the filtered assets the bulk "Move filtered to room" action can
  // actually touch: only types that are allowed to sit inside a Room. Asking the
  // registry rather than keeping an exclusion list of type names means a
  // Building-dwelling type (Condenser), a pooled Bulk Item, a Building, and any
  // future type are all handled with no list to maintain — and a nested Room now
  // qualifies too, since a Room may sit inside another Room, so filtering a room
  // and moving its contents takes the closet along with the desks.
  //
  // The filtered room ITSELF is excluded, and that exclusion is load-bearing:
  // the Room filter matches the room as well as everything under it (that's what
  // makes it find things nested deeper), so without this every single use of
  // "move the devices in this room" would quietly move the room into the
  // destination as well — restructuring the building rather than relocating
  // equipment. Caught in browser testing after the room filter became
  // chain-aware; it was harmless when the filter only ever matched a roomId.
  // Which room the bulk move takes things OUT of: the HierarchyNav scope, when
  // you've navigated into a Room. This used to fall back to the Room column
  // filter, which is gone — the scope was already the primary way to narrow to a
  // room, and it's the better source anyway, since it matches nested rooms the
  // way the filter did. No scope, or a scope that isn't a Room, means there's no
  // single room to move things out of, so the toolbar doesn't offer the action.
  const bulkMoveSourceId = useMemo(() => {
    const scoped = scopeId ? (assets || []).find(a => a.label === scopeId) : null;
    return scoped && scoped.type === "Room" ? scopeId : "";
  }, [scopeId, assets]);

  const roomMovable = useMemo(
    () => filtered.filter(a => a.label !== bulkMoveSourceId && canBeParentOf("Room", a.type)),
    [filtered, bulkMoveSourceId]
  );

  // Flattened across every active asset's maintenanceItems, for the site-wide
  // Maintenance tab — archived assets are excluded, matching the default Active
  // filter on the Assets tab.
  const allMaintenanceRows = useMemo(() => {
    if (!assets) return [];
    const rows = [];
    assets.forEach(a => {
      if ((a.status || "Active") === "Archived") return;
      const assetName = nameOf(a);
      (a.maintenanceItems || []).forEach((item, idx) => {
        rows.push({ asset: a, assetName, item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) });
      });
    });
    return rows;
  }, [assets]);
  const maintenanceOverdueTotal = allMaintenanceRows.filter(r => r.status === "overdue").length;
  const maintenanceFrequencyOptions = useMemo(() => (
    ["All frequencies", ...Array.from(new Set(allMaintenanceRows.map(r => r.item.frequencyLabel).filter(Boolean))).sort()]
  ), [allMaintenanceRows]);
  const maintenanceOwnerOptions = useMemo(() => (
    ["All owners", ...Array.from(new Set(allMaintenanceRows.map(r => r.item.owner).filter(Boolean))).sort()]
  ), [allMaintenanceRows]);
  const maintenanceFilterConfigs = {
    frequency: { label: "Frequency", value: maintenanceFrequencyFilter, setValue: setMaintenanceFrequencyFilter, options: maintenanceFrequencyOptions },
    owner: { label: "Owner", value: maintenanceOwnerFilter, setValue: setMaintenanceOwnerFilter, options: maintenanceOwnerOptions },
    status: {
      label: "Status", value: maintenanceStatusFilter, setValue: setMaintenanceStatusFilter,
      options: MAINTENANCE_STATUS_FILTER_OPTIONS.map(o => o.value),
      labelForOption: v => (MAINTENANCE_STATUS_FILTER_OPTIONS.find(o => o.value === v) || {}).label || v,
    },
  };
  // Maps a sortable column key to its comparable value on a row — used by both
  // the header's plain-sort columns (task/asset/lastPerformed/nextDue) and the
  // filter-columns' "Sort A → Z"/"Z → A" (frequency/owner/status).
  function maintenanceSortValue(row, key) {
    switch (key) {
      case "task": return row.item.task || "";
      case "asset": return row.assetName || "";
      case "frequency": return row.item.frequencyLabel || "";
      case "owner": return row.item.owner || "";
      case "lastPerformed": return dateOnly(row.item.lastPerformed);
      case "nextDue": return row.due ? row.due.getTime() : Infinity;
      case "status": return row.status || "";
      default: return "";
    }
  }
  const filteredMaintenanceRows = useMemo(() => {
    const q = maintenanceQuery.trim().toLowerCase();
    const list = allMaintenanceRows.filter(r => {
      if (maintenanceStatusFilter !== "All statuses" && r.status !== maintenanceStatusFilter) return false;
      if (maintenanceFrequencyFilter !== "All frequencies" && r.item.frequencyLabel !== maintenanceFrequencyFilter) return false;
      if (maintenanceOwnerFilter !== "All owners" && r.item.owner !== maintenanceOwnerFilter) return false;
      if (!q) return true;
      return [r.item.task, r.item.owner, r.asset.label, roomNameOf(r.asset, assets), r.asset.type]
        .some(v => (v || "").toLowerCase().includes(q));
    });
    if (maintenanceSortConfig) {
      const { key, dir } = maintenanceSortConfig;
      const mult = dir === "desc" ? -1 : 1;
      list.sort((a, b) => {
        const av = maintenanceSortValue(a, key), bv = maintenanceSortValue(b, key);
        return typeof av === "number" && typeof bv === "number"
          ? (av - bv) * mult
          : av.toString().localeCompare(bv.toString()) * mult;
      });
    } else {
      // Default view (no explicit sort): due-soonest first, with never-performed
      // items surfaced at the very top since they need attention most.
      list.sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    }
    return list;
  }, [allMaintenanceRows, maintenanceQuery, maintenanceStatusFilter, maintenanceFrequencyFilter, maintenanceOwnerFilter, maintenanceSortConfig]);

  // Per-device override wins when set; otherwise falls back to the column's
  // server-defined default (e.g. true for a newly added custom column this
  // device hasn't seen/customized yet).
  const isColumnVisible = c => columnVisibility[c.key] ?? c.visible;
  const visibleColumns = columns.filter(isColumnVisible);
  const gridTemplate = visibleColumns.map(c => `${c.width}px`).join(" ") + " 36px";

  const filterConfigs = {
    type: { label: "Type", value: typeFilter, setValue: setTypeFilter, options: types, labelForOption: id => (id === "All types" ? id : typeNameOf(id, typesList)) },
    person: { label: "User", value: userFilter, setValue: setUserFilter, options: users },
    status: { label: "Status", value: statusFilter, setValue: setStatusFilter, options: STATUS_FILTER_OPTIONS },
