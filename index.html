const ROOM_EXCLUDED_FIELDS = ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"];

function fieldAppliesTo(key, type) {
  if (type === "Room" && ROOM_EXCLUDED_FIELDS.includes(key)) return false;
  if (type === "Building" && BUILDING_EXCLUDED_FIELDS.includes(key)) return false;
  if (type === "Bulk Item" && BULK_ITEM_EXCLUDED_FIELDS.includes(key)) return false;
  if (type === "Electrical Panel" && ELECTRICAL_PANEL_EXCLUDED_FIELDS.includes(key)) return false;
  const restriction = TYPE_ONLY_FIELDS[key];
  if (!restriction) return true; // common field, applies to every type
  return restriction.includes(type);

const CATEGORY_ICONS = { Computer: HardDrive, Monitor: Monitor, Phone: Phone, TV: Tv, DocuCam: Camera, Room: DoorOpen, Building: Building2, "Bulk Item": Package, "Electrical Panel": Zap };
function iconFor(type) {

function slugify(name) {
  return "col_" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "col_field";
}
function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}
// A date-only field (lastPerformed, purchaseDate, etc.) is stored and sent as a
// plain "yyyy-MM-dd" string, but Google Sheets auto-converts a plain date-looking
// string into a real Date cell on write — reading it back then yields a full ISO
// timestamp instead ("2026-06-03T07:00:00.000Z"). Slicing to the first 10 chars
// normalizes either shape back to just the date part before it's combined with a
// literal local-midnight time below, so already-round-tripped values still parse.
function dateOnly(s) {
  return s ? String(s).slice(0, 10) : "";
}
function formatDateOnly(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateOnly(dateStr) + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
// Next-due date for a maintenance item, or null if it's never been performed
// (so there's nothing to count forward from) or has no known interval.
function nextMaintenanceDue(item) {
  if (!item.lastPerformed || !item.frequencyDays) return null;
  const last = new Date(dateOnly(item.lastPerformed) + "T00:00:00");
  if (isNaN(last.getTime())) return null;
  return new Date(last.getTime() + item.frequencyDays * 86400000);
}
// "never" (no lastPerformed yet — needs attention), "overdue", "due-soon"
// (within 14 days), or "ok".
function maintenanceStatusOf(item) {
  if (!item.lastPerformed) return "never";
  const due = nextMaintenanceDue(item);
  if (!due) return "never";
  const daysUntil = Math.floor((due.getTime() - Date.now()) / 86400000);
  if (daysUntil < 0) return "overdue";
  if (daysUntil <= 14) return "due-soon";
  return "ok";
}
function describeAudit(entry) {
  if (entry.action === "created") return "Asset created";
  if (entry.action === "deleted") return "Asset permanently deleted";
  if (entry.action === "archived") return "Asset archived";
  if (entry.action === "restored") return "Asset restored from archive";
  if (entry.action === "allocated") {
    return entry.previousQuantity != null
      ? `Allocation to ${entry.room} changed from ${entry.previousQuantity} to ${entry.quantity}`
      : `Allocated ${entry.quantity} to ${entry.room}`;
  }
  if (entry.action === "unallocated") return `Removed allocation of ${entry.quantity} from ${entry.room}`;
  if (entry.action === "noted") return `Note: ${entry.note}`;
  if (entry.action === "maintenance_completed") return `Completed maintenance "${entry.field}" — last done ${entry.to}`;
  if (entry.action === "maintenance_removed") return `Removed scheduled maintenance: ${entry.field}`;
  if (entry.action === "breaker_added") return `Added breaker at ${entry.field} (${entry.to})`;
  if (entry.action === "breaker_swapped") return `Swapped breaker at ${entry.field} — serial changed from "${entry.from}" to "${entry.to}"`;
  if (entry.action === "breaker_removed") return `Removed breaker at ${entry.field}`;
  if (entry.action === "circuit_added") return `Added circuit "${entry.field}" (${entry.to})`;
  if (entry.action === "circuit_reassigned") return `Moved circuit "${entry.field}" from ${entry.from} to ${entry.to}`;
  if (entry.action === "circuit_removed") return `Removed circuit "${entry.field}"`;
  // breaker_edited / circuit_edited fall through to the generic case below —
  // their field/from/to are already in the "X changed from A to B" shape.
  return `${entry.field} changed from "${entry.from || "—"}" to "${entry.to || "—"}"`;
}

function inferBuilding(asset, assets) {
  if (!asset || !asset.room) return "";
  const roomAsset = assets.find(a => a.type === "Room" && a.room === asset.room);
  return roomAsset ? roomAsset.building || "" : "";
}

  { title: "Notes", keys: ["notes"] },

function groupDetailColumns(cols) {
  const groups = DETAIL_FIELD_GROUPS.map(g => ({ title: g.title, columns: [] }));
  const custom = [];
  cols.forEach(c => {
    const groupIdx = DETAIL_FIELD_GROUPS.findIndex(g => g.keys.includes(c.key));
    if (groupIdx === -1) custom.push(c);

// --- Breaker cell addressing -------------------------------------------------
// See BREAKER_TYPES_ARCHITECTURE.md. Every physical slot has two halves,
// addressed "Na"/"Nb" (e.g. "1a", "1b") — a Breaker's footprint is the set of
// half-cells it occupies (Breaker.cells), not a list of whole slot numbers.
// Poles are derived (count of distinct slots touched), never stored.
function slotsFromCells(cells) {
  const set = new Set((cells || []).map(c => c.slice(0, -1)));
  return Array.from(set).sort((a, b) => parseFloat(a) - parseFloat(b));
}
function polesFromCells(cells) {
  return slotsFromCells(cells).length || 1;
}
// A breaker's label collapses to a plain slot number ("6/8") when it fills
// every half of every slot it touches — the common case (single-pole,
// double-pole). If it only claims one half of a slot (tandem, quad, split
// double-pole, ...), that half has to be called out ("9b/11a") or it's
// indistinguishable from its sibling occupying the other half.
function cellsLabel_(breaker) {
  const cells = breaker.cells || [];
  const halvesBySlot = new Map();
  const order = [];
  cells.forEach(c => {
    const slot = c.slice(0, -1);
    const half = c.slice(-1);
    if (!halvesBySlot.has(slot)) { halvesBySlot.set(slot, new Set()); order.push(slot); }
    halvesBySlot.get(slot).add(half);
  });
  return order.map(slot => {
    const halves = halvesBySlot.get(slot);
    return halves.has("a") && halves.has("b") ? slot : `${slot}${[...halves][0]}`;
  }).join("/") || "—";
}
// Resolves a BreakerType member's RELATIVE cells (its own 1st/2nd/... slot,
// e.g. "1a", "2b") onto real panel slots, given the absolute starting slot —
// relative slot i -> startSlot + 2*(i-1), i.e. stacked 2 apart in one column,
// the same convention already used for double-pole breakers today (section 4
// of BREAKER_TYPES_ARCHITECTURE.md — a type's slots must stack in one column).
function resolveRelativeCells(relativeCells, startSlot) {
  return relativeCells.map(rc => {
    const relSlot = parseInt(rc.slice(0, -1), 10);
    const half = rc.slice(-1);
    return `${startSlot + 2 * (relSlot - 1)}${half}`;
  });
}
function resolveTypeSlots(slotSpan, startSlot) {
  return Array.from({ length: slotSpan }, (_, i) => startSlot + 2 * i);
}

  const [draft, setDraft] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmArchive, setConfirmArchive] = useState(null);
  const [confirmDeleteCol, setConfirmDeleteCol] = useState(null);
  const [confirmCommentDelete, setConfirmCommentDelete] = useState(null);
  const [confirmChangeDelete, setConfirmChangeDelete] = useState(null);
  const [showColManager, setShowColManager] = useState(false);
  const [newColName, setNewColName] = useState("");

  // Loads the full snapshot — either from the Sheet backend, or (sandboxMode)
  // from localStorage/MOCK_SNAPSHOT, never touching the network. Never falls
  // back to placeholder data on a real failure — if the backend can't be
  // reached, loadError is surfaced as a blocking screen (see below) rather
  // than silently showing something that isn't the real inventory. Exposed
  // as a named function (not inline in the effect) so the "Try again" button
  // on that error screen, and the sandbox toggle, can both call it directly.
  async function loadData() {
    setLoading(true);
    setLoadError(false);
    try {
      let data;
      if (sandboxMode) {
        let stored = null;
        try {
          const raw = localStorage.getItem(SANDBOX_DATA_KEY);
          if (raw) stored = JSON.parse(raw);
        } catch (e) { /* corrupt/missing sandbox save — fall back to the fixture below */ }
        data = stored || JSON.parse(JSON.stringify(MOCK_SNAPSHOT));
      } else {
        const res = await fetch(SHEET_API_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
      }
      if (!data || !Array.isArray(data.assets)) throw new Error("Malformed response from backend");

      const loadedAssets = data.assets.map(a => ({ comments: [], changes: [], allocations: [], status: "Active", building: "", itemName: "", purchaseDate: "", warrantyUntil: "", ...a }));
      setAssets(loadedAssets);
      // No scriptVersion at all means an old backend that predates this check entirely —
      // still a real mismatch, not a "nothing to compare" case. In sandbox mode the
      // fixture always reports the current frontend version, so this never fires there.
      setBackendScriptVersion(data.scriptVersion || "(none reported — backend predates version tracking)");
      // Migrate column config: append any default columns added in newer app versions.
      let storedCols = data.columns && data.columns.length ? data.columns : DEFAULT_COLUMNS;
      DEFAULT_COLUMNS.forEach(dc => {
        if (!storedCols.some(c => c.key === dc.key)) {
          const statusIdx = storedCols.findIndex(c => c.key === "status");
          const insertAt = statusIdx === -1 ? storedCols.length : statusIdx;
          storedCols = [...storedCols.slice(0, insertAt), dc, ...storedCols.slice(insertAt)];
        }
      });
      setColumns(storedCols);
      setChangeTypes(data.changeTypes && data.changeTypes.length ? data.changeTypes : DEFAULT_CHANGE_TYPES);
      setVendors(Array.isArray(data.vendors) ? data.vendors : []);
      setAuditLog(Array.isArray(data.auditLog) ? data.auditLog : []);
      setPeripheralsList(Array.isArray(data.peripheralsList) ? data.peripheralsList : DEFAULT_PERIPHERALS);
      setBulkItemTypes(Array.isArray(data.bulkItemTypes) ? data.bulkItemTypes : DEFAULT_BULK_ITEM_TYPES);
      setTypesList(Array.isArray(data.typesList) && data.typesList.length ? data.typesList : TYPE_OPTIONS);
      setBreakerTypes(Array.isArray(data.breakerTypes) && data.breakerTypes.length ? data.breakerTypes : SEEDED_BREAKER_TYPES);
      if (Array.isArray(data.usersList) && data.usersList.length) {
        setUsersList(data.usersList);
      } else {
        // No stored users list yet (e.g. brand-new sheet) — derive starter names
        // from whatever's already on the loaded assets, if any.
        const derived = Array.from(
          new Set(loadedAssets.flatMap(a => (a.person ? a.person.split("/").map(s => s.trim()) : [])).filter(Boolean))
        ).sort();
        setUsersList(derived);
      }
      setLoading(false);
    } catch (e) {
      // Sheet unreachable or returned something unexpected — show a blocking error
      // instead of guessing. Assets stays null, so persist()/writeSnapshot() never
      // run against fabricated data (see the write-guard in persist()).
      setLoadError(true);
      setLoading(false);
    }
  }

  useEffect(() => { loadData(); }, [sandboxMode]);

  function toggleSandboxMode() {
    const next = !sandboxMode;
    setSandboxMode(next);
    try { localStorage.setItem(SANDBOX_MODE_KEY, next ? "1" : "0"); } catch (e) { /* non-fatal — just won't remember across reloads */ }
  }

  // Wipes sandbox edits back to the MOCK_SNAPSHOT fixture. Only relevant in
  // sandbox mode — never touches the real backend either way.
  function resetSandbox() {
    try { localStorage.removeItem(SANDBOX_DATA_KEY); } catch (e) { /* non-fatal */ }
    if (sandboxMode) loadData();
  }

  useEffect(() => {
    try {
      const stored = localStorage.getItem(USER_STORAGE_KEY);
      if (stored) setCurrentUser(stored);
      else setShowNamePrompt(true);
    } catch (e) {
      setShowNamePrompt(true);
    }
  }, []);

  useEffect(() => {
    try {
      const stored = localStorage.getItem(COLUMN_VISIBILITY_STORAGE_KEY);
      if (stored) setColumnVisibility(JSON.parse(stored));
    } catch (e) {
      // Non-fatal — falls back to each column's server-defined visible flag.
    }
  }, []);

  function saveUserName(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setCurrentUser(trimmed);
    setShowNamePrompt(false);
    setNameInput("");
    try {
      localStorage.setItem(USER_STORAGE_KEY, trimmed);
    } catch (e) {
      // Non-fatal — name just won't persist to the next session on this device.
    }
  }

  // POSTs the full app state to the Apps Script backend. Sent as text/plain
  // rather than application/json — Apps Script parses e.postData.contents as
  // JSON regardless of the declared content type, and text/plain is a "simple"
  // request that skips the browser's CORS preflight (which Apps Script doesn't
  // handle), avoiding a class of failures that has nothing to do with the data itself.
  async function writeSnapshot(payload) {
    const res = await fetch(SHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
    let result;
    try {
      result = JSON.parse(text);
    } catch (e) {
      throw new Error(`Non-JSON response: ${text.slice(0, 200)}`);
    }
    if (!result || !result.ok) throw new Error(result && result.error ? result.error : "Unknown write failure");
    return true;
  }

  async function persist(nextAssets, nextColumns, nextChangeTypes = changeTypes, nextVendors = vendors, nextAuditLog = auditLog, nextPeripheralsList = peripheralsList, nextUsersList = usersList, nextBulkItemTypes = bulkItemTypes, nextTypesList = typesList, nextBreakerTypes = breakerTypes) {
    // Guard against ever writing over the Sheet before a real snapshot has been
    // loaded — the UI shouldn't be reachable in that state, but this keeps a
    // load-failure from being able to clobber live data no matter how it's triggered.
    if (assets === null) return;
    // Reference equality against current state, computed before any setState
    // below. Every call site either passes a domain through untouched (same
    // reference) or a freshly computed one (new reference) — that's already
    // the convention throughout this file — so this reliably detects which
    // domains actually changed without each call site needing to declare it.
    // Lets the backend skip rewriting tabs that didn't change.
    const dirty = {
      assets: nextAssets !== assets,
      config: nextColumns !== columns || nextChangeTypes !== changeTypes || nextVendors !== vendors
        || nextPeripheralsList !== peripheralsList || nextUsersList !== usersList || nextBulkItemTypes !== bulkItemTypes
        || nextTypesList !== typesList,
      breakerTypes: nextBreakerTypes !== breakerTypes,
    };
    setAssets(nextAssets);
    setColumns(nextColumns);
    setChangeTypes(nextChangeTypes);
    setVendors(nextVendors);
    setAuditLog(nextAuditLog);
    setPeripheralsList(nextPeripheralsList);
    setUsersList(nextUsersList);
    setBulkItemTypes(nextBulkItemTypes);
    setTypesList(nextTypesList);
    setBreakerTypes(nextBreakerTypes);
    const payload = {
      assets: nextAssets, columns: nextColumns, changeTypes: nextChangeTypes,
      vendors: nextVendors, auditLog: nextAuditLog, peripheralsList: nextPeripheralsList, usersList: nextUsersList,
      bulkItemTypes: nextBulkItemTypes, typesList: nextTypesList, breakerTypes: nextBreakerTypes, _dirty: dirty,
    };
    if (sandboxMode) {
      // Mirror to localStorage so a refresh doesn't lose sandbox edits — but
      // never touches SHEET_API_URL. scriptVersion is stamped fresh each save
      // so the sandbox never shows a false "backend outdated" warning.
      try {
        localStorage.setItem(SANDBOX_DATA_KEY, JSON.stringify({ ...payload, scriptVersion: FRONTEND_SCRIPT_VERSION }));
        setSaveError(false);
      } catch (e) {
        setSaveError(true);
      }
      return;
    }
    try {
      await writeSnapshot(payload);
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  function logAudit(entries) {
    return [...auditLog, ...entries];
  }

  const rooms = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.map(a => a.room).filter(Boolean));
    return ["All rooms", ...Array.from(set).sort()];
  }, [assets]);

  const types = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.map(a => a.type || "Other"));
    return ["All types", ...Array.from(set).sort()];
  }, [assets]);

  const users = useMemo(() => ["All users", ...usersList], [usersList]);

  // Rooms as recognized by an actual Room asset — used to power the linked
  // Room dropdown on every other asset type.
  const roomAssetNames = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.filter(a => a.type === "Room").map(a => a.room).filter(Boolean));
    return Array.from(set).sort();
  }, [assets]);

  // Buildings as recognized by an actual Building asset — powers the linked
  // Building dropdown on Room assets.
  const buildingAssetNames = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.filter(a => a.type === "Building").map(a => a.building).filter(Boolean));
    return Array.from(set).sort();
  }, [assets]);

  const filtered = useMemo(() => {
    if (!assets) return [];
    const q = query.trim().toLowerCase();
    const list = assets.filter(a => {
      if (roomFilter !== "All rooms" && a.room !== roomFilter) return false;
      if (typeFilter !== "All types" && (a.type || "Other") !== typeFilter) return false;
      if (userFilter !== "All users" && !(a.person || "").split("/").map(s => s.trim()).includes(userFilter)) return false;
      if (statusFilter !== "All statuses" && (a.status || "Active") !== statusFilter) return false;
      if (!q) return true;
      return Object.values(a).some(v => typeof v === "string" && v.toLowerCase().includes(q));
    });
    if (sortConfig) {
      const { key, dir } = sortConfig;
      const mult = dir === "desc" ? -1 : 1;
      list.sort((x, y) => {
        const xv = (x[key] || "").toString(), yv = (y[key] || "").toString();
        const xn = parseFloat(xv), yn = parseFloat(yv);
        if (!isNaN(xn) && !isNaN(yn) && xv.trim() !== "" && yv.trim() !== "") return (xn - yn) * mult;
        return xv.localeCompare(yv, undefined, { numeric: true, sensitivity: "base" }) * mult;
      });
    }
    return list;
  }, [assets, query, roomFilter, typeFilter, userFilter, statusFilter, sortConfig]);

  // Flattened across every active asset's maintenanceItems, for the site-wide
  // Maintenance tab — archived assets are excluded, matching the default Active
  // filter on the Assets tab.
  const allMaintenanceRows = useMemo(() => {
    if (!assets) return [];
    const rows = [];
    assets.forEach(a => {
      if ((a.status || "Active") === "Archived") return;
      const assetName = a.type === "Bulk Item" ? (a.itemName || "Bulk Item")
        : a.type === "Building" ? (a.building || "Building")
        : a.type === "Room" ? (a.room || "Room")
        : a.label;
      (a.maintenanceItems || []).forEach((item, idx) => {
        rows.push({ asset: a, assetName, item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) });
      });
    });
    return rows;
  }, [assets]);
  const maintenanceOverdueTotal = allMaintenanceRows.filter(r => r.status === "overdue").length;
  const maintenanceFrequencyOptions = useMemo(() => (
    ["All frequencies", ...Array.from(new Set(allMaintenanceRows.map(r => r.item.frequencyLabel).filter(Boolean))).sort()]
  ), [allMaintenanceRows]);
  const maintenanceOwnerOptions = useMemo(() => (
    ["All owners", ...Array.from(new Set(allMaintenanceRows.map(r => r.item.owner).filter(Boolean))).sort()]
  ), [allMaintenanceRows]);
  const maintenanceFilterConfigs = {
    frequency: { label: "Frequency", value: maintenanceFrequencyFilter, setValue: setMaintenanceFrequencyFilter, options: maintenanceFrequencyOptions },
    owner: { label: "Owner", value: maintenanceOwnerFilter, setValue: setMaintenanceOwnerFilter, options: maintenanceOwnerOptions },
    status: {
      label: "Status", value: maintenanceStatusFilter, setValue: setMaintenanceStatusFilter,
      options: MAINTENANCE_STATUS_FILTER_OPTIONS.map(o => o.value),
      labelForOption: v => (MAINTENANCE_STATUS_FILTER_OPTIONS.find(o => o.value === v) || {}).label || v,
    },
  };
  // Maps a sortable column key to its comparable value on a row — used by both
  // the header's plain-sort columns (task/asset/lastPerformed/nextDue) and the
  // filter-columns' "Sort A → Z"/"Z → A" (frequency/owner/status).
  function maintenanceSortValue(row, key) {
    switch (key) {
      case "task": return row.item.task || "";
      case "asset": return row.assetName || "";
      case "frequency": return row.item.frequencyLabel || "";
      case "owner": return row.item.owner || "";
      case "lastPerformed": return dateOnly(row.item.lastPerformed);
      case "nextDue": return row.due ? row.due.getTime() : Infinity;
      case "status": return row.status || "";
      default: return "";
    }
  }
  const filteredMaintenanceRows = useMemo(() => {
    const q = maintenanceQuery.trim().toLowerCase();
    const list = allMaintenanceRows.filter(r => {
      if (maintenanceStatusFilter !== "All statuses" && r.status !== maintenanceStatusFilter) return false;
      if (maintenanceFrequencyFilter !== "All frequencies" && r.item.frequencyLabel !== maintenanceFrequencyFilter) return false;
      if (maintenanceOwnerFilter !== "All owners" && r.item.owner !== maintenanceOwnerFilter) return false;
      if (!q) return true;
      return [r.item.task, r.item.owner, r.asset.label, r.asset.room, r.asset.type]
        .some(v => (v || "").toLowerCase().includes(q));
    });
    if (maintenanceSortConfig) {
      const { key, dir } = maintenanceSortConfig;
      const mult = dir === "desc" ? -1 : 1;
      list.sort((a, b) => {
        const av = maintenanceSortValue(a, key), bv = maintenanceSortValue(b, key);
        return typeof av === "number" && typeof bv === "number"
          ? (av - bv) * mult
          : av.toString().localeCompare(bv.toString()) * mult;
      });
    } else {
      // Default view (no explicit sort): due-soonest first, with never-performed
      // items surfaced at the very top since they need attention most.
      list.sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    }
    return list;
  }, [allMaintenanceRows, maintenanceQuery, maintenanceStatusFilter, maintenanceFrequencyFilter, maintenanceOwnerFilter, maintenanceSortConfig]);

  // Per-device override wins when set; otherwise falls back to the column's
  // server-defined default (e.g. true for a newly added custom column this
  // device hasn't seen/customized yet).
  const isColumnVisible = c => columnVisibility[c.key] ?? c.visible;
  const visibleColumns = columns.filter(isColumnVisible);
  const gridTemplate = visibleColumns.map(c => `${c.width}px`).join(" ") + " 36px";

  const filterConfigs = {
    type: { label: "Type", value: typeFilter, setValue: setTypeFilter, options: types },
    room: { label: "Room", value: roomFilter, setValue: setRoomFilter, options: rooms },
    person: { label: "User", value: userFilter, setValue: setUserFilter, options: users },
    status: { label: "Status", value: statusFilter, setValue: setStatusFilter, options: STATUS_FILTER_OPTIONS },
  };

  const selectedAsset = assets ? assets.find(a => a.label === selectedLabel) : null;

  function openDetail(asset, initialTab = "details") {

    setEditingMaintenanceIdx(null);
    setMaintenanceEditDraft(null);
    setConfirmMaintenanceDelete(null);
    setSwappingBreaker(null);
    setSwapDraft({ serial: "", ampRating: "", installedDate: "" });

  function startAdd() {
    const nums = assets.filter(a => a.label.startsWith("BCA")).map(a => parseInt((a.label.match(/\d+/) || ["0"])[0], 10));
    const next = Math.max(0, ...nums) + 1;
    setDraft({ ...emptyDraftFrom(columns), label: "BCA" + String(next).padStart(4, "0"), type: "Computer", status: "Active", comments: [], changes: [], allocations: [] });
    setShowAdd(true);

  async function saveDraft() {
    if (!draft.label?.trim() || !draft.type?.trim()) return;
    if (showAdd) {
      const createdEntry = {
        at: new Date().toISOString(), by: currentUser || "", assetLabel: draft.label,
        assetType: draft.type, action: "created",
      };
      await persist([...assets, { comments: [], changes: [], allocations: [], ...draft }], columns, changeTypes, vendors, logAudit([createdEntry]));
      cancelAdd();
    } else {
      const original = selectedAsset;
      const editEntries = [];
      Object.keys(draft).forEach(key => {
        if (key === "comments" || key === "changes" || key === "allocations") return;
        const oldVal = original[key] || "";
        const newVal = draft[key] || "";
        if (oldVal === newVal) return;
        const fieldLabel = columns.find(c => c.key === key)?.label || key;
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draft.type || original.type, action: "edited", field: fieldLabel, from: oldVal, to: newVal,
        });
      });

      // Rename cascades: keep name-based links consistent across the inventory.
      const roomRenamed = original.type === "Room" && draft.room && draft.room !== original.room;
      const buildingRenamed = original.type === "Building" && draft.building && draft.building !== original.building;

      const next = assets.map(a => {
        if (a.label === selectedLabel) return { ...a, ...draft };
        let updated = a;
        if (roomRenamed) {
          if (updated.room === original.room) updated = { ...updated, room: draft.room };
          if ((updated.allocations || []).some(al => al.room === original.room)) {
            updated = { ...updated, allocations: updated.allocations.map(al => (al.room === original.room ? { ...al, room: draft.room } : al)) };
          }
        }
        if (buildingRenamed && updated.building === original.building) {
          updated = { ...updated, building: draft.building };
        }
        return updated;
      });
      if (roomRenamed) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: "Room", action: "edited", field: "Room rename cascade",
          from: original.room, to: `${draft.room} (updated on all linked assets)`,
        });
      }
      if (buildingRenamed) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: "Building", action: "edited", field: "Building rename cascade",
          from: original.building, to: `${draft.building} (updated on all linked rooms)`,
        });
      }
      if (editNote.trim()) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draft.type || original.type, action: "noted", note: editNote.trim(),
        });
      }
      await persist(next, columns, changeTypes, vendors, editEntries.length ? logAudit(editEntries) : auditLog);
      setDetailEditing(false);
      setEditNote("");
    }
  }

  async function doDelete(label) {

      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,

    if (selectedLabel === label) closeDetail();

  // Bulk actions on the currently filtered set — powered by the active User / Room filter.
  async function reassignFilteredTo(newUser) {
    if (!newUser.trim()) return;
    const targets = new Set(filtered.filter(a => fieldAppliesTo("person", a.type)).map(a => a.label));
    const entries = [];
    const next = assets.map(a => {
      if (!targets.has(a.label) || a.person === newUser) return a;
      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,
        assetType: a.type, action: "edited", field: "User", from: a.person || "", to: newUser,
      });
      return { ...a, person: newUser };

    await persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
    setUserFilter(newUser);
    setReassignTarget("");

    const next = assets.map(a => {

      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,

  function getAllocatedTotal(asset) {
    return ((asset && asset.allocations) || []).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
  }
  function getAvailable(asset) {
    const total = parseFloat(asset && asset.totalQuantity) || 0;
    return total - getAllocatedTotal(asset);
  }

  async function saveAllocation() {
    if (!selectedAsset) return;
    const room = allocationDraft.room;
    const qty = parseFloat(allocationDraft.quantity);
    if (!room || !qty || qty <= 0) {
      setAllocationError("Pick a room and a quantity greater than 0.");
      return;
    }
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.room === room);
    const otherRoomsTotal = existing.filter(a => a.room !== room).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
    const totalQty = parseFloat(selectedAsset.totalQuantity) || 0;
    if (otherRoomsTotal + qty > totalQty) {
      setAllocationError(`Only ${totalQty - otherRoomsTotal} available to assign here.`);
      return;
    }
    setAllocationError("");
    const nextAllocations = existingForRoom
      ? existing.map(a => (a.room === room ? { ...a, quantity: qty } : a))
      : [...existing, { room, quantity: qty }];
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "allocated", room, quantity: qty,
      previousQuantity: existingForRoom ? existingForRoom.quantity : null,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setAllocationDraft({ room: "", quantity: "" });
  }

  async function removeAllocation(room) {
    if (!selectedAsset) return;
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.room === room);
    const nextAllocations = existing.filter(a => a.room !== room);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "unallocated", room, quantity: existingForRoom ? existingForRoom.quantity : 0,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setConfirmAllocationRemove(null);
  }

  // Adding a new schedule isn't separately audited — its own at/by plus its

    };

  function startEditMaintenance(idx) {

    setMaintenanceEditDraft({ task: item.task, frequency: item.frequencyLabel, lastPerformed: dateOnly(item.lastPerformed), owner: item.owner || "" });
    setEditingMaintenanceIdx(idx);

    setMaintenanceEditDraft(null);
  }

  // Mutating an existing schedule (unlike adding one) loses the prior value, so
  // it's logged field-by-field — same approach as the main asset edit diff.
  async function saveMaintenanceEdit() {
    if (!maintenanceEditDraft.task.trim() || !selectedAsset) return;
    const idx = editingMaintenanceIdx;
    const items = selectedAsset.maintenanceItems || [];
    const original = items[idx];
    const freq = MAINTENANCE_FREQUENCIES.find(f => f.label === maintenanceEditDraft.frequency) || MAINTENANCE_FREQUENCIES[1];
    const updated = {
      ...original,
      task: maintenanceEditDraft.task.trim(),
      frequencyLabel: freq.label,
      frequencyDays: freq.days,
      lastPerformed: maintenanceEditDraft.lastPerformed || "",
      owner: maintenanceEditDraft.owner.trim(),
    };
    const mkEntry = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_edited", field: `${original.task} — ${field}`, from, to,
    });
    const entries = [];
    if (original.task !== updated.task) entries.push(mkEntry("Task", original.task, updated.task));
    if (original.frequencyLabel !== updated.frequencyLabel) entries.push(mkEntry("Frequency", original.frequencyLabel, updated.frequencyLabel));
    if ((original.owner || "") !== (updated.owner || "")) entries.push(mkEntry("Owner", original.owner || "—", updated.owner || "—"));
    if ((original.lastPerformed || "") !== (updated.lastPerformed || "")) {
      entries.push(mkEntry("Last performed", formatDateOnly(original.lastPerformed) || "—", formatDateOnly(updated.lastPerformed) || "—"));
    }
    const nextItems = items.map((it, i) => (i === idx ? updated : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    await persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
    cancelEditMaintenance();
  }

  async function markMaintenanceDone(idx) {
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const today = new Date().toISOString().slice(0, 10);
    const nextItems = items.map((it, i) => (i === idx ? { ...it, lastPerformed: today } : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "maintenance_completed", field: item.task,
      from: item.lastPerformed ? formatDateOnly(item.lastPerformed) : "never", to: formatDateOnly(today),
    };
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
  }

  async function deleteMaintenanceItem(idx) {
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const nextItems = items.filter((_, i) => i !== idx);
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_removed", field: item.task,

    setConfirmMaintenanceDelete(null);

  // ---------- Breakers / Circuits (Electrical Panel assets only) ----------
  // Breakers/Circuits carry no at/by of their own (unlike comments/changes/
  // maintenance items), so — like Allocations — every mutation is audited.
  // These are plain (non-async) functions: onAdd/onSave need to return a
  // validation-error string synchronously for ChildEntityTable to show it, so
  // persist() is called fire-and-forget here, same as toggleColumnVisible/
  // addColumn/addChangeType etc. already do elsewhere in this file.
  function slotsLabel_(breaker) {
    return cellsLabel_(breaker);
  }

  function updateBreakers(nextBreakers) {
    return assets.map(a => (a.label === selectedLabel ? { ...a, breakers: nextBreakers } : a));
  }

  // Panel slot count/layout drive the visual diagram in the Breakers tab —
  // stored as plain asset fields (like brand/model), not part of the
  // breakers/circuits child tables, since they describe the panel itself.
  function updatePanelConfig(slotCount, layout) {
    if (!selectedAsset) return;
    const original = selectedAsset;
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: original.type,
      action: "edited", field, from, to,
    });
    const entries = [];
    if (String(original.panelSlotCount || "") !== String(slotCount || "")) entries.push(mk("Panel Slot Count", original.panelSlotCount || "—", slotCount || "—"));
    if ((original.panelLayout || "") !== (layout || "")) entries.push(mk("Panel Layout", original.panelLayout || "—", layout || "—"));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, panelSlotCount: slotCount, panelLayout: layout } : a));
    persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
  }

  // Placing a breaker means placing a whole BreakerType instance at once — one
  // Breaker row per type member (1 for Single-Pole/Double-Pole, 2 for Tandem,
  // however many the type defines), each with its own amp rating from the
  // moment it's created, linked by a fresh groupId. See
  // BREAKER_TYPES_ARCHITECTURE.md section 4. Circuits attach to these rows
  // exactly like any other breaker, as a separate later step — placing a type
  // is never blocked on (or coupled to) adding circuits.
  function addBreaker(draft) {
    if (!selectedAsset) return "No panel selected.";
    const type = breakerTypes.find(t => t.id === draft.breakerTypeId);
    if (!type) return "Pick a breaker type.";
    const startSlot = parseInt(draft.startSlot, 10);
    if (!startSlot || startSlot < 1) return "Enter a starting slot.";
    const panelSlotCount = parseInt(selectedAsset.panelSlotCount, 10) || 0;
    const resolvedSlots = resolveTypeSlots(type.slotSpan, startSlot);
    if (panelSlotCount && Math.max(...resolvedSlots) > panelSlotCount) {
      return `Slot ${Math.max(...resolvedSlots)} is beyond this panel's ${panelSlotCount} slots.`;
    }
    const existing = selectedAsset.breakers || [];
    const takenCells = new Set(existing.flatMap(b => b.cells || []));
    const groupId = crypto.randomUUID();
    const status = draft.status || "Active";
    const serial = draft.serial || "";
    const installedDate = draft.installedDate || "";
    const notes = draft.notes || "";
    const newBreakers = type.members.map((member, i) => {
      const cells = resolveRelativeCells(member.cells, startSlot);
      return {
        id: crypto.randomUUID(), panelLabel: selectedAsset.label, cells,
        breakerTypeId: type.id, groupId,
        ampRating: draft[`amp_${i}`] !== undefined && draft[`amp_${i}`] !== "" ? draft[`amp_${i}`] : member.ampRating,
        status, serial, installedDate, notes,
        circuits: [],
      };
    });
    const conflictCell = newBreakers.flatMap(b => b.cells).find(c => takenCells.has(c));
    if (conflictCell) return `Slot ${conflictCell.slice(0, -1)} is already in use.`;
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_added", field: `Slot ${resolvedSlots.join("/")}`,
      to: `${type.name} (${newBreakers.map(b => b.ampRating ? b.ampRating + "A" : "?A").join(" / ")})`,
    };
    persist(updateBreakers([...existing, ...newBreakers]), columns, changeTypes, vendors, logAudit([entry]));
  }

  // Editing a placed breaker only ever touches its own row — cells, groupId,
  // and breakerTypeId are set once at placement (addBreaker, above) and
  // aren't editable here, since changing them could orphan sibling rows in
  // the same group. Delete and re-add to change where/what a breaker is.
  //
  // Amp rating is the one spec that legitimately varies per breaker within a
  // type instance (e.g. the 15/30/15 split double-pole) — everything else
  // (serial, installed date, notes) describes the one physical unit, not the
  // individual pole, so those live at the group level (saveBreakerInstanceDetails
  // below) instead of here.
  function saveBreakerAmp(id, ampRating) {
    if (!selectedAsset) return "No panel selected.";
    const existing = selectedAsset.breakers || [];
    const original = existing.find(b => b.id === id);
    if (!original) return "Breaker not found.";
    const updated = { ...original, ampRating: ampRating || "" };
    if ((original.ampRating || "") === updated.ampRating) return;
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_edited", field: `Slot ${slotsLabel_(original)} — Amp Rating`, from: original.ampRating || "—", to: updated.ampRating || "—",
    };
    const nextBreakers = existing.map(b => (b.id === id ? updated : b));
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
  }

  // Applies to every member of the group at once — a serial/install date/notes
  // describe the physical breaker unit you bought and installed, not any one
  // pole of it, so editing it here writes the same value to every row in the
  // group rather than just the member that happened to be clicked.
  function saveBreakerInstanceDetails(memberIds, groupSlotLabel, draft) {
    if (!selectedAsset) return "No panel selected.";
    const existing = selectedAsset.breakers || [];
    const members = existing.filter(b => memberIds.includes(b.id));
    if (members.length === 0) return "Breaker not found.";
    const anchor = members[0];
    const next = { serial: draft.serial || "", installedDate: draft.installedDate || "", notes: draft.notes || "" };
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_edited", field: `Slot ${groupSlotLabel} — ${field}`, from, to,
    });
    const entries = [];
    if ((anchor.serial || "") !== next.serial) entries.push(mk("Serial", anchor.serial || "—", next.serial || "—"));
    if ((anchor.installedDate || "") !== next.installedDate) {
      entries.push(mk("Installed Date", formatDateOnly(anchor.installedDate) || "—", formatDateOnly(next.installedDate) || "—"));
    }
    if ((anchor.notes || "") !== next.notes) entries.push(mk("Notes", anchor.notes || "—", next.notes || "—"));
    const nextBreakers = existing.map(b => (memberIds.includes(b.id) ? { ...b, ...next } : b));
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
  }

  // Referential integrity (a breaker unit with circuits attached can't be
  // deleted) is enforced here, client-side only — consistent with every other
  // guard in this app (delete/archive confirmations etc.); nothing else
  // validates server-side either, so this one check wouldn't close a real gap
  // by moving. Delete removes the whole group — a breaker-type instance is one
  // physical unit, not N independently removable poles.
  function canDeleteBreakerGroup(members) {
    const withCircuits = members.filter(m => (m.circuits || []).length > 0);
    if (withCircuits.length > 0) {
      return `Still has circuits attached (${withCircuits.length} of ${members.length} breaker${members.length !== 1 ? "s" : ""} in this unit) — move or remove them first.`;
    }
    return null;
  }

  function deleteBreakerGroup(members, groupSlotLabel) {
    if (!selectedAsset || members.length === 0) return;
    const ids = new Set(members.map(m => m.id));
    const existing = selectedAsset.breakers || [];
    const nextBreakers = existing.filter(b => !ids.has(b.id));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_removed", field: `Slot ${groupSlotLabel}`,
    };
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
  }

  // Swap is deliberately separate from the generic edit above — it's the only
  // way to change serial/ampRating/installedDate, keeping "replaced the
  // physical unit" distinct from "corrected a typo" in the audit trail.
  function openSwapBreaker(breaker) {
    setSwappingBreaker(breaker);
    setSwapDraft({ serial: breaker.serial || "", ampRating: breaker.ampRating || "", installedDate: dateOnly(breaker.installedDate) });
    setSwapError(null);
  }

  function submitSwapBreaker() {
    if (!selectedAsset || !swappingBreaker) return;
    const existing = selectedAsset.breakers || [];
    const original = existing.find(b => b.id === swappingBreaker.id);
    if (!original) { setSwapError("Breaker not found."); return; }
    const updated = { ...original, serial: swapDraft.serial || "", ampRating: swapDraft.ampRating || "", installedDate: swapDraft.installedDate || "" };
    const nextBreakers = existing.map(b => (b.id === original.id ? updated : b));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "breaker_swapped", field: `Slot ${slotsLabel_(original)}`,
      from: original.serial || "—", to: updated.serial || "—",
    };
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
    setSwappingBreaker(null);
    setSwapError(null);
  }

  function addCircuit(breakerId, draft) {
    if (!selectedAsset) return "No panel selected.";
    if (!draft.label || !draft.label.trim()) return "Enter a circuit label.";
    const roomsServed = draft.roomsServed || [];
    const feedsPanelLabel = draft.feedsPanelLabel || "";
    if (roomsServed.length === 0 && !feedsPanelLabel) return "Pick either rooms served or a sub-panel this circuit feeds.";
    if (roomsServed.length > 0 && feedsPanelLabel) return "A circuit can serve rooms or feed a sub-panel, not both.";
    const existing = selectedAsset.breakers || [];
    const breaker = existing.find(b => b.id === breakerId);
    if (!breaker) return "Breaker not found.";
    const circuit = {
      id: crypto.randomUUID(), breakerId, label: draft.label.trim(), description: (draft.description || "").trim(),
      roomsServed, feedsPanelLabel,
    };
    const nextBreakers = existing.map(b => (b.id === breakerId ? { ...b, circuits: [...(b.circuits || []), circuit] } : b));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_added", field: circuit.label,
      to: feedsPanelLabel ? `Feeds ${feedsPanelLabel}` : `Serves ${roomsServed.join(", ")}`,
    };
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
  }

  function saveCircuitEdit(breakerId, id, draft) {
    if (!selectedAsset) return "No panel selected.";
    if (!draft.label || !draft.label.trim()) return "Enter a circuit label.";
    const roomsServed = draft.roomsServed || [];
    const feedsPanelLabel = draft.feedsPanelLabel || "";
    if (roomsServed.length === 0 && !feedsPanelLabel) return "Pick either rooms served or a sub-panel this circuit feeds.";
    if (roomsServed.length > 0 && feedsPanelLabel) return "A circuit can serve rooms or feed a sub-panel, not both.";
    const existing = selectedAsset.breakers || [];
    const breaker = existing.find(b => b.id === breakerId);
    if (!breaker) return "Breaker not found.";
    const original = (breaker.circuits || []).find(c => c.id === id);
    if (!original) return "Circuit not found.";
    const updated = { ...original, label: draft.label.trim(), description: (draft.description || "").trim(), roomsServed, feedsPanelLabel };
    const mk = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_edited", field: `${original.label} — ${field}`, from, to,
    });
    const entries = [];
    if (original.label !== updated.label) entries.push(mk("Label", original.label, updated.label));
    if ((original.description || "") !== updated.description) entries.push(mk("Description", original.description || "—", updated.description || "—"));
    if ((original.roomsServed || []).join(",") !== roomsServed.join(",")) {
      entries.push(mk("Rooms served", (original.roomsServed || []).join(", ") || "—", roomsServed.join(", ") || "—"));
    }
    if ((original.feedsPanelLabel || "") !== feedsPanelLabel) entries.push(mk("Feeds sub-panel", original.feedsPanelLabel || "—", feedsPanelLabel || "—"));
    const nextBreakers = existing.map(b => (b.id === breakerId ? { ...b, circuits: (b.circuits || []).map(c => (c.id === id ? updated : c)) } : b));
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
  }

  function deleteCircuit(breakerId, id) {
    if (!selectedAsset) return;
    const existing = selectedAsset.breakers || [];
    const breaker = existing.find(b => b.id === breakerId);
    if (!breaker) return;
    const circuit = (breaker.circuits || []).find(c => c.id === id);
    if (!circuit) return;
    const nextBreakers = existing.map(b => (b.id === breakerId ? { ...b, circuits: (b.circuits || []).filter(c => c.id !== id) } : b));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_removed", field: circuit.label,
    };
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
  }

  // Same-panel only for this pass — moving a circuit to a different Panel
  // asset would mean mutating two assets atomically, deferred as a follow-up.
  function openMoveCircuit(breakerId, circuit) {
    setMovingCircuit({ breakerId, circuit });
    setMoveCircuitTarget("");
    setMoveCircuitError(null);
  }

  function submitMoveCircuit() {
    if (!selectedAsset || !movingCircuit) return;
    if (!moveCircuitTarget) { setMoveCircuitError("Pick a destination breaker."); return; }
    if (moveCircuitTarget === movingCircuit.breakerId) { setMoveCircuitError("That's already this circuit's breaker."); return; }
    const existing = selectedAsset.breakers || [];
    const fromBreaker = existing.find(b => b.id === movingCircuit.breakerId);
    const toBreaker = existing.find(b => b.id === moveCircuitTarget);
    if (!fromBreaker || !toBreaker) { setMoveCircuitError("Breaker not found."); return; }
    const circuit = (fromBreaker.circuits || []).find(c => c.id === movingCircuit.circuit.id);
    if (!circuit) { setMoveCircuitError("Circuit not found."); return; }
    const movedCircuit = { ...circuit, breakerId: toBreaker.id };
    const nextBreakers = existing.map(b => {
      if (b.id === fromBreaker.id) return { ...b, circuits: (b.circuits || []).filter(c => c.id !== circuit.id) };
      if (b.id === toBreaker.id) return { ...b, circuits: [...(b.circuits || []), movedCircuit] };
      return b;
    });
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "circuit_reassigned", field: circuit.label,
      from: `Slot ${slotsLabel_(fromBreaker)}`, to: `Slot ${slotsLabel_(toBreaker)}`,
    };
    persist(updateBreakers(nextBreakers), columns, changeTypes, vendors, logAudit([entry]));
    setMovingCircuit(null);
    setMoveCircuitTarget("");
    setMoveCircuitError(null);
  }

  // Local-only — no persist() call. Column show/hide is a per-device viewing
  // preference now, not shared state, so this never touches the Sheet.
  function toggleColumnVisible(key) {
    const col = columns.find(c => c.key === key);
    if (col && col.locked) return;
    const next = { ...columnVisibility, [key]: !isColumnVisible(col) };
    setColumnVisibility(next);
    try {
      localStorage.setItem(COLUMN_VISIBILITY_STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      // Non-fatal — the toggle still applies for this session, just won't stick next visit.
    }
  }

  function addColumn() {
    if (!newColName.trim()) return;
    let key = slugify(newColName);
    let i = 1;
    while (columns.some(c => c.key === key)) key = slugify(newColName) + "_" + i++;
    const nextColumns = [...columns, { key, label: newColName.trim(), width: 160, visible: true, custom: true }];
    const nextAssets = assets.map(a => ({ ...a, [key]: "" }));
    persist(nextAssets, nextColumns);
    setNewColName("");
  }

  function removeColumn(key) {
    const nextColumns = columns.filter(c => c.key !== key);
    const nextAssets = assets.map(a => {
      const copy = { ...a };
      delete copy[key];
      return copy;
    });
    persist(nextAssets, nextColumns);
    setConfirmDeleteCol(null);
  }

  function addChangeType() {
    const name = newChangeTypeName.trim();
    if (!name || changeTypes.includes(name)) return;
    persist(assets, columns, [...changeTypes, name], vendors);
    setNewChangeTypeName("");
  }

  function removeChangeType(name) {
    persist(assets, columns, changeTypes.filter(t => t !== name), vendors);
  }

  function addVendor() {
    const name = newVendorName.trim();
    if (!name || vendors.includes(name)) return;
    persist(assets, columns, changeTypes, [...vendors, name]);
    setNewVendorName("");
  }

  function removeVendor(name) {
    persist(assets, columns, changeTypes, vendors.filter(v => v !== name));
  }

  function addPeripheral() {
    const name = newPeripheralName.trim();
    if (!name || peripheralsList.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, [...peripheralsList, name]);
    setNewPeripheralName("");
  }

  function removePeripheral(name) {
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList.filter(p => p !== name));
  }

  function addUser() {
    const name = newUserName.trim();
    if (!name || usersList.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, [...usersList, name].sort());
    setNewUserName("");
  }

  // Removing a user only takes them off the pick list — assets already assigned
  // to them keep that value until someone reassigns them.
  function removeUser(name) {
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList.filter(u => u !== name));
  }

  function addBulkItemType() {
    const name = newBulkItemTypeName.trim();
    if (!name || bulkItemTypes.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, [...bulkItemTypes, name].sort());
    setNewBulkItemTypeName("");
  }

  // Removing a sub-type only takes it off the pick list — bulk items already
  // using that value keep it until someone edits them.
  function removeBulkItemType(name) {
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes.filter(t => t !== name));
  }

  function addType() {
    const name = newTypeName.trim();
    if (!name || typesList.includes(name)) return;
    // Insert before "Other" (if present) so it stays the catch-all at the end of
    // the picker, matching how new default columns get inserted before "status".
    const otherIdx = typesList.indexOf("Other");
    const nextTypesList = otherIdx === -1
      ? [...typesList, name]
      : [...typesList.slice(0, otherIdx), name, ...typesList.slice(otherIdx)];
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes, nextTypesList);
    setNewTypeName("");
  }

  // Removing a type only takes it off the pick list — assets already using that
  // value keep it until someone edits them. LOCKED_TYPES can't be removed at all,
  // since Room/Building/Bulk Item/Electrical Panel have structural dependencies
  // elsewhere (field-exclusion rules, Contents/Allocations/Breakers tabs).
  function removeType(name) {
    if (LOCKED_TYPES.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes, typesList.filter(t => t !== name));
  }

  // --- Breaker Types (catalog) ------------------------------------------------
  // See BREAKER_TYPES_ARCHITECTURE.md. A type's cells use RELATIVE slot indices
  // (its own 1st/2nd/... slot) — allCellsForSpan/saveBreakerType work entirely
  // in that relative space; resolving onto real panel slots happens only at
  // placement time (addBreakerFromType), not here.
  function allCellsForSpan(slotSpan) {
    const cells = [];
    for (let i = 1; i <= slotSpan; i++) cells.push(`${i}a`, `${i}b`);
    return cells;
  }

  function openAddBreakerType() {
    setBreakerTypeDraft({ id: null, name: "", slotSpan: 1, members: [] });
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function openEditBreakerType(type) {
    setBreakerTypeDraft({ ...type, members: type.members.map(m => ({ ...m })) });
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function cancelBreakerTypeDraft() {
    setBreakerTypeDraft(null);
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function changeBreakerTypeSlotSpan(slotSpan) {
    // Members are cleared on span change rather than trying to salvage cells
    // that might now be out of range — simplest correct behavior, and slot
    // span is normally the first thing set, before any member is defined.
    setBreakerTypeDraft(d => ({ ...d, slotSpan, members: [] }));
    setCurrentMemberCells([]);
  }
  function toggleBreakerTypeCell(cell) {
    setCurrentMemberCells(prev => (prev.includes(cell) ? prev.filter(c => c !== cell) : [...prev, cell]));
  }
  function addBreakerTypeMember() {
    if (currentMemberCells.length === 0) { setBreakerTypeError("Select at least one cell for this breaker."); return; }
    if (!currentMemberAmp) { setBreakerTypeError("Enter an amp rating for this breaker."); return; }
    setBreakerTypeDraft(d => ({ ...d, members: [...d.members, { cells: [...currentMemberCells].sort(), ampRating: currentMemberAmp }] }));
    setCurrentMemberCells([]);
    setCurrentMemberAmp("");
    setBreakerTypeError(null);
  }
  function removeBreakerTypeMember(idx) {
    setBreakerTypeDraft(d => ({ ...d, members: d.members.filter((_, i) => i !== idx) }));
  }

  function saveBreakerType() {
    const draft = breakerTypeDraft;
    const name = (draft.name || "").trim();
    if (!name) { setBreakerTypeError("Enter a name."); return; }
    if (draft.members.length === 0) { setBreakerTypeError("Add at least one breaker."); return; }
    const allCells = allCellsForSpan(draft.slotSpan);
    const usedCells = draft.members.flatMap(m => m.cells);
    const missing = allCells.filter(c => !usedCells.includes(c));
    if (missing.length > 0) { setBreakerTypeError(`Every cell must be assigned to a breaker — still unassigned: ${missing.join(", ")}.`); return; }
    const isNew = !draft.id;
    const savedType = { id: draft.id || crypto.randomUUID(), name, slotSpan: draft.slotSpan, members: draft.members };
    const nextTypes = isNew ? [...breakerTypes, savedType] : breakerTypes.map(t => (t.id === savedType.id ? savedType : t));
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes, typesList, nextTypes);
    cancelBreakerTypeDraft();
  }

  // Blocks deletion if any breaker anywhere still references this type,
  // listing exactly where (panel + slot) rather than just refusing — the
  // architecture doc's breakerTypeId is display-only, but that doesn't mean
  // deleting the type out from under placed breakers is harmless: the badge
  // would go stale/blank, so it's still worth surfacing to fix first.
  function findBreakerTypeUsages(typeId) {
    const usages = [];
    (assets || []).filter(a => a.type === "Electrical Panel").forEach(panel => {
      (panel.breakers || []).filter(b => b.breakerTypeId === typeId).forEach(b => {
        usages.push({ panelLabel: panel.label, slot: cellsLabel_(b) });
      });
    });
    return usages;
  }
  function removeBreakerType(id) {
    const usages = findBreakerTypeUsages(id);
    if (usages.length > 0) {
      const list = usages.map(u => `${u.panelLabel} Slot ${u.slot}`).join(", ");
      setBreakerTypeError(`Can't delete — still used by: ${list}.`);
      return;
    }
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes, typesList, breakerTypes.filter(t => t.id !== id));
  }

  function exportToExcel() {
    const assetRows = assets.map(a => {
      const row = {};
      columns.forEach(c => { row[c.label] = fieldAppliesTo(c.key, a.type) ? (a[c.key] || "") : ""; });
      row["Comments logged"] = (a.comments || []).length;
      row["Changes logged"] = (a.changes || []).length;
      row["Total cost logged"] = (a.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
      if (a.type === "Bulk Item") {
        row["Allocated"] = getAllocatedTotal(a);
        row["Available"] = getAvailable(a);
      }
      return row;
    });
    const commentRows = [];
    assets.forEach(a => {
      (a.comments || []).forEach(cm => {
        commentRows.push({ "Asset ID": a.label, Type: a.type, Room: a.room, When: formatWhen(cm.at), Comment: cm.text, "Logged by": cm.by || "" });
      });
    });
    const changeRows = [];
    assets.forEach(a => {
      (a.changes || []).forEach(ch => {
        changeRows.push({
          "Asset ID": a.label, Type: a.type, Room: a.room, When: formatWhen(ch.at),
          "Change type": ch.changeType, Vendor: ch.vendor, Cost: parseFloat(ch.cost) || "", Note: ch.note,
          "Logged by": ch.by || "",
        });
      });
    });
    const allocationRows = [];
    assets.forEach(a => {
      (a.allocations || []).forEach(al => {
        allocationRows.push({ "Asset ID": a.label, Item: a.type === "Bulk Item" ? (a.notes || a.label) : a.label, Room: al.room, Quantity: al.quantity });
      });
    });

    const auditRows = auditLog.map(entry => ({
      "Asset ID": entry.assetLabel, Type: entry.assetType, When: formatWhen(entry.at),
      Action: entry.action, Detail: describeAudit(entry), "By": entry.by || "",
    }));

    const breakerRows = [];
    const circuitRows = [];
    assets.forEach(a => {
      (a.breakers || []).forEach(b => {
        const breakerType = breakerTypes.find(t => t.id === b.breakerTypeId);
        breakerRows.push({
          Panel: a.label, "Slot(s)": slotsFromCells(b.cells).join("/"), "Amp Rating": b.ampRating || "",
          Poles: polesFromCells(b.cells), Type: breakerType ? breakerType.name : "", Status: b.status || "", Serial: b.serial || "",
          "Installed Date": b.installedDate || "", Notes: b.notes || "", Circuits: (b.circuits || []).length,
        });
        (b.circuits || []).forEach(c => {
          circuitRows.push({
            Panel: a.label, "Slot(s)": slotsFromCells(b.cells).join("/"), Circuit: c.label,
            Description: c.description || "",
            Serves: c.feedsPanelLabel ? `Feeds → ${c.feedsPanelLabel}` : (c.roomsServed || []).join(", "),
          });
        });
      });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assetRows), "Assets");
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(changeRows.length ? changeRows : [{ "Asset ID": "", Type: "", Room: "", When: "", "Change type": "", Vendor: "", Cost: "", Note: "", "Logged by": "" }]),
      "Changes"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(commentRows.length ? commentRows : [{ "Asset ID": "", Type: "", Room: "", When: "", Comment: "", "Logged by": "" }]),
      "Comments"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(allocationRows.length ? allocationRows : [{ "Asset ID": "", Item: "", Room: "", Quantity: "" }]),
      "Allocations"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(breakerRows.length ? breakerRows : [{
        Panel: "", "Slot(s)": "", "Amp Rating": "", Poles: "", Mount: "", Status: "", Serial: "", "Installed Date": "", Notes: "", Circuits: "",
      }]),
      "Breakers"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(circuitRows.length ? circuitRows : [{ Panel: "", "Slot(s)": "", Circuit: "", Description: "", Serves: "" }]),
      "Circuits"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(auditRows.length ? auditRows : [{ "Asset ID": "", Type: "", When: "", Action: "", Detail: "", "By": "" }]),
      "Audit Log"

    XLSX.writeFile(wb, "brookside-asset-inventory.xlsx");
  }

  if (loadError) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Sans', sans-serif", padding: 16 }}>
        <div style={{ background: C.surface, border: `1.5px solid ${C.danger}`, borderRadius: 10, padding: 24, width: "100%", maxWidth: 380, textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 16, color: C.danger, marginBottom: 8 }}>Couldn't load inventory</div>
          <div style={{ fontSize: 14, color: C.muted, marginBottom: 20 }}>
            The app couldn't reach the Google Sheets backend. Nothing has been changed — check your connection and try again.
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
            <button onClick={loadData} style={{ padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
              Try again
            </button>
            <button onClick={() => window.location.reload()} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 10, color: C.ink }}>
              Refresh page
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'IBM Plex Mono', monospace", color: C.muted }}>
        Loading inventory…
      </div>
    );
  }

  const globalStyle = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

      button:active { transform: translateY(0.5px); }
      .icon-btn { transition: background-color 0.15s ease; }
      .icon-btn:hover { background: ${C.hover} !important; }
      input, select, textarea { transition: border-color 0.15s ease, box-shadow 0.15s ease; }

      input:focus, select:focus, textarea:focus {

      .scroller::-webkit-scrollbar-track { background: ${C.hover}; }
