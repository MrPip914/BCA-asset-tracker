// A physical artifact, NOT a printout of the on-screen Table view: it ignores
// Table mode's room filter and sort entirely and always prints every slot,
// every breaker and every circuit — including the panel's `unassignedCircuits`,
// which sit on no slot at all and would otherwise vanish from the one document
// that's meant to be the complete record taped inside the panel door.
//
// Sized against the real panel rather than against paper. A standard breaker
// slot is 1" tall and a two-column panel stacks two slots per inch of panel
// height, so a panel's breaker area is slotCount/2 inches; listing slots
// sequentially 1→N inside that same height works out to a uniform 0.5" per slot
// row, with a 1" blank band top and bottom for trimming and tape.
//
// That row height is a MINIMUM, not a clamp: a slot carrying several circuits,
// or one long note, grows its row instead of clipping it. "Include every
// breaker and circuit" is the stated requirement, and it beats matching the
// panel's height to the millimetre when the two conflict.
const LEGEND_ROW_IN = 0.5;     // one slot row — see the slotCount/2 reasoning above
const LEGEND_BAND_IN = 1;      // blank trim/tape band above and below
const LEGEND_WIDTH_IN = 7.5;   // letter portrait minus 0.5" side margins
const LEGEND_SIDE_PAD_IN = 0.5;

// What a circuit feeds, in the terse form a door card needs: room names, or the
// downstream panel for a sub-panel feed — with that panel's room appended,
// since a bare asset id means nothing to whoever's standing at the panel.
function legendServes(circuit, allAssets) {
  if (circuit.feedsPanelLabel) {
    const target = allAssets.find(a => a.label === circuit.feedsPanelLabel);
    const room = target ? roomNameOf(target, allAssets) : "";
    return `Feeds → ${circuit.feedsPanelLabel}${room ? ` (${room})` : ""}`;
  }
  return (circuit.roomsServedIds || []).map(id => roomNameFor(id, allAssets)).filter(Boolean).join(", ");
}

function PanelLegendCard({ slotCount, breakers, unassignedCircuits, allAssets, panelAsset, mode, pageHeightIn }) {
  const tiled = mode === "tiled";
  // The panel's own height is the FLOOR, not the answer. Rows grow past their
  // 0.5" minimum whenever a slot carries several circuits or a long note, and
  // the unassigned-circuit section adds height no slot count predicts — so a
  // page sized from slotCount alone spills a few inches onto a second sheet.
  // pageHeightIn is that card measured for real just before printing (see
  // runPrint in PanelDiagram); it falls back to the computed floor if the
  // measurement couldn't run.
  const cardHeightIn = slotCount * LEGEND_ROW_IN + LEGEND_BAND_IN * 2;
  const pageHeight = Math.max(cardHeightIn, pageHeightIn || 0);

  // Which breakers touch each slot. Both directions are many: a slot can hold
  // more than one breaker (a tandem is two breakers sharing slot 1, as 1a and
  // 1b) and one breaker can touch more than one slot (a double-pole on 1 + 3).
  const bySlot = new Map();
  breakers.forEach(b => slotsFromCells(b.cells).forEach(s => {
    const n = parseInt(s, 10);
    if (!n) return;
    if (!bySlot.has(n)) bySlot.set(n, []);
    bySlot.get(n).push(b);
  }));
  const anchorSlot = b => Math.min(...slotsFromCells(b.cells).map(Number));

  // One "line" per circuit rather than per slot, so the Serves and Notes columns
  // stay aligned when a breaker carries several circuits. Each slot's lines then
  // split that slot's 0.5" between them, keeping the physical scale intact.
  //
  // A breaker spanning non-adjacent slots (1 and 3) can't be a rowSpan in a
  // sequential 1→N list — slot 2 sits between them — so it prints in full on its
  // lowest slot and leaves a pointer on the others, the way a paper directory
  // brackets a 240V pair.
  const slots = [];
  for (let s = 1; s <= slotCount; s++) {
    const here = [...(bySlot.get(s) || [])].sort((a, b) =>
      String((a.cells || []).slice().sort()[0] || "").localeCompare(
        String((b.cells || []).slice().sort()[0] || ""), undefined, { numeric: true }));
    const lines = [];
    here.forEach(b => {
      const span = cellsLabel_(b);
      const badge = span !== String(s) ? span : "";
      if (anchorSlot(b) !== s) { lines.push({ kind: "cont", badge, span }); return; }
      const circuits = b.circuits || [];
      if (circuits.length === 0) { lines.push({ kind: "empty", badge }); return; }
      circuits.forEach(c => lines.push({ kind: "circuit", badge, serves: legendServes(c, allAssets), notes: c.notes || "" }));
    });
    if (lines.length === 0) lines.push({ kind: "spare" });
    slots.push({ slot: s, lines });
  }

  const rule = "0.5pt solid #999";
  const cellBase = { border: rule, padding: "2pt 4pt", verticalAlign: "top" };
  const slotCell = { ...cellBase, fontFamily: "'IBM Plex Mono', monospace", fontSize: "9pt", fontWeight: 700, textAlign: "center", verticalAlign: "middle" };
  const servesCell = { ...cellBase, fontSize: "8.5pt", fontWeight: 600, color: "#000" };
  const notesCell = { ...cellBase, fontSize: "7.5pt", color: "#333", whiteSpace: "pre-line", lineHeight: 1.25 };
  const headCell = { border: rule, background: "#E4E4E4", padding: "3pt 4pt", fontSize: "7pt", fontWeight: 700, letterSpacing: "0.5pt", textTransform: "uppercase", textAlign: "left" };
  const badgeStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: "6.5pt", fontWeight: 700, color: "#555", border: "0.5pt solid #999", borderRadius: "2pt", padding: "0 2pt", marginRight: "3pt" };

  const room = roomNameOf(panelAsset, allAssets);
  const building = buildingNameOf(panelAsset, allAssets);
  const place = [room, building].filter(Boolean).join(" · ");

  // The dynamic half of the print CSS. In exact mode the page IS the card, so
  // @page carries the computed physical size and zero margin and the card
  // supplies its own 1" bands. In tiled mode the page is plain letter and its
  // margin does that job, so the bands collapse.
  const css = `
    .panel-legend { display: none; }
    /* Deliberately OUTSIDE @media print: the measuring pass below lays this out
       on screen, and it has to be the identical layout or the height it reports
       is not the height that prints. Harmless on screen — the card is
       display:none unless printing or measuring. */
    .panel-legend { font-family: 'IBM Plex Sans', sans-serif; color: #000; background: #fff; }
    .panel-legend table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    .panel-legend thead { display: table-header-group; }
    .panel-legend tr { break-inside: avoid; page-break-inside: avoid; }
    .panel-legend.measuring {
      display: block; position: absolute; left: -10000px; top: 0;
      width: ${LEGEND_WIDTH_IN}in;
    }
    @media print {
      ${tiled ? "@page { size: letter portrait; margin: 0.5in; }" : `@page { size: ${LEGEND_WIDTH_IN}in ${pageHeight.toFixed(2)}in; margin: 0; }`}
      /* The card is portalled to <body>, a sibling of #root rather than a
         descendant, so print is a straight swap of which one displays. The
         alternative — leaving it in the tree and hiding the app around it —
         needs the card absolutely positioned to avoid inheriting the hidden-
         but-still-laid-out app's offset, and that silently breaks the day
         anyone wraps the panel view in a position:relative container. */
      #root { display: none !important; }
      .panel-legend { display: block; width: 100%; }
      .panel-legend th, .panel-legend td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  `;

  return createPortal(
    <div className="panel-legend" aria-hidden="true">
      <style>{css}</style>
      <div style={{ minHeight: tiled ? 0 : `${cardHeightIn}in`, padding: tiled ? 0 : `0 ${LEGEND_SIDE_PAD_IN}in`, display: "flex", flexDirection: "column" }}>
        <div style={{ height: tiled ? "auto" : `${LEGEND_BAND_IN}in`, display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: "8pt", paddingBottom: "4pt", marginBottom: "4pt", borderBottom: "1.5pt solid #000" }}>
          <div>
            <div style={{ fontSize: "13pt", fontWeight: 700, lineHeight: 1.1 }}>{panelAsset.label} — Circuit Directory</div>
            <div style={{ fontSize: "8pt", color: "#333", marginTop: "2pt" }}>
              {place ? `${place} · ` : ""}{slotCount} slots
            </div>
          </div>
          <div style={{ fontSize: "7.5pt", color: "#333", whiteSpace: "nowrap" }}>Printed {new Date().toLocaleDateString()}</div>
        </div>

        <table>
          <colgroup>
            <col style={{ width: "0.5in" }} />
            <col style={{ width: "2.1in" }} />
            <col />
          </colgroup>
          <thead>
            <tr>
              <th style={{ ...headCell, textAlign: "center" }}>Slot</th>
              <th style={headCell}>Serves</th>
              <th style={headCell}>Notes</th>
            </tr>
          </thead>
          <tbody>
            {slots.map(({ slot, lines }) => lines.map((ln, i) => (
              <tr key={`${slot}-${i}`} style={{ height: `${LEGEND_ROW_IN / lines.length}in` }}>
                {i === 0 && <td rowSpan={lines.length} style={slotCell}>{slot}</td>}
                {ln.kind === "spare" ? (
                  /* Left deliberately blank — a spare slot is where an
                     electrician hand-writes a newly added circuit at the panel. */
                  <td colSpan={2} style={cellBase} />
                ) : ln.kind === "cont" ? (
                  <td colSpan={2} style={{ ...cellBase, fontSize: "7.5pt", color: "#555", fontStyle: "italic" }}>
                    ↑ same breaker as slot {ln.span}
                  </td>
                ) : ln.kind === "empty" ? (
                  <td colSpan={2} style={{ ...cellBase, fontSize: "7.5pt", color: "#777" }}>
                    {ln.badge && <span style={badgeStyle}>{ln.badge}</span>}
                    breaker installed — no circuits recorded
                  </td>
                ) : (
                  <>
                    <td style={servesCell}>
                      {ln.badge && <span style={badgeStyle}>{ln.badge}</span>}
                      {ln.serves || "—"}
                    </td>
                    <td style={notesCell}>{ln.notes}</td>
                  </>
                )}
              </tr>
            )))}
          </tbody>
        </table>

        {unassignedCircuits.length > 0 && (
          <div style={{ marginTop: "10pt" }}>
            <div style={{ fontSize: "8pt", fontWeight: 700, letterSpacing: "0.5pt", textTransform: "uppercase", marginBottom: "3pt" }}>
              Unassigned circuits — not landed on a breaker
            </div>
            <table>
              <colgroup>
                <col style={{ width: "2.6in" }} />
                <col />
              </colgroup>
              <tbody>
                {unassignedCircuits.map(c => (
                  <tr key={c.id}>
                    <td style={servesCell}>{legendServes(c, allAssets) || c.label || "—"}</td>
                    <td style={notesCell}>{c.notes || ""}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {tiled && (
          <div style={{ fontSize: "7pt", color: "#555", marginTop: "8pt" }}>
            Cut along the table edge and tape the pages end-to-end in slot order.
          </div>
        )}
        <div style={{ height: tiled ? 0 : `${LEGEND_BAND_IN}in`, flexShrink: 0 }} />
      </div>
    </div>,
    document.body
  );
}

function PanelDiagram({ slotCount, layout, breakers, unassignedCircuits, allAssets, breakerTypes, panelAsset, panelLabel, onReconfigure, onSlotClick, onSpareClick, canEdit }) {
  // Clicking an empty slot is how a breaker gets ADDED, so it's inert for a
  // viewer. Guarded here rather than by not rendering the cells, because the
  // empty slots are meaningful information on a panel diagram — "nothing is in
  // slot 14" is something you want to see; you just can't act on it.
  const handleSpareClick = slot => { if (canEdit) onSpareClick(slot); };
  const [infoMode, setInfoMode] = useState("breaker"); // "breaker" | "feeds" | "table"
  const [linkCopied, setLinkCopied] = useState(false);
  // Printing the door card. `printMode` picks the page geometry (see
  // PanelLegendCard); `printRequest` is a counter rather than a boolean so
  // printing the same mode twice in a row still fires the effect. The deferral
  // is what lets the swapped-in @page rule reach the stylesheet before
  // window.print() reads it — calling print() straight from the click handler
  // runs against the previous render. It's a timer and NOT requestAnimationFrame:
  // rAF doesn't fire while the page isn't compositing, so a user who clicked and
  // immediately switched tabs would get no print dialog at all until they came
  // back. A timer fires either way.
  const [printMenuOpen, setPrintMenuOpen] = useState(false);
  const [printMode, setPrintMode] = useState("exact"); // "exact" | "tiled"
  const [printPageHeightIn, setPrintPageHeightIn] = useState(null);
  const [printRequest, setPrintRequest] = useState(0);
  useEffect(() => {
    if (!printRequest) return;
    const t = setTimeout(() => window.print(), 0);
    return () => clearTimeout(t);
  }, [printRequest]);
  // Exact mode sizes the page to the card, so it needs the card's real height —
  // which a display:none element doesn't have. The .measuring class lays it out
  // off-screen at the final print width for one synchronous read (CSS inches are
  // 96px by definition, so the conversion is exact), then it goes back to hidden
  // before the browser ever paints a frame with it visible.
  //
  // Called when the menu OPENS, not just on print, so the menu can quote the
  // size that will actually come out. Quoting the slotCount floor instead would
  // understate it by inches on any panel with long notes — and the number's
  // whole job is to tell you whether the card fits the door.
  function measureCard() {
    const el = document.querySelector(".panel-legend");
    if (!el) return;
    el.classList.add("measuring");
    const h = el.getBoundingClientRect().height / 96;
    el.classList.remove("measuring");
    setPrintPageHeightIn(h);
  }
  function togglePrintMenu() {
    setPrintMenuOpen(open => {
      if (!open) measureCard();
      return !open;
    });
  }
  function runPrint(mode) {
    setPrintMenuOpen(false);
    measureCard();
    setPrintMode(mode);
    setPrintRequest(n => n + 1);
  }
  // Table mode's own sort/filter state — same ColumnHeaderCell/ColumnFilterModal
  // pattern the Assets/Maintenance tables use (see CLAUDE.md), just local to this
  // component instead of living on AssetTracker, since a panel's breaker table is
  // self-contained data no other tab needs to read.
  const [tableSortConfig, setTableSortConfig] = useState(null);
  const [tableRoomFilter, setTableRoomFilter] = useState("");
  const [tableActiveFilterCol, setTableActiveFilterCol] = useState(null);

  // Builds a link back to this exact panel's Breakers tab (?asset=...&tab=breakers,
  // consumed by the one-time deep-link effect in AssetTracker) and copies it to the
  // clipboard. Falls back to the older execCommand approach when the async Clipboard
  // API isn't available (e.g. a plain file:// page, which isn't a secure context).
  function copyPanelLink() {
    const url = `${window.location.origin}${window.location.pathname}?asset=${encodeURIComponent(panelLabel)}&tab=breakers`;
    const onCopied = () => { setLinkCopied(true); setTimeout(() => setLinkCopied(false), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(onCopied).catch(() => fallbackCopyToClipboard(url, onCopied));
    } else {
      fallbackCopyToClipboard(url, onCopied);
    }
  }
  // Opens the bulk QR label tool with just this panel preselected, so a single
  // replacement sticker doesn't mean printing the whole set. Deliberately a
  // hand-off rather than a QR rendered inline: drawing one here would mean
  // pulling a QR encoder into index.html — another CDN module on an already
  // heavy page — for a button most sessions never press. panel-qr-sheet.html
  // already has the encoder, the print layout, and the label sizing.
  function openPanelQrSheet() {
    const base = `${window.location.origin}${window.location.pathname}`.replace(/[^/]*$/, "");
    window.open(`${base}panel-qr-sheet.html?only=${encodeURIComponent(panelLabel)}`, "_blank", "noopener");
  }
  const columns = layout === "single-column" ? 1 : 2;
  const rowOf = n => (columns === 1 ? n : Math.ceil(n / 2));
  const colOf = n => (columns === 1 ? 0 : (n % 2 === 1 ? 0 : 1));
  // Grid tracks, left to right: [numLeft] [breaker col 0] [breaker col 1] [numRight]
  // (single-column collapses to [num] [breaker]). Breaker col -> track, and
  // the number track on that same side.
  const breakerTrack = col => (columns === 1 ? 2 : col + 2);
  const numberTrack = col => (columns === 1 ? 1 : (col === 0 ? 1 : 4));
  const gridTemplateColumns = columns === 1 ? "28px 1fr" : "28px 1fr 1fr 28px";

  // Every slot a breaker touches is derived from its cells (see
  // BREAKER_TYPES_ARCHITECTURE.md) — slotMap is just "which breakers touch
  // this slot at all," used below to find the group anchored there.
  const slotMap = {};
  breakers.forEach(b => slotsFromCells(b.cells).forEach(s => {
    const n = parseInt(s, 10);
    if (!n) return;
    (slotMap[n] = slotMap[n] || []).push(b);
  }));

  const covered = new Set();
  const cells = [];
  for (let s = 1; s <= slotCount; s++) {
    if (covered.has(s)) continue;
    const here = slotMap[s] || [];
    const col = colOf(s);
    const row = rowOf(s);

    if (here.length === 0) {
      cells.push({ key: `spare-${s}`, col, row, rowSpan: 1, kind: "spare", slot: s });
      continue;
    }
    // Every breaker placed via Add Breaker carries a groupId (even a lone
    // single-pole/double-pole — a "group" of one) — so grouping is always
    // just "every breaker sharing this groupId," regardless of how many
    // slots or members it has. A group of >1 renders as a vertical stack
    // (the same cell shape whether it's a tandem, quad, or any custom
    // BreakerType); a group of 1 renders as the plain single cell.
    const groupId = here[0].groupId;
    const groupBreakers = groupId ? breakers.filter(b => b.groupId === groupId) : [here[0]];
    const groupSlots = [...new Set(groupBreakers.flatMap(b => slotsFromCells(b.cells).map(x => parseInt(x, 10))))].sort((a, b2) => a - b2);
    if (groupSlots[0] !== s) continue; // reached via a non-primary slot; the primary slot already covers it
    groupSlots.filter(x => x !== s).forEach(x => covered.add(x));
    const rows = groupSlots.map(rowOf);
    const rowSpan = Math.max(...rows) - Math.min(...rows) + 1;
    if (groupBreakers.length > 1) {
      // Sort each breaker ONCE by its own minimum slot — not by bucketing
      // "which slots does this breaker touch" (a breaker spanning 2 slots,
      // like the middle breaker of a split double-pole, would then get
      // listed once per slot it touches and render as a duplicate box).
      const orderedBreakers = [...groupBreakers].sort((b1, b2) => {
        const s1 = Math.min(...slotsFromCells(b1.cells).map(Number));
        const s2 = Math.min(...slotsFromCells(b2.cells).map(Number));
        return s1 - s2;
      });
      cells.push({ key: `group-${groupId}`, col, row: Math.min(...rows), rowSpan, kind: "tandem", breakers: orderedBreakers, slot: s });
    } else {
      cells.push({ key: `breaker-${groupBreakers[0].id}`, col, row: Math.min(...rows), rowSpan, kind: "breaker", breaker: groupBreakers[0], slot: s });
    }
  }

  // Slot numbers print independently of the breaker cells above — every
  // slot gets its own number at its own row, even when a double-pole
  // breaker's cell spans two of them.
  const numbers = [];
  for (let s = 1; s <= slotCount; s++) {
    numbers.push({ key: `num-${s}`, slot: s, col: colOf(s), row: rowOf(s) });
  }

  // Every slot a group occupies must have the SAME parity, i.e. sit in one
  // column — see BREAKER_TYPES_ARCHITECTURE.md section 4. The grid math above
  // relies on it: a group is anchored at its lowest slot, takes its column from
  // that one slot, and spans rowSpan rows there, so a group straddling both
  // columns gets drawn on top of its neighbours while the slots it covers render
  // nothing. Anything placed through Add Breaker satisfies this by construction
  // (resolveTypeSlots steps by 2), but a scripted or imported write can violate
  // it — sample data once did, and the only symptom was silently overlapping
  // cells that read as a rendering glitch rather than bad data. Surfacing it is
  // the whole point; the diagram deliberately still draws it as-is.
  const parityWarnings = [];
  {
    const byGroup = {};
    breakers.forEach(b => {
      const key = b.groupId || `solo-${b.id}`;
      (byGroup[key] = byGroup[key] || []).push(b);
    });
    Object.keys(byGroup).forEach(key => {
      const slots = [...new Set(byGroup[key].flatMap(b => slotsFromCells(b.cells).map(x => parseInt(x, 10))))]
        .filter(Boolean).sort((a, b2) => a - b2);
      if (slots.length > 1 && new Set(slots.map(n => n % 2)).size > 1) parityWarnings.push(slots.join("+"));
    });
  }

  // What a cell shows in "feeds" mode — what the breaker's circuit(s) actually
  // serve (rooms, or a downstream sub-panel), not the circuit's own label or
  // its electrical spec.
  function feedInfo(breaker) {
    const circuits = breaker.circuits || [];
    if (circuits.length === 0) return { primary: "—", secondary: "no circuits" };
    const roomIds = [...new Set(circuits.flatMap(c => c.roomsServedIds || []))];
    const subPanels = [...new Set(circuits.filter(c => c.feedsPanelLabel).map(c => c.feedsPanelLabel))];
    const parts = [...roomIds.map(id => roomNameFor(id, allAssets)), ...subPanels.map(p => `→ ${p}`)];
    return { primary: parts.join(", ") || "—", secondary: "" };
  }
  function breakerInfo(breaker) {
    return { primary: breaker.ampRating ? `${breaker.ampRating}A` : "—", secondary: "" };
  }
  const cellInfo = infoMode === "feeds" ? feedInfo : breakerInfo;

  const cellBase = {
    borderRadius: 8, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
    cursor: "pointer", padding: "4px", gap: 2, background: "#fff", textAlign: "center", overflow: "hidden",
  };

  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, marginBottom: 20, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
            Panel Layout — {slotCount} slots
          </span>
          {canEdit && (
          <button onClick={onReconfigure} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", color: C.muted }} aria-label="Reconfigure panel layout">
            <Settings size={14} />
          </button>
          )}
          {/* Copy link and the QR sticker are reads — a viewer standing at a
              panel is exactly who needs them. */}
          <button onClick={copyPanelLink} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", gap: 4, color: linkCopied ? C.success : C.muted }} aria-label="Copy link to this panel">
            {linkCopied ? <Check size={14} /> : <Copy size={14} />}
            {linkCopied && <span style={{ fontSize: 11, fontWeight: 600 }}>Copied!</span>}
          </button>
          <button onClick={openPanelQrSheet} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", color: C.muted }} aria-label="Print a QR sticker for this panel">
            <QrCode size={14} />
          </button>
          {/* Prints the door card, which is built from the panel's own data —
              so this sits outside the Breaker/Feeds/Table toggle and is offered
              in all three modes, not just Table. The two entries are page
              geometry, not content: both print the identical card. */}
          <div style={{ position: "relative", display: "flex" }}>
            <button onClick={togglePrintMenu} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex", alignItems: "center", color: C.muted }} aria-label="Print circuit directory">
              <Printer size={14} />
            </button>
            {printMenuOpen && (
              <>
                <div onClick={() => setPrintMenuOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 40 }} />
                <div style={{ position: "absolute", top: "100%", left: 0, marginTop: 4, zIndex: 41, background: C.surface, border: `1.5px solid ${C.border}`, borderRadius: 10, boxShadow: "0 4px 12px rgba(42,52,57,0.15)", minWidth: 240, overflow: "hidden" }}>
                  {[
                    ["exact", "Print at panel size", `${LEGEND_WIDTH_IN}" × ${Math.max(slotCount * LEGEND_ROW_IN + LEGEND_BAND_IN * 2, printPageHeightIn || 0).toFixed(1)}" — one page, true scale. Save as PDF.`],
                    ["tiled", "Tile across letter pages", "Cut and tape end-to-end. For printing at home."],
                  ].map(([mode, title, hint]) => (
                    <button
                      key={mode} type="button" onClick={() => runPrint(mode)}
                      style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "none", border: "none", borderTop: mode === "tiled" ? `1px solid ${C.border}` : "none" }}
                    >
                      <div style={{ fontSize: 13, fontWeight: 600, color: C.ink }}>{title}</div>
                      <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>{hint}</div>
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
        <div style={{ display: "flex", border: `1.5px solid ${C.border}`, borderRadius: 8, overflow: "hidden" }}>
          {[["breaker", "Breaker"], ["feeds", "Feeds"], ["table", "Table"]].map(([val, label]) => (
            <button
              key={val} type="button" onClick={() => setInfoMode(val)}
              style={{ padding: "5px 10px", fontSize: 12, fontWeight: 600, border: "none", cursor: "pointer", background: infoMode === val ? C.brand : "#fff", color: infoMode === val ? "#fff" : C.ink }}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
      {parityWarnings.length > 0 && (
        <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 12px", marginBottom: 12, border: `1.5px solid ${C.danger}`, borderRadius: 8, background: "#fff" }}>
          <AlertTriangle size={16} style={{ color: C.danger, flexShrink: 0, marginTop: 1 }} />
          <div style={{ fontSize: 13, color: C.ink }}>
            <b>Invalid breaker placement:</b> slots {parityWarnings.join("; ")}.{" "}
            A breaker spanning more than one slot must occupy slots in a single column (e.g. 22 and 24, not 22 and 23) —
            these overlap other breakers in the diagram until the data is corrected.
          </div>
        </div>
      )}
      {infoMode === "table" ? (() => {
        // One row per circuit (a breaker with no circuits yet still gets a single
        // row, circuit fields blank) — flat rows are what makes per-column sort
        // and the Room filter meaningful, unlike the grouped-by-slot diagram/table
        // toggle siblings. roomIds stays on the row (not just the display text) so
        // the Room filter can do a real membership check against a circuit that
        // serves more than one room, not a brittle string-contains match.
        const tableRows = [];
        [...cells].sort((a, b2) => a.slot - b2.slot).forEach(cell => {
          if (cell.kind === "spare") {
            tableRows.push({ key: cell.key, breakerId: null, spareSlot: cell.slot, slotSort: cell.slot, slotLabel: String(cell.slot), typeName: "Spare", ampRating: "", roomIds: [], roomText: "—", notes: "" });
            return;
          }
          const groupBreakers = cell.kind === "tandem" ? cell.breakers : [cell.breaker];
          const type = breakerTypes.find(t => t.id === groupBreakers[0].breakerTypeId);
          groupBreakers.forEach(b => {
            const circuits = (b.circuits && b.circuits.length) ? b.circuits : [null];
            circuits.forEach(c => {
              const roomIds = c ? (c.roomsServedIds || []) : [];
              const roomText = c
                ? (c.feedsPanelLabel ? `Feeds → ${c.feedsPanelLabel}` : roomIds.length ? roomIds.map(id => roomNameFor(id, allAssets)).join(", ") : "—")
                : "—";
              tableRows.push({
                key: `${b.id}-${c ? c.id : "none"}`, breakerId: b.id,
                slotSort: Math.min(...slotsFromCells(b.cells).map(Number)), slotLabel: cellsLabel_(b),
                typeName: type ? type.name : "—", ampRating: b.ampRating || "",
                roomIds, roomText, notes: c ? (c.notes || "") : "",
              });
            });
          });
        });

        const roomOptionIds = [...new Set(tableRows.flatMap(r => r.roomIds))]
          .sort((a2, b2) => roomNameFor(a2, allAssets).localeCompare(roomNameFor(b2, allAssets)));
        const tableFilterConfigs = {
          room: {
            label: "Room", value: tableRoomFilter, setValue: setTableRoomFilter, options: ["", ...roomOptionIds],
            labelForOption: id => (id ? roomNameFor(id, allAssets) : "All rooms"),
          },
        };

        let displayRows = tableRoomFilter ? tableRows.filter(r => r.roomIds.includes(tableRoomFilter)) : tableRows;
        if (tableSortConfig) {
          const mult = tableSortConfig.dir === "desc" ? -1 : 1;
          const sortValue = r => {
            if (tableSortConfig.key === "slot") return r.slotSort;
            if (tableSortConfig.key === "amp") return parseFloat(r.ampRating) || 0;
            return { type: r.typeName, room: r.roomText, notes: r.notes }[tableSortConfig.key] || "";
          };
          displayRows = [...displayRows].sort((a2, b2) => {
            const av = sortValue(a2), bv = sortValue(b2);
            if (typeof av === "number" && typeof bv === "number") return (av - bv) * mult;
            return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" }) * mult;
          });
        }
        // A breaker with multiple circuits gets one row per circuit, so Slot/Type/
        // Amp would otherwise repeat identically on every one of those rows — merge
        // them into one vertically-centered cell spanning every consecutive row for
        // that breaker instead. Based on adjacency in the already-sorted/filtered
        // list, not a stored "first of group" flag, so it still does the right thing
        // regardless of sort order: rows only merge when they actually land next to
        // each other. mergeSpan is only set on the first row of a run; 0 means "this
        // row's Slot/Type/Amp cells are covered by an earlier row's merged cell,
        // don't render them here at all."
        displayRows = displayRows.map((r, i) => {
          const isFirst = !(i > 0 && r.breakerId && displayRows[i - 1].breakerId === r.breakerId);
          if (!isFirst) return { ...r, mergeSpan: 0 };
          let span = 1;
          while (displayRows[i + span] && r.breakerId && displayRows[i + span].breakerId === r.breakerId) span++;
          return { ...r, mergeSpan: span };
        });

        // Fixed px for every column, not 1fr/flex fractions — a fractional track
        // resolves relative to its grid's own natural width, which drifted between
        // rows back when each row was its own separate grid container. Body rows
        // now all share ONE grid container (needed for the Slot/Type/Amp row-span
        // above), so that particular failure mode can't recur here anymore, but the
        // header is still a separate grid and needs to land on the same boundaries.
        const tableCols = "70px 190px 220px 210px 90px";
        const cellStyle = (col, span, borderTop) => ({
          gridColumn: col, gridRow: span ? `span ${span}` : undefined,
          padding: "10px 12px", borderTop: borderTop ? `1px solid ${C.border}` : "none",
          display: "flex", alignItems: "center", cursor: "pointer",
        });
        return (
          <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden" }}>
            <div className="scroller" style={{ overflowX: "auto" }}>
              <div style={{ display: "grid", gridTemplateColumns: tableCols, background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
                {[["slot", "Slot"], ["room", "Room"], ["notes", "Notes"], ["type", "Type"], ["amp", "Amp"]].map(([key, label]) => (
                  <ColumnHeaderCell key={key} label={label} colKey={key} filterConfigs={tableFilterConfigs} sortConfig={tableSortConfig} setSortConfig={setTableSortConfig} onOpenFilter={setTableActiveFilterCol} />
                ))}
              </div>
              {displayRows.length === 0 ? (
                <div style={{ padding: 24, textAlign: "center", color: C.empty, fontSize: 13, minWidth: "max-content" }}>No circuits match.</div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: tableCols, gridAutoRows: "auto", minWidth: "max-content" }}>
                  {displayRows.map((r, i) => {
                    const onRowClick = () => { if (r.breakerId) onSlotClick(r.breakerId); else if (r.spareSlot) handleSpareClick(r.spareSlot); };
                    const top = i > 0;
                    return (
                      <React.Fragment key={r.key}>
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(1, r.mergeSpan, top), fontSize: 13, fontFamily: "'IBM Plex Mono', monospace", color: C.ink }}>
                            {r.slotLabel}
                          </div>
                        )}
                        <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(2, 0, top), fontSize: 13, color: C.ink }}>{r.roomText}</div>
                        <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(3, 0, top), fontSize: 12, color: C.muted, whiteSpace: "pre-line" }}>{r.notes || "—"}</div>
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(4, r.mergeSpan, top), fontSize: 13, color: C.ink }}>
                            {r.typeName}
                          </div>
                        )}
                        {r.mergeSpan !== 0 && (
                          <div onClick={onRowClick} className="row-body" style={{ ...cellStyle(5, r.mergeSpan, top), fontSize: 13, color: C.ink }}>
                            {r.ampRating ? `${r.ampRating}A` : "—"}
                          </div>
                        )}
                      </React.Fragment>
                    );
                  })}
                </div>
              )}
            </div>
            <ColumnFilterModal activeCol={tableActiveFilterCol} filterConfigs={tableFilterConfigs} sortConfig={tableSortConfig} setSortConfig={setTableSortConfig} onClose={() => setTableActiveFilterCol(null)} />
          </div>
        );
      })() : (
      <div style={{ display: "grid", gridTemplateColumns, gridAutoRows: "44px", gap: 6, width: "100%" }}>
        {numbers.map(n => (
          <div
            key={n.key}
            style={{
              gridColumn: numberTrack(n.col), gridRow: n.row,
              display: "flex", alignItems: "center",
              justifyContent: columns === 1 ? "center" : (n.col === 0 ? "flex-end" : "flex-start"),
              fontSize: 11, fontWeight: 700, color: C.muted, fontFamily: "'IBM Plex Mono', monospace",
            }}
          >
            {n.slot}
          </div>
        ))}
        {cells.map(cell => {
          if (cell.kind === "spare") {
            return (
              <button
                key={cell.key} type="button" onClick={() => handleSpareClick(cell.slot)}
                style={{ gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px dashed ${C.border}`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: C.placeholder, background: "none", cursor: "pointer" }}
              >
                spare
              </button>
            );
          }
          if (cell.kind === "tandem") {
            return (
              <div key={cell.key} style={{ gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px solid ${C.border}`, borderRadius: 8, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                {cell.breakers.map((b, i) => {
                  const info = cellInfo(b);
                  return (
                    <button
                      key={b.id} onClick={() => onSlotClick(b.id)} type="button"
                      style={{ flex: 1, border: "none", borderTop: i > 0 ? `1px solid ${C.border}` : "none", background: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", padding: "2px 4px", overflow: "hidden" }}
                    >
                      <span style={{ fontSize: 9, fontWeight: 700, color: C.brandDark }}>{info.primary}</span>
                      <span style={{ fontSize: 8, color: C.muted, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden", maxWidth: "100%" }}>{info.secondary}</span>
                    </button>
                  );
                })}
              </div>
            );
          }
          const b = cell.breaker;
          const info = cellInfo(b);
          return (
            <button
              key={cell.key} onClick={() => onSlotClick(b.id)} type="button"
              style={{ ...cellBase, gridColumn: breakerTrack(cell.col), gridRow: `${cell.row} / span ${cell.rowSpan}`, border: `1.5px solid ${C.border}` }}
            >
              <span style={{ fontSize: 11, fontWeight: 700, color: C.brandDark }}>{info.primary}</span>
              <span style={{ fontSize: 9, color: C.muted, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden", maxWidth: "100%" }}>{info.secondary}</span>
            </button>
          );
        })}
      </div>
      )}
      {/* Always mounted, never visible on screen (.panel-legend is display:none
          until @media print). Rendering it only on demand would mean printing a
          card the browser hasn't laid out yet. */}
      <PanelLegendCard
        slotCount={slotCount}
        breakers={breakers}
        unassignedCircuits={unassignedCircuits || []}
        allAssets={allAssets}
        panelAsset={panelAsset}
        mode={printMode}
        pageHeightIn={printPageHeightIn}
      />
    </div>
  );
}

// A circuit's "what does this feed?" control — the rooms-vs-sub-panel either/or
// that doesn't fit ChildEntityTable's generic field types, so it goes in through
// its renderCustomFields hook. Top-level (not a closure inside the breaker modal
// where it started) because the same control now appears in two places: the
// circuits under a breaker, and the panel's unassigned-circuit list. Same rule in
// both — a circuit serves rooms OR feeds a downstream sub-panel, never both —
// enforced for real in validateCircuitDraft; this just makes the choice visible.
// The rooms a circuit serves — several, so this is the multi-select face of
// HierarchyBrowserModal. It replaced a flat wrap of one chip per Room in the
// school: fine at four rooms, a wall at forty, and with no building shown two
// rooms both called "Kitchen" were indistinguishable.
//
// The chips stay, but as a summary of what's CHOSEN rather than the whole
// catalogue — they're the answer to "what does this circuit serve", which is the
// thing you want visible while filling the form in. Tapping one removes it, so
// the common correction never needs the browser at all. Each chip carries its
// building when there is one, since that's the ambiguity that started this.
function RoomsServedField({ value, onChange, assets }) {
  const [open, setOpen] = useState(false);
  const all = assets || [];
  const selected = value || [];
  const anyRooms = all.some(a => a.type === "Room");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      {selected.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {selected.map(id => {
            const room = all.find(a => a.label === id);
            const where = room ? buildingNameOf(room, all) : "";
            return (
              <button
                key={id}
                type="button"
                onClick={() => onChange(selected.filter(x => x !== id))}
                aria-label={`Remove ${room ? nameOf(room) : id}`}
                style={{ display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 14, fontSize: 13, fontWeight: 600, border: `1.5px solid ${C.brand}`, background: C.brand, color: "#fff" }}
              >
                {room ? nameOf(room) : "(deleted room)"}
                {where && <span style={{ fontWeight: 400, opacity: 0.85 }}>· {where}</span>}
                <X size={13} />
              </button>
            );
          })}
        </div>
      )}
      {!anyRooms ? (
        <div style={{ fontSize: 13, color: C.empty }}>No Room assets yet.</div>
      ) : (
        <button
          type="button"
          onClick={() => setOpen(true)}
          style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", borderRadius: 10, fontSize: 13, fontWeight: 600, border: `1.5px dashed ${C.border}`, background: "transparent", color: C.brandDark }}
        >
          <Plus size={14} /> {selected.length ? "Add or change rooms" : "Choose rooms"}
        </button>
      )}
      {open && (
        <HierarchyBrowserModal
          title="Select rooms"
          hint="Choose one or more Rooms"
          assets={all}
          isSelectable={a => a.type === "Room"}
          multi
          value={selected}
          onChange={onChange}
          onClose={() => setOpen(false)}
        />
      )}
    </div>
  );
}

function CircuitTargetFields({ values, setValues, assets, otherPanels }) {
  const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent };
  const mode = values.feedsPanelLabel ? "subpanel" : (values._mode || "rooms");
  const roomsSelected = values.roomsServedIds || [];
  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 8 }}>
      <span style={labelStyle}>Serves</span>
      <div style={{ display: "flex", gap: 6 }}>
        <button
          type="button"
          onClick={() => setValues({ ...values, _mode: "rooms", feedsPanelLabel: "" })}
          style={{ flex: 1, padding: "7px 10px", background: mode === "rooms" ? C.brand : "transparent", color: mode === "rooms" ? "#fff" : C.ink, border: `1.5px solid ${mode === "rooms" ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
        >
          Serves rooms
        </button>
        <button
          type="button"
          onClick={() => setValues({ ...values, _mode: "subpanel", roomsServedIds: [] })}
          style={{ flex: 1, padding: "7px 10px", background: mode === "subpanel" ? C.brand : "transparent", color: mode === "subpanel" ? "#fff" : C.ink, border: `1.5px solid ${mode === "subpanel" ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
        >
          Feeds sub-panel
        </button>
      </div>
      {mode === "rooms" ? (
        <RoomsServedField
          value={roomsSelected}
          onChange={ids => setValues({ ...values, roomsServedIds: ids })}
          assets={assets}
        />
      ) : otherPanels.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No other Electrical Panel assets yet.</div>
      ) : (
        <PickerField
          label="Feeds a sub-panel"
          hideLabel
          value={values.feedsPanelLabel || ""}
          onChange={v => setValues({ ...values, feedsPanelLabel: v })}
          options={["", ...otherPanels.map(p => p.label)]}
          placeholder="Select a panel…"
          // A panel has no name of its own, so its Asset ID IS its identity —
          // but an ID alone ("BCA0083") is unidentifiable when you're standing in
          // front of four panels, so the location it's in is appended. This was a
          // bare list of ids before.
          labelForOption={id => {
            if (!id) return "Select a panel…";
            const p = otherPanels.find(x => x.label === id);
            if (!p) return id;
            const where = pathOf(p, assets);
            return where ? `${p.label} — ${where}` : p.label;
          }}
          title="Select a panel"
        />
      )}
    </div>
  );
}

// The shared field config for a Circuit row in ChildEntityTable — used by the
// circuits under a breaker and by the panel's unassigned list, so the two can't
// drift into showing different fields for the same entity.
const CIRCUIT_TABLE_FIELDS = [
  { key: "label", label: "Label", placeholder: "e.g. Outlets, Water Heater", wide: true },
  { key: "notes", label: "Notes", type: "textarea", wide: true, placeholder: "One callout per line, e.g.\n- North wall outlets\n- Closet outlets" },
];
const CIRCUIT_TABLE_INITIAL_DRAFT = { label: "", notes: "", roomsServedIds: [], feedsPanelLabel: "" };

// What a circuit row shows when collapsed: what it actually serves, then its
// per-callout notes. Shared for the same reason the field config above is.
function circuitSummary(circuit, assets) {
  return (
    <div>
      <div style={{ fontWeight: 600, fontSize: 13, color: C.ink }}>
        {circuit.feedsPanelLabel
          ? `Feeds → ${circuit.feedsPanelLabel}`
          : (circuit.roomsServedIds || []).length
          ? circuit.roomsServedIds.map(id => roomNameFor(id, assets)).join(", ")
          : circuit.label}
      </div>
      {circuit.notes && (
        <div style={{ fontSize: 12, color: C.muted, whiteSpace: "pre-line", marginTop: 2 }}>{circuit.notes}</div>
      )}
    </div>
  );
}

// Generic list/add/edit/delete UI for a structured child entity (id + fields).
// Built for Breakers and Circuits — validated against both real shapes in this
// same pass, not designed speculatively for a single call site. Field-driven
// (text/number/date/select/multiselect) covers the common cases;
// renderCustomFields covers anything that doesn't fit that shape (e.g. a
// circuit's rooms-vs-sub-panel toggle). Owns its own add/edit/expand/
// delete-confirm UI state — the caller just supplies items + field config +
// onAdd/onSave/onDelete. Actions that aren't a generic field edit (Swap
// Breaker, Move Circuit) live outside this component via customRowActions,
// which the caller uses to open its own dedicated modal.
function ChildEntityTable({
  items, fields, onAdd, onSave, onDelete, initialDraft,
  renderCustomFields, renderSummary, renderExpanded, customRowActions,
  addLabel, emptyMessage, canDelete, deleteConfirmMessage, highlightedId, hideAddButton,
  addOpen: addOpenProp, onAddOpenChange, isSaving,
  // Defaults true so a caller that predates view-only roles behaves as it always
  // did. Both current callers pass it explicitly; keep doing that rather than
  // relying on the default, since silently defaulting to "editable" is the wrong
  // way for a permission check to fail.
  canEdit = true,
}) {
  const [draft, setDraft] = useState(initialDraft);
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [expandedIds, setExpandedIds] = useState({});
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [addError, setAddError] = useState(null);
  const [editError, setEditError] = useState(null);
  // "Add" open state is normally internal, but a caller that wants its own
  // trigger button elsewhere on the page (e.g. a compact "+" next to a
  // section header instead of this component's own full-width button) can
  // control it externally by passing addOpen/onAddOpenChange.
  const [uncontrolledAddOpen, setUncontrolledAddOpen] = useState(false);
  const addOpen = addOpenProp !== undefined ? addOpenProp : uncontrolledAddOpen;
  const setAddOpen = onAddOpenChange || setUncontrolledAddOpen;

  function renderField(f, values, setValues) {
    // See dateOnly()'s comment: a date field may come back from the Sheet as a
    // full ISO timestamp instead of the plain "yyyy-MM-dd" a <input type="date">
    // requires — normalize so an already-round-tripped value still displays.
    const value = f.type === "date" ? dateOnly(values[f.key]) : values[f.key];
    const commonLabel = (
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        {f.label}
      </span>
    );
    if (f.type === "select") {
      return (
        <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
          {commonLabel}
          <PickerField
            label={f.label}
            hideLabel
            value={value || ""}
            onChange={v => setValues({ ...values, [f.key]: v })}
            options={["", ...(f.options || [])]}
            labelForOption={o => o || "Select…"}
            title={`Select ${f.label}`}
          />
        </label>
      );
    }
    if (f.type === "textarea") {
      return (
        <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
          {commonLabel}
          <textarea
            value={value || ""}
            onChange={e => setValues({ ...values, [f.key]: e.target.value })}
            placeholder={f.placeholder}
            rows={f.rows || 3}
            style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, resize: "vertical", fontFamily: "inherit" }}
          />
        </label>
      );
    }
    if (f.type === "multiselect") {
      const selected = Array.isArray(value) ? value : [];
      return (
        <div key={f.key} style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
          {commonLabel}
          {(f.options || []).length === 0 ? (
            <div style={{ fontSize: 13, color: C.empty }}>None available yet.</div>
          ) : (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {(f.options || []).map(opt => {
                const active = selected.includes(opt);
                return (
                  <button
                    key={opt}
                    type="button"
                    onClick={() => setValues({ ...values, [f.key]: active ? selected.filter(s => s !== opt) : [...selected, opt] })}
                    style={{
                      padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                      border: `1.5px solid ${active ? C.brand : C.border}`, background: active ? C.brand : "#fff", color: active ? "#fff" : C.ink,
                    }}
                  >
                    {opt}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      );
    }
    return (
      <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: f.wide ? "1 / -1" : undefined }}>
        {commonLabel}
        <input
          type={f.type === "number" ? "number" : f.type === "date" ? "date" : "text"}
          value={value || ""}
          onChange={e => setValues({ ...values, [f.key]: e.target.value })}
          placeholder={f.placeholder}
          style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
        />
      </label>
    );
  }

  function startEdit(item) {
    setEditingId(item.id);
    setEditDraft({ ...item });
    setEditError(null);
  }
  function cancelEdit() {
    setEditingId(null);
    setEditDraft(null);
    setEditError(null);
  }
  // onAdd/onSave may return a validation error string (e.g. slot overlap, or
  // "a save is already in flight") — when they do, the draft is kept as-is so
  // the user doesn't lose their input. The isSaving case therefore needs no
  // separate guard here: the caller's handler reports it like any other refusal.
  function saveEdit() {
    const error = onSave(editingId, editDraft);
    if (error) { setEditError(error); return; }
    cancelEdit();
  }
  function submitAdd() {
    const error = onAdd(draft);
    if (error) { setAddError(error); return; }
    setAddError(null);
    setDraft(initialDraft);
    setAddOpen(false);
  }
  function toggleExpanded(id) {
    setExpandedIds({ ...expandedIds, [id]: !expandedIds[id] });
  }

  return (
    <div>
      {addOpen ? (
        <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
            {fields.map(f => renderField(f, draft, setDraft))}
            {renderCustomFields && renderCustomFields(draft, setDraft, true)}
          </div>
          {addError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 8 }}>{addError}</div>}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <button
              onClick={() => { setAddOpen(false); setAddError(null); setDraft(initialDraft); }}
              style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}
            >
              Cancel
            </button>
            <button onClick={submitAdd} disabled={isSaving} style={{ padding: "8px 14px", background: isSaving ? C.border : C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
              {isSaving ? "Saving…" : addLabel}
            </button>
          </div>
        </div>
      ) : (hideAddButton || !canEdit) ? null : (
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 20 }}>
          <button
            onClick={() => setAddOpen(true)}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            <Plus size={14} /> {addLabel}
          </button>
        </div>
      )}

      {items.length === 0 ? (
        <div style={{ fontSize: 12, color: C.empty, padding: "2px 0" }}>{emptyMessage}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column" }}>
          {items.map((item, i) => {
            const isEditing = editingId === item.id;
            const isExpanded = !!expandedIds[item.id];
            if (isEditing) {
              return (
                <div key={item.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 14, margin: "6px 0", boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                    {fields.map(f => renderField(f, editDraft, setEditDraft))}
                    {renderCustomFields && renderCustomFields(editDraft, setEditDraft, false)}
                  </div>
                  {editError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 8 }}>{editError}</div>}
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                    <button onClick={saveEdit} disabled={isSaving} style={{ padding: "8px 14px", background: isSaving ? C.border : C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                      {isSaving ? "Saving…" : "Save"}
                    </button>
                    <button onClick={cancelEdit} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                      Cancel
                    </button>
                  </div>
                </div>
              );
            }
            const isHighlighted = highlightedId === item.id;
            return (
              <div
                key={item.id}
                id={`entity-row-${item.id}`}
                style={{
                  borderBottom: i < items.length - 1 ? `1px solid ${C.border}` : "none",
                  background: isHighlighted ? C.brandLight || C.surface : "transparent",
                  padding: "8px 4px",
                  boxShadow: isHighlighted ? `0 0 0 3px ${C.brand}33` : "none", transition: "box-shadow 0.2s, background-color 0.2s",
                }}
              >
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
                    {renderExpanded && (
                      <button onClick={() => toggleExpanded(item.id)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex", flexShrink: 0 }} aria-label={isExpanded ? "Collapse" : "Expand"}>
                        {isExpanded ? <ChevronDown size={15} color={C.brand} /> : <ChevronRight size={15} color={C.brand} />}
                      </button>
                    )}
                    <div style={{ minWidth: 0, flex: 1 }}>{renderSummary ? renderSummary(item) : null}</div>
                  </div>
                  {/* customRowActions is Swap Breaker / Move Circuit — writes
                      too, so the whole cluster goes for a viewer. Expand/collapse
                      lives in the other half of the row and stays. */}
                  {canEdit && (
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                    {customRowActions && customRowActions(item)}
                    <button onClick={() => startEdit(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Edit">
                      <Pencil size={14} color={C.muted} />
                    </button>
                    <button
                      onClick={() => setConfirmDeleteId(item.id)}
                      className="icon-btn"
                      style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }}
                      aria-label="Delete"
                    >
                      <X size={14} color={C.placeholder} />
                    </button>
                  </div>
                  )}
                </div>
                {isExpanded && renderExpanded && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                    {renderExpanded(item)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {confirmDeleteId !== null && (() => {
        const item = items.find(i => i.id === confirmDeleteId);
        const blockReason = canDelete && item ? canDelete(item) : null;
        return (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", maxWidth: 360 }}>
              {blockReason ? (
                <>
                  <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Can't delete</div>
                  <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>{blockReason}</div>
                  <div style={{ display: "flex", justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDeleteId(null)} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                      OK
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>
                    {deleteConfirmMessage ? deleteConfirmMessage(item) : "Delete this item?"}
                  </div>
                  <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                    <button onClick={() => setConfirmDeleteId(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                      Cancel
                    </button>
                    <button
                      onClick={() => { if (isSaving) return; onDelete(confirmDeleteId); setConfirmDeleteId(null); }}
                      disabled={isSaving}
                      style={{ padding: "8px 14px", background: isSaving ? C.border : C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                    >
                      {isSaving ? "Saving…" : "Delete"}
                    </button>
                  </div>
                </>
              )}
            </div>
          </div>
        );
      })()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AssetTracker />);
</script>
</body>
</html>
