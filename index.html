<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Import map: lets the app's plain "import X from 'react'" style statements
     resolve to real packages served over CDN, with no bundler/build step. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}

<!-- Babel Standalone: transpiles the JSX/ESM below in the browser at load time. -->
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module" data-presets="react">
import ReactDOM from "react-dom/client";

import React, { useState, useEffect, useMemo } from "react";
import * as XLSX from "xlsx";
import {
  Search, Plus, X, Pencil, Trash2, Save, ChevronRight, ArrowLeft, MessageSquare,
  Monitor, Phone, Tv, Camera, HardDrive, HelpCircle, Columns3, Lock, Filter, Check, DoorOpen, Download,
  Wrench, UserCircle, Settings, History, Archive, ArchiveRestore, Building2, Package, Copy,
} from "lucide-react";

// Starter managed peripherals/users/bulk-item-type lists — empty until the school
// builds them up via the "manage" (gear icon) UI, or they arrive from the Sheet on load.
const DEFAULT_PERIPHERALS = [];
const DEFAULT_USERS = [];
const DEFAULT_BULK_ITEM_TYPES = [];

// Known types, used for the Type dropdown and for icons
const TYPE_OPTIONS = ["Computer", "Monitor", "Phone", "TV", "DocuCam", "Stream Deck", "Room", "Building", "Bulk Item", "Other"];

// Options for the structured per-asset change log
const DEFAULT_CHANGE_TYPES = ["Purchase", "Repair", "Replacement", "Upgrade", "Maintenance", "Relocation", "Disposal", "Other"];

// Preset intervals for scheduled maintenance — fixed (not a managed list) since
// each needs a day-count to compute a next-due date.
const MAINTENANCE_FREQUENCIES = [
  { label: "Weekly", days: 7 },
  { label: "Monthly", days: 30 },
  { label: "Quarterly", days: 90 },
  { label: "Semi-Annually", days: 182 },
  { label: "Annually", days: 365 },
];

// Which extra field applies to which types. A field not listed here (or an
// asset whose type isn't in the list) simply doesn't show that field.
const TYPE_ONLY_FIELDS = {
  hostname: ["Computer"],
  screenSize: ["Monitor", "TV"],
  building: ["Room", "Building"], // Room links to a building; Building uses it as its own name
  totalQuantity: ["Bulk Item"],
  itemName: ["Bulk Item"], // Bulk Item's sub-type — picked from the managed bulkItemTypes list (e.g. "Folding Chair", "Cafeteria Table")
};
// Fields that don't make sense for a Room asset at all (it's a space, not a device).
const ROOM_EXCLUDED_FIELDS = ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"];
// A Building is one level up from a Room — it has even less in common with a device asset.
const BUILDING_EXCLUDED_FIELDS = ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "room", "purchaseDate", "warrantyUntil"];
// A Bulk Item (tables, chairs...) isn't individually tagged or tied to one room —
// it's a pooled quantity, distributed across rooms via the Allocations tab instead.
const BULK_ITEM_EXCLUDED_FIELDS = ["hostname", "screenSize", "peripherals", "serial", "room", "building", "person"];
function fieldAppliesTo(key, type) {
  if (type === "Room" && ROOM_EXCLUDED_FIELDS.includes(key)) return false;
  if (type === "Building" && BUILDING_EXCLUDED_FIELDS.includes(key)) return false;
  if (type === "Bulk Item" && BULK_ITEM_EXCLUDED_FIELDS.includes(key)) return false;
  const restriction = TYPE_ONLY_FIELDS[key];
  if (!restriction) return true; // common field, applies to every type
  return restriction.includes(type);
}

const DEFAULT_COLUMNS = [
  { key: "type", label: "Type", width: 140 },
  { key: "itemName", label: "Sub-Type", width: 150 },
  { key: "screenSize", label: "Screen Size", width: 110 },
  { key: "totalQuantity", label: "Total Qty", width: 100 },
  { key: "building", label: "Building", width: 130 },
  { key: "room", label: "Room", width: 130 },
  { key: "person", label: "User", width: 170 },
  { key: "brand", label: "Brand", width: 120 },
  { key: "model", label: "Model", width: 180 },
  { key: "serial", label: "Serial", width: 180 },
  { key: "hostname", label: "Hostname", width: 160 },
  { key: "purchaseDate", label: "Purchase Date", width: 130 },
  { key: "warrantyUntil", label: "Warranty Until", width: 130 },
  { key: "peripherals", label: "Peripherals", width: 240 },
  { key: "notes", label: "Notes", width: 240 },
  { key: "label", label: "Asset ID", width: 110 },
  { key: "status", label: "Status", width: 100 },
].map(c => ({ ...c, visible: ["type", "itemName", "building", "room", "person", "status"].includes(c.key), custom: false }));

const STATUS_OPTIONS = ["Active", "Archived"];
const STATUS_FILTER_OPTIONS = ["All statuses", "Active", "Archived"];

// Brookside Christian Academy palette (from brooksideacademy.com)
const C = {
  bg: "#F4F0E6",
  surface: "#FFFFFF",
  ink: "#2A3439",
  brand: "#546F75",
  brandDark: "#3E5054",
  accent: "#A9764B",
  border: "#DCD4C2",
  hover: "#EAE3D3",
  danger: "#9C3B2A",
  success: "#4B6B4E",
  muted: "#5C6B6E",
  placeholder: "#9CA7A6",
  empty: "#7C8A8C",
  scrollThumb: "#C7BEA8",
};

const CATEGORY_ICONS = { Computer: HardDrive, Monitor: Monitor, Phone: Phone, TV: Tv, DocuCam: Camera, Room: DoorOpen, Building: Building2, "Bulk Item": Package };
function iconFor(type) {
  return CATEGORY_ICONS[type] || HelpCircle;
}
function slugify(name) {
  return "col_" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "col_field";
}
function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}
function formatDateOnly(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
// Next-due date for a maintenance item, or null if it's never been performed
// (so there's nothing to count forward from) or has no known interval.
function nextMaintenanceDue(item) {
  if (!item.lastPerformed || !item.frequencyDays) return null;
  const last = new Date(item.lastPerformed + "T00:00:00");
  if (isNaN(last.getTime())) return null;
  return new Date(last.getTime() + item.frequencyDays * 86400000);
}
// "never" (no lastPerformed yet — needs attention), "overdue", "due-soon"
// (within 14 days), or "ok".
function maintenanceStatusOf(item) {
  if (!item.lastPerformed) return "never";
  const due = nextMaintenanceDue(item);
  if (!due) return "never";
  const daysUntil = Math.floor((due.getTime() - Date.now()) / 86400000);
  if (daysUntil < 0) return "overdue";
  if (daysUntil <= 14) return "due-soon";
  return "ok";
}
function describeAudit(entry) {
  if (entry.action === "created") return "Asset created";
  if (entry.action === "deleted") return "Asset permanently deleted";
  if (entry.action === "archived") return "Asset archived";
  if (entry.action === "restored") return "Asset restored from archive";
  if (entry.action === "allocated") {
    return entry.previousQuantity != null
      ? `Allocation to ${entry.room} changed from ${entry.previousQuantity} to ${entry.quantity}`
      : `Allocated ${entry.quantity} to ${entry.room}`;
  }
  if (entry.action === "unallocated") return `Removed allocation of ${entry.quantity} from ${entry.room}`;
  if (entry.action === "noted") return `Note: ${entry.note}`;
  if (entry.action === "maintenance_completed") return `Completed maintenance "${entry.field}" — last done ${entry.to}`;
  if (entry.action === "maintenance_removed") return `Removed scheduled maintenance: ${entry.field}`;
  return `${entry.field} changed from "${entry.from || "—"}" to "${entry.to || "—"}"`;
}
// Follows a non-Room asset's Room link to that Room's own Building link.
// Rooms and Buildings store their building directly and don't need this.
function inferBuilding(asset, assets) {
  if (!asset || !asset.room) return "";
  const roomAsset = assets.find(a => a.type === "Room" && a.room === asset.room);
  return roomAsset ? roomAsset.building || "" : "";
}

// Buckets the read-only detail view's fields into labeled sections instead of
// one flat list. Any column not named here (custom user-added columns) falls
// into a trailing "Custom Fields" group rather than being dropped.
const DETAIL_FIELD_GROUPS = [
  { title: "Overview", keys: ["type", "itemName", "screenSize", "totalQuantity", "label", "status"] },
  { title: "Location & Assignment", keys: ["building", "room", "person"] },
  { title: "Device Details", keys: ["brand", "model", "serial", "hostname", "peripherals"] },
  { title: "Purchase & Warranty", keys: ["purchaseDate", "warrantyUntil"] },
  { title: "Notes", keys: ["notes"] },
];
function groupDetailColumns(cols) {
  const groups = DETAIL_FIELD_GROUPS.map(g => ({ title: g.title, columns: [] }));
  const custom = [];
  cols.forEach(c => {
    const groupIdx = DETAIL_FIELD_GROUPS.findIndex(g => g.keys.includes(c.key));
    if (groupIdx === -1) custom.push(c);
    else groups[groupIdx].columns.push(c);
  });
  if (custom.length) groups.push({ title: "Custom Fields", columns: custom });
  return groups.filter(g => g.columns.length > 0);
}

const USER_STORAGE_KEY = "asset-tracker-user"; // localStorage — who's using this browser
// Your deployed Apps Script Web App URL. Redeploy in Apps Script (Deploy > Manage
// deployments > New version) any time you change AssetTrackerSync.gs.
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzXaKRuCrTesxobxP-b2me1TSn0YoGogoYhNPTWU4qWWjXANXGlPuDzJSKGClOTsfOXRQ/exec";
const emptyDraftFrom = columns => Object.fromEntries(columns.map(c => [c.key, ""]));

function AssetTracker() {
  const [assets, setAssets] = useState(null);
  const [columns, setColumns] = useState(DEFAULT_COLUMNS);
  const [changeTypes, setChangeTypes] = useState(DEFAULT_CHANGE_TYPES);
  const [vendors, setVendors] = useState([]);
  const [peripheralsList, setPeripheralsList] = useState(DEFAULT_PERIPHERALS);
  const [showPeripheralsManager, setShowPeripheralsManager] = useState(false);
  const [newPeripheralName, setNewPeripheralName] = useState("");
  const [usersList, setUsersList] = useState(DEFAULT_USERS);
  const [showUsersManager, setShowUsersManager] = useState(false);
  const [newUserName, setNewUserName] = useState("");
  const [bulkItemTypes, setBulkItemTypes] = useState(DEFAULT_BULK_ITEM_TYPES);
  const [showBulkItemTypesManager, setShowBulkItemTypesManager] = useState(false);
  const [newBulkItemTypeName, setNewBulkItemTypeName] = useState("");
  const [auditLog, setAuditLog] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [saveError, setSaveError] = useState(false);

  const [view, setView] = useState("list"); // "list" | "detail"
  const [selectedLabel, setSelectedLabel] = useState(null);
  const [detailEditing, setDetailEditing] = useState(false);
  const [editNote, setEditNote] = useState("");
  const [detailTab, setDetailTab] = useState("details"); // "details" | "comments" | "changes" | "audit" | "allocations"
  const [commentDraft, setCommentDraft] = useState("");
  const [changeDraft, setChangeDraft] = useState({ changeType: "", vendor: "", cost: "", note: "" });
  const [showChangeTypeManager, setShowChangeTypeManager] = useState(false);
  const [showVendorManager, setShowVendorManager] = useState(false);
  const [newChangeTypeName, setNewChangeTypeName] = useState("");
  const [newVendorName, setNewVendorName] = useState("");
  const [allocationDraft, setAllocationDraft] = useState({ room: "", quantity: "" });
  const [allocationError, setAllocationError] = useState("");
  const [confirmAllocationRemove, setConfirmAllocationRemove] = useState(null);
  const [maintenanceDraft, setMaintenanceDraft] = useState({ task: "", frequency: MAINTENANCE_FREQUENCIES[1].label, lastPerformed: "", owner: "" });
  const [editingMaintenanceIdx, setEditingMaintenanceIdx] = useState(null);
  const [maintenanceEditDraft, setMaintenanceEditDraft] = useState(null);
  const [confirmMaintenanceDelete, setConfirmMaintenanceDelete] = useState(null);

  const [currentUser, setCurrentUser] = useState(null);
  const [showNamePrompt, setShowNamePrompt] = useState(false);
  const [nameInput, setNameInput] = useState("");

  const [query, setQuery] = useState("");
  const [roomFilter, setRoomFilter] = useState("All rooms");
  const [typeFilter, setTypeFilter] = useState("All types");
  const [userFilter, setUserFilter] = useState("All users");
  const [statusFilter, setStatusFilter] = useState("Active");
  const [sortConfig, setSortConfig] = useState(null); // { key, dir: "asc" | "desc" }
  const [reassignTarget, setReassignTarget] = useState("");
  const [moveTarget, setMoveTarget] = useState("");
  const [activeFilterCol, setActiveFilterCol] = useState(null);
  const [draft, setDraft] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmArchive, setConfirmArchive] = useState(null);
  const [confirmDeleteCol, setConfirmDeleteCol] = useState(null);
  const [confirmCommentDelete, setConfirmCommentDelete] = useState(null);
  const [confirmChangeDelete, setConfirmChangeDelete] = useState(null);
  const [showColManager, setShowColManager] = useState(false);
  const [newColName, setNewColName] = useState("");

  // Loads the full snapshot from the Sheet backend. Never falls back to placeholder
  // data on failure — if the backend can't be reached, loadError is surfaced as a
  // blocking screen (see below) rather than silently showing something that isn't
  // the real inventory. Exposed as a named function (not inline in the effect) so
  // the "Try again" button on that error screen can call it directly.
  async function loadData() {
    setLoading(true);
    setLoadError(false);
    try {
      const res = await fetch(SHEET_API_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.assets)) throw new Error("Malformed response from backend");

      const loadedAssets = data.assets.map(a => ({ comments: [], changes: [], allocations: [], status: "Active", building: "", itemName: "", purchaseDate: "", warrantyUntil: "", ...a }));
      setAssets(loadedAssets);
      // Migrate column config: append any default columns added in newer app versions.
      let storedCols = data.columns && data.columns.length ? data.columns : DEFAULT_COLUMNS;
      DEFAULT_COLUMNS.forEach(dc => {
        if (!storedCols.some(c => c.key === dc.key)) {
          const statusIdx = storedCols.findIndex(c => c.key === "status");
          const insertAt = statusIdx === -1 ? storedCols.length : statusIdx;
          storedCols = [...storedCols.slice(0, insertAt), dc, ...storedCols.slice(insertAt)];
        }
      });
      setColumns(storedCols);
      setChangeTypes(data.changeTypes && data.changeTypes.length ? data.changeTypes : DEFAULT_CHANGE_TYPES);
      setVendors(Array.isArray(data.vendors) ? data.vendors : []);
      setAuditLog(Array.isArray(data.auditLog) ? data.auditLog : []);
      setPeripheralsList(Array.isArray(data.peripheralsList) ? data.peripheralsList : DEFAULT_PERIPHERALS);
      setBulkItemTypes(Array.isArray(data.bulkItemTypes) ? data.bulkItemTypes : DEFAULT_BULK_ITEM_TYPES);
      if (Array.isArray(data.usersList) && data.usersList.length) {
        setUsersList(data.usersList);
      } else {
        // No stored users list yet (e.g. brand-new sheet) — derive starter names
        // from whatever's already on the loaded assets, if any.
        const derived = Array.from(
          new Set(loadedAssets.flatMap(a => (a.person ? a.person.split("/").map(s => s.trim()) : [])).filter(Boolean))
        ).sort();
        setUsersList(derived);
      }
      setLoading(false);
    } catch (e) {
      // Sheet unreachable or returned something unexpected — show a blocking error
      // instead of guessing. Assets stays null, so persist()/writeSnapshot() never
      // run against fabricated data (see the write-guard in persist()).
      setLoadError(true);
      setLoading(false);
    }
  }

  useEffect(() => { loadData(); }, []);

  useEffect(() => {
    try {
      const stored = localStorage.getItem(USER_STORAGE_KEY);
      if (stored) setCurrentUser(stored);
      else setShowNamePrompt(true);
    } catch (e) {
      setShowNamePrompt(true);
    }
  }, []);

  function saveUserName(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setCurrentUser(trimmed);
    setShowNamePrompt(false);
    setNameInput("");
    try {
      localStorage.setItem(USER_STORAGE_KEY, trimmed);
    } catch (e) {
      // Non-fatal — name just won't persist to the next session on this device.
    }
  }

  // POSTs the full app state to the Apps Script backend. Sent as text/plain
  // rather than application/json — Apps Script parses e.postData.contents as
  // JSON regardless of the declared content type, and text/plain is a "simple"
  // request that skips the browser's CORS preflight (which Apps Script doesn't
  // handle), avoiding a class of failures that has nothing to do with the data itself.
  async function writeSnapshot(payload) {
    const res = await fetch(SHEET_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 200)}`);
    let result;
    try {
      result = JSON.parse(text);
    } catch (e) {
      throw new Error(`Non-JSON response: ${text.slice(0, 200)}`);
    }
    if (!result || !result.ok) throw new Error(result && result.error ? result.error : "Unknown write failure");
    return true;
  }

  async function persist(nextAssets, nextColumns, nextChangeTypes = changeTypes, nextVendors = vendors, nextAuditLog = auditLog, nextPeripheralsList = peripheralsList, nextUsersList = usersList, nextBulkItemTypes = bulkItemTypes) {
    // Guard against ever writing over the Sheet before a real snapshot has been
    // loaded — the UI shouldn't be reachable in that state, but this keeps a
    // load-failure from being able to clobber live data no matter how it's triggered.
    if (assets === null) return;
    setAssets(nextAssets);
    setColumns(nextColumns);
    setChangeTypes(nextChangeTypes);
    setVendors(nextVendors);
    setAuditLog(nextAuditLog);
    setPeripheralsList(nextPeripheralsList);
    setUsersList(nextUsersList);
    setBulkItemTypes(nextBulkItemTypes);
    try {
      await writeSnapshot({
        assets: nextAssets, columns: nextColumns, changeTypes: nextChangeTypes,
        vendors: nextVendors, auditLog: nextAuditLog, peripheralsList: nextPeripheralsList, usersList: nextUsersList,
        bulkItemTypes: nextBulkItemTypes,
      });
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  function logAudit(entries) {
    return [...auditLog, ...entries];
  }

  const rooms = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.map(a => a.room).filter(Boolean));
    return ["All rooms", ...Array.from(set).sort()];
  }, [assets]);

  const types = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.map(a => a.type || "Other"));
    return ["All types", ...Array.from(set).sort()];
  }, [assets]);

  const users = useMemo(() => ["All users", ...usersList], [usersList]);

  // Rooms as recognized by an actual Room asset — used to power the linked
  // Room dropdown on every other asset type.
  const roomAssetNames = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.filter(a => a.type === "Room").map(a => a.room).filter(Boolean));
    return Array.from(set).sort();
  }, [assets]);

  // Buildings as recognized by an actual Building asset — powers the linked
  // Building dropdown on Room assets.
  const buildingAssetNames = useMemo(() => {
    if (!assets) return [];
    const set = new Set(assets.filter(a => a.type === "Building").map(a => a.building).filter(Boolean));
    return Array.from(set).sort();
  }, [assets]);

  const filtered = useMemo(() => {
    if (!assets) return [];
    const q = query.trim().toLowerCase();
    const list = assets.filter(a => {
      if (roomFilter !== "All rooms" && a.room !== roomFilter) return false;
      if (typeFilter !== "All types" && (a.type || "Other") !== typeFilter) return false;
      if (userFilter !== "All users" && !(a.person || "").split("/").map(s => s.trim()).includes(userFilter)) return false;
      if (statusFilter !== "All statuses" && (a.status || "Active") !== statusFilter) return false;
      if (!q) return true;
      return Object.values(a).some(v => typeof v === "string" && v.toLowerCase().includes(q));
    });
    if (sortConfig) {
      const { key, dir } = sortConfig;
      const mult = dir === "desc" ? -1 : 1;
      list.sort((x, y) => {
        const xv = (x[key] || "").toString(), yv = (y[key] || "").toString();
        const xn = parseFloat(xv), yn = parseFloat(yv);
        if (!isNaN(xn) && !isNaN(yn) && xv.trim() !== "" && yv.trim() !== "") return (xn - yn) * mult;
        return xv.localeCompare(yv, undefined, { numeric: true, sensitivity: "base" }) * mult;
      });
    }
    return list;
  }, [assets, query, roomFilter, typeFilter, userFilter, statusFilter, sortConfig]);

  const visibleColumns = columns.filter(c => c.visible);
  const gridTemplate = visibleColumns.map(c => `${c.width}px`).join(" ") + " 36px";

  const filterConfigs = {
    type: { label: "Type", value: typeFilter, setValue: setTypeFilter, options: types },
    room: { label: "Room", value: roomFilter, setValue: setRoomFilter, options: rooms },
    person: { label: "User", value: userFilter, setValue: setUserFilter, options: users },
    status: { label: "Status", value: statusFilter, setValue: setStatusFilter, options: STATUS_FILTER_OPTIONS },
  };

  const selectedAsset = assets ? assets.find(a => a.label === selectedLabel) : null;

  function openDetail(asset) {
    setSelectedLabel(asset.label);
    setView("detail");
    setDetailEditing(false);
    setEditNote("");
    setCommentDraft("");
    setChangeDraft({ changeType: "", vendor: "", cost: "", note: "" });
    setDetailTab("details");
    setConfirmCommentDelete(null);
    setConfirmChangeDelete(null);
    setConfirmArchive(null);
    setAllocationDraft({ room: "", quantity: "" });
    setAllocationError("");
    setConfirmAllocationRemove(null);
    setMaintenanceDraft({ task: "", frequency: MAINTENANCE_FREQUENCIES[1].label, lastPerformed: "", owner: "" });
    setEditingMaintenanceIdx(null);
    setMaintenanceEditDraft(null);
    setConfirmMaintenanceDelete(null);
  }

  function closeDetail() {
    setView("list");
    setSelectedLabel(null);
    setDetailEditing(false);
  }

  function startEditSelected() {
    setDraft({ ...emptyDraftFrom(columns), ...selectedAsset });
    setEditNote("");
    setDetailEditing(true);
  }

  function startAdd() {
    const nums = assets.filter(a => a.label.startsWith("BCA")).map(a => parseInt((a.label.match(/\d+/) || ["0"])[0], 10));
    const next = Math.max(0, ...nums) + 1;
    setDraft({ ...emptyDraftFrom(columns), label: "BCA" + String(next).padStart(4, "0"), type: "Computer", status: "Active", comments: [], changes: [], allocations: [] });
    setShowAdd(true);
  }

  function cancelAdd() {
    setShowAdd(false);
    setDraft({});
  }

  async function saveDraft() {
    if (!draft.label?.trim() || !draft.type?.trim()) return;
    if (showAdd) {
      const createdEntry = {
        at: new Date().toISOString(), by: currentUser || "", assetLabel: draft.label,
        assetType: draft.type, action: "created",
      };
      await persist([...assets, { comments: [], changes: [], allocations: [], ...draft }], columns, changeTypes, vendors, logAudit([createdEntry]));
      cancelAdd();
    } else {
      const original = selectedAsset;
      const editEntries = [];
      Object.keys(draft).forEach(key => {
        if (key === "comments" || key === "changes" || key === "allocations") return;
        const oldVal = original[key] || "";
        const newVal = draft[key] || "";
        if (oldVal === newVal) return;
        const fieldLabel = columns.find(c => c.key === key)?.label || key;
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draft.type || original.type, action: "edited", field: fieldLabel, from: oldVal, to: newVal,
        });
      });

      // Rename cascades: keep name-based links consistent across the inventory.
      const roomRenamed = original.type === "Room" && draft.room && draft.room !== original.room;
      const buildingRenamed = original.type === "Building" && draft.building && draft.building !== original.building;

      const next = assets.map(a => {
        if (a.label === selectedLabel) return { ...a, ...draft };
        let updated = a;
        if (roomRenamed) {
          if (updated.room === original.room) updated = { ...updated, room: draft.room };
          if ((updated.allocations || []).some(al => al.room === original.room)) {
            updated = { ...updated, allocations: updated.allocations.map(al => (al.room === original.room ? { ...al, room: draft.room } : al)) };
          }
        }
        if (buildingRenamed && updated.building === original.building) {
          updated = { ...updated, building: draft.building };
        }
        return updated;
      });
      if (roomRenamed) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: "Room", action: "edited", field: "Room rename cascade",
          from: original.room, to: `${draft.room} (updated on all linked assets)`,
        });
      }
      if (buildingRenamed) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: "Building", action: "edited", field: "Building rename cascade",
          from: original.building, to: `${draft.building} (updated on all linked rooms)`,
        });
      }
      if (editNote.trim()) {
        editEntries.push({
          at: new Date().toISOString(), by: currentUser || "", assetLabel: original.label,
          assetType: draft.type || original.type, action: "noted", note: editNote.trim(),
        });
      }
      await persist(next, columns, changeTypes, vendors, editEntries.length ? logAudit(editEntries) : auditLog);
      setDetailEditing(false);
      setEditNote("");
    }
  }

  async function doDelete(label) {
    const asset = assets.find(a => a.label === label);
    const deletedEntry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "deleted",
    };
    await persist(assets.filter(a => a.label !== label), columns, changeTypes, vendors, logAudit([deletedEntry]));
    setConfirmDelete(null);
    if (selectedLabel === label) closeDetail();
  }

  async function archiveAsset(label) {
    const asset = assets.find(a => a.label === label);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "archived",
    };
    const next = assets.map(a => (a.label === label ? { ...a, status: "Archived" } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setConfirmArchive(null);
  }

  async function restoreAsset(label) {
    const asset = assets.find(a => a.label === label);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: label,
      assetType: asset ? asset.type : "", action: "restored",
    };
    const next = assets.map(a => (a.label === label ? { ...a, status: "Active" } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
  }

  async function duplicateAsset(source) {
    const nums = assets.filter(a => a.label.startsWith("BCA")).map(a => parseInt((a.label.match(/\d+/) || ["0"])[0], 10));
    const nextLabel = "BCA" + String(Math.max(0, ...nums) + 1).padStart(4, "0");
    const copy = {
      ...source,
      label: nextLabel,
      serial: "",       // unique per unit — never copied
      hostname: "",     // unique per unit — never copied
      status: "Active",
      comments: [],
      changes: [],
      allocations: [],
    };
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: nextLabel,
      assetType: copy.type, action: "created",
    };
    await persist([...assets, copy], columns, changeTypes, vendors, logAudit([entry]));
    openDetail(copy);
  }

  // Bulk actions on the currently filtered set — powered by the active User / Room filter.
  async function reassignFilteredTo(newUser) {
    if (!newUser.trim()) return;
    const targets = new Set(filtered.filter(a => fieldAppliesTo("person", a.type)).map(a => a.label));
    const entries = [];
    const next = assets.map(a => {
      if (!targets.has(a.label) || a.person === newUser) return a;
      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,
        assetType: a.type, action: "edited", field: "User", from: a.person || "", to: newUser,
      });
      return { ...a, person: newUser };
    });
    await persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
    setUserFilter(newUser);
    setReassignTarget("");
  }

  async function moveFilteredTo(newRoom) {
    if (!newRoom) return;
    const targets = new Set(filtered.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item").map(a => a.label));
    const entries = [];
    const next = assets.map(a => {
      if (!targets.has(a.label) || a.room === newRoom) return a;
      entries.push({
        at: new Date().toISOString(), by: currentUser || "", assetLabel: a.label,
        assetType: a.type, action: "edited", field: "Room", from: a.room || "", to: newRoom,
      });
      return { ...a, room: newRoom };
    });
    await persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
    setRoomFilter(newRoom);
    setMoveTarget("");
  }

  async function addComment() {
    if (!commentDraft.trim() || !selectedAsset) return;
    const comment = { text: commentDraft.trim(), at: new Date().toISOString(), by: currentUser || "" };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, comments: [...(a.comments || []), comment] } : a));
    await persist(next, columns);
    setCommentDraft("");
  }

  async function deleteComment(idx) {
    const next = assets.map(a => {
      if (a.label !== selectedLabel) return a;
      const comments = (a.comments || []).filter((_, i) => i !== idx);
      return { ...a, comments };
    });
    await persist(next, columns);
  }

  async function addChange() {
    if (!changeDraft.changeType || !selectedAsset) return;
    const entry = {
      changeType: changeDraft.changeType,
      vendor: changeDraft.vendor.trim(),
      cost: changeDraft.cost.trim(),
      note: changeDraft.note.trim(),
      at: new Date().toISOString(),
      by: currentUser || "",
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, changes: [...(a.changes || []), entry] } : a));
    await persist(next, columns);
    setChangeDraft({ changeType: "", vendor: "", cost: "", note: "" });
  }

  async function deleteChange(idx) {
    const next = assets.map(a => {
      if (a.label !== selectedLabel) return a;
      const changes = (a.changes || []).filter((_, i) => i !== idx);
      return { ...a, changes };
    });
    await persist(next, columns);
  }

  function getAllocatedTotal(asset) {
    return ((asset && asset.allocations) || []).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
  }
  function getAvailable(asset) {
    const total = parseFloat(asset && asset.totalQuantity) || 0;
    return total - getAllocatedTotal(asset);
  }

  async function saveAllocation() {
    if (!selectedAsset) return;
    const room = allocationDraft.room;
    const qty = parseFloat(allocationDraft.quantity);
    if (!room || !qty || qty <= 0) {
      setAllocationError("Pick a room and a quantity greater than 0.");
      return;
    }
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.room === room);
    const otherRoomsTotal = existing.filter(a => a.room !== room).reduce((sum, a) => sum + (parseFloat(a.quantity) || 0), 0);
    const totalQty = parseFloat(selectedAsset.totalQuantity) || 0;
    if (otherRoomsTotal + qty > totalQty) {
      setAllocationError(`Only ${totalQty - otherRoomsTotal} available to assign here.`);
      return;
    }
    setAllocationError("");
    const nextAllocations = existingForRoom
      ? existing.map(a => (a.room === room ? { ...a, quantity: qty } : a))
      : [...existing, { room, quantity: qty }];
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "allocated", room, quantity: qty,
      previousQuantity: existingForRoom ? existingForRoom.quantity : null,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setAllocationDraft({ room: "", quantity: "" });
  }

  async function removeAllocation(room) {
    if (!selectedAsset) return;
    const existing = selectedAsset.allocations || [];
    const existingForRoom = existing.find(a => a.room === room);
    const nextAllocations = existing.filter(a => a.room !== room);
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "unallocated", room, quantity: existingForRoom ? existingForRoom.quantity : 0,
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, allocations: nextAllocations } : a));
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setConfirmAllocationRemove(null);
  }

  // Adding a new schedule isn't separately audited — its own at/by plus its
  // presence in the Maintenance tab is enough (same reasoning as comments/changes).
  async function addMaintenanceItem() {
    if (!maintenanceDraft.task.trim() || !selectedAsset) return;
    const freq = MAINTENANCE_FREQUENCIES.find(f => f.label === maintenanceDraft.frequency) || MAINTENANCE_FREQUENCIES[1];
    const item = {
      task: maintenanceDraft.task.trim(),
      frequencyLabel: freq.label,
      frequencyDays: freq.days,
      lastPerformed: maintenanceDraft.lastPerformed || "",
      owner: maintenanceDraft.owner.trim(),
      at: new Date().toISOString(),
      by: currentUser || "",
    };
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: [...(a.maintenanceItems || []), item] } : a));
    await persist(next, columns);
    setMaintenanceDraft({ task: "", frequency: freq.label, lastPerformed: "", owner: "" });
  }

  function startEditMaintenance(idx) {
    const item = (selectedAsset.maintenanceItems || [])[idx];
    setMaintenanceEditDraft({ task: item.task, frequency: item.frequencyLabel, lastPerformed: item.lastPerformed || "", owner: item.owner || "" });
    setEditingMaintenanceIdx(idx);
  }

  function cancelEditMaintenance() {
    setEditingMaintenanceIdx(null);
    setMaintenanceEditDraft(null);
  }

  // Mutating an existing schedule (unlike adding one) loses the prior value, so
  // it's logged field-by-field — same approach as the main asset edit diff.
  async function saveMaintenanceEdit() {
    if (!maintenanceEditDraft.task.trim() || !selectedAsset) return;
    const idx = editingMaintenanceIdx;
    const items = selectedAsset.maintenanceItems || [];
    const original = items[idx];
    const freq = MAINTENANCE_FREQUENCIES.find(f => f.label === maintenanceEditDraft.frequency) || MAINTENANCE_FREQUENCIES[1];
    const updated = {
      ...original,
      task: maintenanceEditDraft.task.trim(),
      frequencyLabel: freq.label,
      frequencyDays: freq.days,
      lastPerformed: maintenanceEditDraft.lastPerformed || "",
      owner: maintenanceEditDraft.owner.trim(),
    };
    const mkEntry = (field, from, to) => ({
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_edited", field: `${original.task} — ${field}`, from, to,
    });
    const entries = [];
    if (original.task !== updated.task) entries.push(mkEntry("Task", original.task, updated.task));
    if (original.frequencyLabel !== updated.frequencyLabel) entries.push(mkEntry("Frequency", original.frequencyLabel, updated.frequencyLabel));
    if ((original.owner || "") !== (updated.owner || "")) entries.push(mkEntry("Owner", original.owner || "—", updated.owner || "—"));
    if ((original.lastPerformed || "") !== (updated.lastPerformed || "")) {
      entries.push(mkEntry("Last performed", formatDateOnly(original.lastPerformed) || "—", formatDateOnly(updated.lastPerformed) || "—"));
    }
    const nextItems = items.map((it, i) => (i === idx ? updated : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    await persist(next, columns, changeTypes, vendors, entries.length ? logAudit(entries) : auditLog);
    cancelEditMaintenance();
  }

  async function markMaintenanceDone(idx) {
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const today = new Date().toISOString().slice(0, 10);
    const nextItems = items.map((it, i) => (i === idx ? { ...it, lastPerformed: today } : it));
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel, assetType: selectedAsset.type,
      action: "maintenance_completed", field: item.task,
      from: item.lastPerformed ? formatDateOnly(item.lastPerformed) : "never", to: formatDateOnly(today),
    };
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
  }

  async function deleteMaintenanceItem(idx) {
    if (!selectedAsset) return;
    const items = selectedAsset.maintenanceItems || [];
    const item = items[idx];
    const nextItems = items.filter((_, i) => i !== idx);
    const next = assets.map(a => (a.label === selectedLabel ? { ...a, maintenanceItems: nextItems } : a));
    const entry = {
      at: new Date().toISOString(), by: currentUser || "", assetLabel: selectedLabel,
      assetType: selectedAsset.type, action: "maintenance_removed", field: item.task,
    };
    await persist(next, columns, changeTypes, vendors, logAudit([entry]));
    setConfirmMaintenanceDelete(null);
  }

  function toggleColumnVisible(key) {
    const col = columns.find(c => c.key === key);
    if (col && col.locked) return;
    persist(assets, columns.map(c => (c.key === key ? { ...c, visible: !c.visible } : c)));
  }

  function addColumn() {
    if (!newColName.trim()) return;
    let key = slugify(newColName);
    let i = 1;
    while (columns.some(c => c.key === key)) key = slugify(newColName) + "_" + i++;
    const nextColumns = [...columns, { key, label: newColName.trim(), width: 160, visible: true, custom: true }];
    const nextAssets = assets.map(a => ({ ...a, [key]: "" }));
    persist(nextAssets, nextColumns);
    setNewColName("");
  }

  function removeColumn(key) {
    const nextColumns = columns.filter(c => c.key !== key);
    const nextAssets = assets.map(a => {
      const copy = { ...a };
      delete copy[key];
      return copy;
    });
    persist(nextAssets, nextColumns);
    setConfirmDeleteCol(null);
  }

  function addChangeType() {
    const name = newChangeTypeName.trim();
    if (!name || changeTypes.includes(name)) return;
    persist(assets, columns, [...changeTypes, name], vendors);
    setNewChangeTypeName("");
  }

  function removeChangeType(name) {
    persist(assets, columns, changeTypes.filter(t => t !== name), vendors);
  }

  function addVendor() {
    const name = newVendorName.trim();
    if (!name || vendors.includes(name)) return;
    persist(assets, columns, changeTypes, [...vendors, name]);
    setNewVendorName("");
  }

  function removeVendor(name) {
    persist(assets, columns, changeTypes, vendors.filter(v => v !== name));
  }

  function addPeripheral() {
    const name = newPeripheralName.trim();
    if (!name || peripheralsList.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, [...peripheralsList, name]);
    setNewPeripheralName("");

  function addUser() {
    const name = newUserName.trim();
    if (!name || usersList.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, [...usersList, name].sort());
    setNewUserName("");

  // Removing a user only takes them off the pick list — assets already assigned

  function removeUser(name) {
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList.filter(u => u !== name));

  function addBulkItemType() {
    const name = newBulkItemTypeName.trim();
    if (!name || bulkItemTypes.includes(name)) return;
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, [...bulkItemTypes, name].sort());
    setNewBulkItemTypeName("");

  // Removing a sub-type only takes it off the pick list — bulk items already

  function removeBulkItemType(name) {
    persist(assets, columns, changeTypes, vendors, auditLog, peripheralsList, usersList, bulkItemTypes.filter(t => t !== name));
  }

  function exportToExcel() {
    const assetRows = assets.map(a => {
      const row = {};
      columns.forEach(c => { row[c.label] = fieldAppliesTo(c.key, a.type) ? (a[c.key] || "") : ""; });
      row["Comments logged"] = (a.comments || []).length;
      row["Changes logged"] = (a.changes || []).length;
      row["Total cost logged"] = (a.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
      if (a.type === "Bulk Item") {
        row["Allocated"] = getAllocatedTotal(a);
        row["Available"] = getAvailable(a);
      }
      return row;
    });
    const commentRows = [];
    assets.forEach(a => {
      (a.comments || []).forEach(cm => {
        commentRows.push({ "Asset ID": a.label, Type: a.type, Room: a.room, When: formatWhen(cm.at), Comment: cm.text, "Logged by": cm.by || "" });
      });
    });
    const changeRows = [];
    assets.forEach(a => {
      (a.changes || []).forEach(ch => {
        changeRows.push({
          "Asset ID": a.label, Type: a.type, Room: a.room, When: formatWhen(ch.at),
          "Change type": ch.changeType, Vendor: ch.vendor, Cost: parseFloat(ch.cost) || "", Note: ch.note,
          "Logged by": ch.by || "",
        });
      });
    });
    const allocationRows = [];
    assets.forEach(a => {
      (a.allocations || []).forEach(al => {
        allocationRows.push({ "Asset ID": a.label, Item: a.type === "Bulk Item" ? (a.notes || a.label) : a.label, Room: al.room, Quantity: al.quantity });
      });
    });

    const auditRows = auditLog.map(entry => ({
      "Asset ID": entry.assetLabel, Type: entry.assetType, When: formatWhen(entry.at),
      Action: entry.action, Detail: describeAudit(entry), "By": entry.by || "",
    }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(assetRows), "Assets");
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(changeRows.length ? changeRows : [{ "Asset ID": "", Type: "", Room: "", When: "", "Change type": "", Vendor: "", Cost: "", Note: "", "Logged by": "" }]),
      "Changes"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(commentRows.length ? commentRows : [{ "Asset ID": "", Type: "", Room: "", When: "", Comment: "", "Logged by": "" }]),
      "Comments"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(allocationRows.length ? allocationRows : [{ "Asset ID": "", Item: "", Room: "", Quantity: "" }]),
      "Allocations"
    );
    XLSX.utils.book_append_sheet(
      wb,
      XLSX.utils.json_to_sheet(auditRows.length ? auditRows : [{ "Asset ID": "", Type: "", When: "", Action: "", Detail: "", "By": "" }]),
      "Audit Log"
    );
    XLSX.writeFile(wb, "brookside-asset-inventory.xlsx");
  }

        </div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
          Enter your name so edits and comments you make are attributed to you. This is just a label — not a login — and is remembered on this device.
        </div>
        <input
          value={nameInput}
          onChange={e => setNameInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && saveUserName(nameInput)}
          placeholder="Your name"
          autoFocus
          style={{ width: "100%", padding: "9px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, marginBottom: 12 }}
        />
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          {currentUser && (
            <button onClick={() => { setShowNamePrompt(false); setNameInput(""); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>
              Cancel
            </button>
          )}
          <button
            onClick={() => saveUserName(nameInput)}
            disabled={!nameInput.trim()}
            style={{ padding: "8px 14px", background: nameInput.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
          >
            Save
          </button>
        </div>
      </div>
    </div>
  );

  const peripheralsManagerModal = showPeripheralsManager && (
    <ListManagerModal
      title="Manage peripherals"
      items={peripheralsList}
      newValue={newPeripheralName}
      onNewValueChange={setNewPeripheralName}
      onAdd={addPeripheral}
      onRemove={removePeripheral}
      onClose={() => { setShowPeripheralsManager(false); setNewPeripheralName(""); }}
      placeholder="New peripheral name"
    />
  );

  const usersManagerModal = showUsersManager && (
    <ListManagerModal
      title="Manage users"
      items={usersList}
      newValue={newUserName}
      onNewValueChange={setNewUserName}
      onAdd={addUser}
      onRemove={removeUser}
      onClose={() => { setShowUsersManager(false); setNewUserName(""); }}
      placeholder="New user's name"
    />
  );

  const bulkItemTypesManagerModal = showBulkItemTypesManager && (
    <ListManagerModal
      title="Manage bulk item sub-types"
      items={bulkItemTypes}
      newValue={newBulkItemTypeName}
      onNewValueChange={setNewBulkItemTypeName}
      onAdd={addBulkItemType}
      onRemove={removeBulkItemType}
      onClose={() => { setShowBulkItemTypesManager(false); setNewBulkItemTypeName(""); }}
      placeholder="New sub-type, e.g. Folding Chair"
    />
  );

  // Fields to render in a form for the given type: common fields always,
  // type-restricted fields (hostname, screenSize) only when they apply.
  // Status is excluded — it's changed only via the Archive/Restore actions.
  function formColumnsFor(type) {
    return columns.filter(c => fieldAppliesTo(c.key, type) && c.key !== "status");
  }

  // ---------- DETAIL VIEW ----------
  if (view === "detail" && selectedAsset) {
    const Icon = iconFor(selectedAsset.type);
    const comments = [...(selectedAsset.comments || [])].reverse();
    const changeEntries = [...(selectedAsset.changes || [])].reverse();
    const totalLoggedCost = (selectedAsset.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
    const assetAuditEntries = auditLog.filter(e => e.assetLabel === selectedAsset.label).slice().reverse();
    // Never-performed items sort first (need scheduling attention); the rest by
    // ascending next-due date, which naturally puts the most-overdue on top.
    const maintenanceItems = (selectedAsset.maintenanceItems || [])
      .map((item, idx) => ({ item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) }))
      .sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    const overdueMaintenanceCount = maintenanceItems.filter(m => m.status === "overdue").length;
    const titleText = selectedAsset.type === "Bulk Item" && selectedAsset.itemName
      ? `${selectedAsset.itemName} (Bulk Item)`
      : selectedAsset.screenSize ? `${selectedAsset.type} · ${selectedAsset.screenSize}` : selectedAsset.type;
    const visibleDetailColumns = columns.filter(c => fieldAppliesTo(c.key, selectedAsset.type));
    const inheritedBuilding = !fieldAppliesTo("building", selectedAsset.type) ? inferBuilding(selectedAsset, assets) : "";
    const detailGroups = groupDetailColumns(visibleDetailColumns);
    const editFormColumns = formColumnsFor(draft.type);

    // Contents of a Room: devices located there + bulk-item allocations to it.
    // Contents of a Building: its linked Rooms, plus devices in those rooms.
    const isPlace = selectedAsset.type === "Room" || selectedAsset.type === "Building";
    let contentDevices = [], contentRooms = [], contentAllocations = [];
    if (selectedAsset.type === "Room") {
      contentDevices = assets.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item" && a.room === selectedAsset.room);
      contentAllocations = assets
        .filter(a => a.type === "Bulk Item")
        .flatMap(b => (b.allocations || []).filter(al => al.room === selectedAsset.room).map(al => ({ bulk: b, quantity: al.quantity })));
    } else if (selectedAsset.type === "Building") {
      contentRooms = assets.filter(a => a.type === "Room" && a.building === selectedAsset.building);
      const roomNames = new Set(contentRooms.map(r => r.room));
      contentDevices = assets.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item" && roomNames.has(a.room));
    }
    const contentsCount = contentDevices.length + contentRooms.length + contentAllocations.length;

    return (
      <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: C.ink }}>
        {globalStyle}
        {nameModal}
        {peripheralsManagerModal}
        {usersManagerModal}
        {bulkItemTypesManagerModal}
        <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "12px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={closeDetail} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.brandDark, display: "flex" }} aria-label="Back to list">
            <ArrowLeft size={20} />
          </button>
          <Icon size={17} style={{ color: C.brand, flexShrink: 0 }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, color: C.accent }}>{selectedAsset.label}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: C.brandDark, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{titleText}</div>
        </div>

        <div style={{ display: "flex", gap: 4, padding: "0 20px", borderBottom: `1.5px solid ${C.border}`, position: "sticky", top: 53, background: C.bg, zIndex: 9, overflowX: "auto" }}>
          {[
            { key: "details", label: "Details" },
            ...(isPlace ? [{ key: "contents", label: "Contents", count: contentsCount }] : []),
            ...(selectedAsset.type === "Bulk Item" ? [{ key: "allocations", label: "Allocations", count: (selectedAsset.allocations || []).length }] : []),
            { key: "maintenance", label: "Maintenance", count: maintenanceItems.length, urgent: overdueMaintenanceCount > 0 },
            { key: "comments", label: "Comments", count: comments.length },
            { key: "changes", label: "Change Log", count: changeEntries.length },
            { key: "audit", label: "Audit", count: assetAuditEntries.length },
          ].map(tab => {
            const active = detailTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setDetailTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,
                }}
              >
                {tab.label}{tab.count > 0 ? ` (${tab.count})` : ""}
              </button>
            );
          })}
        </div>

        <div style={{ padding: "18px 20px 60px", maxWidth: 720, margin: "0 auto" }}>
          {detailTab === "details" && (!detailEditing ? (
            <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 18, marginBottom: 20 }}>
              {detailGroups.map((group, gi) => (
                <div key={group.title} style={{ marginTop: gi === 0 ? 0 : 18 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.border}` }}>
                    {group.title}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "14px 20px" }}>
                    {group.columns.map(c => (
                      <Detail key={c.key} label={c.label} value={selectedAsset[c.key]} wide={c.key === "notes"} />
                    ))}
                    {group.title === "Location & Assignment" && inheritedBuilding && (
                      <Detail label="Building (via Room)" value={inheritedBuilding} italic />
                    )}
                  </div>
                </div>
              ))}
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                <button onClick={startEditSelected} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 2 }}>
                  <Pencil size={15} /> Edit
                </button>
                {selectedAsset.type !== "Room" && selectedAsset.type !== "Building" && (
                  <button
                    onClick={() => duplicateAsset(selectedAsset)}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.brandDark, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2 }}
                  >
                    <Copy size={15} /> Duplicate
                  </button>
                )}
                {(selectedAsset.status || "Active") !== "Archived" ? (
                  <button
                    onClick={() => setConfirmArchive(selectedAsset.label)}
                    style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.brandDark, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2 }}
                  >
                    <Archive size={15} /> Archive
                  </button>
                ) : (
                  <>
                    <button
                      onClick={() => restoreAsset(selectedAsset.label)}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.brandDark, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2 }}
                    >
                      <ArchiveRestore size={15} /> Restore
                    </button>
                    <button
                      onClick={() => setConfirmDelete(selectedAsset.label)}
                      style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "transparent", color: C.danger, border: `1.5px solid ${C.danger}`, fontWeight: 600, fontSize: 14, borderRadius: 2 }}
                    >
                      <Trash2 size={15} /> Permanently delete
                    </button>
                  </>
                )}
              </div>
            </div>
          ) : (
            <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 18, marginBottom: 20 }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
                {editFormColumns.map(c => (
                  c.key === "type" ? (
                    <TypeField key={c.key} value={draft.type || ""} onChange={v => setDraft({ ...draft, type: v })} />
                  ) : c.key === "room" && draft.type !== "Room" ? (
                    <RoomField key={c.key} value={draft.room || ""} onChange={v => setDraft({ ...draft, room: v })} roomOptions={roomAssetNames} />
                  ) : c.key === "building" && draft.type !== "Building" ? (
                    <BuildingField key={c.key} value={draft.building || ""} onChange={v => setDraft({ ...draft, building: v })} buildingOptions={buildingAssetNames} />
                  ) : c.key === "person" ? (
                    <UserField
                      key={c.key}
                      value={draft.person || ""}
                      onChange={v => setDraft({ ...draft, person: v })}
                      userOptions={usersList}
                      onManage={() => setShowUsersManager(true)}
                    />
                  ) : c.key === "peripherals" ? (
                    <PeripheralsField
                      key={c.key}
                      value={draft.peripherals || ""}
                      onChange={v => setDraft({ ...draft, peripherals: v })}
                      options={peripheralsList}
                      onManage={() => setShowPeripheralsManager(true)}
                    />
                  ) : c.key === "itemName" ? (
                    <BulkTypeField
                      key={c.key}
                      value={draft.itemName || ""}
                      onChange={v => setDraft({ ...draft, itemName: v })}
                      options={bulkItemTypes}
                      onManage={() => setShowBulkItemTypesManager(true)}
                    />
                  ) : (
                    <Field
                      key={c.key}
                      label={c.label}
                      value={draft[c.key] || ""}
                      onChange={v => setDraft({ ...draft, [c.key]: v })}
                      wide={c.key === "notes"}
                      type={c.key === "totalQuantity" ? "number" : undefined}
                    />
                  )
                ))}
              </div>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 14 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                  Note for audit log (optional)
                </span>
                <textarea
                  value={editNote}
                  onChange={e => setEditNote(e.target.value)}
                  placeholder="Why this change? e.g. 20 chairs disposed of, broken"
                  rows={2}
                  style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, resize: "vertical", color: C.ink }}
                />
              </label>
              <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
                <button onClick={saveDraft} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.success, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 2 }}>
                  <Save size={15} /> Save
                </button>
                <button onClick={() => { setDetailEditing(false); setEditNote(""); }} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2, color: C.ink }}>
                  Cancel
                </button>
              </div>
            </div>
          ))}

          {detailTab === "contents" && (
            <>
              {contentsCount === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>
                  Nothing linked to this {selectedAsset.type.toLowerCase()} yet.
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {contentRooms.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 2 }}>
                      Rooms ({contentRooms.length})
                    </div>
                  )}
                  {contentRooms.map(r => {
                    const RIcon = iconFor(r.type);
                    return (
                      <button key={r.label} onClick={() => openDetail(r)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <RIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1 }}>{r.room}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.accent }}>{r.label}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                  {contentDevices.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginTop: contentRooms.length ? 10 : 0, marginBottom: 2 }}>
                      Devices ({contentDevices.length})
                    </div>
                  )}
                  {contentDevices.map(d => {
                    const DIcon = iconFor(d.type);
                    return (
                      <button key={d.label} onClick={() => openDetail(d)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <DIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {d.type}{d.brand ? ` · ${d.brand}` : ""}{selectedAsset.type === "Building" && d.room ? ` · ${d.room}` : ""}
                        </span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.accent }}>{d.label}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                  {contentAllocations.length > 0 && (
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginTop: (contentRooms.length || contentDevices.length) ? 10 : 0, marginBottom: 2 }}>
                      Bulk Items ({contentAllocations.length})
                    </div>
                  )}
                  {contentAllocations.map(({ bulk, quantity }) => {
                    const BIcon = iconFor(bulk.type);
                    return (
                      <button key={bulk.label} onClick={() => openDetail(bulk)} className="row-body" style={{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px", textAlign: "left", width: "100%" }}>
                        <BIcon size={15} style={{ color: C.brand, flexShrink: 0 }} />
                        <span style={{ fontSize: 14, color: C.ink, flex: 1 }}>{bulk.itemName || "Bulk Item"}</span>
                        <span style={{ fontWeight: 600, color: C.brandDark }}>× {quantity}</span>
                        <ChevronRight size={14} style={{ color: C.placeholder }} />
                      </button>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {detailTab === "allocations" && (
            <>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 16, fontSize: 13 }}>
                <div><span style={{ color: C.muted }}>Total: </span><span style={{ fontWeight: 700, color: C.brandDark }}>{parseFloat(selectedAsset.totalQuantity) || 0}</span></div>
                <div><span style={{ color: C.muted }}>Allocated: </span><span style={{ fontWeight: 700, color: C.brandDark }}>{getAllocatedTotal(selectedAsset)}</span></div>
                <div><span style={{ color: C.muted }}>Available: </span><span style={{ fontWeight: 700, color: getAvailable(selectedAsset) < 0 ? C.danger : C.success }}>{getAvailable(selectedAsset)}</span></div>
              </div>

              <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 14, marginBottom: 20 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                  <RoomField
                    value={allocationDraft.room}
                    onChange={v => {
                      const existing = (selectedAsset.allocations || []).find(a => a.room === v);
                      setAllocationDraft({ room: v, quantity: existing ? String(existing.quantity) : "" });
                      setAllocationError("");
                    }}
                    roomOptions={roomAssetNames}
                  />
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Quantity</span>
                    <input
                      type="number"
                      inputMode="numeric"
                      value={allocationDraft.quantity}
                      onChange={e => { setAllocationDraft({ ...allocationDraft, quantity: e.target.value }); setAllocationError(""); }}
                      placeholder="0"
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                    />
                  </label>
                </div>
                {allocationError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 8 }}>{allocationError}</div>}
                <div style={{ display: "flex", justifyContent: "flex-end" }}>
                  <button
                    onClick={saveAllocation}
                    disabled={!allocationDraft.room || !allocationDraft.quantity}
                    style={{ padding: "8px 14px", background: (allocationDraft.room && allocationDraft.quantity) ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                  >
                    Assign
                  </button>
                </div>
              </div>

              {(selectedAsset.allocations || []).length === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>Nothing assigned to a room yet.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {(selectedAsset.allocations || []).map(a => (
                    <div key={a.room} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "9px 14px" }}>
                      <div style={{ fontSize: 14, color: C.ink }}>{a.room}</div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <span style={{ fontWeight: 600, color: C.brandDark }}>{a.quantity}</span>
                        <button onClick={() => setConfirmAllocationRemove(a.room)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label={`Remove allocation for ${a.room}`}>
                          <X size={14} color={C.placeholder} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {detailTab === "maintenance" && (
            <>
              <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 14, marginBottom: 20 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Task</span>
                    <input
                      value={maintenanceDraft.task}
                      onChange={e => setMaintenanceDraft({ ...maintenanceDraft, task: e.target.value })}
                      placeholder="e.g. Replace HVAC filter"
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                    />
                  </label>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Frequency</span>
                    <select
                      value={maintenanceDraft.frequency}
                      onChange={e => setMaintenanceDraft({ ...maintenanceDraft, frequency: e.target.value })}
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
                    >
                      {MAINTENANCE_FREQUENCIES.map(f => <option key={f.label} value={f.label}>{f.label}</option>)}
                    </select>
                  </label>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Last performed</span>
                    <input
                      type="date"
                      value={maintenanceDraft.lastPerformed}
                      onChange={e => setMaintenanceDraft({ ...maintenanceDraft, lastPerformed: e.target.value })}
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                    />
                  </label>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Owner</span>
                    <input
                      value={maintenanceDraft.owner}
                      onChange={e => setMaintenanceDraft({ ...maintenanceDraft, owner: e.target.value })}
                      placeholder="Who's responsible?"
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                    />
                  </label>
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end" }}>
                  <button
                    onClick={addMaintenanceItem}
                    disabled={!maintenanceDraft.task.trim()}
                    style={{ padding: "8px 14px", background: maintenanceDraft.task.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                  >
                    Schedule
                  </button>
                </div>
              </div>

              {maintenanceItems.length === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>No maintenance scheduled yet.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {maintenanceItems.map(({ item, idx, status, due }) => {
                    const statusMeta = {
                      overdue: { label: "Overdue", color: C.danger },
                      "due-soon": { label: "Due soon", color: C.accent },
                      ok: { label: "On track", color: C.success },
                      never: { label: "Not yet done", color: C.muted },
                    }[status];
                    if (editingMaintenanceIdx === idx) {
                      return (
                        <div key={idx} style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 14 }}>
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                            <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Task</span>
                              <input
                                value={maintenanceEditDraft.task}
                                onChange={e => setMaintenanceEditDraft({ ...maintenanceEditDraft, task: e.target.value })}
                                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                              />
                            </label>
                            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Frequency</span>
                              <select
                                value={maintenanceEditDraft.frequency}
                                onChange={e => setMaintenanceEditDraft({ ...maintenanceEditDraft, frequency: e.target.value })}
                                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
                              >
                                {MAINTENANCE_FREQUENCIES.map(f => <option key={f.label} value={f.label}>{f.label}</option>)}
                              </select>
                            </label>
                            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Last performed</span>
                              <input
                                type="date"
                                value={maintenanceEditDraft.lastPerformed}
                                onChange={e => setMaintenanceEditDraft({ ...maintenanceEditDraft, lastPerformed: e.target.value })}
                                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                              />
                            </label>
                            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Owner</span>
                              <input
                                value={maintenanceEditDraft.owner}
                                onChange={e => setMaintenanceEditDraft({ ...maintenanceEditDraft, owner: e.target.value })}
                                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                              />
                            </label>
                          </div>
                          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                            <button
                              onClick={saveMaintenanceEdit}
                              disabled={!maintenanceEditDraft.task.trim()}
                              style={{ padding: "8px 14px", background: maintenanceEditDraft.task.trim() ? C.success : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                            >
                              Save
                            </button>
                            <button onClick={cancelEditMaintenance} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>
                              Cancel
                            </button>
                          </div>
                        </div>
                      );
                    }
                    return (
                      <div key={idx} style={{ border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4, gap: 8 }}>
                          <span style={{ fontWeight: 700, fontSize: 13, color: C.brandDark }}>{item.task}</span>
