        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}>
            Showing {filtered.length} of {assets.length} assets
            {sortConfig && (
              <button onClick={() => setSortConfig(null)} style={{ background: "none", border: "none", padding: 0, marginLeft: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.accent, textDecoration: "underline" }}>
                clear sort
              </button>
            )}
          </div>
        </div>

        {userFilter !== "All users" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 2, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Reassign {filtered.filter(a => fieldAppliesTo("person", a.type)).length} filtered asset(s) from <b style={{ color: C.brandDark }}>{userFilter}</b> to:</span>
            <select
              value={reassignTarget}
              onChange={e => setReassignTarget(e.target.value)}
              style={{ padding: "6px 10px", border: `1.5px solid ${C.border}`, fontSize: 13, borderRadius: 2, color: C.ink, background: "#fff", flex: "1 1 140px", maxWidth: 220 }}
            >
              <option value="">Select a user…</option>
              {usersList.filter(u => u !== userFilter).map(u => <option key={u} value={u}>{u}</option>)}
            </select>
            <button onClick={() => setShowUsersManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Manage users">
              <Settings size={14} color={C.accent} />
            </button>
            <button
              onClick={() => reassignFilteredTo(reassignTarget)}
              disabled={!reassignTarget.trim()}
              style={{ padding: "6px 12px", background: reassignTarget.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
            >
              Reassign
            </button>
          </div>
        )}

        {roomFilter !== "All rooms" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 2, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Move {filtered.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item").length} filtered device(s) from <b style={{ color: C.brandDark }}>{roomFilter}</b> to:</span>
            <select
              value={moveTarget}
              onChange={e => setMoveTarget(e.target.value)}
              style={{ padding: "6px 10px", border: `1.5px solid ${C.border}`, fontSize: 13, borderRadius: 2, color: C.ink, background: "#fff", flex: "1 1 140px", maxWidth: 220 }}
            >
              <option value="">Select a room…</option>
              {roomAssetNames.filter(r => r !== roomFilter).map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <button
              onClick={() => moveFilteredTo(moveTarget)}
              disabled={!moveTarget}
              style={{ padding: "6px 12px", background: moveTarget ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
            >
              Move
            </button>
          </div>
        )}

        {/* Table */}
        <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, overflow: "hidden", background: C.surface }}>
          <div className="scroller" style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: gridTemplate, background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
              {visibleColumns.map((c, i) => {
                const cfg = filterConfigs[c.key];
                const isFiltered = cfg && cfg.value !== cfg.options[0];
                const sortedHere = sortConfig && sortConfig.key === c.key;
                const sortArrow = sortedHere ? (sortConfig.dir === "asc" ? " ↑" : " ↓") : "";
                return (
                  <div key={c.key} style={{ position: i === 0 ? "sticky" : "static", left: i === 0 ? 0 : undefined, background: C.brandDark, zIndex: i === 0 ? 2 : 1 }}>
                    {cfg ? (
                      <button
                        onClick={() => setActiveFilterCol(c.key)}
                        style={{
                          width: "100%", display: "flex", alignItems: "center", gap: 5, textAlign: "left",
                          background: "none", border: "none", padding: "10px 14px",
                          fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
                          color: isFiltered || sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: isFiltered || sortedHere ? 700 : "inherit",
                        }}
                      >
                        {c.label}{sortArrow}
                        <Filter size={11} style={{ flexShrink: 0 }} />
                      </button>
                    ) : (
                      <button
                        onClick={() => setSortConfig(
                          !sortedHere ? { key: c.key, dir: "asc" }
                          : sortConfig.dir === "asc" ? { key: c.key, dir: "desc" }
                          : null
                        )}
                        title="Tap to sort"
                        style={{
                          width: "100%", display: "flex", alignItems: "center", gap: 5, textAlign: "left",
                          background: "none", border: "none", padding: "10px 14px",
                          fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
                          color: sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: sortedHere ? 700 : "inherit",
                        }}
                      >
                        {c.label}{sortArrow}
                      </button>
                    )}
                  </div>
                );
              })}
              <div style={{ padding: "10px 14px" }} />
            </div>

            {filtered.length === 0 && (
              <div style={{ padding: 32, textAlign: "center", color: C.empty, fontSize: 14, minWidth: "max-content" }}>No assets match your search.</div>
            )}

            {filtered.map(a => (
              <div
                key={a.label}
                className="row-body"
                onClick={() => openDetail(a)}
                style={{ display: "grid", gridTemplateColumns: gridTemplate, alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
              >
                {visibleColumns.map((c, i) => {
                  const isTypeCol = c.key === "type";
                  const Icon = isTypeCol ? iconFor(a.type) : null;
                  const applies = fieldAppliesTo(c.key, a.type);
                  const isInferredBuilding = c.key === "building" && !applies;
                  const inferredValue = isInferredBuilding ? inferBuilding(a, assets) : "";
                  return (
                    <div
                      key={c.key}
                      style={{
                        padding: "12px 14px",
                        fontSize: c.key === "label" ? 12 : 13,
                        fontFamily: c.key === "label" ? "'IBM Plex Mono', monospace" : undefined,
                        fontWeight: c.key === "label" ? 600 : isTypeCol ? 500 : 400,
                        fontStyle: isInferredBuilding && inferredValue ? "italic" : "normal",
                        color: c.key === "label" ? C.accent : (applies || (isInferredBuilding && inferredValue)) ? C.muted : C.border,
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        display: "flex", alignItems: "center", gap: 8,
                        position: i === 0 ? "sticky" : "static",
                        left: i === 0 ? 0 : undefined,
                        background: i === 0 ? C.surface : "transparent",
                        zIndex: i === 0 ? 2 : "auto",
                      }}
                      title={isInferredBuilding && inferredValue ? "Inherited via this asset's Room" : undefined}
                    >
                      {Icon && <Icon size={15} style={{ flexShrink: 0, color: C.brand }} />}
                      {applies ? (a[c.key] || "—") : isInferredBuilding ? (inferredValue || "") : ""}
                    </div>
                  );
                })}
                <div style={{ display: "flex", justifyContent: "center", padding: "12px 8px" }}>
                  <ChevronRight size={15} style={{ color: C.placeholder }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Column header filter modal */}
      {activeFilterCol && filterConfigs[activeFilterCol] && (
        <div onClick={() => setActiveFilterCol(null)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 300, maxHeight: "70vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
                Filter by {filterConfigs[activeFilterCol].label}
              </div>
              <button onClick={() => setActiveFilterCol(null)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {filterConfigs[activeFilterCol].options.map(opt => {
                const isSelected = opt === filterConfigs[activeFilterCol].value;
                return (
                  <button
                    key={opt}
                    onClick={() => { filterConfigs[activeFilterCol].setValue(opt); setActiveFilterCol(null); }}
                    style={{
                      display: "flex", alignItems: "center", justifyContent: "space-between",
                      padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                      borderRadius: 2, fontSize: 14, textAlign: "left", color: C.ink, fontWeight: isSelected ? 600 : 400,
                    }}
                  >
                    {opt}
                    {isSelected && <Check size={15} color={C.brand} />}
                  </button>
                );
              })}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 12, display: "flex", gap: 6 }}>
              {[["asc", "Sort A → Z"], ["desc", "Sort Z → A"]].map(([dir, lbl]) => {
                const active = sortConfig && sortConfig.key === activeFilterCol && sortConfig.dir === dir;
                return (
                  <button
                    key={dir}
                    onClick={() => { setSortConfig(active ? null : { key: activeFilterCol, dir }); setActiveFilterCol(null); }}
                    style={{ flex: 1, padding: "7px 10px", background: active ? C.brand : "transparent", color: active ? "#fff" : C.ink, border: `1.5px solid ${active ? C.brand : C.border}`, borderRadius: 2, fontSize: 13, fontWeight: 600 }}
                  >
                    {lbl}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Column manager modal */}
      {showColManager && (
        <div onClick={() => setShowColManager(false)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 340, maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Columns</div>
              <button onClick={() => setShowColManager(false)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>Hostname and Screen Size only apply to some types — they'll show blank for others.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {columns.map(c => (
                <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 8, opacity: c.locked ? 0.6 : 1 }}>
                    <input type="checkbox" checked={c.visible} disabled={c.locked} onChange={() => toggleColumnVisible(c.key)} />
                    {c.label} {c.locked && <Lock size={11} />}
                  </label>
                  {c.custom && (
                    <button onClick={() => setConfirmDeleteCol(c.key)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
              <input
                value={newColName}
                onChange={e => setNewColName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addColumn()}
                placeholder="New column name"
                style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
              />
              <button onClick={addColumn} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 2, fontSize: 14, fontWeight: 600 }}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Delete column confirm */}
      {confirmDeleteCol && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
          <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 360 }}>
            <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove "{columns.find(c => c.key === confirmDeleteCol)?.label}" column?</div>
            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This deletes that field's data from every asset. This can't be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteCol(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
              <button onClick={() => removeColumn(confirmDeleteCol)} style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}>Remove</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Field({ label, value, onChange, placeholder, wide, type }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>{label}</span>
      <input
        type={type || "text"}
        inputMode={type === "number" ? "numeric" : undefined}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
      />
    </label>
  );
}

function TypeField({ value, onChange }) {
  const options = TYPE_OPTIONS.includes(value) || !value ? TYPE_OPTIONS : [value, ...TYPE_OPTIONS];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Type</span>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function RoomField({ value, onChange, roomOptions }) {
  const options = !value || roomOptions.includes(value) ? roomOptions : [value, ...roomOptions];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Room</span>
      <select
        value={value || ""}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        <option value="">{roomOptions.length ? "Select a room…" : "No Room assets yet"}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function BuildingField({ value, onChange, buildingOptions }) {
  const options = !value || buildingOptions.includes(value) ? buildingOptions : [value, ...buildingOptions];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Building</span>
      <select
        value={value || ""}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        <option value="">{buildingOptions.length ? "Select a building…" : "No Building assets yet"}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function UserField({ value, onChange, userOptions, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom names already on this asset that aren't in the
  // managed list, so editing never silently drops someone.
  const allOptions = [...userOptions, ...selected.filter(s => !userOptions.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        User{selected.length > 1 ? "s" : ""}
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage users">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No users defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PeripheralsField({ value, onChange, options, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom values already on this asset that aren't in the managed list,
  // so editing never silently drops data.
  const allOptions = [...options, ...selected.filter(s => !options.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Peripherals
        <button onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage peripherals">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No peripherals defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Detail({ label, value }) {
  return (
    <div>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 0.5, textTransform: "uppercase", color: C.placeholder }}>{label}</span>
      <div style={{ color: value ? C.ink : C.placeholder, fontSize: 14 }}>{value || "—"}</div>
    </div>
  );
}

function ListManagerModal({ title, items, newValue, onNewValueChange, onAdd, onRemove, onClose, placeholder }) {
  const [confirmItem, setConfirmItem] = useState(null);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 320, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        {items.length === 0 && (
          <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>Nothing added yet.</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
          {items.map(item => (
            <div key={item} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
              {confirmItem === item ? (
                <>
                  <span style={{ color: C.danger, fontSize: 13 }}>Remove "{item}"?</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmItem(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 2, fontSize: 12, color: C.ink }}>Cancel</button>
                    <button
                      onClick={() => { onRemove(item); setConfirmItem(null); }}
                      style={{ padding: "3px 8px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontSize: 12, fontWeight: 600 }}
                    >
                      Delete
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <span>{item}</span>
                  <button onClick={() => setConfirmItem(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                    <Trash2 size={14} color={C.danger} />
                  </button>
                </>
              )}
            </div>
          ))}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
          <input
            value={newValue}
            onChange={e => onNewValueChange(e.target.value)}
            onKeyDown={e => e.key === "Enter" && onAdd()}
            placeholder={placeholder}
            style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
          />
          <button onClick={onAdd} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 2, fontSize: 14, fontWeight: 600 }}>Add</button>
        </div>
      </div>
    </div>
  );
}

function SelectBox({ value, onChange, options }) {
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      style={{ padding: "10px 12px", border: `1.5px solid ${C.brandDark}`, background: C.surface, fontSize: 14, borderRadius: 2, color: C.ink }}
    >
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AssetTracker />);
</script>
</body>
</html>
