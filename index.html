  );

  const nameModal = showNamePrompt && (
    <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 22, width: "100%", maxWidth: 320, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <UserCircle size={18} style={{ color: C.brand }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Who's this?</div>
        </div>
        <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
          Enter your name so edits and comments you make are attributed to you. This is just a label — not a login — and is remembered on this device.
        </div>
        <input
          value={nameInput}
          onChange={e => setNameInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && saveUserName(nameInput)}
          placeholder="Your name"
          autoFocus
          style={{ width: "100%", padding: "9px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, marginBottom: 12 }}
        />
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          {currentUser && (
            <button onClick={() => { setShowNamePrompt(false); setNameInput(""); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
              Cancel
            </button>
          )}
          <button
            onClick={() => saveUserName(nameInput)}
            disabled={!nameInput.trim()}
            style={{ padding: "8px 14px", background: nameInput.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
          >
            Save
          </button>
        </div>
      </div>
    </div>
  );

  const peripheralsManagerModal = showPeripheralsManager && (
    <ListManagerModal
      title="Manage peripherals"
      items={peripheralsList}
      newValue={newPeripheralName}
      onNewValueChange={setNewPeripheralName}
      onAdd={addPeripheral}
      onRemove={removePeripheral}
      onClose={() => { setShowPeripheralsManager(false); setNewPeripheralName(""); }}
      placeholder="New peripheral name"
    />
  );

  const usersManagerModal = showUsersManager && (
    <ListManagerModal
      title="Manage users"
      items={usersList}
      newValue={newUserName}
      onNewValueChange={setNewUserName}
      onAdd={addUser}
      onRemove={removeUser}
      onClose={() => { setShowUsersManager(false); setNewUserName(""); }}
      placeholder="New user's name"
    />
  );

  const bulkItemTypesManagerModal = showBulkItemTypesManager && (
    <ListManagerModal
      title="Manage bulk item sub-types"
      items={bulkItemTypes}
      newValue={newBulkItemTypeName}
      onNewValueChange={setNewBulkItemTypeName}
      onAdd={addBulkItemType}
      onRemove={removeBulkItemType}
      onClose={() => { setShowBulkItemTypesManager(false); setNewBulkItemTypeName(""); }}
      placeholder="New sub-type, e.g. Folding Chair"
    />
  );

  const typesManagerModal = showTypesManager && (
    <ListManagerModal
      title="Manage asset types"
      items={typesList}
      newValue={newTypeName}
      onNewValueChange={setNewTypeName}
      onAdd={addType}
      onRemove={removeType}
      onClose={() => { setShowTypesManager(false); setNewTypeName(""); }}
      placeholder="New type name"
      isLocked={t => LOCKED_TYPES.includes(t)}
      hint="Room, Building, Bulk Item, and Electrical Panel are built into the app and can't be removed."
    />
  );

  // Bespoke (not ListManagerModal) since a BreakerType needs a richer editor —
  // a visual half-cell grid to build each member's footprint — than a flat
  // list of strings can express. List view and the add/edit form share one
  // modal, toggled by whether breakerTypeDraft is set.
  const breakerTypesManagerModal = showBreakerTypesManager && (
    <div
      onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
      style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: breakerTypeDraft ? 480 : 380, maxHeight: "80vh", overflowY: "auto" }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            {breakerTypeDraft ? (breakerTypeDraft.id ? "Edit Breaker Type" : "New Breaker Type") : "Manage Breaker Types"}
          </div>
          <button
            onClick={() => { setShowBreakerTypesManager(false); cancelBreakerTypeDraft(); setConfirmDeleteTypeId(null); }}
            className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}
          >
            <X size={18} />
          </button>
        </div>

        {breakerTypeError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{breakerTypeError}</div>}

        {!breakerTypeDraft ? (
          <>
            {breakerTypes.length === 0 && <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>No breaker types defined yet.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {breakerTypes.map(t => (
                <div key={t.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: "8px 12px" }}>
                  {confirmDeleteTypeId === t.id ? (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ color: C.danger, fontSize: 13 }}>Delete "{t.name}"?</span>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => setConfirmDeleteTypeId(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 12, color: C.ink }}>Cancel</button>
                        <button
                          onClick={() => { removeBreakerType(t.id); setConfirmDeleteTypeId(null); }}
                          style={{ padding: "3px 8px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontSize: 12, fontWeight: 600 }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 14, color: C.ink }}>{t.name}</div>
                        <div style={{ fontSize: 12, color: C.muted }}>
                          {t.slotSpan} slot{t.slotSpan !== 1 ? "s" : ""} · {t.members.length} breaker{t.members.length !== 1 ? "s" : ""} · {t.members.map(m => `${m.ampRating || "?"}A`).join(", ")}
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 4 }}>
                        <button onClick={() => openEditBreakerType(t)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Edit ${t.name}`}>
                          <Pencil size={14} color={C.muted} />
                        </button>
                        <button onClick={() => { setBreakerTypeError(null); setConfirmDeleteTypeId(t.id); }} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }} aria-label={`Delete ${t.name}`}>
                          <Trash2 size={14} color={C.danger} />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <button
              onClick={openAddBreakerType}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600 }}
            >
              <Plus size={14} /> New Breaker Type
            </button>
          </>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Name</span>
              <input
                value={breakerTypeDraft.name}
                onChange={e => setBreakerTypeDraft({ ...breakerTypeDraft, name: e.target.value })}
                placeholder="e.g. Tandem"
                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
              />
            </label>
            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Slot Span</span>
              <select
                value={breakerTypeDraft.slotSpan}
                onChange={e => changeBreakerTypeSlotSpan(parseInt(e.target.value, 10))}
                style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, background: "#fff", maxWidth: 160 }}
              >
                <option value={1}>1 slot</option>
                <option value={2}>2 slots</option>
                <option value={3}>3 slots</option>
              </select>
            </label>

            <div>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                Click cells for the breaker you're defining
              </span>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, marginTop: 6 }}>
                {(() => {
                  const takenSet = new Set(breakerTypeDraft.members.flatMap(m => m.cells));
                  return Array.from({ length: breakerTypeDraft.slotSpan }, (_, i) => i + 1).map(slotIdx => (
                    <div key={slotIdx} style={{ display: "flex", gap: 4, alignItems: "center" }}>
                      <span style={{ fontSize: 11, color: C.muted, width: 40 }}>Slot {slotIdx}</span>
                      {["a", "b"].map(half => {
                        const cell = `${slotIdx}${half}`;
                        const taken = takenSet.has(cell);
                        const selected = currentMemberCells.includes(cell);
                        return (
                          <button
                            key={cell} type="button" disabled={taken}
                            onClick={() => toggleBreakerTypeCell(cell)}
                            style={{
                              flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 12, fontWeight: 700,
                              border: `1.5px solid ${selected ? C.brand : C.border}`,
                              background: taken ? C.bg : selected ? C.brand : "#fff",
                              color: taken ? C.placeholder : selected ? "#fff" : C.ink,
                              cursor: taken ? "not-allowed" : "pointer",
                            }}
                          >
                            {cell}{taken ? " ✓" : ""}
                          </button>
                        );
                      })}
                    </div>
                  ));
                })()}
              </div>
            </div>

            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Amp Rating (selected cells)</span>
                <input
                  type="number" placeholder="20" value={currentMemberAmp}
                  onChange={e => setCurrentMemberAmp(e.target.value)}
                  style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                />
              </label>
              <button onClick={addBreakerTypeMember} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600 }}>
                Add Breaker
              </button>
            </div>

            {breakerTypeDraft.members.length > 0 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Breakers in this type</span>
                {breakerTypeDraft.members.map((m, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", border: `1px solid ${C.border}`, borderRadius: 8, padding: "6px 10px", fontSize: 13 }}>
                    <span>{m.cells.join("+")} · {m.ampRating}A · {new Set(m.cells.map(c => c.slice(0, -1))).size}-pole</span>
                    <button onClick={() => removeBreakerTypeMember(i)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label="Remove breaker">
                      <X size={13} color={C.placeholder} />
                    </button>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", borderTop: `1px solid ${C.border}`, paddingTop: 14 }}>
              <button onClick={cancelBreakerTypeDraft} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                Cancel
              </button>
              <button onClick={saveBreakerType} style={{ padding: "8px 14px", background: C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                Save Type
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );

  // Fields to render in a form for the given type: common fields always,
  // type-restricted fields (hostname, screenSize) only when they apply.
  // Status is excluded — it's changed only via the Archive/Restore actions.
  function formColumnsFor(type) {
    return columns.filter(c => fieldAppliesTo(c.key, type) && c.key !== "status");
  }

  // ---------- DETAIL VIEW ----------
  if (view === "detail" && selectedAsset) {
    const Icon = iconFor(selectedAsset.type);
    const comments = [...(selectedAsset.comments || [])].reverse();
    const changeEntries = [...(selectedAsset.changes || [])].reverse();
    const totalLoggedCost = (selectedAsset.changes || []).reduce((sum, c) => sum + (parseFloat(c.cost) || 0), 0);
    const assetAuditEntries = auditLog.filter(e => e.assetLabel === selectedAsset.label).slice().reverse();
    // Never-performed items sort first (need scheduling attention); the rest by
    // ascending next-due date, which naturally puts the most-overdue on top.
    const maintenanceItems = (selectedAsset.maintenanceItems || [])
      .map((item, idx) => ({ item, idx, status: maintenanceStatusOf(item), due: nextMaintenanceDue(item) }))
      .sort((a, b) => (a.due ? a.due.getTime() : -Infinity) - (b.due ? b.due.getTime() : -Infinity));
    const overdueMaintenanceCount = maintenanceItems.filter(m => m.status === "overdue").length;
    const titleText = selectedAsset.type === "Bulk Item" && selectedAsset.itemName
      ? `${selectedAsset.itemName} (Bulk Item)`
      : selectedAsset.screenSize ? `${selectedAsset.type} · ${selectedAsset.screenSize}` : selectedAsset.type;
    const visibleDetailColumns = columns.filter(c => fieldAppliesTo(c.key, selectedAsset.type));
    const inheritedBuilding = !fieldAppliesTo("building", selectedAsset.type) ? inferBuilding(selectedAsset, assets) : "";
    const detailGroups = groupDetailColumns(visibleDetailColumns);
    const editFormColumns = formColumnsFor(draft.type);

    // Contents of a Room: devices located there + bulk-item allocations to it.
    // Contents of a Building: its linked Rooms, plus devices in those rooms.
    const isPlace = selectedAsset.type === "Room" || selectedAsset.type === "Building";
    let contentDevices = [], contentRooms = [], contentAllocations = [];
    if (selectedAsset.type === "Room") {
      contentDevices = assets.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item" && a.room === selectedAsset.room);
      contentAllocations = assets
        .filter(a => a.type === "Bulk Item")
        .flatMap(b => (b.allocations || []).filter(al => al.room === selectedAsset.room).map(al => ({ bulk: b, quantity: al.quantity })));
    } else if (selectedAsset.type === "Building") {
      contentRooms = assets.filter(a => a.type === "Room" && a.building === selectedAsset.building);
      const roomNames = new Set(contentRooms.map(r => r.room));
      contentDevices = assets.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item" && roomNames.has(a.room));
    }
    const contentsCount = contentDevices.length + contentRooms.length + contentAllocations.length;

    return (
      <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', sans-serif", color: C.ink }}>
        {globalStyle}
        {nameModal}
        {peripheralsManagerModal}
        {usersManagerModal}
        {bulkItemTypesManagerModal}
        {typesManagerModal}
        {breakerTypesManagerModal}
        <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "12px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={closeDetail} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.brandDark, display: "flex" }} aria-label="Back to list">
            <ArrowLeft size={20} />
          </button>
          <Icon size={17} style={{ color: C.brand, flexShrink: 0 }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, fontWeight: 600, color: C.accent }}>{selectedAsset.label}</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: C.brandDark, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{titleText}</div>
        </div>

        <div style={{ display: "flex", gap: 4, padding: "0 20px", borderBottom: `1.5px solid ${C.border}`, position: "sticky", top: 53, background: C.bg, zIndex: 9, overflowX: "auto" }}>
          {[
            { key: "details", label: "Details" },
            ...(isPlace ? [{ key: "contents", label: "Contents", count: contentsCount }] : []),
            ...(selectedAsset.type === "Bulk Item" ? [{ key: "allocations", label: "Allocations", count: (selectedAsset.allocations || []).length }] : []),
            ...(selectedAsset.type === "Electrical Panel" ? [{ key: "breakers", label: "Breakers", count: (selectedAsset.breakers || []).length }] : []),
            { key: "maintenance", label: "Maintenance", count: maintenanceItems.length, urgent: overdueMaintenanceCount > 0 },
            { key: "comments", label: "Comments", count: comments.length },
            { key: "changes", label: "Change Log", count: changeEntries.length },
            { key: "audit", label: "Audit", count: assetAuditEntries.length },
          ].map(tab => {
            const active = detailTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setDetailTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,
                }}
              >
                {tab.label}{tab.count > 0 ? ` (${tab.count})` : ""}
              </button>
            );
          })}
        </div>

        <div style={{ padding: "18px 20px 60px", maxWidth: 720, margin: "0 auto" }}>
          {detailTab === "details" && (!detailEditing ? (
            <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, background: C.surface, padding: 18, boxShadow: "0 1px 3px rgba(42,52,57,0.08), 0 1px 2px rgba(42,52,57,0.06)", marginBottom: 20 }}>
              {detailGroups.map((group, gi) => (
                <div key={group.title} style={{ marginTop: gi === 0 ? 0 : 18 }}>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", color: C.accent, marginBottom: 10, paddingBottom: 6, borderBottom: `1px solid ${C.border}` }}>
                    {group.title}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "14px 20px" }}>
                    {group.columns.map(c => (
                      <Detail key={c.key} label={c.label} value={selectedAsset[c.key]} wide={c.key === "notes"} />
                    ))}
                    {group.title === "Location & Assignment" && inheritedBuilding && (
                      <Detail label="Building (via Room)" value={inheritedBuilding} italic />
                    )}
                  </div>
                </div>
              ))}
              <div style={{ display: "flex", gap: 10, marginTop: 20, flexWrap: "wrap" }}>
                <button onClick={startEditSelected} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 10 }}>
                  <Pencil size={15} /> Edit
                </button>
                {selectedAsset.type !== "Room" && selectedAsset.type !== "Building" && (

          // same as the diagram already renders them as one visual cell.
          const members = [...(clicked.groupId ? allBreakers.filter(b => b.groupId === clicked.groupId) : [clicked])].sort((b1, b2) => {
            const s1 = Math.min(...slotsFromCells(b1.cells).map(Number));
            const s2 = Math.min(...slotsFromCells(b2.cells).map(Number));
            return s1 - s2;
          });
          const anchor = members[0];
          const memberIds = members.map(m => m.id);
          const breakerType = breakerTypes.find(t => t.id === anchor.breakerTypeId);
          const groupSlotLabel = [...new Set(members.flatMap(m => slotsFromCells(m.cells)))].sort((a, b) => parseFloat(a) - parseFloat(b)).join("/") || "—";
          const otherPanelLabels = assets.filter(a => a.type === "Electrical Panel" && a.label !== selectedAsset.label).map(a => a.label);
          const labelStyle = { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent };
          const inputStyle = { padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink };
          const closeModal = () => {
            setOpenBreakerId(null); setMemberAmpDrafts(null); setEditingMemberId(null);
            setInstanceDraft(null); setEditingInstance(false); setBreakerModalError(null); setConfirmDeleteGroup(false);
          };
          function renderCircuitTargetFields(values, setValues) {
            const mode = values.feedsPanelLabel ? "subpanel" : (values._mode || "rooms");
            const roomsSelected = values.roomsServed || [];
            return (
              <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 8 }}>
                <span style={labelStyle}>Serves</span>
                <div style={{ display: "flex", gap: 6 }}>
                  <button
                    type="button"
                    onClick={() => setValues({ ...values, _mode: "rooms", feedsPanelLabel: "" })}
                    style={{ flex: 1, padding: "7px 10px", background: mode === "rooms" ? C.brand : "transparent", color: mode === "rooms" ? "#fff" : C.ink, border: `1.5px solid ${mode === "rooms" ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
                  >
                    Serves rooms
                  </button>
                  <button
                    type="button"
                    onClick={() => setValues({ ...values, _mode: "subpanel", roomsServed: [] })}
                    style={{ flex: 1, padding: "7px 10px", background: mode === "subpanel" ? C.brand : "transparent", color: mode === "subpanel" ? "#fff" : C.ink, border: `1.5px solid ${mode === "subpanel" ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
                  >
                    Feeds sub-panel
                  </button>
                </div>
                {mode === "rooms" ? (
                  roomAssetNames.length === 0 ? (
                    <div style={{ fontSize: 13, color: C.empty }}>No Room assets yet.</div>
                  ) : (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {roomAssetNames.map(room => {
                        const active = roomsSelected.includes(room);
                        return (
                          <button
                            key={room}
                            type="button"
                            onClick={() => setValues({ ...values, roomsServed: active ? roomsSelected.filter(r => r !== room) : [...roomsSelected, room] })}
                            style={{ padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500, border: `1.5px solid ${active ? C.brand : C.border}`, background: active ? C.brand : "#fff", color: active ? "#fff" : C.ink }}
                          >
                            {room}
                          </button>
                        );
                      })}
                    </div>
                  )
                ) : otherPanelLabels.length === 0 ? (
                  <div style={{ fontSize: 13, color: C.empty }}>No other Electrical Panel assets yet.</div>
                ) : (
                  <select
                    value={values.feedsPanelLabel || ""}
                    onChange={e => setValues({ ...values, feedsPanelLabel: e.target.value })}
                    style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, background: "#fff" }}
                  >
                    <option value="">Select a panel…</option>
                    {otherPanelLabels.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                )}
              </div>
            );
          }
          return (
            <div onClick={closeModal} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
              <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 520, maxHeight: "85vh", overflowY: "auto" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 16, color: C.brandDark }}>Slot {groupSlotLabel}</div>
                    {breakerType && <div style={{ fontSize: 12, color: C.muted }}>{breakerType.name} — {members.length} breaker{members.length !== 1 ? "s" : ""}</div>}
                  </div>
                  <button onClick={closeModal} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
                </div>

                {/* Instance-level details — serial/installed/notes describe the one
                    physical unit, so they're edited once here and applied to every
                    member row, not repeated per breaker. Delete removes the whole
                    unit for the same reason. */}
                <div style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, marginBottom: 14, background: "#fff" }}>
                  {editingInstance ? (
                    <>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10, marginBottom: 12 }}>
                        <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          <span style={labelStyle}>Serial</span>
                          <input value={instanceDraft.serial} onChange={e => setInstanceDraft({ ...instanceDraft, serial: e.target.value })} placeholder="optional" style={inputStyle} />
                        </label>
                        <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          <span style={labelStyle}>Installed</span>
                          <input type="date" value={dateOnly(instanceDraft.installedDate)} onChange={e => setInstanceDraft({ ...instanceDraft, installedDate: e.target.value })} style={inputStyle} />
                        </label>
                        <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: "1 / -1" }}>
                          <span style={labelStyle}>Notes</span>
                          <input value={instanceDraft.notes} onChange={e => setInstanceDraft({ ...instanceDraft, notes: e.target.value })} style={inputStyle} />
                        </label>
                      </div>
                      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                        <button
                          onClick={() => { setInstanceDraft({ serial: anchor.serial || "", installedDate: anchor.installedDate || "", notes: anchor.notes || "" }); setEditingInstance(false); }}
                          style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}
                        >
                          Cancel
                        </button>
                        <button
                          onClick={() => { saveBreakerInstanceDetails(memberIds, groupSlotLabel, instanceDraft); setEditingInstance(false); }}
                          style={{ padding: "8px 14px", background: C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                        >
                          Save
                        </button>
                      </div>
                    </>
                  ) : (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 16 }}>
                        <div>
                          <div style={labelStyle}>Serial</div>
                          <div style={{ fontSize: 13, color: C.ink }}>{anchor.serial || "—"}</div>
                        </div>
                        <div>
                          <div style={labelStyle}>Installed</div>
                          <div style={{ fontSize: 13, color: C.ink }}>{formatDateOnly(anchor.installedDate) || "—"}</div>
                        </div>
                        <div>
                          <div style={labelStyle}>Notes</div>
                          <div style={{ fontSize: 13, color: C.ink }}>{anchor.notes || "—"}</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
                        <button onClick={() => setEditingInstance(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Edit">
                          <Pencil size={14} color={C.muted} />
                        </button>
                        {!confirmDeleteGroup && (
                          <button onClick={() => { setBreakerModalError(null); setConfirmDeleteGroup(true); }} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Delete">
                            <Trash2 size={14} color={C.danger} />
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {confirmDeleteGroup && (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "flex-end", marginTop: 12 }}>
                      <span style={{ fontSize: 13, color: C.danger }}>Delete this breaker unit?</span>
                      <button onClick={() => setConfirmDeleteGroup(false)} style={{ padding: "8px 12px", background: "transparent", border: `1.5px solid ${C.border}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                        Cancel
                      </button>
                      <button
                        onClick={() => {
                          const reason = canDeleteBreakerGroup(members);
                          if (reason) { setBreakerModalError(reason); setConfirmDeleteGroup(false); return; }
                          deleteBreakerGroup(members, groupSlotLabel);
                          closeModal();
                        }}
                        style={{ padding: "8px 12px", background: C.danger, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                      >
                        Delete
                      </button>
                    </div>
                  )}

                  {breakerModalError && <div style={{ fontSize: 13, color: C.danger, marginTop: 10 }}>{breakerModalError}</div>}
                </div>

                {members.map((member, idx) => {
                  const ampDraft = memberAmpDrafts[member.id];
                  if (ampDraft === undefined) return null;
                  const isEditingAmp = editingMemberId === member.id;
                  return (
                    <div key={member.id} style={{ border: `1px solid ${C.border}`, borderRadius: 10, padding: 14, marginBottom: 14, background: "#fff" }}>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: members.length > 1 ? "space-between" : "flex-end", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
                        {members.length > 1 && (
                          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.muted }}>
                            Breaker {idx + 1} — Slot {slotsLabel_(member)}
                          </div>
                        )}
                        {isEditingAmp ? (
                          <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
                            <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                              <span style={labelStyle}>Amp Rating</span>
                              <input type="number" value={ampDraft} onChange={e => setMemberAmpDrafts({ ...memberAmpDrafts, [member.id]: e.target.value })} style={{ ...inputStyle, width: 100 }} />
                            </label>
                            <button
                              onClick={() => { setMemberAmpDrafts({ ...memberAmpDrafts, [member.id]: member.ampRating || "" }); setEditingMemberId(null); }}
                              style={{ padding: "8px 12px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}
                            >
                              Cancel
                            </button>
                            <button
                              onClick={() => { saveBreakerAmp(member.id, ampDraft); setEditingMemberId(null); }}
                              style={{ padding: "8px 12px", background: C.success, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}
                            >
                              Save
                            </button>
                          </div>
                        ) : (
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={labelStyle}>Amp Rating</span>
                            <span style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{member.ampRating ? `${member.ampRating}A` : "—"}</span>
                            <button onClick={() => setEditingMemberId(member.id)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Edit amp rating">
                              <Pencil size={14} color={C.muted} />
                            </button>
                          </div>
                        )}
                      </div>

                      <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 12 }}>
                        <div style={{ ...labelStyle, marginBottom: 8 }}>Circuits</div>
                        <ChildEntityTable
                          items={member.circuits || []}
                          fields={[
                            { key: "label", label: "Label", placeholder: "e.g. Circuit 14" },
                            { key: "description", label: "Description", placeholder: "What does this feed?", wide: true },
                          ]}
                          initialDraft={{ label: "", description: "", roomsServed: [], feedsPanelLabel: "" }}
                          onAdd={draft2 => addCircuit(member.id, draft2)}
                          onSave={(id, draft2) => saveCircuitEdit(member.id, id, draft2)}
                          onDelete={id => deleteCircuit(member.id, id)}
                          addLabel="Add Circuit"
                          hideAddButton={!isEditingAmp}
                          emptyMessage="No circuits on this breaker yet."
                          renderCustomFields={renderCircuitTargetFields}
                          deleteConfirmMessage={circuit => `Delete circuit "${circuit.label}"?`}
                          renderSummary={circuit => (
                            <div>
                              <div style={{ fontWeight: 600, fontSize: 13, color: C.ink }}>{circuit.label}</div>
                              <div style={{ fontSize: 12, color: C.muted }}>
                                {circuit.feedsPanelLabel ? `Feeds → ${circuit.feedsPanelLabel}` : (circuit.roomsServed || []).length ? `Serves ${circuit.roomsServed.join(", ")}` : "—"}
                                {circuit.description ? ` · ${circuit.description}` : ""}
                              </div>
                            </div>
                          )}
                          customRowActions={circuit => (
                            <button onClick={() => openMoveCircuit(member.id, circuit)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label={`Move circuit ${circuit.label}`}>
                              <ArrowLeftRight size={14} color={C.muted} />
                            </button>
                          )}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {swappingBreaker && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 4, color: C.brandDark }}>Swap breaker at Slot {slotsLabel_(swappingBreaker)}</div>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>
                Keeps the same slot(s) and id — logged as a physical replacement, separate from a field edit.
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>New Serial</span>
                  <input
                    value={swapDraft.serial}
                    onChange={e => setSwapDraft({ ...swapDraft, serial: e.target.value })}
                    style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                  />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Amp Rating</span>
                  <input
                    type="number"
                    value={swapDraft.ampRating}
                    onChange={e => setSwapDraft({ ...swapDraft, ampRating: e.target.value })}
                    style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                  />
                </label>
                <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Installed Date</span>
                  <input
                    type="date"
                    value={swapDraft.installedDate}
                    onChange={e => setSwapDraft({ ...swapDraft, installedDate: e.target.value })}
                    style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink }}
                  />
                </label>
              </div>
              {swapError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{swapError}</div>}
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => { setSwappingBreaker(null); setSwapError(null); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                  Cancel
                </button>
                <button onClick={submitSwapBreaker} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                  Swap
                </button>
              </div>
            </div>
          </div>
        )}

        {movingCircuit && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 24, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 4, color: C.brandDark }}>Move circuit "{movingCircuit.circuit.label}"</div>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 14 }}>Choose a different breaker on this panel.</div>
              <select
                value={moveCircuitTarget}
                onChange={e => setMoveCircuitTarget(e.target.value)}
                style={{ width: "100%", padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 10, color: C.ink, background: "#fff", marginBottom: 12 }}
              >
                <option value="">Select a breaker…</option>
                {(selectedAsset.breakers || []).filter(b => b.id !== movingCircuit.breakerId).map(b => (
                  <option key={b.id} value={b.id}>Slot {slotsLabel_(b)}</option>
                ))}
              </select>
              {moveCircuitError && <div style={{ fontSize: 13, color: C.danger, marginBottom: 12 }}>{moveCircuitError}</div>}
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => { setMovingCircuit(null); setMoveCircuitError(null); }} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>
                  Cancel
                </button>
                <button onClick={submitMoveCircuit} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 10, fontWeight: 600, fontSize: 13 }}>
                  Move
                </button>
              </div>
            </div>
          </div>
        )}

        {showChangeTypeManager && (
          <ListManagerModal
            title="Manage change types"
            items={changeTypes}
            newValue={newChangeTypeName}
            onNewValueChange={setNewChangeTypeName}
            onAdd={addChangeType}
            onRemove={removeChangeType}
            onClose={() => { setShowChangeTypeManager(false); setNewChangeTypeName(""); }}
            placeholder="New change type"
          />
        )}

        {showVendorManager && (
          <ListManagerModal
            title="Manage vendors"
            items={vendors}
            newValue={newVendorName}
            onNewValueChange={setNewVendorName}
            onAdd={addVendor}
            onRemove={removeVendor}
            onClose={() => { setShowVendorManager(false); setNewVendorName(""); }}
            placeholder="New vendor name"
          />
        )}
      </div>
    );
  }

  // ---------- LIST VIEW ----------
  const hiddenColumns = columns.filter(c => !isColumnVisible(c));
  const addFormColumns = formColumnsFor(draft.type);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', 'Helvetica Neue', sans-serif", color: C.ink }}>
      {globalStyle}
      {nameModal}
      {peripheralsManagerModal}
      {usersManagerModal}
      {bulkItemTypesManagerModal}
      {typesManagerModal}
      {breakerTypesManagerModal}

      {/* Slim header */}
      <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "10px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: C.brandDark }}>BCA Asset Tracker</h1>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button
            onClick={toggleSandboxMode}
            title={sandboxMode
              ? "Sandbox is ON — you're editing local fixture data, nothing is saved to the Google Sheet. Click to switch back to the real Sheet."
              : "Click to switch to Sandbox mode — local fixture data, safe to experiment on, nothing saved to the Google Sheet."}
            style={{
              display: "flex", alignItems: "center", gap: 5, border: `1.5px solid ${sandboxMode ? C.accent : C.border}`,
              background: sandboxMode ? C.accent : "transparent", color: sandboxMode ? "#fff" : C.muted,
              borderRadius: 12, padding: "3px 10px", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, fontWeight: 700,
            }}
          >
            <FlaskConical size={12} />
            {sandboxMode ? "SANDBOX" : "Sandbox"}
          </button>
          {sandboxMode && (
            <button
              onClick={() => { if (confirm("Reset sandbox data back to the starting fixture? Your sandbox edits will be lost.")) resetSandbox(); }}
              title="Reset sandbox data back to the starting fixture"
              style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted }}
            >
              <RotateCcw size={12} /> Reset
            </button>
          )}
          <button
            onClick={() => { setNameInput(currentUser || ""); setShowNamePrompt(true); }}
            style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}
          >
            <UserCircle size={14} style={{ color: C.brand }} />
            {currentUser || "Set name"}
            {saveError && <span style={{ color: C.danger, marginLeft: 8 }}>Sync failed</span>}
          </button>
          {backendScriptVersion && backendScriptVersion !== FRONTEND_SCRIPT_VERSION && (
            <span
              style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.danger }}
              title={`Deployed backend: ${backendScriptVersion}\nExpected: ${FRONTEND_SCRIPT_VERSION}\n\nAssetTrackerSync.gs was edited but the live deployment wasn't updated to match — some saves may silently fail to persist. Redeploy: Apps Script > Deploy > Manage deployments > pencil icon > Version: New version > Deploy.`}
            >
              Backend outdated
            </span>
          )}
        </div>
      </div>

      {/* Top-level page tabs */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "0 20px", position: "sticky", top: 45, background: C.bg, zIndex: 9 }}>
        <div style={{ display: "flex", gap: 4, overflowX: "auto", overflowY: "hidden" }}>
          {[
            { key: "assets", label: "Assets" },
            { key: "maintenance", label: "Maintenance", count: allMaintenanceRows.length, urgent: maintenanceOverdueTotal > 0 },
          ].map(tab => {
            const active = mainTab === tab.key;
            return (
              <button
                key={tab.key}
                onClick={() => setMainTab(tab.key)}
                style={{
                  background: "none", border: "none", padding: "10px 12px", whiteSpace: "nowrap",
                  fontSize: 13, fontWeight: active || tab.urgent ? 700 : 500, color: tab.urgent ? C.danger : active ? C.brandDark : C.muted,
                  borderBottom: active ? `2px solid ${C.brand}` : "2px solid transparent", marginBottom: -1.5,
                }}

            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This deletes that field's data from every asset. This can't be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteCol(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 10, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>

}

function Field({ label, value, onChange, placeholder, wide, type }) {

function PickerTrigger({ value, placeholder, onClick, ariaLabel }) {

function BulkTypeField({ value, onChange, options, onManage }) {

  const allOptions = !value || options.includes(value) ? options : [value, ...options];
  return (

function UserField({ value, onChange, userOptions, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom names already on this asset that aren't in the
  // managed list, so editing never silently drops someone.
  const allOptions = [...userOptions, ...selected.filter(s => !userOptions.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        User{selected.length > 1 ? "s" : ""}
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage users">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No users defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ListManagerModal({ title, items, newValue, onNewValueChange, onAdd, onRemove, onClose, placeholder, isLocked, hint }) {
  const [confirmItem, setConfirmItem] = useState(null);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:320, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>

            return (
            <div key={item} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
              {confirmItem === item ? (
                <>
                  <span style={{ color: C.danger, fontSize: 13 }}>Remove "{item}"?</span>
                  <div style={{ display: "flex", gap: 6 }}>

                    <button

                  </div>
                </>

                    <button onClick={() => setConfirmItem(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>

      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth: 300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>

          <div style={{ display: "flex", alignItems: "center", gap: 2 }}>

              <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.accent, display: "flex" }} aria-label={manageLabel || "Manage list"}>
                <Settings size={15} />
              </button>
            )}
            <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>

          {options.map(opt => {

            return (
              <button
                key={opt || "__none__"}
                onClick={() => { onChange(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: opt ? C.ink : C.empty, fontWeight: isSelected ? 600 : 400,
                }}

                {getLabel(opt)}

              </button>
            );
          })}
        </div>
      </div>
    </div>

}

// Header cell for a data-table column: either a filter+sort trigger (Filter icon,
// opens ColumnFilterModal) for columns present in filterConfigs, or a plain
// click-to-cycle sort button (asc -> desc -> none) for everything else. A small
// × chip appears next to the sort arrow on whichever column is currently sorted,
// so it can be cleared directly instead of reopening the modal or re-cycling taps.
function ColumnHeaderCell({ label, colKey, sticky, filterConfigs, sortConfig, setSortConfig, onOpenFilter }) {
  const cfg = filterConfigs[colKey];
  const isFiltered = cfg && cfg.value !== cfg.options[0];
  const sortedHere = sortConfig && sortConfig.key === colKey;
  const sortArrow = sortedHere ? (sortConfig.dir === "asc" ? " ↑" : " ↓") : "";
  return (
    <div style={{ position: sticky ? "sticky" : "static", left: sticky ? 0 : undefined, background: C.brandDark, zIndex: sticky ? 2 : 1, display: "flex", alignItems: "center" }}>
      {cfg ? (
        <button
          onClick={() => onOpenFilter(colKey)}
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: isFiltered || sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: isFiltered || sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
          <Filter size={11} style={{ flexShrink: 0 }} />
        </button>
      ) : (
        <button
          onClick={() => setSortConfig(
            !sortedHere ? { key: colKey, dir: "asc" }
            : sortConfig.dir === "asc" ? { key: colKey, dir: "desc" }
            : null
          )}
          title="Tap to sort"
          style={{
            flex: 1, display: "flex", alignItems: "center", gap: 5, textAlign: "left",
            background: "none", border: "none", padding: "10px 14px",
            fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
            color: sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: sortedHere ? 700 : "inherit",
          }}
        >
          {label}{sortArrow}
        </button>
      )}
      {sortedHere && (
        <button
          onClick={() => setSortConfig(null)}
          title="Clear sort"
          aria-label="Clear sort"
          style={{ flexShrink: 0, background: "none", border: "none", padding: "6px 10px 6px 0", color: "#E8C9A0", display: "flex" }}
        >
          <X size={11} />
        </button>
      )}
    </div>
  );
}

// Modal opened from a ColumnHeaderCell's filter button: option list (with an
// optional cfg.labelForOption for columns whose stored value isn't the display
// text, e.g. Maintenance's Status filter storing "due-soon" but showing "Due
// soon") plus Sort A→Z / Z→A for that column.
function ColumnFilterModal({ activeCol, filterConfigs, sortConfig, setSortConfig, onClose }) {
  if (!activeCol || !filterConfigs[activeCol]) return null;
  const cfg = filterConfigs[activeCol];
  const getLabel = cfg.labelForOption || (o => o);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 20, boxShadow: "0 8px 24px rgba(42,52,57,0.16), 0 2px 8px rgba(42,52,57,0.1)", width: "100%", maxWidth:300, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
            Filter by {cfg.label}
          </div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          {cfg.options.map(opt => {
            const isSelected = opt === cfg.value;
            return (
              <button
                key={opt}
                onClick={() => { cfg.setValue(opt); onClose(); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                  borderRadius: 10, fontSize: 14, textAlign: "left", color: C.ink, fontWeight: isSelected ? 600 : 400,
                }}
              >
                {getLabel(opt)}
                {isSelected && <Check size={15} color={C.brand} />}
              </button>
            );
          })}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 12, display: "flex", gap: 6 }}>
          {[["asc", "Sort A → Z"], ["desc", "Sort Z → A"]].map(([dir, lbl]) => {
            const active = sortConfig && sortConfig.key === activeCol && sortConfig.dir === dir;
            return (
              <button
                key={dir}
                onClick={() => { setSortConfig(active ? null : { key: activeCol, dir }); onClose(); }}
                style={{ flex: 1, padding: "7px 10px", background: active ? C.brand : "transparent", color: active ? "#fff" : C.ink, border: `1.5px solid ${active ? C.brand : C.border}`, borderRadius: 10, fontSize: 13, fontWeight: 600 }}
              >
                {lbl}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function SelectBox({ value, onChange, options }) {
  return (

      value={value}
      onChange={e => onChange(e.target.value)}
      style={{ padding: "10px 12px", border: `1.5px solid ${C.border}`, background: C.surface, fontSize: 14, borderRadius: 10, color: C.ink }}
