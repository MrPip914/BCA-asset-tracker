                          <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: 0.5, textTransform: "uppercase", color: statusMeta.color }}>
                              {statusMeta.label}
                            </span>
                            <button onClick={() => setConfirmMaintenanceDelete(idx)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label={`Delete maintenance item ${item.task}`}>
                              <X size={13} color={C.placeholder} />
                            </button>
                          </div>
                        </div>
                        <div style={{ fontSize: 13, color: C.muted, marginBottom: 4 }}>
                          {[item.frequencyLabel, item.owner].filter(Boolean).join(" · ") || "—"}
                        </div>
                        <div style={{ fontSize: 13, color: C.ink, marginBottom: 8 }}>
                          Last performed: {item.lastPerformed ? formatDateOnly(item.lastPerformed) : "Never"}
                          {due && <> · Next due: <span style={{ color: statusMeta.color, fontWeight: 600 }}>{formatDateOnly(due.toISOString().slice(0, 10))}</span></>}
                        </div>
                        <div style={{ display: "flex", gap: 8 }}>
                          <button onClick={() => markMaintenanceDone(idx)} style={{ padding: "6px 12px", background: C.brand, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 12 }}>
                            Mark done today
                          </button>
                          <button onClick={() => startEditMaintenance(idx)} style={{ padding: "6px 12px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 12, color: C.ink }}>
                            Edit
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {detailTab === "changes" && (
            <>
              {totalLoggedCost > 0 && (
                <div style={{ textAlign: "right", fontSize: 12, color: C.muted, marginBottom: 8 }}>
                  Total logged: ${totalLoggedCost.toFixed(2)}
                </div>
              )}
              <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 14, marginBottom: 20 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10, marginBottom: 10 }}>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                      Change type
                      <button onClick={() => setShowChangeTypeManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage change types">
                        <Settings size={12} color={C.accent} />
                      </button>
                    </span>
                    <select
                      value={changeDraft.changeType}
                      onChange={e => setChangeDraft({ ...changeDraft, changeType: e.target.value })}
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
                    >
                      <option value="">Select…</option>
                      {changeTypes.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </label>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
                      Vendor
                      <button onClick={() => setShowVendorManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage vendors">
                        <Settings size={12} color={C.accent} />
                      </button>
                    </span>
                    <select
                      value={changeDraft.vendor}
                      onChange={e => setChangeDraft({ ...changeDraft, vendor: e.target.value })}
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
                    >
                      <option value="">{vendors.length ? "Select…" : "No vendors yet"}</option>
                      {(changeDraft.vendor && !vendors.includes(changeDraft.vendor) ? [changeDraft.vendor, ...vendors] : vendors).map(v => (
                        <option key={v} value={v}>{v}</option>
                      ))}
                    </select>
                  </label>
                  <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Cost</span>
                    <input
                      type="number"
                      inputMode="decimal"
                      value={changeDraft.cost}
                      onChange={e => setChangeDraft({ ...changeDraft, cost: e.target.value })}
                      placeholder="0.00"
                      style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
                    />
                  </label>
                </div>
                <textarea
                  value={changeDraft.note}
                  onChange={e => setChangeDraft({ ...changeDraft, note: e.target.value })}
                  placeholder="Details — what happened, why…"
                  rows={2}
                  style={{ width: "100%", padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, resize: "vertical", color: C.ink }}
                />
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
                  <button
                    onClick={addChange}
                    disabled={!changeDraft.changeType}
                    style={{ padding: "8px 14px", background: changeDraft.changeType ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                  >
                    Log change
                  </button>
                </div>
              </div>

              {changeEntries.length === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>No changes logged yet.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {changeEntries.map((ch, i) => {
                    const realIdx = changeEntries.length - 1 - i;
                    return (
                      <div key={realIdx} style={{ border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                          <span style={{ fontWeight: 700, fontSize: 13, color: C.brandDark }}>{ch.changeType}</span>
                          <button onClick={() => setConfirmChangeDelete(realIdx)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label="Delete change entry">
                            <X size={13} color={C.placeholder} />
                          </button>
                        </div>
                        <div style={{ fontSize: 13, color: C.muted, marginBottom: 4 }}>
                          {[ch.vendor, ch.cost && `$${parseFloat(ch.cost).toFixed(2)}`].filter(Boolean).join(" · ") || "—"}
                        </div>
                        {ch.note && <div style={{ fontSize: 14, color: C.ink, whiteSpace: "pre-wrap", marginBottom: 6 }}>{ch.note}</div>}
                        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.placeholder }}>
                          {formatWhen(ch.at)}{ch.by ? ` · ${ch.by}` : ""}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {detailTab === "comments" && (
            <>
              <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, background: C.surface, padding: 14, marginBottom: 20 }}>
                <textarea
                  value={commentDraft}
                  onChange={e => setCommentDraft(e.target.value)}
                  placeholder="Log a note — e.g. serviced, moved, issue reported…"
                  rows={3}
                  style={{ width: "100%", padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, resize: "vertical", color: C.ink }}
                />
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
                  <button
                    onClick={addComment}
                    disabled={!commentDraft.trim()}
                    style={{ padding: "8px 14px", background: commentDraft.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                  >
                    Add comment
                  </button>
                </div>
              </div>

              {comments.length === 0 ? (
                <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>No comments logged yet.</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {comments.map((cm, i) => {
                    const realIdx = comments.length - 1 - i;
                    return (
                      <div key={realIdx} style={{ border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "10px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.muted }}>
                            {formatWhen(cm.at)}{cm.by ? ` · ${cm.by}` : ""}
                          </span>
                          <button onClick={() => setConfirmCommentDelete(realIdx)} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4 }} aria-label="Delete comment">
                            <X size={13} color={C.placeholder} />
                          </button>
                        </div>
                        <div style={{ fontSize: 14, color: C.ink, whiteSpace: "pre-wrap" }}>{cm.text}</div>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}

          {detailTab === "audit" && (
            assetAuditEntries.length === 0 ? (
              <div style={{ fontSize: 13, color: C.empty, textAlign: "center", padding: "12px 0" }}>No edits recorded yet.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {assetAuditEntries.map((entry, i) => (
                  <div key={i} style={{ border: `1px solid ${C.border}`, borderRadius: 2, background: C.surface, padding: "9px 14px" }}>
                    <div style={{ fontSize: 13, color: C.ink, marginBottom: 3 }}>{describeAudit(entry)}</div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: C.placeholder }}>
                      {formatWhen(entry.at)}{entry.by ? ` · ${entry.by}` : ""}
                    </div>
                  </div>
                ))}
              </div>
            )
          )}
        </div>

        {confirmDelete && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Permanently delete {confirmDelete}?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This erases it from the inventory entirely — including its comments and change log. Unlike archiving, this cannot be recovered.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button onClick={() => doDelete(confirmDelete)} style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}>Permanently delete</button>
              </div>
            </div>
          </div>
        )}

        {confirmArchive && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Archive {confirmArchive}?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>It'll be hidden from the active list by default but nothing is deleted — you can restore it, or permanently delete it, anytime from here.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmArchive(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button onClick={() => archiveAsset(confirmArchive)} style={{ padding: "8px 14px", background: C.brandDark, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}>Archive</button>
              </div>
            </div>
          </div>
        )}

        {confirmCommentDelete !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Delete this comment?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmCommentDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => { deleteComment(confirmCommentDelete); setConfirmCommentDelete(null); }}
                  style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        )}

        {confirmChangeDelete !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Delete this change log entry?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmChangeDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => { deleteChange(confirmChangeDelete); setConfirmChangeDelete(null); }}
                  style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        )}

        {confirmAllocationRemove !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove allocation for {confirmAllocationRemove}?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>That quantity returns to the available pool. This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmAllocationRemove(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => removeAllocation(confirmAllocationRemove)}
                  style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                >
                  Remove
                </button>
              </div>
            </div>
          </div>
        )}

        {confirmMaintenanceDelete !== null && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20 }}>
            <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 340 }}>
              <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Delete this maintenance schedule?</div>
              <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This can't be undone.</div>
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setConfirmMaintenanceDelete(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
                <button
                  onClick={() => deleteMaintenanceItem(confirmMaintenanceDelete)}
                  style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        )}

        {showChangeTypeManager && (
          <ListManagerModal
            title="Manage change types"
            items={changeTypes}
            newValue={newChangeTypeName}
            onNewValueChange={setNewChangeTypeName}
            onAdd={addChangeType}
            onRemove={removeChangeType}
            onClose={() => { setShowChangeTypeManager(false); setNewChangeTypeName(""); }}
            placeholder="New change type"
          />
        )}

        {showVendorManager && (
          <ListManagerModal
            title="Manage vendors"
            items={vendors}
            newValue={newVendorName}
            onNewValueChange={setNewVendorName}
            onAdd={addVendor}
            onRemove={removeVendor}
            onClose={() => { setShowVendorManager(false); setNewVendorName(""); }}
            placeholder="New vendor name"
          />
        )}
      </div>
    );
  }

  // ---------- LIST VIEW ----------
  const hiddenColumns = columns.filter(c => !c.visible);
  const addFormColumns = formColumnsFor(draft.type);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'IBM Plex Sans', 'Helvetica Neue', sans-serif", color: C.ink }}>
      {globalStyle}
      {nameModal}
      {peripheralsManagerModal}
      {usersManagerModal}
      {bulkItemTypesManagerModal}

      {/* Slim header */}
      <div style={{ borderBottom: `2px solid ${C.brand}`, padding: "10px 20px", position: "sticky", top: 0, background: C.bg, zIndex: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: C.brandDark }}>BCA Asset Tracker</h1>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button
            onClick={() => { setNameInput(currentUser || ""); setShowNamePrompt(true); }}
            style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", padding: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}
          >
            <UserCircle size={14} style={{ color: C.brand }} />
            {currentUser || "Set name"}
            {saveError && <span style={{ color: C.danger, marginLeft: 8 }}>Sync failed</span>}
          </button>
        </div>
      </div>

      <div style={{ padding: "18px 20px 80px", maxWidth: 1300, margin: "0 auto" }}>
        {/* Controls */}
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 18 }}>
          <div style={{ position: "relative", flex: "1 1 260px" }}>
            <Search size={16} style={{ position: "absolute", left: 12, top: 12, color: C.accent }} />
            <input
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder="Search asset ID, room, user, serial…"
              style={{ width: "100%", padding: "10px 12px 10px 36px", border: `1.5px solid ${C.brandDark}`, background: C.surface, fontSize: 14, borderRadius: 2, color: C.ink }}
            />
          </div>
          <button
            onClick={() => setShowColManager(true)}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 14px", background: C.surface, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2, color: C.ink }}
          >
            <Columns3 size={16} /> Columns
          </button>

          <button
            onClick={exportToExcel}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 14px", background: C.surface, border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2, color: C.ink }}
          >
            <Download size={16} /> Export
          </button>

          <button
            onClick={startAdd}
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 16px", background: C.brand, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 2 }}
          >
            <Plus size={16} /> Add asset
          </button>
        </div>

        {/* Add form */}
        {showAdd && (
          <div style={{ border: `1.5px solid ${C.brandDark}`, background: C.surface, padding: 20, marginBottom: 18, borderRadius: 2 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: C.brandDark }}>Add asset</div>
              <button onClick={cancelAdd} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))", gap: 12 }}>
              {addFormColumns.map(c => (
                c.key === "type" ? (
                  <TypeField key={c.key} value={draft.type || ""} onChange={v => setDraft({ ...draft, type: v })} />
                ) : c.key === "room" && draft.type !== "Room" ? (
                  <RoomField key={c.key} value={draft.room || ""} onChange={v => setDraft({ ...draft, room: v })} roomOptions={roomAssetNames} />
                ) : c.key === "building" && draft.type !== "Building" ? (
                  <BuildingField key={c.key} value={draft.building || ""} onChange={v => setDraft({ ...draft, building: v })} buildingOptions={buildingAssetNames} />
                ) : c.key === "person" ? (
                  <UserField
                    key={c.key}
                    value={draft.person || ""}
                    onChange={v => setDraft({ ...draft, person: v })}
                    userOptions={usersList}
                    onManage={() => setShowUsersManager(true)}
                  />
                ) : c.key === "peripherals" ? (
                  <PeripheralsField
                    key={c.key}
                    value={draft.peripherals || ""}
                    onChange={v => setDraft({ ...draft, peripherals: v })}
                    options={peripheralsList}
                    onManage={() => setShowPeripheralsManager(true)}
                  />
                ) : c.key === "itemName" ? (
                  <BulkTypeField
                    key={c.key}
                    value={draft.itemName || ""}
                    onChange={v => setDraft({ ...draft, itemName: v })}
                    options={bulkItemTypes}
                    onManage={() => setShowBulkItemTypesManager(true)}
                  />
                ) : (
                  <Field
                    key={c.key}
                    label={c.label}
                    value={draft[c.key] || ""}
                    onChange={v => setDraft({ ...draft, [c.key]: v })}
                    wide={c.key === "notes"}
                    placeholder={c.key === "screenSize" ? 'e.g. 24"' : undefined}
                    type={c.key === "totalQuantity" ? "number" : undefined}
                  />
                )
              ))}
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button onClick={saveDraft} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: C.success, color: "#fff", border: "none", fontWeight: 600, fontSize: 14, borderRadius: 2 }}>
                <Save size={15} /> Save
              </button>
              <button onClick={cancelAdd} style={{ padding: "9px 16px", background: "transparent", border: `1.5px solid ${C.brandDark}`, fontWeight: 600, fontSize: 14, borderRadius: 2, color: C.ink }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {/* Result count + bulk actions on the filtered set */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.muted }}>
            Showing {filtered.length} of {assets.length} assets
            {sortConfig && (
              <button onClick={() => setSortConfig(null)} style={{ background: "none", border: "none", padding: 0, marginLeft: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: C.accent, textDecoration: "underline" }}>
                clear sort
              </button>
            )}
          </div>
        </div>

        {userFilter !== "All users" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 2, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Reassign {filtered.filter(a => fieldAppliesTo("person", a.type)).length} filtered asset(s) from <b style={{ color: C.brandDark }}>{userFilter}</b> to:</span>
            <select
              value={reassignTarget}
              onChange={e => setReassignTarget(e.target.value)}
              style={{ padding: "6px 10px", border: `1.5px solid ${C.border}`, fontSize: 13, borderRadius: 2, color: C.ink, background: "#fff", flex: "1 1 140px", maxWidth: 220 }}
            >
              <option value="">Select a user…</option>
              {usersList.filter(u => u !== userFilter).map(u => <option key={u} value={u}>{u}</option>)}
            </select>
            <button onClick={() => setShowUsersManager(true)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4, display: "flex" }} aria-label="Manage users">
              <Settings size={14} color={C.accent} />
            </button>
            <button
              onClick={() => reassignFilteredTo(reassignTarget)}
              disabled={!reassignTarget.trim()}
              style={{ padding: "6px 12px", background: reassignTarget.trim() ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
            >
              Reassign
            </button>
          </div>
        )}

        {roomFilter !== "All rooms" && filtered.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", border: `1.5px solid ${C.brand}`, borderRadius: 2, background: C.surface, padding: "10px 14px", marginBottom: 10, fontSize: 13 }}>
            <span style={{ color: C.muted }}>Move {filtered.filter(a => a.type !== "Room" && a.type !== "Building" && a.type !== "Bulk Item").length} filtered device(s) from <b style={{ color: C.brandDark }}>{roomFilter}</b> to:</span>
            <select
              value={moveTarget}
              onChange={e => setMoveTarget(e.target.value)}
              style={{ padding: "6px 10px", border: `1.5px solid ${C.border}`, fontSize: 13, borderRadius: 2, color: C.ink, background: "#fff", flex: "1 1 140px", maxWidth: 220 }}
            >
              <option value="">Select a room…</option>
              {roomAssetNames.filter(r => r !== roomFilter).map(r => <option key={r} value={r}>{r}</option>)}
            </select>
            <button
              onClick={() => moveFilteredTo(moveTarget)}
              disabled={!moveTarget}
              style={{ padding: "6px 12px", background: moveTarget ? C.brand : C.border, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}
            >
              Move
            </button>
          </div>
        )}

        {/* Table */}
        <div style={{ border: `1.5px solid ${C.brandDark}`, borderRadius: 2, overflow: "hidden", background: C.surface }}>
          <div className="scroller" style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: gridTemplate, background: C.brandDark, color: "#F4F0E6", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", minWidth: "max-content" }}>
              {visibleColumns.map((c, i) => {
                const cfg = filterConfigs[c.key];
                const isFiltered = cfg && cfg.value !== cfg.options[0];
                const sortedHere = sortConfig && sortConfig.key === c.key;
                const sortArrow = sortedHere ? (sortConfig.dir === "asc" ? " ↑" : " ↓") : "";
                return (
                  <div key={c.key} style={{ position: i === 0 ? "sticky" : "static", left: i === 0 ? 0 : undefined, background: C.brandDark, zIndex: i === 0 ? 2 : 1 }}>
                    {cfg ? (
                      <button
                        onClick={() => setActiveFilterCol(c.key)}
                        style={{
                          width: "100%", display: "flex", alignItems: "center", gap: 5, textAlign: "left",
                          background: "none", border: "none", padding: "10px 14px",
                          fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
                          color: isFiltered || sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: isFiltered || sortedHere ? 700 : "inherit",
                        }}
                      >
                        {c.label}{sortArrow}
                        <Filter size={11} style={{ flexShrink: 0 }} />
                      </button>
                    ) : (
                      <button
                        onClick={() => setSortConfig(
                          !sortedHere ? { key: c.key, dir: "asc" }
                          : sortConfig.dir === "asc" ? { key: c.key, dir: "desc" }
                          : null
                        )}
                        title="Tap to sort"
                        style={{
                          width: "100%", display: "flex", alignItems: "center", gap: 5, textAlign: "left",
                          background: "none", border: "none", padding: "10px 14px",
                          fontFamily: "inherit", fontSize: "inherit", letterSpacing: "inherit", textTransform: "inherit",
                          color: sortedHere ? "#E8C9A0" : "#F4F0E6", fontWeight: sortedHere ? 700 : "inherit",
                        }}
                      >
                        {c.label}{sortArrow}
                      </button>
                    )}
                  </div>
                );
              })}
              <div style={{ padding: "10px 14px" }} />
            </div>

            {filtered.length === 0 && (
              <div style={{ padding: 32, textAlign: "center", color: C.empty, fontSize: 14, minWidth: "max-content" }}>No assets match your search.</div>
            )}

            {filtered.map(a => (
              <div
                key={a.label}
                className="row-body"
                onClick={() => openDetail(a)}
                style={{ display: "grid", gridTemplateColumns: gridTemplate, alignItems: "center", cursor: "pointer", background: C.surface, borderTop: `1px solid ${C.border}` }}
              >
                {visibleColumns.map((c, i) => {
                  const isTypeCol = c.key === "type";
                  const Icon = isTypeCol ? iconFor(a.type) : null;
                  const applies = fieldAppliesTo(c.key, a.type);
                  const isInferredBuilding = c.key === "building" && !applies;
                  const inferredValue = isInferredBuilding ? inferBuilding(a, assets) : "";
                  return (
                    <div
                      key={c.key}
                      style={{
                        padding: "12px 14px",
                        fontSize: c.key === "label" ? 12 : 13,
                        fontFamily: c.key === "label" ? "'IBM Plex Mono', monospace" : undefined,
                        fontWeight: c.key === "label" ? 600 : isTypeCol ? 500 : 400,
                        fontStyle: isInferredBuilding && inferredValue ? "italic" : "normal",
                        color: c.key === "label" ? C.accent : (applies || (isInferredBuilding && inferredValue)) ? C.muted : C.border,
                        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                        display: "flex", alignItems: "center", gap: 8,
                        position: i === 0 ? "sticky" : "static",
                        left: i === 0 ? 0 : undefined,
                        background: i === 0 ? C.surface : "transparent",
                        zIndex: i === 0 ? 2 : "auto",
                      }}
                      title={isInferredBuilding && inferredValue ? "Inherited via this asset's Room" : undefined}
                    >
                      {Icon && <Icon size={15} style={{ flexShrink: 0, color: C.brand }} />}
                      {isTypeCol && a.type === "Bulk Item" ? (
                        <>
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.itemName || "Bulk Item"}</span>
                          <span style={{ flexShrink: 0, fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, fontWeight: 700, letterSpacing: 0.5, color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 3, padding: "1px 4px" }}>
                            BULK
                          </span>
                        </>
                      ) : isTypeCol && a.type === "Building" ? (
                        a.building || "Building"
                      ) : isTypeCol && a.type === "Room" ? (
                        a.room || "Room"
                      ) : (
                        applies ? (a[c.key] || "—") : isInferredBuilding ? (inferredValue || "") : ""
                      )}
                    </div>
                  );
                })}
                <div style={{ display: "flex", justifyContent: "center", padding: "12px 8px" }}>
                  <ChevronRight size={15} style={{ color: C.placeholder }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Column header filter modal */}
      {activeFilterCol && filterConfigs[activeFilterCol] && (
        <div onClick={() => setActiveFilterCol(null)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 300, maxHeight: "70vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>
                Filter by {filterConfigs[activeFilterCol].label}
              </div>
              <button onClick={() => setActiveFilterCol(null)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {filterConfigs[activeFilterCol].options.map(opt => {
                const isSelected = opt === filterConfigs[activeFilterCol].value;
                return (
                  <button
                    key={opt}
                    onClick={() => { filterConfigs[activeFilterCol].setValue(opt); setActiveFilterCol(null); }}
                    style={{
                      display: "flex", alignItems: "center", justifyContent: "space-between",
                      padding: "9px 10px", background: isSelected ? C.hover : "transparent", border: "none",
                      borderRadius: 2, fontSize: 14, textAlign: "left", color: C.ink, fontWeight: isSelected ? 600 : 400,
                    }}
                  >
                    {opt}
                    {isSelected && <Check size={15} color={C.brand} />}
                  </button>
                );
              })}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 12, paddingTop: 12, display: "flex", gap: 6 }}>
              {[["asc", "Sort A → Z"], ["desc", "Sort Z → A"]].map(([dir, lbl]) => {
                const active = sortConfig && sortConfig.key === activeFilterCol && sortConfig.dir === dir;
                return (
                  <button
                    key={dir}
                    onClick={() => { setSortConfig(active ? null : { key: activeFilterCol, dir }); setActiveFilterCol(null); }}
                    style={{ flex: 1, padding: "7px 10px", background: active ? C.brand : "transparent", color: active ? "#fff" : C.ink, border: `1.5px solid ${active ? C.brand : C.border}`, borderRadius: 2, fontSize: 13, fontWeight: 600 }}
                  >
                    {lbl}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* Column manager modal */}
      {showColManager && (
        <div onClick={() => setShowColManager(false)} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30, padding: 16 }}>
          <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 340, maxHeight: "80vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>Columns</div>
              <button onClick={() => setShowColManager(false)} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
            </div>
            <div style={{ fontSize: 12, color: C.empty, marginBottom: 10 }}>Hostname and Screen Size only apply to some types — they'll show blank for others.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {columns.map(c => (
                <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
                  <label style={{ display: "flex", alignItems: "center", gap: 8, opacity: c.locked ? 0.6 : 1 }}>
                    <input type="checkbox" checked={c.visible} disabled={c.locked} onChange={() => toggleColumnVisible(c.key)} />
                    {c.label} {c.locked && <Lock size={11} />}
                  </label>
                  {c.custom && (
                    <button onClick={() => setConfirmDeleteCol(c.key)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                      <Trash2 size={14} color={C.danger} />
                    </button>
                  )}
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
              <input
                value={newColName}
                onChange={e => setNewColName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addColumn()}
                placeholder="New column name"
                style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
              />
              <button onClick={addColumn} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 2, fontSize: 14, fontWeight: 600 }}>Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Delete column confirm */}
      {confirmDeleteCol && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 30 }}>
          <div style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 24, maxWidth: 360 }}>
            <div style={{ fontWeight: 700, marginBottom: 8, color: C.brandDark }}>Remove "{columns.find(c => c.key === confirmDeleteCol)?.label}" column?</div>
            <div style={{ fontSize: 14, color: C.muted, marginBottom: 18 }}>This deletes that field's data from every asset. This can't be undone.</div>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={() => setConfirmDeleteCol(null)} style={{ padding: "8px 14px", background: "transparent", border: `1.5px solid ${C.brandDark}`, borderRadius: 2, fontWeight: 600, fontSize: 13, color: C.ink }}>Cancel</button>
              <button onClick={() => removeColumn(confirmDeleteCol)} style={{ padding: "8px 14px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontWeight: 600, fontSize: 13 }}>Remove</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Field({ label, value, onChange, placeholder, wide, type }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4, gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>{label}</span>
      <input
        type={type || "text"}
        inputMode={type === "number" ? "numeric" : undefined}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
      />
    </label>
  );
}

function TypeField({ value, onChange }) {
  const options = TYPE_OPTIONS.includes(value) || !value ? TYPE_OPTIONS : [value, ...TYPE_OPTIONS];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Type</span>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function RoomField({ value, onChange, roomOptions }) {
  const options = !value || roomOptions.includes(value) ? roomOptions : [value, ...roomOptions];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Room</span>
      <select
        value={value || ""}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        <option value="">{roomOptions.length ? "Select a room…" : "No Room assets yet"}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function BuildingField({ value, onChange, buildingOptions }) {
  const options = !value || buildingOptions.includes(value) ? buildingOptions : [value, ...buildingOptions];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>Building</span>
      <select
        value={value || ""}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        <option value="">{buildingOptions.length ? "Select a building…" : "No Building assets yet"}</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function BulkTypeField({ value, onChange, options, onManage }) {
  // Include the current value even if it's not in the managed list (legacy/custom
  // data), so editing never silently drops it.
  const allOptions = !value || options.includes(value) ? options : [value, ...options];
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Sub-type
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage bulk item sub-types">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      <select
        value={value || ""}
        onChange={e => onChange(e.target.value)}
        style={{ padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink, background: "#fff" }}
      >
        <option value="">{options.length ? "Select…" : "No sub-types yet — add one"}</option>
        {allOptions.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function UserField({ value, onChange, userOptions, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom names already on this asset that aren't in the
  // managed list, so editing never silently drops someone.
  const allOptions = [...userOptions, ...selected.filter(s => !userOptions.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        User{selected.length > 1 ? "s" : ""}
        <button type="button" onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage users">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No users defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PeripheralsField({ value, onChange, options, onManage }) {
  const selected = (value || "").split("/").map(s => s.trim()).filter(Boolean);
  // Include any legacy/custom values already on this asset that aren't in the managed list,
  // so editing never silently drops data.
  const allOptions = [...options, ...selected.filter(s => !options.includes(s))];

  function toggle(opt) {
    const next = selected.includes(opt) ? selected.filter(s => s !== opt) : [...selected, opt];
    onChange(next.join("/"));
  }

  return (
    <div style={{ gridColumn: "1 / -1", display: "flex", flexDirection: "column", gap: 6 }}>
      <span style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 0.5, textTransform: "uppercase", color: C.accent }}>
        Peripherals
        <button onClick={onManage} className="icon-btn" style={{ background: "none", border: "none", padding: 2, borderRadius: 4, display: "flex" }} aria-label="Manage peripherals">
          <Settings size={12} color={C.accent} />
        </button>
      </span>
      {allOptions.length === 0 ? (
        <div style={{ fontSize: 13, color: C.empty }}>No peripherals defined yet — add some with the gear icon above.</div>
      ) : (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {allOptions.map(opt => {
            const active = selected.includes(opt);
            return (
              <button
                key={opt}
                type="button"
                onClick={() => toggle(opt)}
                style={{
                  padding: "6px 12px", borderRadius: 14, fontSize: 13, fontWeight: active ? 600 : 500,
                  border: `1.5px solid ${active ? C.brand : C.border}`,
                  background: active ? C.brand : "#fff",
                  color: active ? "#fff" : C.ink,
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Detail({ label, value, wide, italic }) {
  return (
    <div style={{ gridColumn: wide ? "1 / -1" : undefined }}>
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 0.5, textTransform: "uppercase", color: C.placeholder }}>{label}</span>
      <div style={{ color: value ? C.ink : C.placeholder, fontSize: 14, fontStyle: italic ? "italic" : "normal" }}>{value || "—"}</div>
    </div>
  );
}

function ListManagerModal({ title, items, newValue, onNewValueChange, onAdd, onRemove, onClose, placeholder }) {
  const [confirmItem, setConfirmItem] = useState(null);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(42,52,57,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 40, padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, border: `1.5px solid ${C.brandDark}`, borderRadius: 2, padding: 20, width: "100%", maxWidth: 320, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: 1, textTransform: "uppercase", color: C.accent }}>{title}</div>
          <button onClick={onClose} className="icon-btn" style={{ background: "none", border: "none", padding: 6, borderRadius: 4, color: C.ink }}><X size={18} /></button>
        </div>
        {items.length === 0 && (
          <div style={{ fontSize: 13, color: C.empty, marginBottom: 12 }}>Nothing added yet.</div>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 16 }}>
          {items.map(item => (
            <div key={item} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 14 }}>
              {confirmItem === item ? (
                <>
                  <span style={{ color: C.danger, fontSize: 13 }}>Remove "{item}"?</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => setConfirmItem(null)} style={{ padding: "3px 8px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 2, fontSize: 12, color: C.ink }}>Cancel</button>
                    <button
                      onClick={() => { onRemove(item); setConfirmItem(null); }}
                      style={{ padding: "3px 8px", background: C.danger, color: "#fff", border: "none", borderRadius: 2, fontSize: 12, fontWeight: 600 }}
                    >
                      Delete
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <span>{item}</span>
                  <button onClick={() => setConfirmItem(item)} className="icon-btn" style={{ background: "none", border: "none", padding: 4, borderRadius: 4 }}>
                    <Trash2 size={14} color={C.danger} />
                  </button>
                </>
              )}
            </div>
          ))}
        </div>
        <div style={{ borderTop: `1px solid ${C.border}`, paddingTop: 14, display: "flex", gap: 6 }}>
          <input
            value={newValue}
            onChange={e => onNewValueChange(e.target.value)}
            onKeyDown={e => e.key === "Enter" && onAdd()}
            placeholder={placeholder}
            style={{ flex: 1, padding: "8px 10px", border: `1.5px solid ${C.border}`, fontSize: 14, borderRadius: 2, color: C.ink }}
          />
          <button onClick={onAdd} style={{ padding: "8px 14px", background: C.brand, color: "#fff", border: "none", borderRadius: 2, fontSize: 14, fontWeight: 600 }}>Add</button>
        </div>
      </div>
    </div>
  );
}

function SelectBox({ value, onChange, options }) {
  return (
    <select
      value={value}
      onChange={e => onChange(e.target.value)}
      style={{ padding: "10px 12px", border: `1.5px solid ${C.brandDark}`, background: C.surface, fontSize: 14, borderRadius: 2, color: C.ink }}
    >
      {options.map(o => <option key={o} value={o}>{o}</option>)}
    </select>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AssetTracker />);
</script>
</body>
</html>
