<script type="text/babel" data-type="module" data-presets="react">
import ReactDOM from "react-dom/client";

import React, { useState, useEffect, useMemo, useRef } from "react";
import * as XLSX from "xlsx";
import {
  Search, Plus, X, Pencil, Trash2, Save, ChevronRight, ChevronDown, ArrowLeft, MessageSquare,
  Monitor, Phone, Tv, Camera, HardDrive, HelpCircle, Columns3, Lock, Filter, Check, DoorOpen, Download,
  Wrench, UserCircle, Settings, History, Archive, ArchiveRestore, Building2, Package, Copy, Zap, Repeat, ArrowLeftRight, Menu,
  FlaskConical, RotateCcw,
} from "lucide-react";

// Starter managed peripherals/users/bulk-item-type lists — empty until the school
// builds them up via the "manage" (gear icon) UI, or they arrive from the Sheet on load.
const DEFAULT_PERIPHERALS = [];
const DEFAULT_USERS = [];
const DEFAULT_BULK_ITEM_TYPES = [];

// ---------- TYPE REGISTRY ----------
// The single place describing everything the app knows about a *structurally*
// special asset type. This used to be spread across TYPE_OPTIONS, LOCKED_TYPES,
// TYPE_ONLY_FIELDS, five separate *_EXCLUDED_FIELDS arrays, CATEGORY_ICONS, and a
// scattering of `asset.type === "Room"`-style tests at render sites — so adding a
// structurally new type meant remembering to edit all of them, in the right
// places, with nothing to catch a miss. Now it's one entry here.
//
// Each entry may declare:
//   locked         — can't be removed from the managed type list (isLockedType()).
//                    These have deep structural dependencies elsewhere (field
//                    rules, Contents/Allocations/Breakers tabs, inferBuilding())
//                    that a plain managed-list removal would silently break.
//   icon           — lucide icon for list rows / the detail header. Default is
//                    HelpCircle (see iconFor()).
//   excludedFields — column keys this type doesn't get at all.
//   onlyFields     — column keys that belong to THIS type. Any key named in any
//                    entry's onlyFields becomes restricted app-wide (see
//                    RESTRICTED_FIELDS below): no type that doesn't name it gets it.
//   linkage        — how the type attaches to a place. This is the one thing
//                    render sites branch on, instead of comparing type names:
//                      "room"        — has a roomId; its Building is inferred
//                                      transitively through that Room.
//                      "building"    — has a buildingId of its own: a Room, or an
//                                      outdoor unit that sits in no particular
//                                      Room. Must also name "building" in onlyFields.
//                      "allocations" — no single place; a pooled quantity spread
//                                      across rooms via its own allocations[].
//                      "none"        — attaches to nothing. A Building is the top
//                                      of the place tree, and its `building` field
//                                      is its own display name, not a link.
//
// Types added at runtime via the gear-icon type manager are deliberately NOT in
// here — they're generic devices, and every lookup below falls back to exactly
// that: no icon, no field rules, DEFAULT_LINKAGE.
const DEFAULT_LINKAGE = "room";
const TYPE_REGISTRY = {
  Computer: { icon: HardDrive, linkage: "room", onlyFields: ["hostname"] },
  Monitor: { icon: Monitor, linkage: "room", onlyFields: ["screenSize"] },
  Phone: { icon: Phone, linkage: "room" },
  TV: { icon: Tv, linkage: "room", onlyFields: ["screenSize"] },
  DocuCam: { icon: Camera, linkage: "room" },
  "Stream Deck": { linkage: "room" },
  "Mini Split": { linkage: "room" },
  // An outdoor unit doesn't sit inside any one Room, so it links straight to a
  // Building instead of inferring one through a Room like every other device.
  Condenser: { linkage: "building", onlyFields: ["building"], excludedFields: ["room"] },
  // A Room is a space, not a device — no brand/model/serial/etc. It links up to
  // the Building it's in.
  Room: {
    locked: true, icon: DoorOpen, linkage: "building", onlyFields: ["building"],
    excludedFields: ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "purchaseDate", "warrantyUntil"],
  },
  // One level up from a Room, with even less in common with a device asset.
  Building: {
    locked: true, icon: Building2, linkage: "none", onlyFields: ["building"],
    excludedFields: ["brand", "model", "serial", "peripherals", "hostname", "screenSize", "room", "purchaseDate", "warrantyUntil"],
  },
  // Tables, chairs... not individually tagged or tied to one room — a pooled
  // quantity, distributed across rooms via the Allocations tab instead.
  // `itemName` is its sub-type, picked from the managed bulkItemTypes list
  // (e.g. "Folding Chair", "Cafeteria Table").
  "Bulk Item": {
    locked: true, icon: Package, linkage: "allocations", onlyFields: ["totalQuantity", "itemName"],
    excludedFields: ["hostname", "screenSize", "peripherals", "serial", "room", "building", "person"],
  },
  // Otherwise device-like (real brand/model/serial, purchase date, warranty, room
  // placement) — it just doesn't have peripherals like a computer does.
  "Electrical Panel": { locked: true, icon: Zap, linkage: "room", excludedFields: ["peripherals"] },
  Other: { linkage: "room" },
};

// Starter/fallback type list for a brand-new sheet, in registry order. The live
// list is managed via the gear icon on the Type field (persisted as Config's
// `typesList`) and can hold types that aren't in the registry at all.
const TYPE_OPTIONS = Object.keys(TYPE_REGISTRY);

// Locked types can't be removed in the type manager (see `locked` above).
function isLockedType(type) {
  return !!TYPE_REGISTRY[type]?.locked;
}
// How this type attaches to a place — the only thing render sites should branch
// on. An unregistered (user-added) type is a generic room-linked device.
function linkageOf(type) {
  return TYPE_REGISTRY[type]?.linkage || DEFAULT_LINKAGE;
}

// Options for the structured per-asset change log
const DEFAULT_CHANGE_TYPES = ["Purchase", "Repair", "Replacement", "Upgrade", "Maintenance", "Relocation", "Disposal", "Other"];

// Preset intervals for scheduled maintenance — fixed (not a managed list) since
// each needs a day-count to compute a next-due date.
const MAINTENANCE_FREQUENCIES = [
  { label: "Weekly", days: 7 },
  { label: "Monthly", days: 30 },
  { label: "Quarterly", days: 90 },
  { label: "Semi-Annually", days: 182 },
  { label: "Annually", days: 365 },
];

// A field key named in ANY registry entry's onlyFields is restricted app-wide:
// only the types that name it get it. Derived from the registry rather than
// declared as a second parallel list, so introducing a type-specific field is a
// one-line change to one entry and can't drift out of sync.
const RESTRICTED_FIELDS = new Set(
  Object.values(TYPE_REGISTRY).flatMap(entry => entry.onlyFields || [])
);
// Does `key` apply to an asset of `type`? Explicit exclusions win first, then the
// restricted-field rule; anything else is a common field present on every type.
// An unregistered (user-added) type excludes nothing and owns no restricted field
// — i.e. it behaves as a generic device, exactly as before the registry existed.
function fieldAppliesTo(key, type) {
  const entry = TYPE_REGISTRY[type];
  if (entry?.excludedFields?.includes(key)) return false;
  if (!RESTRICTED_FIELDS.has(key)) return true; // common field, applies to every type
  return !!entry?.onlyFields?.includes(key);
}

const DEFAULT_COLUMNS = [
  { key: "type", label: "Type", width: 140 },
  { key: "itemName", label: "Sub-Type", width: 150 },
  { key: "screenSize", label: "Screen Size", width: 110 },
  { key: "totalQuantity", label: "Total Qty", width: 100 },
  { key: "building", label: "Building", width: 130 },
  { key: "room", label: "Room", width: 130 },
  { key: "person", label: "User", width: 170 },
  { key: "brand", label: "Brand", width: 120 },
  { key: "model", label: "Model", width: 180 },
  { key: "serial", label: "Serial", width: 180 },
  { key: "hostname", label: "Hostname", width: 160 },
  { key: "purchaseDate", label: "Purchase Date", width: 130 },
  { key: "warrantyUntil", label: "Warranty Until", width: 130 },
  { key: "peripherals", label: "Peripherals", width: 240 },
  { key: "notes", label: "Notes", width: 240 },
  { key: "label", label: "Asset ID", width: 110 },
  { key: "status", label: "Status", width: 100 },
].map(c => ({ ...c, visible: ["type", "itemName", "building", "room", "person", "status"].includes(c.key), custom: false }));

const STATUS_OPTIONS = ["Active", "Archived"];
const STATUS_FILTER_OPTIONS = ["All statuses", "Active", "Archived"];
const MAINTENANCE_STATUS_FILTER_OPTIONS = [
  { value: "All statuses", label: "All statuses" },
  { value: "overdue", label: "Overdue" },
  { value: "due-soon", label: "Due soon" },
  { value: "ok", label: "On track" },
  { value: "never", label: "Never done" },
];

// Brookside Christian Academy palette (from brooksideacademy.com)
const C = {
  bg: "#F4F0E6",
  surface: "#FFFFFF",
  ink: "#2A3439",
  brand: "#546F75",
  brandDark: "#3E5054",
  accent: "#A9764B",
  border: "#DCD4C2",
  hover: "#EAE3D3",
  danger: "#9C3B2A",
  success: "#4B6B4E",
  muted: "#5C6B6E",
  placeholder: "#9CA7A6",
  empty: "#7C8A8C",
  scrollThumb: "#C7BEA8",
};

// Registry types without an `icon` (and every user-added type) fall back to a
// generic question mark.
function iconFor(type) {
  return TYPE_REGISTRY[type]?.icon || HelpCircle;
}
function slugify(name) {
  return "col_" + name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "col_field";
}
function formatWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}
// A date-only field (lastPerformed, purchaseDate, etc.) is stored and sent as a
// plain "yyyy-MM-dd" string, but Google Sheets auto-converts a plain date-looking
// string into a real Date cell on write — reading it back then yields a full ISO
// timestamp instead ("2026-06-03T07:00:00.000Z"). Slicing to the first 10 chars
// normalizes either shape back to just the date part before it's combined with a
// literal local-midnight time below, so already-round-tripped values still parse.
function dateOnly(s) {
  return s ? String(s).slice(0, 10) : "";
}
function formatDateOnly(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateOnly(dateStr) + "T00:00:00");
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
// Next-due date for a maintenance item, or null if it's never been performed
// (so there's nothing to count forward from) or has no known interval.
function nextMaintenanceDue(item) {
  if (!item.lastPerformed || !item.frequencyDays) return null;
  const last = new Date(dateOnly(item.lastPerformed) + "T00:00:00");
  if (isNaN(last.getTime())) return null;
  return new Date(last.getTime() + item.frequencyDays * 86400000);
}
// "never" (no lastPerformed yet — needs attention), "overdue", "due-soon"
// (within 14 days), or "ok".
function maintenanceStatusOf(item) {
  if (!item.lastPerformed) return "never";
  const due = nextMaintenanceDue(item);
  if (!due) return "never";
  const daysUntil = Math.floor((due.getTime() - Date.now()) / 86400000);
  if (daysUntil < 0) return "overdue";
  if (daysUntil <= 14) return "due-soon";
  return "ok";
}
function describeAudit(entry) {
  if (entry.action === "created") return "Asset created";
  if (entry.action === "deleted") return "Asset permanently deleted";
  if (entry.action === "archived") return "Asset archived";
  if (entry.action === "restored") return "Asset restored from archive";
  if (entry.action === "allocated") {
    return entry.previousQuantity != null
      ? `Allocation to ${entry.room} changed from ${entry.previousQuantity} to ${entry.quantity}`
      : `Allocated ${entry.quantity} to ${entry.room}`;
  }
  if (entry.action === "unallocated") return `Removed allocation of ${entry.quantity} from ${entry.room}`;
  if (entry.action === "noted") return `Note: ${entry.note}`;
  if (entry.action === "maintenance_completed") return `Completed maintenance "${entry.field}" — last done ${entry.to}`;
  if (entry.action === "maintenance_removed") return `Removed scheduled maintenance: ${entry.field}`;
  if (entry.action === "breaker_added") return `Added breaker at ${entry.field} (${entry.to})`;
  if (entry.action === "breaker_swapped") return `Swapped breaker at ${entry.field} — serial changed from "${entry.from}" to "${entry.to}"`;
  if (entry.action === "breaker_removed") return `Removed breaker at ${entry.field}`;
  if (entry.action === "circuit_added") return `Added circuit "${entry.field}" (${entry.to})`;
  if (entry.action === "circuit_reassigned") return `Moved circuit "${entry.field}" from ${entry.from} to ${entry.to}`;
  if (entry.action === "circuit_removed") return `Removed circuit "${entry.field}"`;
  // breaker_edited / circuit_edited fall through to the generic case below —
  // their field/from/to are already in the "X changed from A to B" shape.
  return `${entry.field} changed from "${entry.from || "—"}" to "${entry.to || "—"}"`;
}
// Every asset already has a stable, unique `label` — Room/Building references
// elsewhere in the app store that label (an id), not the mutable display
// name, so renaming a Room/Building is a normal single-asset edit with
// nothing else to keep in sync. These resolve an id back to the current
// display name at render time; a dangling id (its Room/Building was deleted)
// resolves to "" rather than throwing.
function roomNameFor(roomId, assets) {
  if (!roomId) return "";
  const room = assets.find(a => a.type === "Room" && a.label === roomId);
  return room ? room.room || "" : "";
}
function buildingNameFor(buildingId, assets) {
  if (!buildingId) return "";
  const building = assets.find(a => a.type === "Building" && a.label === buildingId);
  return building ? building.building || "" : "";
}

// Follows a non-Room asset's Room link to that Room's own Building link.
// Rooms and Buildings store their building directly and don't need this.
function inferBuilding(asset, assets) {
  if (!asset || !asset.roomId) return "";
  const roomAsset = assets.find(a => a.type === "Room" && a.label === asset.roomId);
  return roomAsset ? buildingNameFor(roomAsset.buildingId, assets) : "";
}

// Same "direct field, or inferred via Room" logic as inferBuilding above, but
// returns the Building asset's id instead of its display name — used for
// filtering/sorting by building, where matching on a stable id (not a name
// that could theoretically collide or change) is what's actually wanted.
function effectiveBuildingId(asset, assets) {
  if (!asset) return "";
  if (fieldAppliesTo("building", asset.type)) return asset.buildingId || "";
  if (!asset.roomId) return "";
  const roomAsset = assets.find(a => a.type === "Room" && a.label === asset.roomId);
  return roomAsset ? roomAsset.buildingId || "" : "";
}

// Buckets the read-only detail view's fields into labeled sections instead of
// one flat list. Any column not named here (custom user-added columns) falls
// into a trailing "Custom Fields" group rather than being dropped.
const DETAIL_FIELD_GROUPS = [
  { title: "Overview", keys: ["type", "itemName", "screenSize", "totalQuantity", "label", "status"] },
  { title: "Location & Assignment", keys: ["building", "room", "person"] },
  { title: "Device Details", keys: ["brand", "model", "serial", "hostname", "peripherals"] },
  { title: "Purchase & Warranty", keys: ["purchaseDate", "warrantyUntil"] },
  { title: "Notes", keys: ["notes"] },
];
function groupDetailColumns(cols) {
  const groups = DETAIL_FIELD_GROUPS.map(g => ({ title: g.title, columns: [] }));
  const custom = [];
  cols.forEach(c => {
    const groupIdx = DETAIL_FIELD_GROUPS.findIndex(g => g.keys.includes(c.key));
    if (groupIdx === -1) custom.push(c);
    else groups[groupIdx].columns.push(c);
  });
  if (custom.length) groups.push({ title: "Custom Fields", columns: custom });
  return groups.filter(g => g.columns.length > 0);
}

const USER_STORAGE_KEY = "asset-tracker-user"; // localStorage — who's using this browser
// localStorage — per-device column show/hide overrides. Column *definitions*
// (key/label/width/custom flag) stay server-synced since custom columns add a
// real field to every asset; only which ones are shown on THIS device is local,
// so one person's view preference stops overriding everyone else's, and toggling
// needs no server round-trip.
const COLUMN_VISIBILITY_STORAGE_KEY = "asset-tracker-column-visibility";
// Your deployed Apps Script Web App URL. Redeploy in Apps Script (Deploy > Manage
// deployments > New version) any time you change AssetTrackerSync.gs.
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzXaKRuCrTesxobxP-b2me1TSn0YoGogoYhNPTWU4qWWjXANXGlPuDzJSKGClOTsfOXRQ/exec";
// Must match SCRIPT_VERSION in AssetTrackerSync.gs, bumped by hand any time
// either file changes. loadData() compares this against what the deployed
// backend actually reports (data.scriptVersion) and flags a mismatch —
// catches a stuck deployment (edited-but-not-redeployed) automatically
// instead of it silently dropping data until someone happens to notice.
const FRONTEND_SCRIPT_VERSION = "v11 (2026-08-13) — Config gains `nextAssetNumber`, a monotonic counter for the next BCA asset label; read back in doGet and kept at max(posted, stored) on every config write, so a permanently deleted asset's label is never reissued to a new asset (which would inherit its AuditLog history)";
const emptyDraftFrom = columns => Object.fromEntries(columns.map(c => [c.key, ""]));

// --- Asset ID (label) issuing ------------------------------------------------
// Generated Asset IDs are BCA-prefixed and zero-padded to 4 digits (BCA0082).
// The BCR/BCB labels on Rooms/Buildings predate this and are never generated —
// only BCA numbers are ever issued, for every type.
const ASSET_LABEL_PREFIX = "BCA";
const assetLabelForNumber = n => ASSET_LABEL_PREFIX + String(n).padStart(4, "0");
// The numeric part of a BCA label, or 0 for anything else (a BCR/BCB label, or
// a hand-typed non-conforming one) — those consume no number from the counter.
function assetNumberFromLabel(label) {
  const m = /^BCA(\d+)$/i.exec(String(label || "").trim());
  return m ? parseInt(m[1], 10) : 0;
}

// --- Breaker cell addressing -------------------------------------------------
// See BREAKER_TYPES_ARCHITECTURE.md. Every physical slot has two halves,
// addressed "Na"/"Nb" (e.g. "1a", "1b") — a Breaker's footprint is the set of
// half-cells it occupies (Breaker.cells), not a list of whole slot numbers.
// Poles are derived (count of distinct slots touched), never stored.
function slotsFromCells(cells) {
  const set = new Set((cells || []).map(c => c.slice(0, -1)));
  return Array.from(set).sort((a, b) => parseFloat(a) - parseFloat(b));
}
function polesFromCells(cells) {
  return slotsFromCells(cells).length || 1;
}
// A breaker's label collapses to a plain slot number ("6/8") when it fills
// every half of every slot it touches — the common case (single-pole,
// double-pole). If it only claims one half of a slot (tandem, quad, split
// double-pole, ...), that half has to be called out ("9b/11a") or it's
// indistinguishable from its sibling occupying the other half.
function cellsLabel_(breaker) {
  const cells = breaker.cells || [];
  const halvesBySlot = new Map();
  const order = [];
  cells.forEach(c => {
    const slot = c.slice(0, -1);
    const half = c.slice(-1);
    if (!halvesBySlot.has(slot)) { halvesBySlot.set(slot, new Set()); order.push(slot); }
    halvesBySlot.get(slot).add(half);
  });
  return order.map(slot => {
    const halves = halvesBySlot.get(slot);
    return halves.has("a") && halves.has("b") ? slot : `${slot}${[...halves][0]}`;
  }).join("/") || "—";
}
// Resolves a BreakerType member's RELATIVE cells (its own 1st/2nd/... slot,
// e.g. "1a", "2b") onto real panel slots, given the absolute starting slot —
// relative slot i -> startSlot + 2*(i-1), i.e. stacked 2 apart in one column,
// the same convention already used for double-pole breakers today (section 4
// of BREAKER_TYPES_ARCHITECTURE.md — a type's slots must stack in one column).
function resolveRelativeCells(relativeCells, startSlot) {
  return relativeCells.map(rc => {
    const relSlot = parseInt(rc.slice(0, -1), 10);
    const half = rc.slice(-1);
    return `${startSlot + 2 * (relSlot - 1)}${half}`;
  });
}
function resolveTypeSlots(slotSpan, startSlot) {
  return Array.from({ length: slotSpan }, (_, i) => startSlot + 2 * i);
}

// Seeded so the catalog isn't empty on first use — covers every breaker
// shape built or discussed while designing this: a plain single-pole, a
// standard 240V double-pole, a tandem pair, a quad (two tandem pairs sharing

// that motivated moving to cell-based addressing in the first place.
const SEEDED_BREAKER_TYPES = [

  ] },
  { id: "type-tandem", name: "Tandem", slotSpan: 1, members: [

    { cells: ["1b"], ampRating: "20" },
  ] },
  { id: "type-quad", name: "Quad", slotSpan: 2, members: [
    { cells: ["1a"], ampRating: "20" },
    { cells: ["1b"], ampRating: "20" },
    { cells: ["2a"], ampRating: "20" },
    { cells: ["2b"], ampRating: "20" },
  ] },
  { id: "type-split-double", name: "Split Double-Pole (15/30/15)", slotSpan: 2, members: [
    { cells: ["1a"], ampRating: "15" },
    { cells: ["1b", "2a"], ampRating: "30" },
    { cells: ["2b"], ampRating: "15" },

// --- Local Sandbox mode -----------------------------------------------------
// Lets you iterate on the UI without touching the live Google Sheet: loadData()
// reads MOCK_SNAPSHOT (below) instead of fetching SHEET_API_URL, and persist()
// just updates in-memory state (mirrored to localStorage so a page refresh
// doesn't lose sandbox edits) instead of POSTing to Apps Script. Toggle with the
// "Sandbox" pill in the top-right corner — it's a plain on/off switch, remembered
// per-device via localStorage, OFF by default so the app talks to the real Sheet
// unless you deliberately turn it on. Nothing here ever touches the real backend.
const SANDBOX_MODE_KEY = "asset-tracker-sandbox-mode";
const SANDBOX_DATA_KEY = "asset-tracker-sandbox-data";
// A trimmed, realistic snapshot — not the full live inventory (that'd bloat this
// file for no benefit) — but with the Electrical Panel structure kept in full,
// since that's the area under active development and the one most worth having
// good fixture data for. Update this by hand when you want the sandbox to start
// from a different baseline; it's plain data, safe to edit directly.
const MOCK_SNAPSHOT = {
  scriptVersion: FRONTEND_SCRIPT_VERSION,
  assets: [
    { label: "BCB0001", type: "Building", building: "Building 100", brand: "", model: "", serial: "", person: "", peripherals: "", notes: "", totalQuantity: "", purchaseDate: "", warrantyUntil: "", status: "Active" },
